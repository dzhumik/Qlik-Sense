ым значениям невозможна в секции WHERE?","a":["WHERE выполняется после GROUP BY, но не имеет доступа к агрегатам, поскольку они вычисляются в отдельном внутреннем контексте выполнения, изолированном от секции фильтрации строк","WHERE работает только со строками, а не с группами","WHERE выполняется до агрегации — агрегированных значений ещё не существует на этом этапе обработки запроса. HAVING применяется после GROUP BY, когда агрегаты уже вычислены.","WHERE не поддерживает агрегатные функции по синтаксическим ограничениям SQL, поэтому их необходимо выносить в отдельный подзапрос или CTE, тогда как HAVING — лишь синтаксический сахар для удобства"],"c":2,"f":2},{"id":2037281129,"n":51,"t":"SQL и работа с данными","s":"Фильтрация данных в аналитических запросах - корректное применение WHERE и HAVING при работе с агрегированными и детальными данными из таблиц фактов DWH","q":"В отчёте нужно показать менеджеров, у которых сумма продаж за текущий квартал превышает 1 000 000 руб., при этом учитывать только закрытые сделки (status = 'closed') — где корректно разместить каждое из условий в SQL-запросе с GROUP BY?","a":["Условие status = 'closed' нужно поместить в HAVING, чтобы фильтрация происходила уже после того, как GROUP BY сформировал группы по менеджерам — это гарантирует корректный подсчёт итогов. Условие SUM(amount) > 1000000 тоже размещается в HAVING. WHERE в данном случае избыточен и может нарушить логику агрегации, поскольку удаляет строки до формирования групп, что приводит к неполным данным по менеджерам.","Фильтр status = 'closed' — в WHERE, SUM > 1000000 — тоже в WHERE через подзапрос.","Условие status = 'closed' — в WHERE (фильтрует строки до агрегации), условие SUM(amount) > 1000000 — в HAVING (фильтрует уже агрегированные группы). Размещение фильтра по статусу в HAVING было бы ошибкой: агрегация посчитается по всем сделкам, включая незакрытые.","Оба условия можно разместить в HAVING — это удобнее, так как HAVING проверяет условия после группировки и одинаково корректно работает как с агрегатами, так и с обычными полями вроде status, просто применяя фильтр на финальный результат."],"c":2,"f":2},{"id":1735698358,"n":52,"t":"SQL и работа с данными","s":"Логика JOIN в многотабличных запросах - выбор типа соединения (INNER, LEFT, FULL OUTER) при объединении таблиц фактов из разных доменных областей DWH","q":"Почему при объединении таблиц фактов из разных доменных областей DWH через INNER JOIN можно непреднамеренно потерять аналитически значимые данные?","a":["INNER JOIN между таблицами фактов разных доменов не вызывает потери данных, поскольку оба источника ссылаются на одни и те же измерения (даты, клиенты, продукты). Общие dimension-таблицы гарантируют полное пересечение множеств фактов, и любая запись из одного домена всегда имеет соответствие в другом через conforming dimensions — это фундаментальный принцип проектирования DWH по методологии Кимбалла.","INNER JOIN возвращает только пересечение множеств: строки, не имеющие соответствия в обеих таблицах, исключаются из результата. В DWH факты разных доменов (например, продажи и логистика) покрывают разные подмножества бизнес-событий — не каждая продажа имеет связанную поставку и наоборот. INNER JOIN молча отбрасывает такие несовпадающие записи, искажая агрегаты и метрики, тогда как LEFT или FULL OUTER JOIN сохраняют все факты, явно показывая отсутствие связи через NULL.","Проблема не в типе JOIN, а в некорректной гранулярности ключей соединения. Если таблицы фактов объединяются по суррогатным ключам разной размерности, INNER JOIN возвращает декартово произведение совпадающих строк, многократно дублируя метрики. Потеря данных при этом не происходит — происходит их избыточное умножение, что и искажает агрегаты.","INNER JOIN теряет данные только при наличии NULL-значений в ключевых полях соединения. Если ключи заполнены корректно и прошли валидацию ETL-процесса, пересечение таблиц фактов разных доменов через INNER JOIN безопасно — все аналитически значимые записи сохраняются, поскольку DWH по определению содержит только согласованные, очищенные данные с гарантированной ссылочной целостностью между доменами."],"c":1,"f":2},{"id":1867969528,"n":53,"t":"SQL и работа с данными","s":"Фильтрация по диапазону дат — использование BETWEEN и операторов сравнения для выгрузки транзакций за указанный период из DWH","q":"Какой SQL-запрос выгрузит транзакции из таблицы SALES за период с 1 января по 31 марта 2024 года включительно?","a":["SELECT * FROM SALES WHERE SALE_DATE > '2024-01-01' AND SALE_DATE < '2024-04-01', так как BETWEEN работает некорректно с датами в большинстве баз данных и лучше использовать явные операторы сравнения без граничных значений","SELECT * FROM SALES WHERE SALE_DATE >= '2024-01-01' AND SALE_DATE < '2024-03-31', так как оператор BETWEEN не включает правую граничную дату, поэтому нужно использовать строгое сравнение","SELECT * FROM SALES WHERE SALE_DATE BETWEEN '2024-01-01' AND '2024-03-31'. BETWEEN включает обе граничные даты.","SELECT * FROM SALES WHERE SALE_DATE BETWEEN '2024-01-01' AND '2024-03-31' AND SALE_DATE != '2024-03-31', потому что BETWEEN включает левую границу, но исключает правую, и 31 марта нужно добавлять отдельно"],"c":2,"f":2},{"id":2138355640,"n":54,"t":"SQL и работа с данными","s":"Оператор LIKE и шаблоны поиска — фильтрация текстовых полей справочника продуктов по частичному совпадению наименования или кода","q":"Почему символ % в операторе LIKE заменяет любое количество символов, включая ноль?","a":["% заменяет ровно один или несколько символов, ноль не входит — для пустой строки нужно использовать отдельный шаблон ''","% унаследован из регулярных выражений, где означает «повторение предыдущего символа» — в SQL его адаптировали для замены символов","Это wildcard-шаблон: он означает «любая последовательность символов любой длины», что позволяет искать подстроку в любой позиции строки без знания точного окружения.","% работает только в конце строки, заменяя хвостовую часть — поэтому поиск подстроки в середине требует другого символа"],"c":2,"f":2},{"id":610169387,"n":55,"t":"SQL и работа с данными","s":"Фильтрация данных в SQL - использование WHERE и HAVING для отбора записей по статическим условиям и по результатам агрегации при выгрузке из корпоративного хранилища","q":"В хранилище данных нужно получить только те отделы, где средняя сумма продаж за квартал превышает 500 000 — какое предложение SQL следует использовать для этого условия?","a":["Правильно использовать подзапрос с WHERE: сначала посчитать средние продажи через SELECT department, AVG(sales_amount) AS avg_sales в подзапросе, а затем во внешнем запросе применить WHERE avg_sales > 500000 — это единственный синтаксически верный способ, так как HAVING не работает с псевдонимами и алиасами столбцов.","HAVING здесь не нужен: достаточно применить WHERE sales_amount > 500000 до группировки, и тогда в агрегацию попадут только нужные строки. Итоговый средний показатель автоматически будет корректным, так как отфильтруются все строки ниже порога.","HAVING: условие на агрегированные данные применяется после GROUP BY. Например: GROUP BY department HAVING AVG(sales_amount) > 500000. WHERE здесь не подойдёт, так как фильтрует строки до агрегации.","WHERE AVG(sales_amount) > 500000, указанное после GROUP BY — это стандартный способ фильтрации агрегированных данных. HAVING в современном SQL применяется только для фильтрации самих групп по ключу группировки, но не по результатам агрегатных функций."],"c":2,"f":1},{"id":1208583034,"n":56,"t":"SQL и работа с данными","s":"Общие табличные выражения (CTE) - использование конструкции WITH для декомпозиции сложных SQL-запросов к DWH на читаемые логические блоки","q":"В отчёте Qlik Sense нужно посчитать топ-10 продуктов по выручке, а затем показать их долю от общей выручки всех продуктов — как организовать SQL-запрос к DWH с помощью CTE?","a":["Создать два CTE: первый (all_products) считает выручку по всем продуктам, второй (top_products) отбирает топ-10 из первого. Долю нужно считать не от общей выручки всех продуктов, а от суммарной выручки именно этих топ-10, то есть делить revenue каждого продукта на SUM(revenue) внутри top_products. Это даёт корректную структуру отчёта Qlik Sense, где 100% соответствует совокупной выручке отображаемых позиций, а не всего ассортимента, что методологически точнее для аналитики.","Создать один CTE (top_products), который через ROW_NUMBER() отбирает топ-10 продуктов по выручке, а долю от общей выручки вычислить прямо внутри этого же CTE через оконную функцию SUM() OVER () — она автоматически посчитает сумму по всем строкам до применения фильтра топ-10. Финальный SELECT просто обращается к этому единственному CTE. Разделение на два CTE избыточно и снижает производительность из-за двойного сканирования таблицы фактов в DWH.","Правильный подход — избегать CTE для подобных задач в DWH, так как они материализуются как временные таблицы и создают нагрузку на хранилище. Вместо этого нужно использовать два отдельных SQL-запроса в скрипте загрузки Qlik Sense: первый загружает топ-10 продуктов по выручке в таблицу QlikTop, второй — общую выручку в таблицу QlikTotal, затем в самом Qlik Sense создать вычисляемое поле через JOIN этих таблиц. Это стандартная практика для BI-инструментов.","Создать два CTE: первый (top_products) — считает выручку по продуктам и отбирает топ-10 через ROW_NUMBER() или LIMIT/FETCH, второй (total_revenue) — считает SUM выручки по всем продуктам. В финальном SELECT соединить их, вычислив долю: top_products.revenue / total_revenue.total * 100. Такая декомпозиция делает логику прозрачной и позволяет переиспользовать промежуточные результаты без вложенных подзапросов."],"c":3,"f":1},{"id":1452695232,"n":57,"t":"SQL и работа с данными","s":"Подзапросы в WHERE - использование коррелированных и некоррелированных подзапросов для фильтрации записей по вычисляемым условиям (например, клиенты выше среднего по сумме заказов)","q":"Напишите SQL-запрос, возвращающий клиентов, чья сумма заказов превышает среднюю сумму заказов по всем клиентам, используя подзапрос в HAVING.","a":["SELECT customer_id, SUM(order_amount) AS total FROM orders WHERE SUM(order_amount) > (SELECT AVG(total) FROM (SELECT SUM(order_amount) AS total FROM orders GROUP BY customer_id) t) GROUP BY customer_id;","SELECT customer_id, SUM(order_amount) AS total FROM orders GROUP BY customer_id HAVING total > (SELECT AVG(total) FROM (SELECT SUM(order_amount) AS total FROM orders GROUP BY customer_id) t);","SELECT customer_id, SUM(order_amount) AS total FROM orders GROUP BY customer_id HAVING SUM(order_amount) > (SELECT AVG(order_amount) FROM orders);","SELECT customer_id, SUM(order_amount) AS total FROM orders GROUP BY customer_id HAVING SUM(order_amount) > (SELECT AVG(total) FROM (SELECT SUM(order_amount) AS total FROM orders GROUP BY customer_id) t);"],"c":3,"f":1,"e":"Сравнивать нужно сумму клиента со средней суммой по клиентам: в HAVING стоит SUM(order_amount), а подзапрос считает AVG по агрегированным итогам. Агрегат в WHERE недопустим, а алиас в HAVING поддерживают не все СУБД.","u":1},{"id":1233815814,"n":58,"t":"SQL и работа с данными","s":"Оконные функции SQL - использование LAG и LEAD для расчёта динамики и отклонений показателей между периодами в запросах к корпоративному хранилищу","q":"Почему LAG/LEAD без явного указания PARTITION BY могут возвращать некорректные значения при анализе динамики по нескольким бизнес-единицам одновременно?","a":["Без PARTITION BY увеличивается нагрузка на сортировку, что приводит к таймаутам и усечению результата — последние бизнес-единицы теряют значения LAG.","Без PARTITION BY окно охватывает весь результирующий набор, и функция «заглядывает» в строки соседней бизнес-единицы, смешивая данные разных разделов — граница между группами не учитывается.","Без PARTITION BY функция игнорирует ORDER BY, из-за чего строки обрабатываются в произвольном порядке и возвращают случайные значения из набора.","Без PARTITION BY LAG/LEAD работают только внутри текущей бизнес-единицы, но не могут корректно рассчитать смещение при дублирующихся датах."],"c":1,"f":1},{"id":800725485,"n":59,"t":"SQL и работа с данными","s":"Оконные функции SQL - применение ROW_NUMBER и RANK для ранжирования менеджеров по показателям продаж в аналитических выгрузках из DWH","q":"В выгрузке из DWH нужно присвоить менеджерам ранг по сумме продаж внутри каждого региона, при этом менеджеры с одинаковой суммой должны получить одинаковый ранг, а следующий ранг должен быть пропущен — какую оконную функцию следует использовать?","a":["ROW_NUMBER() OVER (PARTITION BY region ORDER BY sales_sum DESC) — функция автоматически обрабатывает дубликаты, присваивая им одинаковый номер, что делает её предпочтительной для ранжирования менеджеров с равными продажами.","DENSE_RANK() OVER (PARTITION BY region ORDER BY sales_sum DESC) — именно эта функция пропускает ранги при совпадении значений, тогда как RANK() присваивает последовательные номера без пропусков.","RANK() OVER (PARTITION BY region ORDER BY sales_sum DESC). В отличие от ROW_NUMBER, RANK присваивает одинаковый ранг при совпадении значений и пропускает следующий номер (например, 1,1,3).","RANK() OVER (ORDER BY sales_sum DESC PARTITION BY region) — синтаксис верный, но сначала указывается ORDER BY, затем PARTITION BY."],"c":2,"f":1},{"id":534050878,"n":60,"t":"SQL и работа с данными","s":"Многотабличные JOIN-ы - логика и порядок соединения трёх и более таблиц (заказы, клиенты, продукты) для формирования плоских выборок под отчёты Qlik Sense","q":"Почему порядок JOIN-ов влияет на производительность запроса при соединении трёх и более таблиц?","a":["Ранние JOIN-ы с фильтрующими условиями сокращают промежуточный набор строк, уменьшая объём данных для последующих соединений и снижая нагрузку на движок БД.","Чем позже выполняется JOIN с большой таблицей, тем больше данных накапливается в промежуточных результатах, поэтому большие таблицы всегда нужно соединять первыми.","Порядок JOIN-ов влияет на производительность потому, что каждый последующий JOIN создаёт новый индекс на промежуточной таблице, и чем раньше строится индекс по ключевому полю, тем быстрее выполняются все последующие соединения в цепочке.","Порядок JOIN-ов не влияет на производительность — современные оптимизаторы SQL-движков автоматически переставляют соединения в оптимальный порядок независимо от того, как написан запрос."],"c":0,"f":1},{"id":1937743014,"n":61,"t":"SQL и работа с данными","s":"Оконные функции с PARTITION BY и ORDER BY - формирование нарастающих итогов и скользящих расчётов в разрезе периодов и аналитических измерений без постобработки в Qlik Sense","q":"Почему без ORDER BY в оконной функции нарастающий итог вычисляется некорректно?","a":["Без ORDER BY база данных обрабатывает строки в произвольном физическом порядке хранения, поэтому каждый раз при выполнении запроса нарастающий итог может давать разные результаты — это проблема недетерминированности, а не логики рамки окна.","ORDER BY в оконной функции нужен исключительно для сортировки результирующего набора в выводе запроса, и его отсутствие лишь нарушает визуальный порядок строк. Сам расчёт SUM по окну при этом остаётся верным, так как агрегация выполняется по всей секции PARTITION независимо от сортировки.","ORDER BY определяет порядок накопления строк в рамке окна (ROWS/RANGE). Без него база данных не знает последовательность суммирования, и по умолчанию в рамку включаются все строки секции сразу — итог в каждой строке равен общей сумме по PARTITION, а не накопленной.","Без ORDER BY не работает PARTITION BY, и секция окна не формируется совсем."],"c":2,"f":1,"e":"Без ORDER BY рамкой окна считается вся секция, и в каждой строке SUM вернёт общий итог секции. ORDER BY задаёт порядок накопления.","u":1},{"id":1470144695,"n":62,"t":"SQL и работа с данными","s":"Оператор IN и список значений — фильтрация выборки по множеству статусов или категорий без перечисления условий через OR","q":"Вам нужно получить заказы со статусами 'NEW', 'PENDING', 'IN_PROGRESS' из таблицы orders — напишите WHERE-условие с оператором IN.","a":["WHERE status = 'NEW' OR 'PENDING' OR 'IN_PROGRESS'","WHERE status NOT IN ('NEW', 'PENDING', 'IN_PROGRESS')","WHERE status IN ('NEW', 'PENDING', 'IN_PROGRESS')","WHERE status IN ['NEW', 'PENDING', 'IN_PROGRESS']"],"c":2,"f":1},{"id":1880078630,"n":63,"t":"Визуализация и отчётность","s":"KPI-плитка в Qlik Sense — конфигурирование показателя, формата отображения значения и условного цветового индикатора статуса","q":"Почему в KPI-плитке условный цвет индикатора задаётся через выражение, а не фиксированным значением?","a":["Чтобы цвет менялся динамически в зависимости от текущего значения показателя относительно заданных порогов","Потому что Qlik Sense не поддерживает статические цвета в компонентах типа KPI","Фиксированный цвет сбрасывается при каждом обновлении данных, выражение сохраняется","Чтобы обеспечить совместимость цветовой схемы с корпоративной темой оформления"],"c":0,"f":3},{"id":233527716,"n":64,"t":"Визуализация и отчётность","s":"Set Analysis в мерах Qlik Sense - реализация расчёта текущего периода к аналогичному периоду прошлого года через модификаторы множеств","q":"Почему в Set Analysis для расчёта аналогичного периода прошлого года используют модификатор Year с выражением вида {}, а не просто фиксированное значение года?","a":["Динамическое выражение используется для того, чтобы учитывать выборки пользователя: если пользователь не выбрал ни одного года, Max(Year)-1 возвращает глобальный максимум, тем самым игнорируя контекст и всегда показывая данные именно за предпоследний год в модели, что принципиально отличается от фиксированного значения.","Динамическое выражение $(=Max(Year)-1) автоматически вычисляется в момент выполнения запроса и возвращает год, на единицу меньший текущего выбранного, что делает меру универсальной и не требующей ручного обновления при смене отчётного периода.","Фиксированное значение года пришлось бы обновлять вручную каждый раз, но главная причина использования динамического выражения — в том, что оно вычисляется на стороне браузера до отправки запроса в движок, снижая нагрузку на сервер.","Фиксированное значение года не поддерживается синтаксисом Set Analysis — движок Qlik Sense не принимает числовые литералы в модификаторах множеств, поэтому динамическое выражение через знак доллара является единственным допустимым способом передачи числового значения в фильтр."],"c":1,"f":6},{"id":838347953,"n":65,"t":"Визуализация и отчётность","s":"Скрипт загрузки данных Qlik Sense - реализация инкрементальной загрузки по полю временно́й метки с использованием QVD-файлов","q":"Почему при инкрементальной загрузке в Qlik Sense QVD-файл читается дважды за один цикл обновления?","a":["Первый раз — для получения минимальной временно́й метки (чтобы исключить дубликаты), второй раз — для резервного копирования QVD перед перезаписью.","Первый раз — для проверки целостности файла, второй раз — для загрузки данных в оперативную память перед объединением с новыми записями.","Первый раз — для извлечения максимальной временно́й метки (чтобы запросить только новые записи из источника), второй раз — для объединения старых данных из QVD с новыми записями перед сохранением обновлённого QVD.","QVD читается дважды для балансировки нагрузки: первое чтение формирует кэш, второе — непосредственно загружает данные в модель Qlik."],"c":2,"f":3},{"id":1382929081,"n":66,"t":"Визуализация и отчётность","s":"Ассоциативная модель данных Qlik Sense - выявление и устранение синтетических ключей при объединении нескольких таблиц фактов и измерений","q":"В скрипте Qlik Sense таблицы Orders и Shipments обе содержат поля CustomerID и ProductID — какой метод устранения синтетического ключа предпочтительнее применить?","a":["Синтетические ключи безвредны, если таблиц не более трёх, поэтому достаточно оставить как есть и проверить корректность данных через Data Model Viewer.","Правильно применить Concatenate, объединив Orders и Shipments в одну таблицу — это полностью устраняет синтетический ключ, сохраняя все связи модели.","Нужно всегда создавать составной ключ CustomerID & '-' & ProductID в обеих таблицах — это стандартный способ устранения синтетических ключей при любых пересечениях полей.","Предпочтительнее переименовать неключевые поля через AS/Alias, разрывая лишние связи. Составной ключ (CustomerID & '-' & ProductID) применяется, только если обе связи семантически необходимы."],"c":3,"f":6},{"id":2063573221,"n":67,"t":"Визуализация и отчётность","s":"Ассоциативная модель данных Qlik Sense - выявление и устранение синтетических ключей при объединении нескольких таблиц фактов и измерений","q":"Почему синтетические ключи возникают при объединении таблиц, имеющих несколько общих полей?","a":["Qlik автоматически создаёт скрытую составную таблицу-ключ, когда две таблицы связаны более чем одним одноимённым полем, что нарушает чистоту ассоциативной модели и снижает производительность","Qlik создаёт синтетические ключи, когда находит поля с одинаковыми именами в разных таблицах, чтобы принудительно выстроить иерархию между ними","Синтетические ключи возникают потому, что Qlik не поддерживает соединение таблиц по нескольким полям одновременно и автоматически дублирует строки данных для создания уникальных идентификаторов, что приводит к многократному увеличению объёма модели","Синтетические ключи появляются только в Star Schema, когда таблица фактов соединяется с несколькими измерениями по одному общему полю"],"c":0,"f":3},{"id":1789486389,"n":68,"t":"Визуализация и отчётность","s":"Корпоративный шаблон приложения Qlik Sense — проектирование единой навигационной структуры, стилевых стандартов и скриптовых заготовок для тиражирования внутри команды","q":"Команда тиражирует корпоративный шаблон Qlik Sense: в каждом новом приложении нужно автоматически подставлять название проекта и дату обновления в мастер-заголовок — какой механизм шаблона обеспечит это без ручного редактирования каждого приложения?","a":["Оптимальный подход — создать отдельный лист «Мета-данные» и разместить на нём два текстовых объекта с жёстко прописанными значениями названия и даты. При тиражировании шаблона администратор вручную обновляет только этот лист, а остальные листы приложения ссылаются на него через master items, что централизует управление и сокращает количество правок до одного места.","Для автоматической подстановки названия проекта и даты обновления в мастер-заголовок следует использовать динамические выражения непосредственно в свойствах текстового объекта: функция DocumentName() возвращает имя приложения, а ReloadTime() — время последней загрузки. Эти функции вызываются прямо в поле «Заголовок» без объявления переменных в скрипте, что упрощает шаблон и исключает лишние зависимости между слоями приложения.","Используй Set Analysis с меткой $Table для извлечения названия из метаданных модели данных.","Переменные (Variables) в скрипте загрузки: vAppName и vLastReloadTime (через Now()/ReloadTime()). В мастер-объекте заголовка используются выражения '=$(vAppName)' и '=$(vLastReloadTime)'. При тиражировании достаточно задать значение vAppName в одном месте скрипта — все визуализации обновятся автоматически."],"c":3,"f":3},{"id":424369102,"n":69,"t":"Визуализация и отчётность","s":"Корпоративный шаблон приложения Qlik Sense — проектирование единой навигационной структуры, стилевых стандартов и скриптовых заготовок для тиражирования внутри команды","q":"Почему в корпоративном шаблоне Qlik Sense переменные навигации и стилей выносятся в отдельный init-скрипт, а не задаются напрямую в каждом листе?","a":["Чтобы изменение одного значения автоматически распространялось на все приложения команды без ручного редактирования каждого листа — единая точка управления снижает риск рассинхронизации стандартов при тиражировании шаблона.","Переменные выносятся в init-скрипт, чтобы ускорить загрузку листов: браузер кэширует их отдельно и не перечитывает при каждом открытии страницы приложения.","Вынесение в отдельный скрипт позволяет разграничить права доступа: аналитики видят листы, но не могут изменять навигационные переменные без доступа к секции загрузки.","Init-скрипт нужен для изоляции переменных от модели данных — иначе Qlik Sense смешивает стилевые параметры с полями и вызывает конфликты при ассоциациях."],"c":0,"f":3},{"id":773662652,"n":70,"t":"Визуализация и отчётность","s":"Функция Aggr в Qlik Sense — применение виртуальных таблиц для построения сложных агрегированных показателей и создание стандартизированных выражений для повторного использования командой","q":"Почему функция Aggr в Qlik Sense вычисляет результат до применения внешней агрегации, а не вместе с ней?","a":["Aggr вычисляет результат до применения внешней агрегации потому, что Qlik Sense использует механизм предварительной компиляции выражений: движок сначала разворачивает все вложенные функции в плоский список значений, а затем передаёт их внешней агрегации — это стандартное поведение для всех вложенных функций, не уникальное для Aggr, просто у Aggr синтаксис делает это явным.","Причина в том, что Aggr работает в контексте Set Analysis и вычисляется на этапе разрешения фильтров, до того как движок Qlik Sense строит гиперкуб визуализации — это позволяет изолировать вычисление от текущего контекста выбора и передать внешней агрегации значения, не зависящие от состояния фильтров пользователя, что принципиально отличает её от обычных вложенных агрегаций.","Aggr вычисляется заранее, поскольку внешняя агрегация не способна самостоятельно определить нужный уровень детализации без подсказки разработчика — функция Aggr фактически заменяет отсутствующий в Qlik Sense механизм GROUP BY из SQL, и движок обязан завершить её расчёт первой, чтобы передать внешней функции уже готовую плоскую колонку, иначе SQL-подобный движок Qlik просто не сможет разрешить конфликт измерений.","Aggr создаёт виртуальную таблицу с промежуточными значениями по заданным измерениям, позволяя внешней агрегации (например, Avg или Max) работать уже с предварительно сгруппированными результатами, а не с исходными строками данных — это даёт возможность строить многоуровневые агрегации, невозможные в одном выражении без вложенности."],"c":3,"f":2},{"id":1084671775,"n":71,"t":"Визуализация и отчётность","s":"Типы визуализаций Qlik Sense — выбор и настройка таблиц, столбчатых диаграмм и KPI-плиток для дашборда по готовому ТЗ","q":"Почему KPI-плитка в Qlik Sense показывает только одно агрегированное значение, а не набор строк?","a":["KPI-плитка показывает одно значение, потому что Qlik Sense автоматически агрегирует все строки в одно число при добавлении любого визуального элемента на лист, независимо от типа диаграммы.","KPI-плитка предназначена для отображения единственной ключевой метрики (меры) без разбивки по измерениям, чтобы дать мгновенный ответ на вопрос о состоянии показателя.","KPI-плитка ограничена одним значением из-за технического ограничения движка Associative Engine, который не может передавать несколько строк в компактный виджет — для этого нужно использовать расширенный режим разработчика.","KPI-плитка отображает одно значение, потому что содержит скрытое измерение по умолчанию, которое схлопывает все строки в итог — если добавить явное измерение в настройках, плитка автоматически превратится в таблицу со строками."],"c":1,"f":7},{"id":1384862142,"n":72,"t":"Визуализация и отчётность","s":"Структура листа в Qlik Sense — размещение и выравнивание объектов визуализации по макету при добавлении нового листа в существующее приложение","q":"Вы добавляете новый лист в приложение Qlik Sense и хотите разместить диаграмму точно под KPI-блоком без перекрытия — какой инструмент макета поможет выровнять объекты по сетке?","a":["Для точного выравнивания объектов в Qlik Sense используется панель «Align & Distribute» в меню Edit, которая задаёт координаты вручную.","В режиме редактирования листа Qlik Sense автоматически привязывает объекты к адаптивной сетке (snap-to-grid), что позволяет выравнивать и размещать визуализации без перекрытия, просто перетаскивая их на нужную позицию.","Qlik Sense не имеет встроенной сетки — объекты размещаются свободно, поэтому выравнивание выполняется через CSS-стили в разделе настроек темы приложения.","В режиме редактирования нужно вручную указать пиксельные отступы в свойствах каждого объекта — только так можно избежать перекрытия визуализаций на листе."],"c":1,"f":3},{"id":1505472297,"n":73,"t":"Визуализация и отчётность","s":"Фильтр-панель в Qlik Sense — настройка набора listbox-фильтров по измерениям региона, периода и подразделения согласно техническому заданию","q":"Почему listbox-фильтры в Qlik Sense автоматически сужают доступные значения при выборе в одном из них?","a":["Это поведение задаётся вручную в скрипте загрузки.","Потому что Qlik Sense использует ассоциативную модель данных: выбор в одном фильтре мгновенно пересчитывает связанные данные и скрывает несовместимые значения в остальных фильтрах.","Потому что в Qlik Sense по умолчанию включена опция каскадной фильтрации, которую разработчик задаёт в настройках панели фильтров: каждый последующий фильтр зависит от предыдущего и отображает только дочерние значения согласно иерархии измерений.","Потому что каждый listbox-фильтр отправляет SQL-запрос к базе данных при каждом выборе, и сервер возвращает только те значения, которые существуют в результирующей выборке, исключая остальные из отображения."],"c":1,"f":3},{"id":15906593,"n":74,"t":"Визуализация и отчётность","s":"Инкрементальная загрузка QVD-файлов — реализация механизмов частичного обновления данных через хранение меток времени и управление дельта-загрузкой в скриптах Qlik Sense","q":"В скрипте инкрементальной загрузки QVD после дельта-обновления новые записи объединены с историческими через Concatenate, но дубликаты изменённых записей остаются — какой механизм устранит эту проблему?","a":["Настроить в QVD-файле метаданные версионирования: добавить поле RowVersion с инкрементальным счётчиком, затем при загрузке исторических данных применить MAX(RowVersion) группировкой по ключевому полю — таким образом система автоматически выберет последнюю версию каждой записи, устранив дубликаты без дополнительных join-операций и перезаписи QVD.","Использовать конструкцию inner join или Not exists перед Concatenate: сначала загрузить исторический QVD, исключив из него записи с ключами, присутствующими в дельте (WHERE NOT EXISTS или через join), затем добавить дельту — так обновлённые записи заменят старые версии.","Использовать оператор Noconcatenate перед повторной загрузкой дельты.","Применить функцию Distinct при финальном объединении таблиц: конструкция LOAD Distinct автоматически устранит дубликаты изменённых записей, поскольку Qlik Sense идентифицирует повторяющиеся строки по всем полям и оставляет только уникальные комбинации — это стандартный способ дедупликации после Concatenate."],"c":1,"f":4},{"id":1923209172,"n":75,"t":"Визуализация и отчётность","s":"Структура листа в Qlik Sense — размещение и выравнивание объектов визуализации по макету при добавлении нового листа в существующее приложение","q":"Почему в Qlik Sense объекты на листе привязываются к сетке при размещении?","a":["Привязка к сетке нужна для защиты объектов от случайного перемещения пользователями в режиме просмотра готового приложения.","Это техническое требование движка рендеринга Qlik Sense: без привязки к сетке объекты не могут корректно отображать данные и теряют связь с моделью данных.","Сетка обеспечивает единообразное выравнивание и упрощает создание аккуратного макета без ручного позиционирования по пикселям.","Сетка ограничивает размер объектов, чтобы они не выходили за пределы экрана при разных разрешениях мониторов."],"c":2,"f":3},{"id":1102840024,"n":76,"t":"Визуализация и отчётность","s":"Циклические зависимости в модели данных Qlik Sense - диагностика и устранение циклов через Link-таблицы и переименование ключевых полей","q":"Почему циклические зависимости в модели данных Qlik Sense приводят к непредсказуемым результатам фильтрации?","a":["Циклические зависимости вызывают ошибку компиляции скрипта, из-за чего модель данных не загружается полностью, а часть таблиц остаётся недоступной для визуализаций и фильтров.","Цикл блокирует индексы ключей.","Qlik не может однозначно определить направление распространения выборки между таблицами — ассоциации образуют замкнутый контур, и движок выбирает путь произвольно, что искажает агрегации и связанные значения.","Qlik Sense автоматически разрывает цикл, удаляя одну из ассоциаций с наименьшим числом уникальных значений, что приводит к потере части данных и неполной фильтрации по удалённому ключу."],"c":2,"f":2},{"id":1100131285,"n":77,"t":"Визуализация и отчётность","s":"Библиотека мастер-элементов Qlik Sense — принципы формирования и стандартизации master dimensions и master measures для унификации визуализаций корпоративных приложений","q":"В корпоративном приложении Qlik Sense несколько команд используют разные формулы для расчёта маржинальности — какой механизм мастер-библиотеки устранит это расхождение без изменения каждого листа вручную?","a":["Создать единую Master Measure с централизованной формулой маржинальности. При обновлении выражения в мастер-элементе все связанные визуализации автоматически наследуют изменение, обеспечивая единую логику расчёта во всех листах приложения.","Использовать Master Dimension с выражением маржинальности, привязав её ко всем чартам через панель библиотеки. Master Dimensions предназначены для управления расчётными показателями наравне с Master Measures, поэтому формула маржинальности корректно сохранится и автоматически распространится на связанные объекты при редактировании.","Экспортировать приложение в QMC, отредактировать XML-структуру вручную, заменив все формулы маржинальности единым выражением, после чего импортировать обратно. Это гарантирует полную унификацию без использования мастер-библиотеки и позволяет контролировать каждое выражение на уровне метаданных приложения напрямую.","Создать переменную Qlik Sense с формулой маржинальности и подставить её во все существующие визуализации вручную через редактор выражений. Переменные обновляются централизованно, однако автоматической синхронизации с уже созданными объектами не происходит — каждый лист потребует ручной проверки и замены формул на ссылку к переменной."],"c":0,"f":2},{"id":777009926,"n":78,"t":"Визуализация и отчётность","s":"Set Analysis в мерах Qlik Sense - построение сравнительных расчётов план/факт с управлением контекстом выборки","q":"Какое выражение Set Analysis нужно использовать в мере Qlik Sense, чтобы рассчитать плановые продажи за текущий выбранный год, игнорируя выборку по полю Тип (факт/план)?","a":["Sum({<Тип={'План'}, Год=>} Продажи) — сбрасывает выборку по году, что приводит к расчёту плана за все годы, а не текущий выбранный.","Sum({1<Тип={'План'}>} Продажи) — игнорирует все пользовательские выборки включая год, возвращая план по всем периодам.","Sum({<Тип={'План'}>} Продажи) — фиксирует значение поля Тип='План', остальные выборки (год и др.) сохраняются из контекста пользователя.","Sum({$<Тип-={'Факт'}>} Продажи) — исключает факт вместо явного указания плана, что может включать пустые или иные значения поля Тип."],"c":2,"f":2},{"id":1672101474,"n":79,"t":"Визуализация и отчётность","s":"Свойства диаграмм в Qlik Sense — настройка осей, меток, заголовков и цветового оформления визуализации в панели свойств","q":"В Qlik Sense нужно скрыть заголовок диаграммы, чтобы освободить место на дашборде — в каком разделе панели свойств это настраивается?","a":["В разделе 'Вид' (Appearance) → 'Общие' (General) снять флажок 'Показать заголовок' (Show titles).","В разделе 'Вид' (Appearance) → 'Представление' (Presentation) следует установить для параметра 'Заголовок' значение 'Нет' (None) и сохранить изменения на листе.","В разделе 'Данные' (Data) → 'Измерения' (Dimensions) нужно удалить все метки измерений, после чего заголовок диаграммы автоматически скрывается системой.","В разделе 'Вид' (Appearance) → 'Цвета и легенда' (Colors and legend) необходимо отключить опцию 'Показать легенду' (Show legend), что одновременно скрывает заголовок."],"c":0,"f":2},{"id":396217777,"n":80,"t":"Визуализация и отчётность","s":"Базовый скрипт загрузки Qlik Sense — синтаксис оператора LOAD с фильтрацией данных по полю даты из одной таблицы","q":"Почему при фильтрации данных по дате в операторе LOAD используется секция WHERE, а не отдельный оператор FILTER?","a":["Оператор FILTER в Qlik Sense предназначен исключительно для работы с числовыми полями и агрегатными функциями, а для фильтрации по полям типа дата синтаксически обязательно применяется секция WHERE внутри оператора LOAD","FILTER является устаревшим оператором и был удалён из Qlik Sense, поэтому разработчики вынуждены использовать WHERE как единственную доступную альтернативу для фильтрации строк при загрузке данных","WHERE работает непосредственно на уровне базы данных источника, передавая условие фильтрации в SQL-запрос, тогда как FILTER обрабатывает данные уже после их полной загрузки в оперативную память приложения","WHERE является встроенной частью синтаксиса LOAD и фильтрует строки ещё на этапе чтения данных, не загружая лишние записи в память приложения"],"c":3,"f":2},{"id":864600814,"n":81,"t":"Визуализация и отчётность","s":"Set Analysis в Qlik Sense — построение библиотеки переиспользуемых выражений для расчёта показателей в разрезах периодов, сценариев и фильтров вне текущего выделения","q":"Как dollar-expansion `$(=expression)` взаимодействует с текущим выделением при использовании в Set Analysis?","a":["Dollar-expansion вычисляется до применения selections и возвращает значение, независимое от текущего контекста пользователя, что делает её идеальной для статических фильтров.","Dollar-expansion вычисляется с учётом текущих selections, но результат подставляется как статический литерал в Set-фильтр.","Dollar-expansion полностью игнорирует текущие selections и всегда возвращает агрегат по всем данным, поэтому результат в Set Analysis всегда соответствует состоянию без фильтров.","Dollar-expansion учитывает selections и динамически обновляет Set-фильтр при каждом изменении выделения."],"c":1,"f":4,"e":"$(=…) вычисляется один раз перед расчётом объекта — с учётом текущих выборок, — и результат подставляется в выражение как готовый текст. Внутри строк таблицы он уже не пересчитывается.","u":1},{"id":841920563,"n":82,"t":"Визуализация и отчётность","s":"Библиотека мастер-элементов Qlik Sense — принципы формирования и стандартизации master dimensions и master measures для унификации визуализаций корпоративных приложений","q":"Почему изменение master measure в библиотеке автоматически обновляет все визуализации, использующие её?","a":["Каждая визуализация хранит копию формулы, но движок сравнивает её с эталоном в библиотеке и перезаписывает при открытии листа.","Qlik Sense автоматически пересчитывает все листы приложения по расписанию, синхронизируя формулы между объектами и библиотекой.","Изменение master measure запускает триггер обновления, который рассылает новое выражение всем объектам через внутреннюю шину событий приложения.","Визуализации хранят ссылку на master measure, а не копию формулы, поэтому любое изменение определения сразу отражается везде, где она применяется."],"c":3,"f":4},{"id":1195594481,"n":83,"t":"Визуализация и отчётность","s":"Циклические зависимости в модели данных Qlik Sense - диагностика и устранение циклов через Link-таблицы и переименование ключевых полей","q":"Как Link-таблица устраняет циклическую зависимость между таблицами Orders, Customers и Products в Qlik Sense?","a":["Link-таблица дублирует все поля из трёх таблиц в одну, заменяя исходные таблицы и устраняя цикл через полное слияние данных.","Цикл устраняется переименованием ключевых полей в Link-таблице, чтобы Qlik не мог связать их с исходными таблицами автоматически.","Link-таблица хранит только ключевые поля OrderID, CustomerID, ProductID, а исходные таблицы полностью удаляются из модели данных.","Link-таблица содержит уникальные комбинации конкатенированного ключа из OrderID, CustomerID, ProductID; из исходных таблиц удаляются только циклообразующие поля."],"c":3,"f":2},{"id":1439187755,"n":84,"t":"Визуализация и отчётность","s":"Set Analysis в Qlik Sense — построение библиотеки переиспользуемых выражений для расчёта показателей в разрезах периодов, сценариев и фильтров вне текущего выделения","q":"Рассчитайте продажи за предыдущий год, полностью игнорируя выбор пользователя по году в фильтре.","a":["Sum({1} Sales) — {1} игнорирует все выборы, Max({1} Year) берёт глобальный максимум года, модификатор подставляет предыдущий год.","Sum({} Sales)","Sum({$} Sales) — убирает выбор по году через модификатор, но Max(Year) считает максимум в текущем контексте выборки, а не глобально, что даст неверный результат при активных фильтрах","Sum({1} Sales) — {1} игнорирует выборы пользователя, однако Max(Year) без модификатора {1} вычисляется в текущем контексте выделения, и если пользователь выбрал конкретный год, выражение вернёт неверный предыдущий год или NULL"],"c":0,"f":2},{"id":719403336,"n":85,"t":"Визуализация и отчётность","s":"Оптимизация порядка JOIN и резидентных таблиц в скриптах Qlik Sense — управление последовательностью объединений и временными таблицами для сокращения времени перезагрузки приложения","q":"Почему JOIN к меньшей резидентной таблице ускоряет перезагрузку скрипта в Qlik Sense?","a":["Резидентная таблица исключает повторный парсинг SQL-запроса к источнику, а меньший размер снижает нагрузку на сетевой канал между Qlik Engine и базой данных.","Меньшая таблица занимает меньше места в RAM, поэтому Qlik автоматически сжимает её и ускоряет последующие операции чтения с диска.","JOIN к меньшей таблице быстрее из-за сортировки ключей.","Данные уже в RAM без повторного чтения источника, меньший объём сравнения ускоряет объединение."],"c":3,"f":4},{"id":1666684766,"n":86,"t":"Визуализация и отчётность","s":"Базовый скрипт загрузки Qlik Sense — синтаксис оператора LOAD с фильтрацией данных по полю даты из одной таблицы","q":"Вам нужно загрузить из таблицы Sales только записи за 2024 год по полю OrderDate — какой оператор LOAD с условием вы напишете?","a":["LOAD * FROM Sales WHERE Date(OrderDate, 'YYYY') = 2024 ORDER BY OrderDate;","LOAD * FROM Sales WHERE Year(OrderDate) = '2024' AND OrderDate IS NOT NULL;","LOAD * FROM Sales WHERE Year(OrderDate) = 2024;","LOAD * FROM Sales WHERE OrderDate >= '2024-01-01' AND OrderDate <= '2024-12-31';"],"c":2,"f":3},{"id":97798319,"n":87,"t":"Визуализация и отчётность","s":"Мастер-элементы Qlik Sense - создание и управление переиспользуемыми мерами и измерениями для стандартизации расчётных показателей между листами приложения","q":"Почему изменение мастер-меры автоматически обновляет все визуализации, использующие её?","a":["Qlik Sense использует механизм кэширования, который синхронизирует все копии выражения по таймеру при каждом обновлении данных.","Визуализации хранят выражение локально, но движок Qlik автоматически сверяет его с мастер-элементом при каждом рендеринге листа.","Визуализации хранят ссылку на мастер-элемент, а не копию выражения, поэтому любое изменение определения мастер-меры мгновенно применяется ко всем объектам, ссылающимся на неё.","При сохранении мастер-меры система создаёт новые копии выражения во всех визуализациях, заменяя устаревшие определения."],"c":2,"f":5},{"id":944253667,"n":88,"t":"Визуализация и отчётность","s":"Скрипт загрузки данных Qlik Sense - реализация инкрементальной загрузки по полю временно́й метки с использованием QVD-файлов","q":"В скрипте Qlik Sense выполняется инкрементальная загрузка из QVD-файла по полю ModifiedDate. После загрузки новых записей необходимо обновить QVD. Какой оператор следует использовать для записи объединённых данных обратно в QVD-файл?","a":["Оператор STORE: после конкатенации новых записей со старыми выполняется STORE TableName INTO 'file.qvd' (qvd);","Оператор SAVE: используется SAVE TableName TO 'file.qvd' для записи обновлённых данных в QVD-файл.","Оператор STORE не нужен — QVD обновляется автоматически после выполнения LOAD из источника.","Оператор EXPORT: команда EXPORT TableName INTO 'file.qvd' (qvd) сохраняет таблицу в QVD-формате."],"c":0,"f":1},{"id":894469582,"n":89,"t":"Визуализация и отчётность","s":"Типы визуализаций Qlik Sense — выбор и настройка таблиц, столбчатых диаграмм и KPI-плиток для дашборда по готовому ТЗ","q":"На дашборде нужно показать выполнение плана продаж одним числом с цветовой индикацией — какой тип визуализации Qlik Sense выбрать?","a":["Gauge (индикатор): специально создан для отображения одного числа с цветовой шкалой выполнения плана и визуальным прогресс-баром, что делает его основным инструментом для KPI на дашбордах.","Столбчатая диаграмма с одним столбцом: цвет столбца настраивается по выражению и наглядно показывает одно число.","Текстовый объект с формулой — он поддерживает динамические значения и при правильной настройке CSS меняет цвет фона по условию.","KPI-плитка (KPI object): отображает одно ключевое значение с условным форматированием цвета по порогам выполнения плана."],"c":3,"f":2},{"id":2044260715,"n":90,"t":"Визуализация и отчётность","s":"Свойства диаграмм в Qlik Sense — настройка осей, меток, заголовков и цветового оформления визуализации в панели свойств","q":"Почему настройка цветового оформления диаграммы в Qlik Sense выполняется через панель свойств, а не напрямую на визуализации?","a":["Цветовое оформление нельзя менять напрямую на визуализации, потому что Qlik Sense защищает диаграммы от случайных изменений — прямое редактирование заблокировано по соображениям безопасности.","Панель свойств используется для цветов, так как визуализация отображает только данные и не содержит элементов управления — все настройки хранятся отдельно в базе метаданных приложения.","Панель свойств централизованно управляет параметрами объекта, разделяя данные и представление — это позволяет изменять оформление без затрагивания логики вычислений и обеспечивает воспроизводимость настроек при обновлении данных.","Настройка через панель свойств нужна для синхронизации цветов между всеми листами приложения — изменение цвета в одном месте автоматически применяется ко всем схожим диаграммам."],"c":2,"f":3},{"id":2122210777,"n":91,"t":"Визуализация и отчётность","s":"Функция Aggr в Qlik Sense — применение виртуальных таблиц для построения сложных агрегированных показателей и создание стандартизированных выражений для повторного использования командой","q":"В отчёте нужно показать топ-5 клиентов по сумме продаж за каждый регион отдельно — какое выражение Aggr корректно ранжирует клиентов внутри каждого региона?","a":["Rank(Total Aggr(Sum(Sales), Region, Customer)) <= 5 — модификатор Total обеспечивает ранжирование клиентов внутри каждого региона независимо.","Rank(Total Aggr(Sum(Sales), Customer, Region)) <= 5 — модификатор Total без указания поля Region обнуляет региональный контекст и заставляет функцию ранжировать клиентов внутри каждого региона отдельно, игнорируя общий итог.","Aggr(Rank(Sum(Sales)), Region, Customer) <= 5 — вложенный Rank внутрь Aggr даёт региональное ранжирование.","Rank(Aggr(Sum(Sales), Region, Customer)) <= 5 — без модификатора Total ранжирование происходит глобально по всем регионам сразу, что и даёт топ-5 по каждому региону независимо."],"c":0,"f":2},{"id":449548392,"n":92,"t":"Визуализация и отчётность","s":"Set Analysis в мерах Qlik Sense - построение сравнительных расчётов план/факт с управлением контекстом выборки","q":"Почему в Set Analysis для расчёта плана используют фиксированный идентификатор набора {1} вместо {$}?","a":["{$} полностью игнорирует все выборки и всегда возвращает итоги по всей таблице фактов, поэтому для плана нужен {1}, который, напротив, учитывает только те измерения, которые явно указаны в модификаторах через угловые скобки","{1} игнорирует текущие выборки пользователя и берёт все данные, тогда как {$} наследует активный контекст выборки, что исказило бы плановые значения при фильтрации по факту.","{$} медленнее {1}","{1} обеспечивает более высокую производительность при расчёте агрегатов, так как Qlik Sense кэширует результаты полного набора данных и не пересчитывает их при каждом изменении выборки пользователя"],"c":1,"f":2},{"id":1287561526,"n":93,"t":"Визуализация и отчётность","s":"Оптимизация порядка JOIN и резидентных таблиц в скриптах Qlik Sense — управление последовательностью объединений и временными таблицами для сокращения времени перезагрузки приложения","q":"В скрипте Qlik Sense при загрузке 50M строк из хранилища вы делаете JOIN с небольшим справочником (500 строк). Какой порядок загрузки таблиц даст наилучшую производительность?","a":["Использовать резидентную таблицу: сначала большая таблица в RAM, затем JOIN со справочником через Resident — минимальный расход памяти.","Загрузить большую таблицу первой — JOIN оптимизируется автоматически, Qlik переупорядочивает операции при компиляции скрипта.","Загрузить справочник первым, JOIN даст лучший результат, чем ApplyMap() — маппинг медленнее при большом числе обращений к ключам.","Загрузить справочник первым в RAM, затем JOIN с большой таблицей. Оптимальнее — заменить JOIN на ApplyMap(): быстрее и экономит память, справочник не входит в ассоциативную модель."],"c":3,"f":1},{"id":1889122080,"n":94,"t":"Визуализация и отчётность","s":"Инкрементальная загрузка QVD-файлов — реализация механизмов частичного обновления данных через хранение меток времени и управление дельта-загрузкой в скриптах Qlik Sense","q":"Почему при инкрементальной загрузке QVD-файлов метка времени последней загрузки сохраняется именно после успешного завершения скрипта, а не до его начала?","a":["Метка сохраняется после завершения скрипта, чтобы избежать блокировки QVD-файла во время загрузки — запись метки до старта создаёт конфликт доступа между потоками чтения и записи в Qlik Engine.","Сохранение метки после скрипта гарантирует, что временной диапазон следующей загрузки начнётся ровно с момента окончания предыдущей, исключая перекрытие периодов и дублирование записей в результирующем QVD-файле.","Метка времени фиксируется после скрипта потому, что только в этот момент Qlik Sense завершает транзакцию и фиксирует точное серверное время окончания операции, которое используется как эталон для следующей дельта-выборки.","Чтобы при сбое скрипта метка не обновилась, и следующий запуск повторно захватил тот же дельта-период, исключив потерю данных."],"c":3,"f":1,"e":"Если скрипт упадёт, метка не сдвинется, и следующий запуск заново заберёт тот же период — данные не потеряются. Метка, записанная до начала, при сбое «пропустила» бы период.","u":1},{"id":1515898533,"n":95,"t":"Визуализация и отчётность","s":"KPI-плитка в Qlik Sense — конфигурирование показателя, формата отображения значения и условного цветового индикатора статуса","q":"В KPI-плитке Qlik Sense нужно окрасить значение в красный (ниже 80) и зелёный (выше 80). Где настраивается это условие?","a":["В панели свойств: «Вид» → «Цвета» → «Color by expression» или через пороги «Limits».","В разделе «Представление» → «Условное форматирование» на панели свойств, где задаются пороговые значения Min и Max для шкалы цветового градиента.","В редакторе скриптов через функцию ColorMix1(), применяемую к полю до загрузки данных в модель.","В настройках меры через «Edit expression» — нужно обернуть формулу в If() и вернуть HEX-код цвета напрямую из выражения агрегации."],"c":0,"f":1,"e":"Цвет значения KPI задаётся в свойствах объекта, в разделе оформления: условные цвета с порогами или цвет по выражению. Скрипт загрузки для этого не используется.","u":1},{"id":185964769,"n":96,"t":"Продуктовая и бизнес-аналитика","s":"Техники проведения интервью с заказчиком — выявление противоречий в формулировках бизнес-показателей и согласование финального перечня метрик отчёта","q":"Почему при выявлении противоречий в формулировках бизнес-показателей важно фиксировать конкретные примеры расчётов от заказчика, а не только словесные определения?","a":["Словесные определения допускают разные интерпретации, а числовой пример однозначно раскрывает логику расчёта и позволяет обнаружить скрытые расхождения между ожиданиями разных стейкхолдеров.","Словесные определения субъективны, поэтому их нужно заменять числовыми примерами, которые всегда однозначны и не требуют дополнительного согласования со стейкхолдерами.","Числовые примеры нужны только для технической документации — они помогают разработчику написать корректный SQL-запрос, тогда как бизнес-логику достаточно зафиксировать в словесном описании.","Конкретные примеры расчётов важны потому, что заказчики часто не доверяют аналитикам и требуют доказательств правильности понимания, а словесные определения воспринимаются как попытка уйти от ответственности."],"c":0,"f":2},{"id":1757407243,"n":97,"t":"Продуктовая и бизнес-аналитика","s":"Матрица доступа к отчётам — определение допустимых срезов данных и уровней детализации для каждой роли пользователей","q":"В Qlik Sense необходимо ограничить доступ региональных менеджеров только к данным своего региона — какой механизм следует использовать?","a":["Row-Level Security через Management Console: администратор назначает регионы пользователям через интерфейс хаба, и Qlik автоматически применяет фильтры ко всем листам приложения без изменения скрипта загрузки данных.","Section Access с полем REGION в скрипте загрузки, но фильтрация применяется только на уровне визуализаций — сами данные остаются полностью загруженными в память, что требует дополнительной защиты через Set Analysis.","Создать отдельное приложение для каждого региона.","Section Access: в таблице доступа задаются поля REGION и USERID, Qlik автоматически фильтрует данные при загрузке для каждого пользователя."],"c":3,"f":4},{"id":2050472796,"n":98,"t":"Продуктовая и бизнес-аналитика","s":"Логика drill-down навигации в отчётах — проектирование переходов между уровнями детализации при декомпозиции требований заказчика","q":"Заказчик хочет видеть продажи по регионам, а при клике на регион — по городам, затем по магазинам. Как правильно спроектировать drill-down навигацию в Qlik Sense для этого сценария?","a":["Создать три отдельных листа (регионы, города, магазины) и настроить кнопки навигации между ними с передачей фильтра через Set Analysis — это стандартный подход для drill-down в Qlik Sense.","Drill-down реализуется через обратную иерархию: сначала создаётся уровень Магазин, затем Город, затем Регион — Qlik Sense автоматически инвертирует порядок для корректного отображения навигации сверху вниз.","Создать иерархию в измерении (Drill-down dimension): Регион → Город → Магазин. В Qlik Sense это реализуется через Master Dimension с типом Drill-down, где каждый клик на значение автоматически переходит на следующий уровень детализации, фильтруя данные по выбранному контексту.","Использовать Drill-down dimension не нужно — достаточно добавить все три поля в одну таблицу и дать пользователю самому скрывать/показывать столбцы через настройки визуализации."],"c":2,"f":3},{"id":1904634726,"n":99,"t":"Продуктовая и бизнес-аналитика","s":"Управление scope при анализе требований — фиксация изменений договорённостей с заказчиком, согласование границ отчёта и контроль расширения требований","q":"В середине разработки отчёта в Qlik Sense заказчик устно просит добавить новые измерения и фильтры, значительно расширяя исходный scope — какое действие должен предпринять senior BI-разработчик в первую очередь?","a":["Оценить трудозатраты и сразу приступить к реализации, уведомив менеджера проекта по факту выполнения — опытный разработчик способен самостоятельно решать о допустимости изменений.","Зафиксировать запрос письменно (email, Jira, confluence), оценить impact на сроки и трудозатраты, согласовать изменение scope через формальный change request с подписью заказчика — только после этого приступать к реализации.","Отказать заказчику в изменениях до завершения текущей итерации — scope заморожен на этапе разработки, все новые требования автоматически переносятся в следующий спринт без оценки и согласования.","Немедленно начать реализацию новых измерений и фильтров, зафиксировав устную договорённость как достаточное основание — на senior-уровне доверие заказчику важнее бюрократии, а формальное согласование можно провести постфактум при сдаче отчёта."],"c":1,"f":4},{"id":867832740,"n":100,"t":"Продуктовая и бизнес-аналитика","s":"Граница реализуемости аналитических запросов в BI — критерии разграничения задач уровня отчётности и задач, требующих привлечения смежных команд (data science)","q":"Бизнес просит построить модель предсказания оттока клиентов на основе данных из корпоративного хранилища — какое решение корректно принять BI-разработчику на Qlik Sense/SAP BW?","a":["Отказать бизнесу: BI-инструменты принципиально не работают с предиктивными задачами, и даже подготовка данных для таких моделей выходит за рамки компетенции BI-разработчика.","Эскалировать задачу в команду Data Science: предиктивное моделирование выходит за границы BI-отчётности. BI-разработчик может подготовить витрину данных для модели и визуализировать её результаты, но не строить саму модель.","Построить модель в SAP BW с использованием Planning-функций и агрегированных показателей — это стандартный аналитический сценарий, не требующий привлечения Data Science.","Реализовать модель оттока напрямую в Qlik Sense через расширенные скрипты загрузки и встроенные статистические функции — платформа поддерживает базовое ML-моделирование."],"c":1,"f":4},{"id":1918429740,"n":101,"t":"Продуктовая и бизнес-аналитика","s":"Оценка реализуемости бизнес-требований — методы определения технической границы решения в Qlik Sense и обоснование scope для заказчика без привлечения руководителя","q":"Заказчик требует динамически переключать источник данных в Qlik Sense между несколькими хранилищами в рамках одного приложения — как технически оценить реализуемость?","a":["Нереализуемо нативно: QIX загружает данные при reload, источник не переключается в рантайме. Альтернатива — конкатенация данных из всех источников в скрипте с полем-идентификатором источника для фильтрации пользователем.","Технически возможно через On-Demand App Generation (ODAG): мастер-приложение хранит метаданные всех источников, а при выборе нужного хранилища ODAG генерирует дочернее приложение с соответствующим подключением, что и обеспечивает динамическое переключение источников в рамках единого пользовательского интерфейса.","Qlik Sense поддерживает динамическое переключение источников через механизм Section Access: достаточно настроить разграничение доступа к данным по источникам, и движок QIX автоматически подгрузит нужное хранилище при выборе пользователя без перезагрузки приложения.","Реализуемо через переменные Qlik Sense: создаётся переменная с именем источника, скрипт перезагрузки читает её значение и подключается к нужному хранилищу. Пользователь меняет переменную через input box, после чего данные обновляются динамически без полного reload всего приложения."],"c":0,"f":4,"e":"Движок QIX работает с данными, загруженными при перезагрузке, — переключить источник «на лету» без reload нельзя. Рабочий вариант: загрузить данные всех источников в одну модель с полем-признаком источника и фильтровать по нему.","u":1},{"id":2106813141,"n":102,"t":"Продуктовая и бизнес-аналитика","s":"Сбор бизнес-требований к отчёту - структура и техника проведения брифинга с заказчиком для заполнения опросного листа","q":"Почему брифинг с заказчиком начинают с вопросов о бизнес-цели отчёта, а не о его внешнем виде?","a":["Бизнес-цель определяет бюджет проекта, а без понимания бюджета невозможно решить, насколько сложным делать визуальное оформление.","Чтобы понять, какую проблему решает отчёт, и не разработать визуально красивый, но бесполезный инструмент — форма должна следовать за функцией, а не наоборот.","Потому что заказчик лучше понимает язык бизнеса, чем интерфейсов — так проще установить контакт и расположить его к диалогу.","Внешний вид отчёта согласовывается отдельно с дизайнером, поэтому аналитику незачем тратить на это время в начале встречи."],"c":1,"f":4},{"id":1403493614,"n":103,"t":"Продуктовая и бизнес-аналитика","s":"Уточняющие вопросы к заказчику - типовой чек-лист для определения периодичности обновления отчёта и целевой аудитории","q":"Почему периодичность обновления отчёта важно согласовывать с заказчиком на этапе сбора требований?","a":["Периодичность обновления важна только для технической команды, поскольку именно она отвечает за производительность системы. Заказчику достаточно получить готовый отчёт, а частоту загрузки разработчик определяет самостоятельно исходя из нагрузки на сервер.","Разная периодичность требует разных технических решений: онлайн-обновление нагружает хранилище, а ежедневная загрузка — нет. Неверно выбранная периодичность может сделать отчёт бесполезным для бизнес-решений или избыточно дорогим в эксплуатации.","Согласование периодичности нужно исключительно для планирования бюджета проекта: чем чаще обновляется отчёт, тем выше стоимость лицензий Qlik Sense и SAP BW. Бизнес-ценность данных от частоты обновления не зависит, так как аналитики всегда могут использовать исторические срезы для принятия решений.","Чтобы заказчик мог запланировать встречи для просмотра отчёта."],"c":1,"f":3},{"id":940046375,"n":104,"t":"Продуктовая и бизнес-аналитика","s":"Сопоставление требований заказчика с доступными метриками хранилища - фиксация совпадений и расхождений в структурированном реестре","q":"Почему расхождения между требованиями заказчика и метриками хранилища важно фиксировать в структурированном реестре, а не в произвольных заметках?","a":["Структурированный реестр позволяет отслеживать статус каждого расхождения, приоритизировать доработки и обеспечивать прозрачность между аналитиком, разработчиком и заказчиком — произвольные заметки не дают такого контроля и теряются при передаче задач.","Произвольные заметки удобнее: их быстрее создавать.","Структурированный реестр нужен исключительно для формальной отчётности перед руководством: он показывает объём выполненной работы аналитика, тогда как для рабочего процесса достаточно произвольных заметок — главное, чтобы разработчик понимал задачу и мог её выполнить без лишней бюрократии.","Фиксация расхождений в реестре важна потому, что позволяет автоматически генерировать SQL-запросы для устранения несоответствий в хранилище — произвольные заметки не интегрируются с инструментами SAP BW и Qlik Sense, поэтому структура реестра напрямую влияет на скорость технической реализации доработок и снижает количество ошибок при разработке витрин данных."],"c":0,"f":3},{"id":261823998,"n":105,"t":"Продуктовая и бизнес-аналитика","s":"Сбор бизнес-требований к отчёту - структура и техника проведения брифинга с заказчиком для заполнения опросного листа","q":"Заказчик на брифинге говорит: «Хочу отчёт по продажам». Какой уточняющий вопрос следует задать первым?","a":["Спросить, какие именно показатели продаж нужно отобразить в отчёте.","Уточнить, как часто заказчик планирует использовать отчёт.","Уточнить технические требования: какую систему использует заказчик для хранения данных о продажах.","Уточнить цель: какое бизнес-решение заказчик будет принимать на основе этого отчёта."],"c":3,"f":2},{"id":1556340386,"n":106,"t":"Продуктовая и бизнес-аналитика","s":"Формализация требований к метрикам - способы однозначного описания показателей с единицами измерения, формулой и бизнес-контекстом в ТЗ","q":"Почему формула метрики в ТЗ должна содержать явное указание единиц измерения?","a":["Без единиц измерения одна и та же формула может интерпретироваться по-разному разными разработчиками, что приведёт к несовместимым отчётам и ошибочным бизнес-решениям.","Единицы измерения нужны только для финансовых метрик, где важна валюта — для операционных показателей они избыточны и лишь усложняют документацию.","Это требование стандарта оформления ТЗ: единицы измерения делают документ формально корректным и помогают пройти согласование, хотя технически формула работает и без них.","Единицы измерения указываются для удобства конечных пользователей, чтобы они понимали отчёт, но на логику вычислений разработчиком это никак не влияет."],"c":0,"f":4},{"id":2000726494,"n":107,"t":"Продуктовая и бизнес-аналитика","s":"Техническое задание на отчёт - обязательные разделы и правила описания показателей и фильтров для передачи в разработку","q":"Почему описание бизнес-логики вычисления показателя обязательно включается в техническое задание на отчёт?","a":["Без точной формулы разработчик может реализовать показатель неверно, и отчёт будет давать некорректные данные, которые примут за достоверные.","Бизнес-логика нужна только для документации, разработчик и так знает, как считать стандартные показатели.","Без описания логики отчёт будет работать медленнее, так как система не сможет оптимизировать запросы.","Описание формулы важно лишь для приёмки отчёта заказчиком, на процесс разработки оно не влияет."],"c":0,"f":3},{"id":1714906502,"n":108,"t":"Продуктовая и бизнес-аналитика","s":"Техники проведения интервью с заказчиком — выявление противоречий в формулировках бизнес-показателей и согласование финального перечня метрик отчёта","q":"На интервью заказчик говорит: «Выручка — это сумма всех оплаченных заказов», а финансовый директор уточняет: «Выручка считается по дате отгрузки, без НДС». Какой следующий шаг должен предпринять аналитик для согласования метрики?","a":["Реализовать обе версии метрики в отчёте и дать пользователям самим выбирать нужную через фильтр.","Принять определение финансового директора как приоритетное — он отвечает за финансы, значит его формулировка официальная.","Зафиксировать оба определения, организовать совместную сессию со всеми стейкхолдерами и согласовать единое задокументированное определение метрики с указанием правил расчёта, фильтров и источника данных.","Зафиксировать противоречие в задаче и двигаться дальше — расхождения в определениях устраняются на этапе тестирования отчёта."],"c":2,"f":2},{"id":1100509445,"n":109,"t":"Продуктовая и бизнес-аналитика","s":"Выявление логических противоречий в требованиях — техники обнаружения конфликтов бизнес-логики в многодоменных отчётах и формирование альтернативных сценариев расчёта","q":"Почему конфликты бизнес-логики в многодоменных отчётах чаще всего возникают на стыке агрегационных правил разных источников?","a":["Конфликты возникают из-за разных форматов дат и кодировок в источниках — при ETL-загрузке данные теряют точность, и агрегированные значения расходятся из-за технических ошибок преобразования типов, а не логики расчётов.","Потому что домены используют разные СУБД с несовместимыми диалектами SQL.","Основная причина — отсутствие единого справочника измерений: когда домены используют разные мастер-данные, JOIN между таблицами фактов даёт декартово произведение, что многократно дублирует строки и искажает итоговые суммы по всем метрикам отчёта.","Каждый домен определяет собственные правила агрегации (SUM, COUNT, DISTINCT), и при объединении метрики считаются по разным зёрнам детализации, что порождает несовместимые значения для одного показателя."],"c":3,"f":4},{"id":885258735,"n":110,"t":"Продуктовая и бизнес-аналитика","s":"Декомпозиция бизнес-требований в технические задачи — описание состава листов, объектов визуализации и логики фильтров для разработчика Qlik Sense","q":"Бизнес требует фильтрацию по региону только для одного листа дашборда — какой механизм Qlik Sense наиболее точно решает эту задачу?","a":["Set Analysis в выражениях объектов нужного листа — фильтр задаётся явно, не влияя на глобальный контекст остальных листов.","Sheet-level filter — в настройках листа Qlik Sense есть встроенная опция ограничения действия выборок только текущим листом.","Фильтр региона добавляется в панель фильтров нужного листа, и Qlik Sense автоматически изолирует его от других листов.","Alternate States создаёт изолированный контекст, но фильтр региона в нём автоматически синхронизируется с DefaultState, поэтому остальные листы тоже получают это значение."],"c":0,"f":3},{"id":48196200,"n":111,"t":"Продуктовая и бизнес-аналитика","s":"Логика drill-down навигации в отчётах — проектирование переходов между уровнями детализации при декомпозиции требований заказчика","q":"Почему drill-down навигация должна проектироваться от бизнес-вопроса, а не от структуры данных?","a":["Потому что современные BI-инструменты, такие как Qlik Sense, автоматически строят drill-down на основе метаданных модели данных, и задача аналитика — лишь убедиться, что иерархии в хранилище корректно отражают бизнес-структуру. Если модель данных спроектирована правильно, то переходы между уровнями детализации автоматически совпадут с логикой бизнес-вопросов, поэтому отдельно проектировать навигацию от пользовательских сценариев нецелесообразно.","Потому что пользователь движется по логике принятия решений, а не по модели хранилища: сначала определяется, какой вопрос возникает при виде агрегата (например, 'почему упали продажи?'), и только под этот следующий вопрос подбирается подходящий уровень детализации. Если проектировать от структуры данных, переходы становятся технически корректными, но бессмысленными для аналитика.","Потому что бизнес-пользователи, как правило, не формулируют чёткие вопросы заранее и исследуют данные хаотично, поэтому наиболее надёжная стратегия — предоставить полную иерархию drill-down, точно воспроизводящую структуру хранилища. Это даёт пользователю максимальную свободу навигации, а понимание бизнес-вопросов происходит уже в процессе анализа, и избыточность уровней компенсируется гибкостью системы.","Потому что структура данных в хранилище часто содержит избыточные технические уровни — например, суррогатные ключи, служебные атрибуты и промежуточные агрегаты, — которые не имеют смысла в интерфейсе. Поэтому проектирование от бизнес-вопроса позволяет просто скрыть лишние уровни иерархии и показать пользователю только «чистые» данные без изменения логики переходов, которая при этом остаётся привязанной к модели хранилища."],"c":1,"f":4},{"id":380581396,"n":112,"t":"Продуктовая и бизнес-аналитика","s":"Формализация требований к метрикам - способы однозначного описания показателей с единицами измерения, формулой и бизнес-контекстом в ТЗ","q":"Аналитик передал требование: «показатель выручки должен быть высоким» — что именно нужно добавить в ТЗ, чтобы формализовать эту метрику корректно?","a":["Следует указать только формулу расчёта и источник данных — этого достаточно для разработчика Qlik Sense, поскольку временной контекст задаётся фильтрами на дашборде самим пользователем, а бизнес-правила по включению возвратов стандартны и закреплены в учётной политике компании без необходимости дублировать их в ТЗ.","Нужно указать: единицу измерения (руб.), формулу расчёта (сумма оплаченных заказов за период), источник данных, временной контекст (день/месяц) и бизнес-правила включения/исключения (например, без возвратов).","Достаточно добавить плановое значение выручки из бюджета и пороговое значение «высокого» показателя в процентах от плана — это позволит системе автоматически окрашивать метрику в зелёный цвет при достижении целевого уровня, что и является формализацией требования.","Нужно согласовать с аналитиком субъективное понятие «высокий», зафиксировать его комментарий в протоколе встречи и приложить к ТЗ — этого достаточно, так как бизнес-контекст уже понятен из формулировки, а единицы измерения для выручки всегда очевидны и не требуют отдельного описания."],"c":1,"f":2},{"id":642969271,"n":113,"t":"Продуктовая и бизнес-аналитика","s":"Формализация расчётных логик показателей — перевод Excel-прототипов и устных описаний в структурированные бизнес-описания для постановки задачи разработчику","q":"Аналитик описал показатель устно: «Берём продажи за месяц, но только по активным клиентам, у которых не было возвратов». Какой критически важный элемент необходимо уточнить перед формализацией расчётной логики для разработчика?","a":["Критически важно уточнить валюту и единицы измерения показателя продаж, а также метод агрегации — сумма или среднее, потому что именно эти параметры определяют точность финансовых расчётов, тогда как понятия «активный клиент» и «возврат» очевидны из контекста и не нуждаются в уточнении.","Нужно уточнить определение «активного клиента» — конкретный критерий (например, наличие покупки за последние N дней) и временной период оценки возвратов, иначе разработчик реализует логику неверно.","Главное — уточнить источник данных и таблицы в SAP BW, из которых берутся продажи, так как именно от структуры хранилища зависит корректность выборки, а определения «активности» и «возвратов» всегда стандартны и не требуют дополнительного согласования с бизнесом.","Необходимо уточнить формат итогового отчёта и визуализации — какие графики и таблицы нужны бизнесу, поскольку без понимания представления данных разработчик не сможет правильно выстроить модель данных в Qlik Sense и настроить агрегации."],"c":1,"f":3},{"id":1652094002,"n":114,"t":"Продуктовая и бизнес-аналитика","s":"Выявление логических противоречий в требованиях — техники обнаружения конфликтов бизнес-логики в многодоменных отчётах и формирование альтернативных сценариев расчёта","q":"В многодоменном отчёте Qlik Sense показатель 'Выручка' из домена Продаж не совпадает с аналогичным показателем из домена Финансов за один период — какую технику следует применить первой для выявления источника логического противоречия?","a":["Нужно запустить полное обновление кэша Qlik Sense и перезагрузить обе модели данных, так как расхождение между доменами в большинстве случаев объясняется устаревшими снимками данных в QVD-файлах, а не различиями в бизнес-логике или определениях метрик.","Первым шагом нужно проверить технические настройки коннекторов к источникам данных в обоих доменах — убедиться, что подключения к базам данных используют одинаковые строки соединения и учётные записи. Расхождение выручки почти всегда вызвано тем, что один коннектор обращается к реплике базы данных с задержкой репликации, а другой — к основному серверу. После выравнивания источников подключения показатели автоматически совпадут без необходимости анализировать бизнес-логику или согласовывать определения метрик с владельцами доменов.","Следует немедленно пересчитать показатель выручки в домене Продаж, принудительно приведя его формулу к стандарту домена Финансов, поскольку финансовая отчётность всегда является эталонной по регуляторным требованиям, а данные Продаж — лишь операционные и заведомо менее точны.","Провести трассировку линии данных (data lineage): сравнить определения метрик в обоих доменах — формулы расчёта, зерно агрегации, фильтры исключений и временны́е срезы. Часто противоречие скрыто в разных бизнес-правилах: Продажи считают по дате отгрузки, Финансы — по дате признания выручки. Зафиксировать оба сценария расчёта как альтернативные и согласовать с владельцами доменов эталонное определение."],"c":3,"f":2},{"id":254150991,"n":115,"t":"Продуктовая и бизнес-аналитика","s":"Функциональная спецификация отчёта — структура и принципы описания бизнес-логики расчётных показателей, сценариев фильтрации и правил агрегации в ТЗ","q":"Почему в функциональной спецификации правила агрегации показателей описываются отдельно от логики их расчёта?","a":["Потому что один и тот же показатель может агрегироваться по-разному в зависимости от контекста среза данных: например, остаток на счёте суммируется по клиентам, но берётся последним значением по времени. Разделение этих слоёв позволяет разработчику корректно реализовать поведение меры в разных измерениях без переопределения базовой формулы.","Потому что в большинстве BI-инструментов, включая Qlik Sense и SAP BW, движок автоматически применяет агрегацию SUM ко всем числовым показателям, поэтому разработчику достаточно один раз зафиксировать исключения из этого правила в отдельном разделе спецификации, не дублируя их в формулах расчёта каждого показателя.","Потому что логика расчёта определяет значение показателя, а агрегация — только его визуальное отображение в отчёте. Разделение нужно, чтобы дизайнер мог менять представление данных, не затрагивая бизнес-логику.","Потому что правила агрегации описываются в отдельном разделе исключительно из соображений удобства документирования: разработчику проще читать ТЗ, когда формулы и агрегации не смешаны в одном блоке. Это стандарт оформления, не несущий технической нагрузки."],"c":0,"f":1},{"id":1697892855,"n":116,"t":"Продуктовая и бизнес-аналитика","s":"Функциональная спецификация отчёта — структура и принципы описания бизнес-логики расчётных показателей, сценариев фильтрации и правил агрегации в ТЗ","q":"В функциональной спецификации отчёта Qlik Sense требуется описать показатель 'Выручка нарастающим итогом'. Какой ключевой элемент бизнес-логики необходимо явно зафиксировать в ТЗ, чтобы разработчик однозначно реализовал расчёт без дополнительных уточнений?","a":["Ключевым элементом бизнес-логики является исключительно указание меры-основы: нужно зафиксировать, берётся Выручка с НДС или без. Все прочие аспекты — период накопления, точка сброса, поведение при NULL — являются техническими деталями реализации и относятся к зоне ответственности разработчика, а не аналитика. Включение этих деталей в функциональную спецификацию перегружает ТЗ излишней технической информацией и противоречит принципу разделения бизнес- и технических требований.","В функциональной спецификации для показателя нарастающего итога необходимо и достаточно зафиксировать только контекст агрегации — перечислить измерения (регион, продукт, канал), в разрезе которых накопление выполняется независимо. Именно это устраняет главную неоднозначность реализации. Базовый период накопления, точка сброса и правила обработки NULL в ТЗ не фиксируются, поскольку в Qlik Sense эти параметры автоматически определяются системой на основе календарного измерения в модели данных и не требуют явного описания.","В ТЗ достаточно зафиксировать только формулу расчёта на языке Qlik Script: указать функцию RangeSum(Above(Sum(Выручка), 0, RowNo())) и прописать, что накопление идёт по строкам таблицы сверху вниз. Остальные параметры — тип года, обработка NULL, разбивка по измерениям — разработчик определит самостоятельно исходя из структуры модели данных и здравого смысла, без дополнительных уточнений в документе.","В ТЗ необходимо явно зафиксировать: базовый период накопления (финансовый или календарный год), точку сброса накопления (начало периода), меру-основу (Выручка без НДС или с НДС), правило обработки NULL (заменять нулём или игнорировать), а также контекст агрегации — по каким измерениям (регион, продукт) накопление выполняется независимо. Без этого разработчик реализует RangeSum/Above произвольно."],"c":3,"f":3},{"id":1580226480,"n":117,"t":"Продуктовая и бизнес-аналитика","s":"Техническое задание на отчёт - обязательные разделы и правила описания показателей и фильтров для передачи в разработку","q":"Аналитик просит добавить в отчёт фильтр по «периоду» — что разработчик обязан уточнить в техническом задании перед началом работы?","a":["Тип периода (день/месяц/год), диапазон или конкретные значения, источник данных (поле в хранилище), поведение по умолчанию и обязательность фильтра.","Разработчик должен согласовать цветовую схему элемента фильтра, его расположение на дашборде, а также уточнить у дизайнера, какой UI-компонент использовать для выбора периода — календарь или выпадающий список.","Уточнить только название поля в БД и формат отображения дат в интерфейсе — этого достаточно для реализации фильтра.","Достаточно уточнить диапазон дат и источник данных, поведение по умолчанию определяется стандартами разработки автоматически."],"c":0,"f":2},{"id":30714176,"n":118,"t":"Продуктовая и бизнес-аналитика","s":"Матрица доступа к отчётам — определение допустимых срезов данных и уровней детализации для каждой роли пользователей","q":"Почему
