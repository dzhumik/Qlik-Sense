 в матрице доступа к отчётам уровни детализации данных разграничиваются по ролям, а не по отдельным пользователям?","a":["Роли используются исключительно из соображений безопасности: индивидуальные настройки доступа слишком легко взломать, тогда как групповые политики лучше защищены от несанкционированного проникновения в систему.","Разграничение по ролям обеспечивает более высокую скорость загрузки отчётов, поскольку система кэширует данные для группы пользователей единым запросом, а не формирует отдельный набор данных для каждого сотрудника.","Роли унифицируют управление доступом: изменение прав одной роли автоматически применяется ко всем её участникам, снижая риск ошибок и упрощая администрирование при масштабировании.","Отдельные пользователи слишком часто меняются, поэтому роли придумали для удобства HR-отдела при онбординге."],"c":2,"f":1},{"id":1568895407,"n":119,"t":"Продуктовая и бизнес-аналитика","s":"Сопоставление требований заказчика с доступными метриками хранилища - фиксация совпадений и расхождений в структурированном реестре","q":"Заказчик запросил метрику 'доля возвратов по клиенту', но в хранилище есть только 'количество возвратов' и 'количество заказов' — как зафиксировать это в реестре?","a":["Пропустить фиксацию — вычисляемые метрики не вносятся в реестр, только готовые поля хранилища.","Отметить как расхождение и сообщить заказчику, что метрика недоступна и требует разработки с нуля.","Отметить как совпадение — нужные данные есть в хранилище, просто хранятся в разных полях.","Отметить как расхождение: метрика отсутствует в готовом виде, но может быть вычислена из доступных полей — указать формулу и источники."],"c":3,"f":1},{"id":1881212556,"n":120,"t":"Продуктовая и бизнес-аналитика","s":"Оценка реализуемости бизнес-требований — методы определения технической границы решения в Qlik Sense и обоснование scope для заказчика без привлечения руководителя","q":"Почему оценка реализуемости бизнес-требования в Qlik Sense должна начинаться с анализа модели данных хранилища, а не с UI-макета?","a":["UI можно построить любой, но если нужные атрибуты и метрики отсутствуют в модели данных или не связаны корректными ключами, требование физически нереализуемо — форма без данных бессмысленна.","Анализ модели данных нужен только при работе с SAP BW, где структура InfoCubes жёстко зафиксирована; в Qlik Sense гибкий скриптовый слой позволяет трансформировать данные под любой макет, поэтому реализуемость определяется именно через UI-прототип.","Qlik Sense автоматически строит ассоциативную модель из любых подключённых источников, поэтому данные всегда можно получить — оценку начинают с UI, чтобы понять, какие именно поля потом запросить у DWH-команды.","Потому что UI-макет согласовывается с заказчиком неделями, а модель данных можно изменить быстро — разработка всегда начинается с интерфейса, а данные подтягиваются под него на следующем этапе."],"c":0,"f":2},{"id":1792809036,"n":121,"t":"Продуктовая и бизнес-аналитика","s":"Декомпозиция бизнес-требований в технические задачи — описание состава листов, объектов визуализации и логики фильтров для разработчика Qlik Sense","q":"Почему при декомпозиции бизнес-требований важно явно описывать логику фильтров до начала разработки в Qlik Sense?","a":["Фильтры определяют контекст вычислений в ассоциативной модели Qlik: неверная логика фильтрации искажает агрегации и меры на всех листах, исправить это после разработки значительно дороже, чем согласовать заранее.","Логику фильтров описывают заранее, чтобы избежать дублирования полей в модели данных SAP BW при выгрузке.","Фильтры в Qlik Sense влияют только на визуальное отображение данных, поэтому их логику можно уточнять итеративно в процессе разработки — это не затрагивает вычисления и агрегации в модели данных.","Явное описание фильтров до разработки важно прежде всего для согласования с заказчиком интерфейса дашборда: без утверждённого UI-макета разработчик не знает, где физически размещать элементы фильтрации на листах, что замедляет вёрстку."],"c":0,"f":1},{"id":1875994915,"n":122,"t":"Продуктовая и бизнес-аналитика","s":"Формализация расчётных логик показателей — перевод Excel-прототипов и устных описаний в структурированные бизнес-описания для постановки задачи разработчику","q":"Почему при формализации расчётной логики показателя недостаточно просто скопировать Excel-формулу в техническое задание?","a":["Excel-формула полностью достаточна для технического задания, если разработчик имеет доступ к исходному файлу — современные BI-инструменты, включая Qlik Sense, умеют напрямую импортировать Excel-логику и автоматически транслировать формулы в скрипты загрузки без дополнительных пояснений от аналитика.","Excel-формула не подходит для ТЗ исключительно по техническим причинам: синтаксис Excel несовместим с языком SAP BW или Qlik, поэтому достаточно просто переписать формулу на нужном языке программирования — бизнес-логику при этом отдельно описывать не требуется, так как она полностью выражена в самой формуле.","Excel-формула содержит неявные допущения: захардкоженные диапазоны, ручные фильтры и контекст конкретного файла — без описания бизнес-логики разработчик не поймёт, как воспроизвести расчёт на реальных данных хранилища в изменяющихся условиях","Копировать Excel-формулу в ТЗ недостаточно только тогда, когда формула содержит макросы VBA или сводные таблицы, поскольку именно они не поддаются переносу в хранилище данных — простые арифметические формулы с функциями SUM и IF вполне однозначны и не требуют дополнительного бизнес-описания для разработчика."],"c":2,"f":1,"e":"В Excel-формуле зашиты диапазоны, ручные фильтры и контекст конкретного файла. Без описания бизнес-логики разработчик не воспроизведёт расчёт на данных хранилища.","u":1},{"id":1174136482,"n":123,"t":"Структура хранилища данных","s":"Неоднозначность бизнес-метрик в контексте структуры хранилища — выявление конфликтующих трактовок показателей и фиксация согласованных определений с привязкой к конкретным полям таблиц хранилища","q":"В хранилище две таблицы содержат поле «выручка»: FACT_SALES.NET_AMOUNT (сумма после скидок) и FACT_ORDERS.GROSS_AMOUNT (сумма до скидок). Бизнес просит отчёт по «выручке» — какое первое действие должен предпринять BI-разработчик?","a":["Запросить у DBA или архитектора хранилища официальное техническое заключение о том, какое поле является «каноническим» источником выручки, поскольку именно команда, проектировавшая структуру таблиц, несёт ответственность за семантику полей, и бизнес здесь не является компетентной стороной для принятия подобных решений.","Зафиксировать согласованное определение метрики с бизнесом в письменном виде, указав конкретное поле-источник (например, FACT_SALES.NET_AMOUNT = выручка после скидок), и отразить это в документации или комментарии к скрипту загрузки Qlik.","Немедленно начать разработку отчёта, взяв FACT_SALES.NET_AMOUNT как наиболее логичный источник — сумма после скидок точнее отражает реальную выручку компании, а уточнение определений с бизнесом можно провести уже после демонстрации первого прототипа, чтобы не затягивать сроки.","Использовать в отчёте оба поля сразу — создать две отдельные меры GROSS_REVENUE и NET_REVENUE, вывести их рядом в дашборде, и пусть бизнес-пользователи сами решат, какая цифра им нужна в каждом конкретном случае — это стандартная практика гибкой аналитики."],"c":1,"f":4},{"id":1173629331,"n":124,"t":"Структура хранилища данных","s":"Схема «звезда» и «снежинка» в корпоративном хранилище — чтение структуры связей между таблицами фактов и измерений для самостоятельного выбора источников данных в ТЗ","q":"В схеме «снежинка» таблица измерения DIM_PRODUCT связана с DIM_CATEGORY, а та — с DIM_DEPARTMENT. При построении отчёта по продажам с группировкой по департаментам, какие таблицы необходимо включить в JOIN-цепочку к таблице фактов FACT_SALES?","a":["FACT_SALES → DIM_PRODUCT → DIM_CATEGORY → DIM_DEPARTMENT: все три таблицы измерений нужно последовательно соединить, так как в схеме «снежинка» атрибут департамента хранится не в DIM_PRODUCT, а в нормализованной таблице DIM_DEPARTMENT.","FACT_SALES → DIM_PRODUCT с фильтрацией по полю DEPARTMENT_ID: в правильно спроектированной схеме «снежинка» все идентификаторы родительских измерений денормализуются обратно в дочернюю таблицу для ускорения запросов, поэтому DIM_CATEGORY и DIM_DEPARTMENT подключать отдельно избыточно.","FACT_SALES → DIM_PRODUCT → DIM_DEPARTMENT: достаточно двух таблиц, так как в схеме «снежинка» оптимизатор автоматически разворачивает цепочки нормализованных измерений и транзитивные связи не требуют явного указания промежуточных таблиц в JOIN-запросе.","FACT_SALES → DIM_CATEGORY → DIM_DEPARTMENT: таблицу DIM_PRODUCT включать не нужно, поскольку ключ категории присутствует непосредственно в таблице фактов как внешний ключ, и соединение можно начинать с уровня категории, минуя уровень продукта."],"c":0,"f":2},{"id":982628641,"n":125,"t":"Структура хранилища данных","s":"Гранулярность таблиц фактов — определение уровня детализации записей хранилища для корректной формулировки метрик и фильтров в ТЗ на отчёт","q":"В таблице фактов продаж записи хранятся на уровне строки чека. Аналитик формулирует метрику 'количество уникальных покупателей в месяц' — какой агрегирующей функцией она должна быть выражена в отчёте?","a":["COUNT(DISTINCT check_id) — гранулярность таблицы определена уровнем чека, поэтому для подсчёта уникальных покупателей достаточно считать уникальные чеки: один чек — один покупатель, что даёт корректный результат без дополнительных оговорок.","COUNT(customer_id) — простой подсчёт строк достаточен, так как каждая строка чека соответствует одному покупателю, а задвоения возникают только при ошибках ETL-загрузки.","COUNT(DISTINCT customer_id) — поскольку гранулярность таблицы ниже уровня покупателя, простой COUNT задвоит клиентов с несколькими покупками.","SUM(customer_id) — поскольку нам нужна агрегация по числовому идентификатору покупателя в разрезе месяца."],"c":2,"f":3},{"id":603112916,"n":126,"t":"Структура хранилища данных","s":"Противоречия между бизнес-требованиями и моделью хранилища — выявление и документирование технически обоснованных ограничений гранулярности в ТЗ до начала разработки","q":"Бизнес требует отчёт по прибыльности каждой отдельной транзакции, но в хранилище данные по затратам хранятся только на уровне месяца и cost center — какое ограничение гранулярности нужно зафиксировать в ТЗ?","a":["Зафиксировать: детализация до транзакции невозможна, минимальная гранулярность — месяц/cost center. В ТЗ указать, что показатель прибыльности рассчитывается только на агрегированном уровне, и согласовать это с бизнес-заказчиком до начала разработки.","В ТЗ нужно зафиксировать требование к доработке хранилища: обязать IT-команду детализировать затраты до уровня транзакции, так как бизнес-требование имеет приоритет над текущей моделью данных.","Зафиксировать ограничение не нужно — достаточно разработать отчёт на уровне транзакций, а затраты распределить равномерно по всем транзакциям месяца пропорционально сумме. Это стандартная практика.","Ограничение гранулярности фиксируется только после разработки — на этапе тестирования, когда становится ясно, какие данные реально доступны. В ТЗ достаточно описать бизнес-требование как есть."],"c":0,"f":4},{"id":1024536890,"n":127,"t":"Структура хранилища данных","s":"Сравнительный анализ альтернативных таблиц фактов — обоснование выбора источника метрики по критериям полноты, актуальности и гранулярности при составлении ТЗ","q":"В хранилище есть две таблицы фактов для метрики «выручка»: FACT_SALES (обновляется ежедневно, гранулярность — строка заказа) и FACT_SALES_SUMMARY (обновляется еженедельно, гранулярность — день/магазин). Отчёт требует анализ выручки по отдельным товарам за текущую неделю — какую таблицу следует выбрать источником и почему?","a":["FACT_SALES_SUMMARY подходит для данной задачи, поскольку содержит уже рассчитанную выручку и не требует повторных вычислений. Детализация до товара формально невозможна напрямую, однако её можно восстановить, присоединив справочник ассортимента магазина за нужный период — это стандартная практика работы с агрегированными фактами в SAP BW при построении отчётов по текущей неделе.","FACT_SALES_SUMMARY предпочтительнее: еженедельная гранулярность идеально совпадает с периодом отчёта «текущая неделя», а агрегация по магазину снижает нагрузку на запросы. FACT_SALES избыточна — строчная детализация замедляет выборку и требует дополнительной агрегации на лету, что увеличивает время отклика отчёта без прироста аналитической ценности.","Обе таблицы равнозначны: оптимальное решение — объединить их через UNION, используя FACT_SALES_SUMMARY для исторических недель и FACT_SALES для текущей. Это обеспечит баланс производительности и детализации. Детализация до товара достижима в FACT_SALES_SUMMARY через обратное разворачивание агрегатов с помощью справочника товаров, подключённого через измерение магазина.","FACT_SALES: только она обеспечивает нужную гранулярность (строка заказа → детализация до товара) и актуальность (ежедневное обновление покрывает текущую неделю). FACT_SALES_SUMMARY не подходит — агрегирована до уровня день/магазин, детализация до товара невозможна, и данные за текущую неделю могут отсутствовать."],"c":3,"f":2},{"id":1268743233,"n":128,"t":"Структура хранилища данных","s":"Гранулярность данных в хранилище - определение уровня детализации записей для корректного описания периода и среза отчётности в ТЗ","q":"В ТЗ на отчёт по продажам указан срез 'за месяц' — какую гранулярность данных нужно указать, если требуется детализация до каждой отдельной транзакции?","a":["Гранулярность задаётся на уровне месяца, так как срез отчёта 'за месяц' определяет минимальный уровень детализации данных.","Гранулярность на уровне дня: одна запись = суммарные продажи за день, что достаточно для месячного среза.","Гранулярность на уровне транзакции (одна запись = одна продажа), а не агрегат за день или месяц.","Нужно указать гранулярность на уровне клиента и продукта, так как детализация по транзакциям избыточна при месячном отчёте."],"c":2,"f":3},{"id":1524476002,"n":129,"t":"Структура хранилища данных","s":"Первичные и внешние ключи в схеме хранилища - использование схемы связей таблиц для сверки полей при заполнении раздела «Источники данных» в ТЗ","q":"В ТЗ нужно указать поле для связи таблицы фактов SALES_FACT с измерением CUSTOMER_DIM — в схеме хранилища CUSTOMER_DIM.CUSTOMER_ID помечен как PK, а в SALES_FACT есть поле CUSTOMER_ID без пометки. Какую роль играет SALES_FACT.CUSTOMER_ID и как это поле следует указать в разделе «Источники данных»?","a":["SALES_FACT.CUSTOMER_ID — суррогатный ключ. В разделе «Источники данных» достаточно указать само поле без связи с измерением, джойн настраивается отдельно в Qlik.","SALES_FACT.CUSTOMER_ID — это дублирующий PK таблицы фактов. В ТЗ его указывают как самостоятельный ключ, ссылка на CUSTOMER_DIM не требуется.","SALES_FACT.CUSTOMER_ID — внешний ключ (FK). В разделе «Источники данных» его нужно указать как поле связи, сославшись на CUSTOMER_DIM.CUSTOMER_ID (PK) — это подтверждает корректность джойна между таблицами.","CUSTOMER_DIM.CUSTOMER_ID — FK, он ссылается на SALES_FACT.CUSTOMER_ID как на PK. В ТЗ связь указывается от измерения к факту, а не наоборот."],"c":2,"f":4},{"id":601160558,"n":130,"t":"Структура хранилища данных","s":"Типы данных полей в схеме хранилища - сопоставление форматов дат, числовых и текстовых полей при описании фильтров и условий отбора данных в ТЗ","q":"В ТЗ указан фильтр по дате: 'период с 01.01.2024 по 31.12.2024'. Поле CALDAY в хранилище имеет тип DATS (формат YYYYMMDD). Как правильно задать условие отбора для этого поля?","a":["CALDAY >= '20240101' AND CALDAY <= '20241231' — оператор BETWEEN не поддерживается для типа DATS, поэтому нужно использовать явное сравнение через >= и <=.","Тип DATS хранит дату в числовом виде, поэтому условие задаётся без кавычек: CALDAY BETWEEN 20240101 AND 20241231, иначе сравнение будет выполняться как текстовое и может дать некорректный результат при сортировке.","Условие задаётся в формате DD.MM.YYYY, как указано в ТЗ: CALDAY BETWEEN '01.01.2024' AND '31.12.2024' — SAP автоматически конвертирует дату при выполнении запроса.","Даты нужно привести к формату YYYYMMDD: CALDAY BETWEEN '20240101' AND '20241231', без разделителей, как хранит тип DATS в SAP."],"c":3,"f":3},{"id":1494947336,"n":131,"t":"Структура хранилища данных","s":"Логика агрегаций по периодам в хранилище данных — корректная формулировка условий расчёта показателей нарастающим итогом и в разрезе временных периодов в ТЗ","q":"Почему при расчёте нарастающего итога (YTD) в ТЗ критично явно фиксировать точку отсчёта периода?","a":["Явная точка отсчёта нужна только чтобы исключить будущие даты из расчёта — без неё агрегация захватывает незакрытые периоды и плановые данные.","Точка отсчёта нужна только для визуального форматирования отчёта — без неё данные считаются верно, но отображаются некорректно в дашборде.","Фиксация точки отсчёта важна лишь при помесячной детализации; для годового YTD система автоматически берёт 1 января без дополнительных условий в ТЗ.","Без явной точки отсчёта агрегация может захватывать данные предыдущих лет или неполных периодов, искажая показатель. Фиксация гарантирует, что суммирование начинается строго с первого дня целевого года (или иного периода), независимо от логики фильтрации в отчёте."],"c":3,"f":4},{"id":1472787118,"n":132,"t":"Структура хранилища данных","s":"Гранулярность таблиц фактов — определение уровня детализации записей хранилища для корректной формулировки метрик и фильтров в ТЗ на отчёт","q":"Почему смешивание в одной таблице фактов записей разной гранулярности приводит к ошибкам в метриках отчёта?","a":["Смешанная гранулярность влияет только на визуальное отображение отчёта — графики и таблицы выглядят неоднородно, но математические агрегации SUM и COUNT остаются точными, поскольку BI-инструменты автоматически нормализуют уровни детализации перед вычислением.","Ошибки в метриках появляются потому, что разная гранулярность нарушает ссылочную целостность между таблицей фактов и измерениями: строки агрегированного уровня не имеют соответствующих записей в dimension-таблицах, и фильтры по этим измерениям начинают отсекать нужные данные.","Проблема возникает исключительно из-за дублирования ключей измерений: когда строки с разной детализацией ссылаются на одни и те же значения в таблицах измерений, JOIN-операции начинают возвращать некорректные декартовы произведения, увеличивая количество строк.","Агрегации суммируют несопоставимые уровни детализации, что искажает итоговые показатели — одни строки представляют транзакции, другие уже агрегированные периоды, и SUM считает их равнозначными."],"c":3,"f":2},{"id":304600511,"n":133,"t":"Структура хранилища данных","s":"Схема «звезда» в корпоративном хранилище данных - чтение готовой схемы таблиц фактов и измерений для корректного переноса бизнес-требований в поля шаблона ТЗ","q":"Почему в схеме 'звезда' таблица фактов хранит числовые метрики, а не описательные атрибуты?","a":["Числовые метрики хранятся в таблице фактов, так как это требование стандарта OLTP-систем, где агрегация выполняется быстрее именно над целочисленными полями первичных ключей.","Таблица фактов хранит только числовые метрики, потому что текстовые поля не поддерживаются в реляционных базах данных и не могут быть использованы в SQL-запросах для построения отчётов.","Описательные атрибуты вынесены в таблицы измерений, чтобы избежать дублирования данных и ускорить агрегацию числовых показателей при аналитических запросах.","Описательные атрибуты занимают больше места, поэтому их хранят в таблице фактов отдельными колонками, а числовые метрики выносят в измерения для ускорения фильтрации."],"c":2,"f":3},{"id":1071344991,"n":134,"t":"Структура хранилища данных","s":"Схема «звезда» в корпоративном хранилище данных - чтение готовой схемы таблиц фактов и измерений для корректного переноса бизнес-требований в поля шаблона ТЗ","q":"В схеме «звезда» аналитик видит таблицу фактов SALES с полем DATE_KEY и таблицу измерений DIM_DATE с полями DATE_KEY, YEAR, MONTH, QUARTER. Какое поле из DIM_DATE нужно указать в ТЗ, чтобы отчёт показывал продажи в разрезе кварталов?","a":["В ТЗ указать поле MONTH из DIM_DATE: кварталы можно получить расчётным путём, сгруппировав месяцы по три, без лишних связей между таблицами.","В ТЗ указать поле QUARTER из таблицы измерений DIM_DATE, связав её с фактами через DATE_KEY.","В ТЗ указать поле DATE_KEY из таблицы SALES — оно уже содержит всю необходимую временну́ю иерархию, включая кварталы.","В ТЗ указать поле YEAR из DIM_DATE, связав через DATE_KEY."],"c":1,"f":2},{"id":24880775,"n":135,"t":"Структура хранилища данных","s":"Таблицы измерений хранилища данных - идентификация атрибутов для заполнения раздела «Измерения» в шаблоне ТЗ отчёта Qlik Sense","q":"Почему атрибуты таблиц измерений используются в разделе «Измерения» шаблона ТЗ, а не в разделе «Показатели»?","a":["Атрибуты измерений описывают качественные характеристики объектов (категории, названия, иерархии), по которым группируются и фильтруются данные, тогда как показатели — это числовые значения, которые агрегируются в разрезе этих характеристик.","Атрибуты таблиц измерений попадают в раздел «Измерения», а не в «Показатели», потому что они не содержат числовых значений и не поддерживают математические операции — это техническое ограничение модели данных хранилища, при котором текстовые и категориальные поля просто недоступны для агрегации в движке Qlik Sense.","Атрибуты измерений используются в разделе «Измерения», потому что они хранятся в отдельных таблицах базы данных, физически отделённых от таблиц фактов, и Qlik Sense автоматически распознаёт их принадлежность к измерениям по структуре модели данных, не допуская их использования в качестве показателей.","Показатели — это поля из таблиц фактов, а измерения — из справочников."],"c":0,"f":2},{"id":2104219382,"n":136,"t":"Структура хранилища данных","s":"Неоднозначность бизнес-метрик в контексте структуры хранилища — выявление конфликтующих трактовок показателей и фиксация согласованных определений с привязкой к конкретным полям таблиц хранилища","q":"Почему одна и та же бизнес-метрика может возвращать разные значения в зависимости от того, из какой таблицы хранилища она извлекается?","a":["Разные таблицы могут хранить метрику на разных уровнях гранулярности, с разными фильтрами, датами актуальности или бизнес-правилами агрегации, что приводит к расхождению результатов даже при формально одинаковом названии показателя.","Расхождения объясняются тем, что каждая таблица хранилища использует собственную кодировку и формат хранения числовых значений, из-за чего одно и то же число интерпретируется по-разному на уровне СУБД — это стандартная особенность реляционных хранилищ, решаемая настройкой типов данных.","Разные значения возникают исключительно из-за технических ошибок в ETL-процессах: при загрузке данных в хранилище происходит дублирование или потеря записей, поэтому одна таблица содержит полный набор данных, а другая — неполный.","Метрика возвращает разные значения, потому что таблицы обновляются в разное время суток."],"c":0,"f":1},{"id":1041257704,"n":137,"t":"Структура хранилища данных","s":"Таблицы измерений хранилища данных — сопоставление бизнес-терминов заказчика с атрибутами справочников контрагентов, договоров и организационных единиц при составлении ТЗ","q":"Заказчик в ТЗ указал термин «регион присутствия контрагента» — в какой таблице измерений хранилища данных и в каком атрибуте следует искать это значение?","a":["В таблице измерения договоров (DIM_CONTRACT) в поле CONTRACT_REGION, поскольку регион присутствия фиксируется в момент заключения договора.","В отдельной таблице-справочнике регионов (DIM_REGION) напрямую, без связи с DIM_COUNTERPARTY, так как регион — самостоятельное измерение.","В таблице измерения контрагентов (например, DIM_COUNTERPARTY) в атрибуте региона/адреса — как правило, поле типа REGION или ADDRESS_REGION, связанное с нормативным справочником регионов.","В таблице фактов продаж (FACT_SALES) в атрибуте REGION_ID, так как регион определяется по месту совершения сделки, а не по справочнику контрагентов."],"c":2,"f":2},{"id":2045214923,"n":138,"t":"Структура хранилища данных","s":"Противоречия между бизнес-требованиями и моделью хранилища — выявление и документирование технически обоснованных ограничений гранулярности в ТЗ до начала разработки","q":"Почему ограничения гранулярности хранилища данных необходимо документировать в ТЗ до начала разработки отчётов?","a":["Документирование ограничений гранулярности в ТЗ нужно прежде всего для защиты команды разработки от претензий заказчика: если бизнес позднее потребует детализацию глубже, чем предусмотрено, разработчики смогут сослаться на подписанный документ и отклонить задачу без дополнительного анализа — это стандартная практика управления ожиданиями в проектах.","Ограничения гранулярности фиксируются в ТЗ, потому что Qlik Sense не умеет агрегировать данные самостоятельно и требует, чтобы все уровни детализации были явно описаны ещё до загрузки данных в модель приложения.","Это требование формальное: регуляторы и внутренние стандарты качества данных обязывают фиксировать уровень детализации на этапе проектирования, однако технически гранулярность можно скорректировать в любой момент разработки, добавив нужные трансформации на уровне скрипта загрузки Qlik или BEx-запроса в SAP BW без переработки базовой модели.","Потому что изменить уровень детализации данных в хранилище после разработки отчётов крайне затратно: бизнес-требования, предполагающие более низкую гранулярность, чем зафиксированная в модели хранилища, физически невыполнимы без переработки ETL и модели — это нужно согласовать заранее, зафиксировав технически обоснованные ограничения как явные допущения ТЗ."],"c":3,"f":3},{"id":414206166,"n":139,"t":"Структура хранилища данных","s":"Гранулярность таблиц фактов хранилища — оценка достижимого уровня детализации метрики при формализации требований к отчёту в ТЗ","q":"В ТЗ заказчик требует отчёт по выручке с детализацией до конкретной строки заказа и часа транзакции, но таблица фактов продаж в хранилище имеет гранулярность «заказ-день». Какое решение вы зафиксируете в ТЗ?","a":["Зафиксировать оба требования как реализуемые: детализация до строки заказа обеспечивается текущей гранулярностью «заказ-день», а детализация до часа достигается через Qlik Sense путём настройки drill-down иерархии времени — инструмент визуализации самостоятельно разбивает дневные агрегаты на часовые срезы на стороне клиента, что полностью удовлетворяет требованиям ТЗ без изменения модели хранилища.","Зафиксировать в ТЗ, что детализация до часа достижима путём добавления вычисляемого поля с интерполяцией времени на основе последовательности строк заказа — это стандартная практика обогащения данных без изменения ETL, и заказчик получит требуемую детализацию без доработки хранилища.","Часовая детализация недостижима — нужно снизить требования. Строчная детализация тоже недоступна, так как гранулярность «заказ-день» означает агрегацию всех строк заказа в одну запись.","Зафиксировать ограничение: детализация до строки заказа достижима, до часа — нет, так как исходная гранулярность таблицы фактов — день. Требуется либо изменение ETL-процесса для загрузки временных меток транзакций, либо снижение требований до дневного уровня детализации."],"c":3,"f":2},{"id":1820470521,"n":140,"t":"Структура хранилища данных","s":"Логика агрегаций по периодам в хранилище данных — корректная формулировка условий расчёта показателей нарастающим итогом и в разрезе временных периодов в ТЗ","q":"В ТЗ указано: 'показатель YTD рассчитывается нарастающим итогом с начала года'. Какое критически важное уточнение необходимо добавить в формулировку, чтобы избежать двусмысленности при реализации в хранилище данных?","a":["Необходимо явно указать: с начала какого года (календарного или финансового), включать ли текущий период, и по какому полю хранилища выполняется фильтрация (дата проводки, дата загрузки или отчётная дата).","Достаточно добавить уточнение о типе агрегации (SUM или AVG), так как именно функция агрегации определяет корректность нарастающего итога в хранилище данных.","Нужно указать гранулярность: день или месяц.","Необходимо явно указать часовой пояс сервера хранилища данных и формат даты (DD.MM.YYYY или YYYY-MM-DD), поскольку различия в форматах между источником и DWH приводят к ошибкам при фильтрации периодов и расчёте YTD-показателей в витринах данных."],"c":0,"f":2},{"id":2128052261,"n":141,"t":"Структура хранилища данных","s":"Типы данных полей в схеме хранилища - сопоставление форматов дат, числовых и текстовых полей при описании фильтров и условий отбора данных в ТЗ","q":"Почему при описании фильтра по дате в ТЗ важно явно указывать формат значения, а не писать просто '01.01.2024'?","a":["Явное указание формата даты в ТЗ необходимо прежде всего по требованиям корпоративных стандартов документирования, а не по техническим причинам: сами системы Qlik Sense и SAP BW используют единый внутренний стандарт хранения дат — числовой timestamp Unix, поэтому технически любой формат записи будет преобразован одинаково и без ошибок, а формат в ТЗ нужен только аналитику для удобства чтения.","Разные системы (Qlik, SAP BW, хранилище) хранят и интерпретируют даты в разных форматах (YYYYMMDD, DD.MM.YYYY, ISO 8601), и без явного указания формата условие фильтрации может быть понято некорректно или вызвать ошибку преобразования типов.","Потому что '01.01.2024' — это текстовая строка, и все СУБД автоматически отклонят такой фильтр с ошибкой синтаксиса. Явное указание формата нужно исключительно для того, чтобы система вообще приняла запрос на выполнение, иначе он не запустится.","Формат даты важно указывать только для визуального отображения в отчётах Qlik Sense — чтобы пользователь видел привычный вид. Сами фильтры и условия отбора работают корректно с любой записью даты, так как системы автоматически распознают числа и точки как разделители."],"c":1,"f":4},{"id":1219108666,"n":142,"t":"Структура хранилища данных","s":"Гранулярность таблиц фактов хранилища — оценка достижимого уровня детализации метрики при формализации требований к отчёту в ТЗ","q":"Почему гранулярность таблицы фактов жёстко ограничивает минимально достижимый уровень детализации метрики в отчёте?","a":["Ограничение возникает из-за прав доступа к исходным системам, а не из-за структуры таблицы фактов в хранилище.","Детализация ниже гранулы возможна путём добавления новых измерений в модель без изменения ETL — достаточно расширить таблицу фактов.","Факт хранится на фиксированном уровне детализации: агрегировать можно, но детализировать ниже исходной гранулы — невозможно без изменения ETL и модели хранилища.","Гранулярность ограничивает только агрегацию: детализировать факт можно всегда через drill-down в Qlik Sense, если настроены связи между таблицами."],"c":2,"f":2},{"id":682156568,"n":143,"t":"Структура хранилища данных","s":"Историчность данных в измерениях хранилища — выявление и фиксация в ТЗ логики работы с изменяющимися атрибутами (SCD) при постановке задач на отчёты по дебиторской задолженности и продажам","q":"В отчёте по дебиторской задолженности нужно показать менеджера, закреплённого за клиентом на момент возникновения долга, а не текущего — какой тип SCD следует зафиксировать в ТЗ для атрибута 'Менеджер' в измерении клиента?","a":["SCD Type 1: атрибут «Менеджер» перезаписывается новым значением, при этом в поле «Менеджер на дату сделки» сохраняется исторический снимок, что позволяет привязать долг к нужному сотруднику без создания дополнительных версий записи.","SCD Type 2: каждое изменение менеджера создаёт новую версию записи с датами действия, что позволяет привязать транзакцию к историческому значению атрибута.","SCD Type 2 не требуется, достаточно зафиксировать в ТЗ сохранение идентификатора менеджера непосредственно в таблице фактов дебиторской задолженности — это стандартная практика, которая даёт тот же результат без усложнения структуры измерения клиента.","SCD Type 3: для атрибута «Менеджер» добавляются два поля — «Текущий менеджер» и «Предыдущий менеджер», что обеспечивает полную историчность и позволяет отобразить менеджера на любой произвольный момент времени в прошлом, включая дату возникновения долга."],"c":1,"f":4},{"id":1725960176,"n":144,"t":"Структура хранилища данных","s":"Историчность данных в измерениях хранилища — выявление и фиксация в ТЗ логики работы с изменяющимися атрибутами (SCD) при постановке задач на отчёты по дебиторской задолженности и продажам","q":"Почему SCD Type 2 предпочтительнее SCD Type 1 при построении отчётов по дебиторской задолженности в разрезе исторических атрибутов контрагента?","a":["SCD Type 2 сохраняет историю изменений атрибутов через новые записи с датами действия, что позволяет корректно привязать задолженность к актуальному на момент сделки состоянию контрагента — например, к его региону или сегменту. SCD Type 1 перезаписывает атрибут, разрушая историческую связь и искажая ретроспективные отчёты.","SCD Type 2 предпочтительнее, поскольку он физически хранит меньше данных за счёт версионирования записей вместо дублирования таблиц. При построении отчётов по дебиторской задолженности это критично, так как позволяет снизить нагрузку на хранилище и ускорить выполнение запросов — именно поэтому SAP BW рекомендует его как стандарт оптимизации производительности витрин данных.","SCD Type 1 разрушает историю атрибутов, поэтому для ретроспективных отчётов по дебиторской задолженности правильнее использовать SCD Type 3, который хранит текущее и одно предыдущее значение атрибута. SCD Type 2 избыточен, так как создаёт слишком много дублирующих записей и усложняет модель данных без реальной аналитической ценности для большинства финансовых отчётов.","SCD Type 2 предпочтителен потому, что он автоматически агрегирует задолженность по всем версиям контрагента и консолидирует итоговые суммы в единую актуальную запись, устраняя необходимость фильтрации по датам действия. Это принципиально отличает его от SCD Type 1, который требует ручной настройки агрегаций и не поддерживает автоматическую консолидацию в Qlik Sense и SAP BW."],"c":0,"f":4},{"id":870717660,"n":145,"t":"Структура хранилища данных","s":"Сравнительный анализ альтернативных таблиц фактов — обоснование выбора источника метрики по критериям полноты, актуальности и гранулярности при составлении ТЗ","q":"Почему высокая гранулярность таблицы фактов может стать недостатком при выборе источника метрики?","a":["Высокая гранулярность всегда избыточна для аналитики, так как бизнес-пользователи работают только с агрегированными данными, а детальные записи замедляют дашборды без какой-либо пользы для точности метрик.","Слишком детальная гранулярность требует дополнительной агрегации, увеличивает объём обрабатываемых данных и может искажать метрику при некорректной свёртке, особенно для аддитивных показателей с разными уровнями детализации.","Высокая гранулярность является недостатком только для неаддитивных метрик вроде остатков или курсов валют, тогда как для аддитивных показателей детализация всегда повышает точность расчётов.","Высокая гранулярность снижает полноту данных: чем детальнее таблица, тем больше пропусков в исторических периодах, что делает метрику ненадёжной при сравнении с менее детальными источниками."],"c":1,"f":1},{"id":698798499,"n":146,"t":"Структура хранилища данных","s":"Схема «звезда» и «снежинка» в корпоративном хранилище — чтение структуры связей между таблицами фактов и измерений для самостоятельного выбора источников данных в ТЗ","q":"Почему в схеме «снежинка» измерения нормализованы в отдельные таблицы, а не хранятся плоско как в «звезде»?","a":["Потому что таблицы фактов содержат слишком много строк, и нормализация измерений снижает нагрузку на них при агрегации данных.","Чтобы упростить загрузку данных в ETL-процессах: плоские таблицы сложнее обновлять, а подтаблицы обновляются независимо друг от друга.","Чтобы ускорить выполнение запросов за счёт уменьшения числа JOIN-ов — нормализация сокращает путь между таблицами фактов и измерений.","Чтобы устранить избыточность данных в измерениях за счёт их декомпозиции на связанные подтаблицы, что экономит место, но увеличивает количество JOIN-ов при построении отчётов."],"c":3,"f":1},{"id":1515829679,"n":147,"t":"Структура хранилища данных","s":"Иерархии измерений корпоративного хранилища — декомпозиция многоуровневых KPI до конкретных атрибутов и уровней для однозначной постановки задачи разработчику","q":"Аналитик просит отчёт по KPI 'Выручка на торгового представителя по регионам за квартал' — какие уровни иерархий измерений хранилища нужно идентифицировать разработчику для однозначной реализации?","a":["Правильная декомпозиция данного KPI требует идентификации трёх иерархий, однако ключевым шагом является не определение уровней Quarter, Region и Sales Representative, а установление правильного порядка джойнов между таблицами измерений и фактов в модели SAP BW: сначала необходимо зафиксировать зависимость InfoObject-ов друг от друга внутри InfoCube, затем определить агрегационный уровень MultiProvider, и только после этого можно говорить об уровнях иерархий — без этого порядка декомпозиция до атрибутов теряет практический смысл и не гарантирует корректности меры Выручка.","Для реализации достаточно определить только меру Выручка и привязать её к таблице фактов — иерархии измерений Qlik Sense строит автоматически на основе ассоциаций между таблицами, поэтому отдельная идентификация уровней Calendar, Sales Territory и HR Org не требуется и лишь усложняет постановку задачи.","Декомпозиция KPI сводится к выбору измерений: Дата (любой уровень детализации), Регион (любой географический атрибут) и Сотрудник (любой атрибут из HR-таблицы). Конкретный уровень иерархии разработчик определяет самостоятельно по контексту отчёта, фиксировать технические ключи и гранулярность факт-таблицы на этапе постановки задачи избыточно.","Необходимо декомпозировать KPI до конкретных иерархий: 1) Время — уровень Quarter в иерархии Calendar (Year→Quarter→Month→Day); 2) География — уровень Region в иерархии Sales Territory; 3) Сотрудник — уровень Sales Representative в иерархии HR/Sales Org. Для каждого уровня фиксируется технический ключ атрибута в хранилище, гранулярность факт-таблицы и способ агрегации меры Выручка (SUM). Без такой декомпозиции разработчик рискует выбрать неверный уровень иерархии или некорректную точку соединения с фактами."],"c":3,"f":3},{"id":1084672156,"n":148,"t":"Структура хранилища данных","s":"Гранулярность данных в хранилище - определение уровня детализации записей для корректного описания периода и среза отчётности в ТЗ","q":"Почему при неверно указанной гранулярности данных в ТЗ итоговые цифры в отчёте могут задваиваться?","a":["Если уровень детализации источника ниже ожидаемого, одна логическая запись хранится в нескольких строках, и суммирование без учёта этого дублирует значения.","Задвоение происходит из-за ошибок в ETL-процессе, а не в гранулярности.","Задвоение возникает из-за того, что при высокой гранулярности источника данные агрегируются на уровне хранилища дважды — сначала при загрузке ETL, затем повторно при построении витрины.","Если в ТЗ указан слишком высокий уровень детализации, Qlik Sense автоматически дублирует строки для обеспечения корректного join между таблицами фактов и измерений, что и приводит к удвоению сумм."],"c":0,"f":2},{"id":317387590,"n":149,"t":"Структура хранилища данных","s":"Таблицы измерений хранилища данных - идентификация атрибутов для заполнения раздела «Измерения» в шаблоне ТЗ отчёта Qlik Sense","q":"В таблице DIM_PRODUCT есть поля: PRODUCT_KEY, PRODUCT_ID, PRODUCT_NAME, CATEGORY, SUBCATEGORY, PRICE, LOAD_DATE. Какие поля включить в раздел «Измерения» ТЗ?","a":["PRODUCT_NAME, CATEGORY, SUBCATEGORY, PRICE — цена характеризует продукт, значит это атрибут измерения","PRODUCT_ID, PRODUCT_NAME, CATEGORY, SUBCATEGORY — бизнес-ключ и описательные атрибуты для группировки, фильтрации и отображения.","PRODUCT_KEY, PRODUCT_ID, PRODUCT_NAME — суррогатный ключ обязателен в измерениях для связи таблиц","PRODUCT_KEY, CATEGORY, SUBCATEGORY, LOAD_DATE — технические поля нужны для корректной фильтрации в Qlik"],"c":1,"f":1},{"id":1239445508,"n":150,"t":"Структура хранилища данных","s":"Иерархии измерений корпоративного хранилища — декомпозиция многоуровневых KPI до конкретных атрибутов и уровней для однозначной постановки задачи разработчику","q":"Почему при декомпозиции KPI до уровня атрибутов хранилища критически важно учитывать гранулярность измерения?","a":["Гранулярность влияет лишь на визуализацию, а не на точность расчётов.","Несоответствие гранулярности измерения уровню KPI приводит к некорректной агрегации: данные либо дублируются при слишком детальном уровне, либо теряется аналитический контекст при слишком высоком — разработчик строит отчёт на неверной иерархической глубине, и метрика считается ошибочно.","Учёт гранулярности при декомпозиции KPI критически важен только в случае работы с финансовыми данными, поскольку именно в финансовых измерениях иерархические уровни строго регламентированы учётной политикой. Для операционных и маркетинговых KPI гранулярность не влияет на корректность агрегации, так как эти данные не проходят аудиторскую проверку и допускают приближённые расчёты.","Гранулярность измерения важна исключительно для оптимизации производительности запросов: чем детальнее уровень атрибута, тем медленнее работает отчёт, поэтому при декомпозиции KPI нужно выбирать максимально высокий уровень иерархии, чтобы снизить нагрузку на хранилище и ускорить выдачу результатов пользователю."],"c":1,"f":1},{"id":638578401,"n":151,"t":"Структура хранилища данных","s":"Таблицы измерений хранилища данных — сопоставление бизнес-терминов заказчика с атрибутами справочников контрагентов, договоров и организационных единиц при составлении ТЗ","q":"Почему атрибуты справочника контрагентов в таблице измерений хранят исторические значения отдельно от текущих?","a":["Разделение нужно для дедупликации: текущие значения участвуют в JOIN с фактами, а исторические архивируются отдельно и в расчётах не используются.","Чтобы не перегружать OLTP-систему: исторические данные вынесены отдельно для оптимизации запросов к текущему справочнику, а не для поддержки аналитики по прошлым периодам.","Исторические значения хранятся отдельно из-за требований аудита — регуляторы обязывают фиксировать все изменения, но в отчётах всегда используется только актуальная версия атрибута.","Чтобы отчёты отражали состояние атрибута на момент транзакции, а не текущее значение — это реализуется через SCD (медленно меняющиеся измерения), где каждая версия записи имеет свой период действия."],"c":3,"f":1,"e":"Историческое хранение атрибутов (SCD, тип 2) позволяет показать атрибут таким, каким он был на дату операции: у каждой версии записи свой период действия.","u":1},{"id":1971355375,"n":152,"t":"SAP BW","s":"Двойные структуры в BEx-запросе — настройка структуры характеристик в строках и структуры показателей в колонках с независимыми фильтрами элементов","q":"В BEx-запросе с двойной структурой нужно отобразить выручку только по региону 'Север' в одном элементе структуры показателей — какой механизм использовать?","a":["Глобальный фильтр запроса по 'Регион' = 'Север' применяется ко всем элементам структуры, включая нужный показатель.","Ограничение задаётся в свойствах всей структуры показателей, автоматически изолируя фильтр от строк.","Calculated Key Figure с формулой IF(Регион='Север', Выручка, 0) — стандартный способ ограничить показатель в структуре.","Restricted Key Figure: в элементе структуры задаётся локальное ограничение по характеристике 'Регион' = 'Север', не затрагивая остальные элементы."],"c":3,"f":4},{"id":716266558,"n":153,"t":"SAP BW","s":"Исключения (Exceptions) в BEx Query Designer — настройка цветовой сигнализации пороговых отклонений факта от плана и проверка отображения в BEx Analyzer","q":"В BEx Query Designer настроено исключение: отклонение >10% подсвечивается красным. В BEx Analyzer цвет не отображается — две наиболее вероятные причины?","a":["Пользователь не имеет роли S_RS_COMP для просмотра исключений; либо в BEx Analyzer используется устаревший шаблон Excel без поддержки цветов.","Порог исключения задан в абсолютных единицах вместо процентов; либо цветовая схема переопределена условным форматированием в Excel.","Исключение применено к вычисляемому показателю, а не к базовому ключевому показателю; либо не задан диапазон ячеек в настройках BEx Analyzer.","Флаг 'Active' у исключения в Query Designer не установлен; либо отключена опция 'Apply Exceptions' в Display Properties таблицы результатов BEx Analyzer."],"c":3,"f":4},{"id":30266927,"n":154,"t":"SAP BW","s":"Иерархии характеристик в BEx-запросах - настройка отображения узлов иерархии, реализация переменных выбора иерархии и уровня раскрытия, верификация корректности расчётов показателей на каждом уровне в BEx Analyzer","q":"В BEx Analyzer узел второго уровня показывает значение, не совпадающее с суммой дочерних узлов. Какова наиболее вероятная причина?","a":["Нелистовые узлы не агрегируют дочерние значения автоматически — нужно включить «Cumulative» в настройках KPI.","Расхождение вызвано некорректной настройкой исключений (exceptions) в BEx Analyzer, которые скрывают часть дочерних узлов.","Причина в том, что в BEx Query Designer не активирован флаг «Hierarchy Active», из-за чего агрегация выполняется по плоской структуре без учёта родительско-дочерних связей — необходимо включить иерархию в свойствах характеристики запроса.","Вероятно, на нелистовой узел проведены прямые значения (posted values). Решение: включить 'Display Posted Values as Nodes' в настройках иерархии в RSA1."],"c":3,"f":4,"e":"Если данные проведены прямо на нелистовой узел (posted values), значение узла = сумма дочерних + собственные проводки. Узлы иерархии агрегируются автоматически, а исключения лишь раскрашивают ячейки и ничего не скрывают.","u":1},{"id":1021217084,"n":155,"t":"SAP BW","s":"Restricted Key Figures в BEx Query Designer - проектирование ограниченных ключевых показателей как альтернативы вычисляемым показателям с BEFORE_AGGREGATION для повышения производительности запросов","q":"В отчёте BEx требуется показать продажи только по региону 'Север' рядом с общими продажами — какой инструмент предпочтительнее CKF с BEFORE_AGGREGATION и почему?","a":["RKF: ограничение передаётся как pushdown-фильтр в WHERE-условие на уровень InfoProvider/БД, сокращая читаемые данные. CKF с BEFORE_AGGREGATION — OLAP-операция над уже прочитанными записями.","RKF и CKF с BEFORE_AGGREGATION технически эквивалентны по производительности, однако RKF предпочтительнее исключительно по причинам удобства разработки: он проще в настройке и не требует написания формул, тогда как разница в скорости чтения данных из БД несущественна.","CKF с BEFORE_AGGREGATION предпочтительнее: фильтр по региону применяется до агрегации в OLAP-процессоре, что снижает нагрузку на базу данных, тогда как RKF передаёт ограничение только после загрузки всех данных в память сервера приложений.","Оба инструмента одинаково передают фильтры на уровень БД, но CKF с BEFORE_AGGREGATION дополнительно оптимизирует агрегацию через BWA/HANA, применяя векторные операции над столбцами, поэтому для регионального среза именно CKF обеспечит более высокую скорость выполнения запроса."],"c":0,"f":3,"e":"Ограничение RKF уходит в запрос к InfoProvider как условие отбора, поэтому из базы читается меньше данных. Расчёт с BEFORE_AGGREGATION выполняется в OLAP-процессоре над уже прочитанными детальными записями и обычно тяжелее.","u":1},{"id":1786599950,"n":156,"t":"SAP BW","s":"Вычисляемые показатели в BEx Query Designer - реализация многоуровневых формул с операторами BEFORE_AGGREGATION и After Aggregation для корректной агрегации при изменении детализации в Excel","q":"Почему формула с BEFORE_AGGREGATION даёт корректный результат при изменении детализации в отчёте, а обычная вычисляемая мера — нет?","a":["BEFORE_AGGREGATION корректно работает при изменении детализации потому, что SAP BW автоматически пересчитывает формулу на стороне сервера приложений при каждом изменении навигации, тогда как обычная мера кэшируется OLAP-процессором и не обновляется при свёртке иерархий, что приводит к устаревшим значениям в ячейках.","Обычная вычисляемая мера даёт некорректный результат только при использовании иерархий с более чем тремя уровнями вложенности, поскольку BEx Query Designer ограничивает глубину рекурсивного вычисления. BEFORE_AGGREGATION же снимает это ограничение, передавая управление расчётом непосредственно движку агрегации InfoCube, минуя слой OLAP-сервера.","Обычная мера работает на уровне записей, BEFORE_AGGREGATION — нет.","BEFORE_AGGREGATION вычисляется на уровне записей до агрегации, поэтому результат правильно суммируется при любой детализации. Обычная мера применяет формулу уже к агрегированным значениям, что при свёртке уровней даёт математически некорректный результат — например, деление суммы на сумму вместо суммы частных."],"c":3,"f":5},{"id":1212860711,"n":157,"t":"SAP BW","s":"Фильтрация данных в BEx-запросах — настройка статических и переменных фильтров по характеристикам InfoProvider'а","q":"Почему переменный фильтр в BEx-запросе предпочтительнее статического при работе с регулярно меняющимися данными?","a":["Статический фильтр не поддерживается в новых версиях SAP BW, поэтому переменный является единственной актуальной альтернативой.","Переменный фильтр быстрее обрабатывается на уровне базы данных, так как значение фиксируется ещё до выполнения запроса.","Переменный фильтр автоматически обновляет данные по расписанию, исключая необходимость ручного запуска отчёта.","Переменный фильтр позволяет пользователю задавать значение при каждом запуске отчёта, не требуя изменения самого запроса в BEx Query Designer."],"c":3,"f":4},{"id":1260565,"n":158,"t":"SAP BW","s":"InfoProvider в SAP BW — понимание структуры аналитического куба на уровне, достаточном для работы с существующими запросами","q":"В существующем BEx-запросе не отображается нужный показатель выручки — в каком объекте InfoCube вы проверите его наличие в первую очередь?","a":["В разделе Key Figures InfoCube — убедиться, что нужный показатель включён в структуру куба.","В настройках самого BEx-запроса — показатель мог быть скрыт через фильтр или свойства отображения столбцов.","В DSO — куб берёт данные оттуда, значит показатель нужно искать в источнике.","В разделе Dimensions InfoCube — показатели хранятся вместе с измерениями в единой структуре куба."],"c":0,"f":3},{"id":1737803409,"n":159,"t":"SAP BW","s":"Характеристики и ключевые показатели в BEx — различия, назначение и правила размещения в строках, колонках и области фильтров запроса","q":"Зачем размещать характеристики вместе с ключевыми показателями в BEx Query?","a":["Характеристики нужны только для фильтрации и не влияют на структуру отчёта","Характеристики определяют формулы расчёта и агрегацию ключевых показателей","Характеристики ускоряют загрузку данных и снижают нагрузку на сервер","Характеристики задают разрезы анализа и детализацию данных."],"c":3,"f":3},{"id":1747334029,"n":160,"t":"SAP BW","s":"Исключения (Exceptions) в BEx Query Designer — настройка цветовой сигнализации пороговых отклонений факта от плана и проверка отображения в BEx Analyzer","q":"В чём ключевое преимущество задания порогов через Alert Threshold перед хардкодингом в формулах?","a":["Хардкодинг в формулах быстрее выполняется на уровне OLAP-движка, а Alert Threshold лишь упрощает визуальное восприятие.","Пороги хранятся декларативно в метаданных исключения и управляются централизованно без правки формул.","Пороги через Alert Threshold защищены от изменений рядовыми пользователями, тогда как формулы редактируются без ограничений.","Alert Threshold автоматически пересчитывает пороги при каждом обновлении данных, устраняя необходимость ручного обслуживания и синхронизации значений между несколькими запросами в системе."],"c":1,"f":2,"e":"Пороги исключения хранятся в метаданных запроса декларативно: их меняют в одном месте, не трогая формулы. Автоматически они не пересчитываются и скорости не добавляют.","u":1},{"id":1243668097,"n":161,"t":"SAP BW","s":"Характеристики и ключевые показатели в BEx — различия, назначение и правила размещения в строках, колонках и области фильтров запроса","q":"В BEx Query Designer нужно показать продажи по регионам с жёстким фильтром по году — куда поместить 'Регион', 'Сумма продаж' и 'Год'?","a":["Регион — в строки, Сумма продаж — в колонки, Год — в Filters (фиксированный фильтр запроса).","Регион — в фильтры, Сумма продаж — в колонки, Год — в строки для анализа динамики по периодам.","Регион и Год оба помещаются в строки для детализации, Сумма продаж — в колонки, фильтры остаются пустыми.","Год — в строки, Регион — в фильтры."],"c":0,"f":2},{"id":1083524194,"n":162,"t":"SAP BW","s":"BEx Query Designer — добавление измерений и ключевых показателей в существующий запрос по техническому заданию","q":"В BEx Query Designer вам нужно добавить в существующий запрос характеристику 'Регион продаж' из InfoProvider — в какую область интерфейса её необходимо перетащить, чтобы она отображалась как строка в отчёте?","a":["Характеристику нужно перетащить в область 'Columns' (Столбцы), именно там формируются строковые измерения в BEx Query Designer.","Характеристику следует добавить в область 'Free Characteristics' — она автоматически отобразится строкой.","Характеристику нужно перетащить в область 'Rows' (Строки) в разделе Rows/Columns панели запроса.","Характеристику необходимо перетащить в область 'Filter' (Фильтр), после чего в настройках отображения выбрать опцию 'Show as Row', чтобы она появилась в строках итогового отчёта."],"c":2,"f":2},{"id":305026529,"n":163,"t":"SAP BW","s":"Формулы в BEx Query Designer — использование операторов IF/THEN/ELSE и функций NODIM, %A для расчёта процентных отклонений с обработкой деления на ноль","q":"Почему при расчёте процентного отклонения в BEx формулу деления необходимо оборачивать в конструкцию IF/THEN/ELSE с проверкой знаменателя?","a":["Проверка знаменателя через IF/THEN/ELSE необходима потому, что SAP BW по умолчанию округляет результат деления до целого числа, и без явной условной логики процентное отклонение будет рассчитано некорректно — особенно при работе с малыми дельта-значениями близкими к нулю.","Конструкция IF/THEN/ELSE нужна исключительно для форматирования отображения: без неё BEx Query Designer показывает результат деления с избыточным количеством десятичных знаков, что нарушает визуальное представление отчёта и затрудняет его восприятие конечными пользователями.","Чтобы избежать ошибки деления на ноль: если базовое значение равно нулю, формула возвращает альтернативный результат (например, 0 или NULL) вместо аварийного значения, которое сделало бы весь отчёт некорректным.","Оборачивание формулы деления в IF/THEN/ELSE требуется для корректной агрегации данных на верхних уровнях иерархии: без этой конструкции BEx не может правильно свернуть результаты по узлам InfoProvider и возвращает ошибочные суммарные значения вместо ожидаемых итогов по группам."],"c":2,"f":2,"e":"Проверка знаменателя защищает от деления на ноль: при нулевой базе формула вернёт заданное значение вместо ошибки (в BEx для этого есть и оператор NDIV0).","u":1},{"id":744639965,"n":164,"t":"SAP BW","s":"Ограниченные ключевые показатели (Restricted Key Figures) — создание фильтров по версии и периоду для сравнительного анализа план/факт/прошлый год","q":"Вы создаёте Restricted Key Figure для показателя «Факт текущего года». Какие характеристики (InfoObjects) необходимо использовать в качестве ограничений, чтобы корректно изолировать фактические данные текущего периода от плановых?","a":["Необходимо ограничить: 0VERSION (версия = '000' — фактические данные) и 0FISCPER или 0CALMONTH (текущий фискальный/календарный период). Это гарантирует, что RKF возвращает только факт за нужный период, не смешивая с плановыми версиями.","Необходимо ограничить 0VERSION (версия = '001' — фактические данные) и 0CALMONTH (текущий период). Версия '000' используется для плановых данных, а '001' традиционно хранит актуальные фактические показатели в стандартных кубах SAP BW, поэтому именно такая комбинация обеспечит корректную выборку без смешивания с планом.","Для изоляции фактических данных достаточно ограничить только 0FISCPER (текущий период) — версия не влияет на разделение план/факт, так как это регулируется типом документа в 0RECORDTP.","Нужно ограничить 0CALMONTH и 0AMOUNT — фильтрация по сумме исключит нулевые плановые значения, автоматически оставив только факт."],"c":0,"f":4},{"id":1055488193,"n":165,"t":"SAP BW","s":"BEx Query Designer — добавление измерений и ключевых показателей в существующий запрос по техническому заданию","q":"Где задаётся агрегация ключевого показателя в SAP BW?","a":["В InfoProvider при настройке трансформации загрузки данных в куб","В свойствах InfoObject ключевого показателя, не в запросе.","В запросе","В свойствах запроса BEx Query Designer на вкладке Aggregation"],"c":1,"f":3},{"id":754379122,"n":166,"t":"SAP BW","s":"Exception Aggregation в BEx-запросах - настройка нестандартной логики агрегации показателей с использованием референсных характеристик для обеспечения корректных расчётов на разных уровнях детализации","q":"Почему при использовании Exception Aggregation с референсной характеристикой результат агрегации может различаться в зависимости от уровня детализации отчёта?","a":["Потому что Exception Aggregation вычисляет значение показателя не стандартным суммированием по всем строкам, а применяет заданную функцию (например, MAX, MIN, COUNT) к уникальным значениям референсной характеристики на каждом уровне детализации — при сворачивании иерархии набор уникальных значений референсной характеристики меняется, что влечёт иной результат агрегации.","Потому что Exception Aggregation применяет разные функции агрегации на разных уровнях иерархии автоматически: на нижнем уровне используется SUM, а на верхних уровнях система переключается на заданную функцию (MAX, MIN, COUNT). Именно это переключение между функциями и приводит к различным результатам при сворачивании детализации отчёта.","Потому что референсная характеристика определяет лишь порядок сортировки строк перед агрегацией, а не логику вычисления. Разные результаты на разных уровнях детализации возникают из-за того, что BEx-движок применяет стандартное суммирование, но изменяет набор строк согласно фильтрам навигационных атрибутов референсной характеристики — при сворачивании часть строк исключается из расчёта, поскольку движок считает их дублями по значению характеристики. Это поведение можно отключить в свойствах запроса через параметр aggregation behavior.","Различия возникают из-за кэширования: на каждом уровне детализации BEx кэширует промежуточные результаты отдельно."],"c":0,"f":2},{"id":914654326,"n":167,"t":"SAP BW","s":"Функции накопленных итогов в BEx - применение SUMCT и SUMRT для построения скользящих и накопленных итогов с настройкой области вычисления и верификацией результатов на тестовых данных","q":"В BEx Analyzer требуется построить скользящий итог за последние 3 месяца по выручке — какую формулу SUMRT использовать, если характеристика времени расположена в строках?","a":["SUMRT([Выручка], -2, 0): суммирует текущую строку (сдвиг 0) и две предыдущие (сдвиг -2), образуя скользящее окно из 3 позиций по оси строк.","SUMCT([Выручка], -2, 0): функция SUMCT применяется для строк, SUMRT — для столбцов, поэтому при временной характеристике в строках нужен именно SUMCT.","SUMRT([Выручка], -3, 0): сдвиг -3 захватывает три предыдущих строки плюс текущую, что даёт окно из 4 позиций — именно столько нужно для корректного скользящего итога за квартал.","SUMRT([Выручка], 0, 2): суммирует текущую и две следующие строки, формируя скользящее окно из 3 позиций по оси строк."],"c":0,"f":3},{"id":349143436,"n":168,"t":"SAP BW","s":"Условия (Conditions) в BEx Query Designer — настройка фильтрации топ-N позиций по показателю и принципы применения условий к результатам запроса","q":"В BEx Query Designer настроено условие «Top 10 по выручке», но в результате отображается 12 позиций — какова наиболее вероятная причина?","a":["Условие учитывает одинаковые значения (ties): если несколько позиций на 10-м месте имеют равную выручку, все они включаются в результат, что превышает заданное число N.","Отображение 12 позиций вместо 10 происходит из-за того, что условие применяется отдельно к каждой характеристике в строках запроса, и если в запросе две характеристики, фильтрация выполняется независимо для каждой, суммируя результаты.","Условие «Top 10» в BEx Query Designer применяется после агрегации данных по всем уровням иерархии, поэтому промежуточные итоги по подгруппам считаются отдельными позициями и увеличивают итоговое число строк сверх заданного N.","Причина в том, что SAP BW при активации условия Top N автоматически добавляет к результату строки с нулевыми значениями выручки, которые технически не входят в топ, но отображаются для обеспечения целостности навигационных атрибутов характеристики."],"c":0,"f":2},{"id":1339120458,"n":169,"t":"SAP BW","s":"Вычисляемые показатели в BEx Query Designer - реализация многоуровневых формул с операторами BEFORE_AGGREGATION и After Aggregation для корректной агрегации при изменении детализации в Excel","q":"В BEx Query Designer рассчитывается доля продаж продукта от итога по региону. Какой тип вычисления назначить знаменателю, чтобы доля корректно пересчитывалась при смене детализации в Excel?","a":["Знаменателю назначить Exception Aggregation по характеристике 'Продукт' — тогда итог будет фиксироваться на уровне продукта и не изменится при смене детализации.","Знаменателю назначить Exception Aggregation по характеристике 'Регион' или Calculate Result As — Overall Result, чтобы итог по региону не зависел от текущей детализации.","Знаменателю назначить BEFORE_AGGREGATION, чтобы расчёт выполнялся до агрегации и итог региона формировался на уровне исходных строк.","Знаменателю назначить Calculate Result As — Summation, чтобы итог суммировался по всем уровням детализации и корректно отражал общий результат по региону при любом срезе."],"c":1,"f":2,"e":"Знаменатель должен оставаться итогом по региону при любой детализации. Из предложенных вариантов это обеспечивает исключительная агрегация или «Вычислить результат как → Общий результат».","u":1},{"id":1865514714,"n":170,"t":"SAP BW","s":"Ограниченные ключевые показатели (Restricted Key Figures) — создание фильтров по версии и периоду для сравнительного анализа план/факт/прошлый год","q":"Почему при создании Restricted Key Figure для анализа план/факт необходимо фиксировать версию данных через фильтр, а не через переменную в запросе?","a":["Фильтр в RKF нужен исключительно из соображений производительности: жёсткая фиксация версии снижает нагрузку на базу данных, а не влияет на логику агрегации или возможность отображения нескольких версий в одном отчёте.","Фильтр в RKF жёстко ограничивает агрегацию меры на уровне куба, гарантируя, что показатель всегда считается только по одной версии (например, план = версия 010, факт = версия 000) независимо от контекста запроса. Переменная же применяется глобально ко всему запросу и не позволяет одновременно отображать разные версии в одном отчёте как отдельные колонки.","Переменная в запросе предпочтительнее, так как позволяет динамически управлять версией через пользовательский ввод, тогда как фильтр в RKF избыточен и дублирует логику отбора, уже заложенную в InfoProvider.","Версию достаточно зафиксировать через глобальный фильтр запроса, а не на уровне RKF — это даёт тот же результат и позволяет выводить план и факт как отдельные колонки, поскольку SAP BW автоматически разделяет значения по версиям."],"c":1,"f":4},{"id":1597645845,"n":171,"t":"SAP BW","s":"Restricted Key Figures в BEx Query Designer - проектирование ограниченных ключевых показателей как альтернативы вычисляемым показателям с BEFORE_AGGREGATION для повышения производительности запросов","q":"В чём принципиальное преимущество RKF перед CKF с BEFORE_AGGREGATION по производительности?","a":["RKF быстрее, так как не использует агрегаты InfoCube и работает напрямую с PSA","RKF обрабатывается OLAP-процессором напрямую, минуя overhead интерпретации formula engine.","RKF медленнее, так как фильтрует данные внутри OLAP-процессора после загрузки всех записей из базы данных в оперативную память","CKF с BEFORE_AGGREGATION медленнее из-за повторного обращения к базе данных на каждый узел иерархии в отчёте"],"c":1,"f":2},{"id":1441802451,"n":172,"t":"SAP BW","s":"BEx Analyzer — выгрузка результатов запроса в Excel и проверка корректности полученных данных","q":"После выгрузки BEx-запроса в Excel числовые значения отображаются как текст — какой первый шаг диагностики?","a":["Проверить формат ячеек: выравнивание по левому краю и апостроф указывают, что Excel принудительно интерпретирует значения как текст.","Проверить настройки SAP BW: если в InfoObject задан тип данных CHAR, то Excel автоматически конвертирует все значения в текстовый формат, и нужно изменить тип на NUMC прямо в транзакции RSD1.","Повторить выгрузку — скорее всего, сбой при экспорте.","Открыть настройки BEx Analyzer и изменить тип данных характеристики с «текст» на «число» в свойствах запроса — это устранит проблему на уровне источника."],"c":0,"f":2,"e":"Сначала смотрят на сами ячейки Excel: выравнивание по левому краю, апостроф, зелёный треугольник — признаки текстового формата. Менять типы InfoObject ради этого не нужно.","u":1},{"id":883549085,"n":173,"t":"SAP BW","s":"Функции накопленных итогов в BEx - применение SUMCT и SUMRT для построения скользящих и накопленных итогов с настройкой области вычисления и верификацией результатов на тестовых данных","q":"В чём принципиальное различие между SUMCT и SUMRT в BEx по направлению накопления?","a":["SUMCT накапливает по строкам сверху вниз, SUMRT — по столбцам справа налево в пределах раздела.","SUMCT агрегирует по всем строкам измерения до текущей, SUMRT — нарастающим итогом по порядку отображения строк.","SUMCT считает скользящий итог за период, SUMRT — полный накопленный итог по всему измерению.","SUMRT агрегирует по всем строкам до текущей, SUMCT — нарастающим итогом по порядку отображения."],"c":1,"f":1,"e":"Вариант выбран как наиболее близкий к формулировке теста. В реальном BEx SUMCT возвращает итог по столбцу (результат текущей детализации), SUMGT — общий итог, SUMRT — итог запроса; нарастающие итоги задаются отдельно, настройкой «Накопленный».","u":1},{"id":22277272,"n":174,"t":"SAP BW","s":"Фильтрация данных в BEx-запросах — настройка статических и переменных фильтров по характеристикам InfoProvider'а","q":"В BEx Query Designer нужно ограничить отчёт данными только по одной стране, значение которой будет одинаковым для всех пользователей — какой тип фильтра следует использовать?","a":["Характеристическое ограничение с пользовательским вводом (User Entry Variable) — пользователи вводят значение страны вручную, но система запоминает последнее введённое значение и применяет его по умолчанию для всех.","Переменный фильтр (Variable Restriction) — он позволяет задать значение страны по умолчанию, которое будет автоматически применяться для всех пользователей без возможности изменения.","Статический фильтр (Characteristic Restriction) — значение характеристики жёстко задаётся в запросе и не меняется при выполнении.","Глобальный фильтр InfoProvider'а (InfoProvider Filter) — ограничение задаётся на уровне самого InfoProvider'а и автоматически наследуется всеми BEx-запросами, построенными на его основе, без настройки в Query Designer."],"c":2,"f":2,"e":"Если значение одно для всех и не должно меняться, его жёстко задают ограничением характеристики в фильтре запроса. Переменные нужны, когда значение выбирает пользователь или подставляет система.","u":1},{"id":1093192541,"n":175,"t":"SAP BW","s":"BEx Analyzer — выгрузка результатов запроса в Excel и проверка корректности полученных данных","q":"Почему при выгрузке запроса BEx Analyzer в Excel важно сохранять живое подключение (Keep Connection) вместо статичного снимка данных?","a":["Живое подключение позволяет обновлять данные прямо в Excel при изменении данных в SAP BW, тогда как статичный снимок фиксирует данные на момент выгрузки и не отражает актуальные изменения.","Статичный снимок данных предпочтительнее, поскольку живое подключение замедляет работу Excel и создаёт избыточную нагрузку на сервер SAP BW при каждом открытии файла, тогда как снимок работает автономно и не требует активного соединения с системой.","Живое подключение необходимо для корректного отображения иерархий и атрибутов SAP BW в Excel, так как статичный снимок данных не поддерживает многоуровневые структуры и выгружает их в плоском формате без группировок.","Живое подключение ускоряет выгрузку данных."],"c":0,"f":2},{"id":94435640,"n":176,"t":"SAP BW","s":"InfoProvider в SAP BW — понимание структуры аналитического куба на уровне, достаточном для работы с существующими запросами","q":"Почему аналитический куб в SAP BW разделяет данные на измерения и показатели?","a":["Разделение нужно только для визуализации: измерения отображаются по осям графика, показатели — в легенде","Показатели задают контекст анализа, а измерения содержат агрегированные числа — так система экономит место в базе данных","Измерения хранят числовые данные для расчётов, а показатели описывают категории объектов — это ускоряет загрузку данных из источников","Измерения задают контекст анализа (по чему), показатели — числовые значения для агрегации (что измеряем), это позволяет гибко срезать данные и быстро их агрегировать"],"c":3,"f":1},{"id":1241370657,"n":177,"t":"SAP BW","s":"Формулы в BEx Query Designer — использование операторов IF/THEN/ELSE и функций NODIM, %A для расчёта процентных отклонений с обработкой деления на ноль","q":"В BEx Query Designer нужно рассчитать процентное отклонение факта от плана с защитой от деления на ноль — какую формулу использовать?","a":["%A('Факт', 'План') — встроенная функция BEx автоматически считает отклонение и защищает от деления на ноль без дополнительных условий","IF(NODIM('Факт') = 0, 0, (NODIM('Факт') - NODIM('План')) / NODIM('Факт') * 100) — защита от деления на ноль через проверку факта","IF(NODIM('План') = 0, 0, (NODIM('Факт') - NODIM('План')) / NODIM('План') * 100). NODIM убирает единицы измерения у Key Figure для корректного деления.","IF('План' = 0, NULL, ('Факт' - 'План') / 'План' * 100) — NODIM не нужен, BEx сам приводит единицы измерения при делении"],"c":2,"f":1,"e":"Делить нужно на план и проверять на ноль именно план. NODIM снимает единицы измерения, чтобы результат деления был безразмерным процентом.","u":1},{"id":2068116119,"n":178,"t":"SAP BW","s":"Иерархии характеристик в BEx-запросах - настройка отображения узлов иерархии, реализация переменных выбора иерархии и уровня раскрытия, верификация корректности расчётов показателей на каждом уровне в BEx Analyzer","q":"Почему при использовании переменной уровня раскрытия иерархии в BEx-запросе показатели на промежуточных узлах могут рассчитываться некорректно при агрегации?","a":["Некорректность расчётов на промежуточных узлах возникает из-за конфликта между переменной уровня раскрытия и настройками агрегации характеристики в InfoObject: если для характеристики задан режим суммирования Exception Aggregation, система применяет его только к листовым узлам текущего видимого уровня, игнорируя промежуточные узлы иерархии, что приводит к двойному счёту значений на тех уровнях, где одновременно присутствуют и листья, и родительские узлы в отображаемом срезе.","Промежуточные узлы иерархии агрегируют значения дочерних листьев, но если уровень раскрытия скрывает часть дочерних узлов, система всё равно суммирует все подчинённые элементы иерархии из БД, игнорируя визуальное ограничение — это может создавать видимое несоответствие между отображаемыми дочерними строками и значением родительского узла в BEx Analyzer.","Переменная уровня раскрытия иерархии напрямую влияет на логику агрегации в БД: когда задан определённый уровень, SAP BW пересчитывает показатели только для видимых узлов, исключая скрытые дочерние элементы из суммирования. Именно поэтому промежуточные узлы показывают заниженные значения — они агрегируют неполный набор листьев, что является ожидаемым поведением системы, требующим ручной корректировки через дополнительные вычисляемые показатели.","Проблема связана с тем, что переменная уровня раскрытия изменяет структуру самого OLAP-куба на момент выполнения запроса: система динамически перестраивает иерархические связи между узлами в соответствии с заданным уровнем, и в этот момент промежуточные узлы теряют ссылки на часть дочерних элементов в таблице агрегатов, что вынуждает BEx Analyzer использовать неактуальные предагрегированные значения из кэша вместо реального пересчёта по базовым транзакционным данным."],"c":1,"f":2,"e":"Уровень раскрытия влияет только на отображение: узел по-прежнему агрегирует все подчинённые элементы из базы. Поэтому видимые строки могут не сходиться с итогом родителя, хотя расчёт верный.","u":1},{"id":784844323,"n":179,"t":"SAP BW","s":"Двойные структуры в BEx-запросе — настройка структуры характеристик в строках и структуры показателей в колонках с независимыми фильтрами элементов","q":"Почему в BEx-запросе с двойной структурой фильтры элементов структуры характеристик и структуры показателей применяются независимо друг от друга?","a":["Фильтры элементов обеих структур на самом деле связаны через глобальный фильтр запроса, но система намеренно отображает их независимо в интерфейсе BEx, чтобы упростить визуальное восприятие отчёта.","Каждая структура имеет собственный контекст выборки: фильтр элемента структуры характеристик ограничивает набор отображаемых строк, тогда как фильтр элемента структуры показателей задаёт условия агрегации или отбора данных для конкретного столбца — эти два измерения ортогональны и не влияют друг на друга при вычислении ячейки результата.","Фильтры применяются независимо, потому что структура характеристик обрабатывается на уровне базы данных, а структура показателей — уже в памяти OLAP-процессора, и они физически разделены в разных слоях вычисления.","Независимость фильтров объясняется тем, что структура показателей всегда имеет приоритет над структурой характеристик: сначала применяются ограничения столбцов, и только после этого строки фильтруются по своим условиям поверх уже отобранных данных."],"c":1,"f":1}];

  if (['auto', 'light', 'dark'].indexOf(s.settings.theme) < 0) s.settings.theme = 'auto';

/* ================= Scroll lock & history ================= */
var lockCount = 0;
function lock(){ if (++lockCount === 1) document.documentElement.classList.add('locked'); }

var screen = null;          // 'session' | 'results' | null
var modals = [];

function ourState(){ return !!(history.state && history.state.dwh); }
function syncHistory(){
  var want = !!(screen || modals.length);
  if (want && !ourState() && !suppressPop) { try { history.pushState({dwh:1}, ''); } catch(e){} }
  else if (!want && ourState() && !suppressPop) {
    suppressPop = true;
    try { history.back(); } catch(e){ suppressPop = false; return; }
    clearTimeout(suppressTimer);
    suppressTimer = setTimeout(function(){ if (suppressPop) { suppressPop = false; syncHistory(); } }, 900);
  }
}
window.addEventListener('popstate', function(){
  if (suppressPop) { suppressPop = false; clearTimeout(suppressTimer); syncHistory(); return; }
  if (modals.length) {
    modals.slice().reverse().forEach(function(m){ m.dismiss(true); });
    syncHistory();
    return;
  }
  if (screen === 'session') sessionBack(true);
  else if (screen === 'results') closeScreen(true);
});

/* ================= Modals ================= */
function presentModal(root, opt){

  lock();
  void root.offsetWidth;
  requestAnimationFrame(function(){ root.classList.add('open'); });

    root: root, closed: false,
    dismiss: function(fromPop){
      if (m.closed) return;
      m.closed = true;
      var i = modals.indexOf(m); if (i > -1) modals.splice(i, 1);
      root.classList.remove('open');
      unlock();
      setTimeout(function(){ if (root.parentNode) root.parentNode.removeChild(root); }, 460);
      if (opt.onDismiss) opt.onDismiss();
      if (fromPop !== true) syncHistory();
    }
  };
  m.cancel = opt.cancel || function(){ m.dismiss(); };
  modals.push(m);
  syncHistory();
  return m;
}

/* ================= Segmented helper ================= */
function segHTML(name, opts, val, cls){
  var i = 0;
  opts.forEach(function(o, k){ if (String(o[0]) === String(val)) i = k; });
  return '<div class="seg ' + (cls || '') + '" data-seg="' + name + '" role="tablist" style="--n:' + opts.length + ';--i:' + i + '"><span class="seg-thumb"></span>' +
    opts.map(function(o, k){ return '<button type="button" role="tab" aria-selected="' + (k === i) + '" data-v="' + esc(String(o[0])) + '">' + o[1] + '</button>'; }).join('') + '</div>';
}
function segSelect(btn){
  var seg = btn.closest('.seg'), btns = $$('button', seg), k = btns.indexOf(btn);
  seg.style.setProperty('--i', k);
  btns.forEach(function(b, j){ b.setAttribute('aria-selected', j === k ? 'true' : 'false'); });
  return btn.getAttribute('data-v');
}
function ringSVG(gid, pct, colors, stroke){
  var r = (120 - stroke) / 2, C = 2 * Math.PI * r;
  return '<svg class="ring" viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="1" y2="1">' +
    '<stop offset="0" style="stop-color:var(--' + colors[0] + ')"/><stop offset="1" style="stop-color:var(--' + colors[1] + ')"/></linearGradient></defs>' +
    '<circle class="ring-track" cx="60" cy="60" r="' + r + '" stroke-width="' + stroke + '"/>' +
    '<circle class="ring-val" cx="60" cy="60" r="' + r + '" stroke-width="' + stroke + '" stroke="url(#' + gid + ')" stroke-dasharray="' + C.toFixed(2) + '" stroke-dashoffset="' + (C * (1 - pct / 100)).toFixed(2) + '" data-c="' + C.toFixed(2) + '" style="opacity:' + (pct > 0 ? 1 : 0) + '"/></svg>';
}
function animateRing(root, pct){
  var c = $('.ring-val', root); if (!c) return;
  var C = +c.getAttribute('data-c');
  requestAnimationFrame(function(){ requestAnimationFrame(function(){
    if (pct > 0) c.style.opacity = 1;
    c.style.strokeDashoffset = (C * (1 - pct / 100)).toFixed(2);
  }); });
}
