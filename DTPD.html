    body: '<div class="nv-legend">' + legend + '</div><div class="nv-grid">' + cells + '</div>',
    onReady: function(b, m){
      b.addEventListener('click', function(e){ var t = e.target.closest('.nv'); if (!t) return; m.dismiss(); goTo(+t.getAttribute('data-i'), false); });
    }
  });
}
/* mouse drag paging (desktop) */
function initMouseDrag(){
  var d = null, justDragged = 0, snapTimer = 0;
  S.pager.addEventListener('pointerdown', function(e){
    if (e.pointerType !== 'mouse' || e.button !== 0 || !session) return;
    d = {x:e.clientX, y:e.clientY, left:S.pager.scrollLeft, start:session.idx, active:false, id:e.pointerId};
  });
  window.addEventListener('pointermove', function(e){
    if (!d || e.pointerId !== d.id) return;
    var dx = e.clientX - d.x;
    if (!d.active) {
      if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(e.clientY - d.y)) {
        d.active = true; clearTimeout(snapTimer); S.pager.classList.add('dragging');
        try { window.getSelection().removeAllRanges(); } catch(err){}
      } else return;
    }
    S.pager.scrollLeft = d.left - dx;
  });
  window.addEventListener('pointerup', function(e){
    if (!d || e.pointerId !== d.id) return;
    var dd = d; d = null;
    if (!dd.active) return;
    justDragged = Date.now();
    var dx = e.clientX - dd.x, w = S.pager.clientWidth, target = dd.start;
    if (dx < -w * 0.12) target = dd.start + 1; else if (dx > w * 0.12) target = dd.start - 1;
    target = clamp(target, 0, session.ids.length - 1);
    progTarget = target; clearTimeout(progTimer); progTimer = setTimeout(function(){ progTarget = -1; }, 900);
    try { S.pager.scrollTo({left: target * w, behavior: reduceMotion() ? 'auto' : 'smooth'}); } catch(err){ S.pager.scrollLeft = target * w; }
    setIdx(target);
    snapTimer = setTimeout(function(){ S.pager.classList.remove('dragging'); }, 520);
  });
  S.pager.addEventListener('click', function(e){ if (Date.now() - justDragged < 300) { e.stopPropagation(); e.preventDefault(); } }, true);
}

/* ================= Results ================= */
var lastResult = null, rvFilter = 'all';
function renderResults(){
  var r = lastResult, n = r.ids.length, c = r.correct.length, w = r.wrong.length, sk = r.skipped.length;
  var pct = n ? Math.round(c / n * 100) : 0;
  var lvl = pct >= 90 ? 3 : pct >= 70 ? 2 : pct >= 50 ? 1 : 0;
  var titles = ['Нужно повторить', 'Неплохое начало', 'Хороший результат', 'Отличный результат!'];
  var msgs = ['Изучите правильные ответы и пройдите ошибки ещё раз — так материал закрепится быстрее.',
    'Больше половины верно. Отработайте ошибки, чтобы выйти на уверенный уровень.',
    'Большинство ответов верные. Добейте ошибки — и будете готовы.',
    'Вы отлично знаете материал. Так держать!'];
  var grads = [['red', 'orange'], ['orange', 'yellow'], ['blue', 'teal'], ['green', 'teal']];
  var h = '<div class="r-hero"><div class="r-ring">' + ringSVG('rg', 0, grads[lvl], 14) + '<div class="num"><b>' + pct + '%</b><span>' + c + ' из ' + n + '</span></div></div>' +
    '<div class="r-title">' + titles[lvl] + '</div><div class="r-sub">' + msgs[lvl] + '</div></div>' +
    '<div class="tiles" style="--cols:' + (sk ? 4 : 3) + '"><div class="tile"><b class="c-green">' + c + '</b><span>Верно</span></div>' +
    '<div class="tile"><b class="c-red">' + w + '</b><span>' + plural(w, ['Ошибка', 'Ошибки', 'Ошибок']) + '</span></div>' +
    (sk ? '<div class="tile"><b>' + sk + '</b><span>Без ответа</span></div>' : '') +
    '<div class="tile"><b>' + fmtTime(r.ms) + '</b><span>Время</span></div></div>' +
    (r.fixed ? '<div class="r-note">' + icon('checkCircle') + 'Исправлено ошибок: ' + r.fixed + '</div>' : '');
  if (w) h += '<div class="sec-h">Работа над ошибками</div><div class="r-actions two">' +
    '<button class="btn btn-filled" type="button" data-act="r-wtest">' + icon('checklist') + 'Пройти · ' + w + '</button>' +
    '<button class="btn btn-tinted" type="button" data-act="r-wlearn">' + icon('cap') + 'Изучить</button></div>';
  h += '<div class="sec-h">' + (w ? 'Ещё' : 'Дальше') + '</div><div class="r-actions"><button class="btn btn-gray" type="button" data-act="r-retry">' + icon('retry') + 'Пройти этот тест ещё раз</button></div>';
  var segs = [['all', 'Все ' + n], ['bad', 'Ошибки ' + w], ['ok', 'Верно ' + c]];
  if (sk) segs.push(['skip', 'Пропущ. ' + sk]);
  h += '<div class="sec-h">Разбор ответов</div><div class="seg-wrap">' + segHTML('rv', segs, rvFilter, 'lg') + '</div><div class="group" id="rv-list"></div>';
  R.inner.innerHTML = h;
  renderReview();
}
function renderReview(){
  var r = lastResult, ids = r.ids;
  if (rvFilter === 'bad') ids = r.wrong; else if (rvFilter === 'ok') ids = r.correct; else if (rvFilter === 'skip') ids = r.skipped;
  var list = $('#rv-list', R.inner);
  if (!ids.length) { list.innerHTML = '<div class="empty small"><p>' + (rvFilter === 'bad' ? 'Ошибок нет — отлично!' : 'Пусто') + '</p></div>'; return; }
  list.innerHTML = ids.map(function(id){
    var q = byId.get(id), a = r.answers.get(id), st = a === undefined ? 'skip' : a === q.c ? 'ok' : 'bad';
    return '<div class="xi" data-id="' + id + '"><button class="xi-row" type="button" aria-expanded="false"><span class="xi-dot ' + st + '">' +
      (st === 'ok' ? icon('check') : st === 'bad' ? icon('xmark') : '') + '</span><span class="xi-body"><span class="xi-q">' + rich(q.q) + '</span>' +
      '<span class="xi-meta">№ ' + q.n + ' · ' + esc(q.t) + '</span></span>' + icon('chevD', 'xi-chev') + '</button><div class="xi-detail"></div></div>';
  }).join('');
}
function onResultsClick(e){
  var t, r = lastResult;
  if ((t = e.target.closest('.seg button'))) { rvFilter = segSelect(t); renderReview(); return; }
  if ((t = e.target.closest('[data-act]'))) {
    var act = t.getAttribute('data-act');
    if (act === 'r-wtest') startSession({kind:'test', ids: store.settings.shuffle ? shuffle(r.wrong) : r.wrong.slice(), label:'Работа над ошибками', instant: store.settings.instant, src:'mistakes'});
    else if (act === 'r-wlearn') startSession({kind:'learn', ids: r.wrong.slice(), label:'Изучение ошибок', hide: store.settings.hide, src:'mistakes'});
    else if (act === 'r-retry') startSession({kind:'test', ids: store.settings.shuffle ? shuffle(r.ids) : r.ids.slice(), label: r.label, instant: r.instant, src: r.src});
    return;
  }
  if ((t = e.target.closest('.xi-row'))) {
    var xi = t.closest('.xi'), id = +xi.getAttribute('data-id');
    toggleXi(xi, function(){ return detailHTML(byId.get(id), {mode:'answer', your: r.answers.get(id)}); });
  }
}

/* ================= Keyboard ================= */
document.addEventListener('keydown', function(e){
  if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
  var tag = e.target && e.target.tagName;
  if (modals.length) {
    if (e.key === 'Escape') { e.preventDefault(); modals[modals.length - 1].cancel(); }
    return;
  }
  if (screen === 'session' && session) {
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    var onButton = tag === 'BUTTON';
    if (e.key === 'ArrowRight') { e.preventDefault(); goTo(session.idx + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(session.idx - 1); }
    else if (e.key === 'Escape') { e.preventDefault(); sessionBack(false); }
    else if (e.key === 'Enter' && !onButton) { e.preventDefault(); onMain(); }
    else if (e.key === ' ' && !onButton && session.kind === 'learn') { e.preventDefault(); onMain(); }
    else if (/^[1-8]$/.test(e.key) && session.kind === 'test') { var k = +e.key - 1; if (k < byId.get(session.ids[session.idx]).a.length) { e.preventDefault(); onOption(session.idx, k); } }
  } else if (screen === 'results') {
    if (e.key === 'Escape') { e.preventDefault(); closeScreen(); }
  }
});

/* ================= Init ================= */
function init(){
  applyTheme();
  $$('[data-ic]').forEach(function(n){ n.outerHTML = icon(n.getAttribute('data-ic')); });
  document.addEventListener('touchstart', function(){}, {passive:true});

  S.el = $('#session'); S.pager = $('#pager'); S.sub = $('#s-sub'); S.counter = $('#s-counter'); S.bar = $('#s-bar');
  S.prev = $('#s-prev'); S.main = $('#s-main'); S.hint = $('#s-hint');
  R.el = $('#results'); R.scroll = $('#r-scroll'); R.inner = $('#r-inner');

  $$('.tab').forEach(function(t){ t.addEventListener('click', function(){ showTab(t.getAttribute('data-tab')); }); });
  $('#nb-right').addEventListener('click', function(e){
    var b = e.target.closest('[data-nav]'); if (!b) return;
    var a = b.getAttribute('data-nav');
    if (a === 'settings') openSettings(); else if (a === 'clear') confirmClearMistakes();
  });
  $('#tab-home').addEventListener('click', onHomeClick);
  $('#dock-btn').addEventListener('click', startFromHome);
  var mp = $('#tab-mistakes');
  initSwipeRows(mp);
  mp.addEventListener('click', onMistakesClick);
  $('#ref-search').addEventListener('input', onRefInput);
  $('#ref-search').addEventListener('keydown', function(e){ if (e.key === 'Enter') e.target.blur(); });
  $('#ref-clear').addEventListener('click', function(e){ e.preventDefault(); var i = $('#ref-search'); i.value = ''; onRefInput(); refState.q = ''; renderRef(); i.focus(); });
  $('#ref-chips').addEventListener('click', function(e){
    var c = e.target.closest('.chip'); if (!c) return;
    refState.f = c.getAttribute('data-k'); renderRef();
  });
  $('#ref-list').addEventListener('click', function(e){
    var t = e.target.closest('.xi-row'); if (!t) return;
    var xi = t.closest('.xi'), id = +xi.getAttribute('data-id');
    toggleXi(xi, function(){ return detailHTML(byId.get(id), {sub:true}); });
  });
  $('#toast').addEventListener('click', function(e){
    if (!e.target.closest('.toast-act')) return;
    var f = toastAction; toastAction = null; $('#toast').classList.remove('show'); if (f) f();
  });

  S.pager.addEventListener('scroll', onPagerScroll, {passive:true});
  S.pager.addEventListener('click', function(e){
    var b = e.target.closest('.opt');
    if (b) { var sl = b.closest('.slide'); onOption(+sl.getAttribute('data-i'), +b.getAttribute('data-k')); return; }
    var r = e.target.closest('[data-act="reveal"]');
    if (r) revealAnswer(+r.closest('.slide').getAttribute('data-i'));
  });
  initMouseDrag();
  S.prev.addEventListener('click', function(){ if (session) goTo(session.idx - 1); });
  S.main.addEventListener('click', onMain);
  $('#s-close').addEventListener('click', function(){ sessionBack(false); });
  $('#s-grid').addEventListener('click', openNavigator);
  $('#r-done').addEventListener('click', function(){ closeScreen(); });
  R.inner.addEventListener('click', onResultsClick);
  R.scroll.addEventListener('scroll', function(){ $('#r-head').classList.toggle('compact', R.scroll.scrollTop > 8); }, {passive:true});
  var resizeRAF = 0;
  window.addEventListener('resize', function(){
    if (resizeRAF) return;
    resizeRAF = requestAnimationFrame(function(){
      resizeRAF = 0;
      if (session && screen === 'session') { progTarget = session.idx; S.pager.scrollLeft = session.idx * S.pager.clientWidth; }
    });
  });

  updateBadge();
  showTab('home', true);
}
try { init(); }
catch (err) {
  document.body.innerHTML = '<div class="err-box"><b>Не удалось запустить тренажёр.</b><br>' + esc(err && err.message) + '</div>';
  if (window.console) console.error(err);
}
window.__dwh = { get session(){ return session; }, get store(){ return store; }, goTo: goTo };
})();
</script>
