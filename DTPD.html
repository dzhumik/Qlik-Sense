  var t = 'auto';
  try {
    var s = JSON.parse(localStorage.getItem('dwh-trainer:v2') || 'null');
    t = (s && s.settings && s.settings.theme) || localStorage.getItem('theme') || 'auto';

<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --nav-h:44px; --tab-h:50px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.32,.72,0,1); --ease-out:cubic-bezier(.22,1,.36,1);

  --bg:#F2F2F7; --card:#FFFFFF; --card2:#F2F2F7; --raised:#FFFFFF;
  --label:#000000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3); --label4:rgba(60,60,67,.18);
  --sep:rgba(60,60,67,.29); --hl:#D1D1D6;
  --fill:rgba(120,120,128,.2); --fill2:rgba(120,120,128,.16); --fill3:rgba(118,118,128,.12); --fill4:rgba(116,116,128,.08);
  --bar:rgba(249,249,249,.9); --material:rgba(250,250,252,.96); --material-solid:#FFFFFF;
  --thumb:#FFFFFF;
  --blue:#007AFF; --green:#34C759; --red:#FF3B30; --orange:#FF9500; --yellow:#FFCC00; --purple:#AF52DE; --pink:#FF2D55; --teal:#30B0C7; --indigo:#5856D6; --gray:#8E8E93;
  --blue-t:rgba(0,122,255,.12); --green-t:rgba(52,199,89,.15); --red-t:rgba(255,59,48,.12); --orange-t:rgba(255,149,0,.15); --purple-t:rgba(175,82,222,.13); --pink-t:rgba(255,45,85,.12); --teal-t:rgba(48,176,199,.15); --indigo-t:rgba(88,86,214,.13); --gray-t:rgba(142,142,147,.16); --yellow-t:rgba(255,204,0,.18);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 0 1px rgba(0,0,0,.04);
  --shadow-lg:0 18px 50px rgba(0,0,0,.22);
  --backdrop:rgba(0,0,0,.34);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --raised:#2C2C2E;
  --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3); --label4:rgba(235,235,245,.18);
  --sep:rgba(84,84,88,.65); --hl:#3A3A3C;
  --fill:rgba(120,120,128,.36); --fill2:rgba(120,120,128,.32); --fill3:rgba(118,118,128,.24); --fill4:rgba(118,118,128,.18);
  --bar:rgba(22,22,24,.9); --material:rgba(44,44,46,.96); --material-solid:#2C2C2E;
  --thumb:#636366;
  --blue:#0A84FF; --green:#30D158; --red:#FF453A; --orange:#FF9F0A; --yellow:#FFD60A; --purple:#BF5AF2; --pink:#FF375F; --teal:#40C8E0; --indigo:#5E5CE6; --gray:#8E8E93;
  --blue-t:rgba(10,132,255,.22); --green-t:rgba(48,209,88,.2); --red-t:rgba(255,69,58,.2); --orange-t:rgba(255,159,10,.2); --purple-t:rgba(191,90,242,.22); --pink-t:rgba(255,55,95,.2); --teal-t:rgba(64,200,224,.2); --indigo-t:rgba(94,92,230,.26); --gray-t:rgba(142,142,147,.24); --yellow-t:rgba(255,214,10,.2);
  --shadow:none;
  --shadow-lg:0 18px 50px rgba(0,0,0,.6);
  --backdrop:rgba(0,0,0,.55);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg);touch-action:manipulation}
html.locked,html.locked body{overflow:hidden}
body{font-family:var(--font);font-size:17px;line-height:1.35;letter-spacing:-.012em;color:var(--label);background:var(--bg);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-tap-highlight-color:transparent;
  min-height:100vh;min-height:100dvh;transition:background-color .3s}
button,input{font:inherit;color:inherit;letter-spacing:inherit;-webkit-appearance:none;appearance:none;border:0;background:none;border-radius:0}
button{cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation;text-align:inherit}
button:disabled{cursor:default}
button:focus{outline:none}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
input[type=search]::-webkit-search-cancel-button,input[type=search]::-webkit-search-decoration{-webkit-appearance:none;display:none}
code{font-family:var(--mono);font-size:.86em;background:var(--fill4);padding:.08em .38em;border-radius:5px;letter-spacing:0;overflow-wrap:anywhere;font-weight:500}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.c-red{color:var(--red)} .c-green{color:var(--green)} .c-blue{color:var(--blue)} .c-orange{color:var(--orange)}
[hidden]{display:none!important}

/* ---------- Navigation bar ---------- */
.navbar{position:fixed;top:0;left:0;right:0;z-index:20;padding-top:var(--sat);transition:background-color .25s,box-shadow .25s}
.navbar.compact{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--sep)}
body[data-tab="ref"] .navbar.compact{box-shadow:none}
.nb-inner{height:var(--nav-h);max-width:760px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 8px}
.nb-title{font-size:17px;font-weight:600;opacity:0;transform:translateY(5px);transition:opacity .2s,transform .25s var(--ease);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
.navbar.compact .nb-title{opacity:1;transform:none}
.nb-right{justify-self:end;display:flex;align-items:center}
.nb-btn{height:44px;min-width:44px;padding:0 10px;color:var(--blue);font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:4px;border-radius:22px;transition:opacity .15s}
.nb-btn:active{opacity:.35}
.nb-btn.danger{color:var(--red)}
.nb-btn.bold{font-weight:600}
.nb-btn .ic{width:24px;height:24px}

/* ---------- Pages ---------- */
.page{display:none;max-width:760px;margin:0 auto;padding:calc(var(--sat) + var(--nav-h)) 0 calc(var(--sab) + var(--tab-h) + 36px)}
.page.active{display:block;animation:pageIn .35s var(--ease)}
#tab-home.page{padding-bottom:calc(var(--sab) + var(--tab-h) + 104px)}
@keyframes pageIn{from{opacity:0}to{opacity:1}}
.lt{padding:4px 20px 4px}
.lt h1{font-size:34px;line-height:41px;font-weight:700;letter-spacing:-.024em}
.lt p{font-size:15px;line-height:20px;color:var(--label2);margin-top:1px}

/* ---------- Grouped lists ---------- */
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:0 32px 7px;margin-top:26px;font-size:13px;line-height:18px;color:var(--label2);text-transform:uppercase;letter-spacing:.02em}
.sec-h .link{text-transform:none;font-size:15px;color:var(--blue);letter-spacing:-.01em;padding:4px 0;margin:-4px 0}
.sec-h .link:active{opacity:.4}
.sec-f{padding:7px 32px 0;font-size:13px;line-height:18px;color:var(--label2)}
.group{margin:0 16px;background:var(--card);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.card{margin:0 16px;background:var(--card);border-radius:18px;box-shadow:var(--shadow)}
.cell{position:relative;display:flex;align-items:center;gap:14px;width:100%;min-height:48px;padding:10px 16px;text-align:left}
.group > .cell + .cell::before{content:"";position:absolute;top:0;right:0;left:var(--sep-l,16px);height:.5px;background:var(--sep)}
.group.icons{--sep-l:60px}
.cell.tap{transition:background-color .2s}
.cell.tap:active{background:var(--hl);transition:none}
.cell-icon{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.cell-icon .ic{width:18px;height:18px;stroke-width:2.2}
.cell-body{flex:1;min-width:0;display:flex;flex-direction:column}
.cell-title{font-size:17px;line-height:22px}
.cell-sub{font-size:13px;line-height:18px;color:var(--label2);margin-top:1px}
.cell-value{color:var(--label2);font-variant-numeric:tabular-nums}
.cell-check{color:var(--blue);width:22px;height:22px;stroke-width:2.6;opacity:0;transform:scale(.6);transition:opacity .15s,transform .25s var(--ease)}
.cell[aria-checked="true"] .cell-check{opacity:1;transform:none}
.cell.col{flex-direction:column;align-items:stretch;gap:10px;padding-top:12px;padding-bottom:14px}
.cell.danger{color:var(--red);justify-content:center}
.chev{color:var(--label3);width:16px;height:16px;stroke-width:2.6}

/* ---------- Switch ---------- */
.switch{position:relative;flex:none;width:51px;height:31px;border-radius:16px;background:var(--fill);transition:background-color .25s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;
  box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:transform .3s var(--ease)}
[aria-checked="true"] > .switch{background:var(--green)}
[aria-checked="true"] > .switch::after{transform:translateX(20px)}

/* ---------- Segmented control ---------- */
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:32px;padding:2px;border-radius:9px;background:var(--fill3)}
.seg-thumb{position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px) / var(--n));border-radius:7px;background:var(--thumb);
  box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);transform:translateX(calc(100% * var(--i)));transition:transform .32s var(--ease)}
.seg button{position:relative;z-index:1;font-size:13px;font-weight:500;text-align:center;border-radius:7px;white-space:nowrap;padding:0 4px;overflow:hidden;text-overflow:ellipsis}
.seg button[aria-selected="true"]{font-weight:600}
.seg.lg{height:36px} .seg.lg button{font-size:14px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 18px;border-radius:14px;font-size:17px;font-weight:600;letter-spacing:-.02em;text-align:center;
  transition:transform .18s var(--ease-out),opacity .18s,background-color .2s,color .2s;white-space:nowrap}
.btn:active{transform:scale(.97);opacity:.82}
.btn .ic{width:20px;height:20px;stroke-width:2.3}
.btn-filled{background:var(--blue);color:#fff}
.btn-tinted{background:var(--blue-t);color:var(--blue)}
.btn-gray{background:var(--fill3);color:var(--label)}
.btn-red{background:var(--red);color:#fff}
.btn-block{width:100%}
.btn:disabled{opacity:.4;transform:none}
.icon-btn{width:34px;height:34px;border-radius:17px;display:grid;place-items:center;background:var(--fill3);color:var(--label2);transition:opacity .15s,transform .15s}
.icon-btn .ic{width:17px;height:17px;stroke-width:2.6}
.icon-btn:active{opacity:.5;transform:scale(.92)}

/* ---------- Tab bar & dock ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-bottom:var(--sab);background:var(--bar);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 -.5px 0 var(--sep)}
.tabbar-inner{display:flex;max-width:560px;margin:0 auto;height:var(--tab-h)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--gray);font-size:10px;font-weight:500;letter-spacing:.01em;position:relative;transition:color .2s}
.tab .ic{width:26px;height:26px;stroke-width:1.8}
.tab[aria-selected="true"]{color:var(--blue)}
.tab[aria-selected="true"] .ic .fill{fill:currentColor;fill-opacity:.18}
.tab:active .ic{transform:scale(.9)}
.badge{position:absolute;top:2px;left:calc(50% + 5px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:12px;font-weight:600;line-height:18px;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:0}
.dock{position:fixed;left:0;right:0;bottom:calc(var(--tab-h) + var(--sab));z-index:19;padding:16px 16px 10px;display:none;pointer-events:none;
  background:linear-gradient(to bottom,rgba(0,0,0,0),var(--bg) 55%)}
:root[data-theme="light"] .dock{background:linear-gradient(to bottom,rgba(242,242,247,0),var(--bg) 55%)}
body[data-tab="home"] .dock{display:block}
.dock-inner{max-width:560px;margin:0 auto;pointer-events:auto}
.dock .btn{width:100%;box-shadow:0 8px 22px rgba(0,122,255,.28)}
.dock .btn:disabled{box-shadow:none;background:var(--fill);color:var(--label2);opacity:1}

/* ---------- Home ---------- */
.prog{display:flex;align-items:center;gap:18px;padding:18px 18px 18px 16px;margin-top:14px}
.prog-ring{position:relative;flex:none;width:96px;height:96px}
.prog-ring .ring{width:96px;height:96px}
.prog-ring-ic{position:absolute;top:0;left:0;right:0;bottom:0;display:grid;place-items:center;color:var(--green)}
.prog-ring-ic .ic{width:28px;height:28px;stroke-width:2.2}
.prog-body{flex:1;min-width:0}
.prog-pct{font-size:34px;line-height:38px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.prog-pct small{font-size:20px;font-weight:600;margin-left:1px;color:var(--label2)}
.prog-cap{font-size:13px;color:var(--label2);margin-top:1px}
.prog-stats{display:flex;gap:14px;margin-top:10px;padding-top:10px;border-top:.5px solid var(--sep)}
.prog-stats > div{display:flex;flex-direction:column;min-width:0}
.prog-stats b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.prog-stats span{font-size:12px;color:var(--label2)}
.ring{transform:rotate(-90deg);overflow:visible;display:block}
.ring-track{fill:none;stroke:var(--fill3)}
.ring-val{fill:none;stroke-linecap:round;transition:stroke-dashoffset 1.1s var(--ease-out),opacity .2s}
.banner{display:flex;align-items:center;gap:14px;width:calc(100% - 32px);padding:14px 14px 14px 16px;margin-top:12px;text-align:left;transition:transform .18s var(--ease-out),background-color .2s}
.banner:active{transform:scale(.98);background:var(--hl)}
.banner-body{flex:1;min-width:0;display:flex;flex-direction:column}
.banner-body b{font-size:17px;font-weight:600;letter-spacing:-.02em}
.banner-body span{font-size:13px;color:var(--label2);margin-top:1px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 16px}
.mode{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:14px 14px 16px;border-radius:18px;background:var(--card);text-align:left;
  box-shadow:var(--shadow),inset 0 0 0 2px transparent;transition:box-shadow .25s,transform .18s var(--ease-out)}
.mode:active{transform:scale(.97)}
.mode[aria-pressed="true"]{box-shadow:var(--shadow),inset 0 0 0 2px var(--blue)}
.mode-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;margin-bottom:9px}
.mode-ic .ic{width:24px;height:24px}
.mode-t{font-size:clamp(15px,4.3vw,17px);font-weight:600;letter-spacing:-.025em}
.mode-s{font-size:13px;line-height:17px;color:var(--label2)}
.mode-radio{position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:12px;box-shadow:inset 0 0 0 1.5px var(--label4);display:grid;place-items:center;color:#fff;transition:background-color .2s}
.mode-radio .ic{width:14px;height:14px;stroke-width:3.2;opacity:0;transform:scale(.5);transition:opacity .15s,transform .25s var(--ease)}
.mode[aria-pressed="true"] .mode-radio{background:var(--blue);box-shadow:none}
.mode[aria-pressed="true"] .mode-radio .ic{opacity:1;transform:none}

/* ---------- Chips & search ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:16px;background:var(--card);color:var(--label);font-size:15px;font-weight:500;
  box-shadow:var(--shadow);transition:background-color .2s,color .2s,transform .15s}
.chip:active{transform:scale(.95)}
.chip .n{font-size:13px;color:var(--label2);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--chip,var(--label));color:var(--chip-fg,var(--bg))}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.75}
.chip .dot{width:8px;height:8px;border-radius:4px;background:var(--chip,var(--gray))}
.chip[aria-pressed="true"] .dot{background:currentColor}
.search{display:flex;align-items:center;gap:6px;height:36px;margin:0 16px;padding:0 8px;border-radius:10px;background:var(--fill3);color:var(--label2)}
.search .ic{width:18px;height:18px;stroke-width:2.3}
.search input{flex:1;min-width:0;height:100%;font-size:17px;color:var(--label);outline:none;background:transparent}
.search input::placeholder{color:var(--label2);opacity:1}
.search .clear{width:18px;height:18px;border-radius:9px;background:var(--label3);color:var(--card);display:none;place-items:center}
.search .clear .ic{width:10px;height:10px;stroke-width:3.4}
.search.has .clear{display:grid}
.sticky-tools{position:sticky;top:calc(var(--sat) + var(--nav-h));z-index:10;padding:6px 0 4px;background:var(--bg);transition:background-color .25s,box-shadow .25s}
.sticky-tools.stuck{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--sep)}

/* ---------- Expandable rows (reference / mistakes / review) ---------- */
.xi{position:relative}
.group > .xi + .xi::before,.group > .sw + .sw::before{content:"";position:absolute;top:0;right:0;left:46px;height:.5px;background:var(--sep);z-index:2}
.xi-row{display:flex;align-items:flex-start;gap:12px;width:100%;padding:12px 14px 12px 16px;text-align:left;transition:background-color .2s}
.xi-row:active{background:var(--hl);transition:none}
.xi-dot{flex:none;width:18px;height:18px;margin-top:2px;border-radius:9px;display:grid;place-items:center;color:#fff;box-shadow:inset 0 0 0 1.5px var(--label4)}
.xi-dot .ic{width:11px;height:11px;stroke-width:3.4}
.xi-dot.ok{background:var(--green);box-shadow:none}
.xi-dot.bad{background:var(--red);box-shadow:none}
.xi-dot.skip{background:var(--gray);box-shadow:none}
.xi-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.xi-q{font-size:15px;line-height:20px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.xi.open .xi-q{display:block;-webkit-line-clamp:unset;font-weight:600}
.xi-meta{font-size:12px;line-height:16px;color:var(--label2);font-variant-numeric:tabular-nums}
.xi-chev{flex:none;margin-top:2px;color:var(--label3);width:16px;height:16px;stroke-width:2.6;transition:transform .3s var(--ease)}
.xi.open .xi-chev{transform:rotate(180deg)}
.xi-detail{display:none;padding:0 16px 16px 46px}
.xi.open .xi-detail{display:block;animation:rise .3s var(--ease)}
mark{background:var(--yellow-t);color:inherit;border-radius:3px;padding:0 1px;box-shadow:0 0 0 1px var(--yellow-t)}
.kv{border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.45;margin-top:8px;background:var(--fill4)}
.kv:first-child{margin-top:0}
.kv > small{display:flex;align-items:center;gap:5px;font-size:12px;line-height:16px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px;color:var(--label2)}
.kv > small .ic{width:13px;height:13px;stroke-width:3}
.kv.good{background:var(--green-t)} .kv.good > small{color:var(--green)}
.kv.bad{background:var(--red-t)} .kv.bad > small{color:var(--red)}
.kv-sub{font-size:12px;line-height:16px;color:var(--label3);margin-top:10px}
.kv .code-blk{font-size:13px}
.inline-actions{display:flex;gap:8px;margin-top:12px}
.inline-actions .btn{height:36px;font-size:15px;border-radius:10px;padding:0 14px}

/* swipe rows */
.sw{position:relative;overflow:hidden;background:var(--red)}
.sw-del{position:absolute;top:0;right:0;bottom:0;width:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#fff;font-size:13px;font-weight:600;background:var(--red)}
.sw-del .ic{width:22px;height:22px}
.sw-content{position:relative;background:var(--card);touch-action:pan-y;transition:transform .35s var(--ease);will-change:transform}
.sw-content.drag{transition:none}
.sw.gone{transition:height .3s var(--ease),opacity .3s;opacity:0}

/* ---------- Empty states ---------- */
.empty{text-align:center;padding:56px 32px 24px;display:flex;flex-direction:column;align-items:center}
.empty-ic{width:76px;height:76px;border-radius:38px;display:grid;place-items:center;color:#fff;margin-bottom:18px}
.empty-ic .ic{width:38px;height:38px;stroke-width:2.6}
.empty h2{font-size:22px;font-weight:700;letter-spacing:-.025em}
.empty p{font-size:15px;line-height:21px;color:var(--label2);margin:6px 0 20px;max-width:330px}
.empty.small{padding:40px 32px}
.empty.small p{margin:0}

/* ---------- Mistakes ---------- */
.mh{padding:18px 16px 16px;margin-top:14px}
.mh-top{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;padding:0 2px}
.mh-num{font-size:44px;line-height:46px;font-weight:700;letter-spacing:-.04em;color:var(--red);font-variant-numeric:tabular-nums}
.mh-cap{font-size:15px;line-height:20px;color:var(--label2)}
.mh-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mh-btns .btn{padding:0 10px}

/* ---------- Overlay screens ---------- */
.screen{position:fixed;top:0;right:0;bottom:0;left:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;
  transform:translate3d(0,100%,0);visibility:hidden;transition:transform .5s var(--ease),visibility 0s linear .5s}
.screen.open{transform:none;visibility:visible;transition:transform .5s var(--ease),visibility 0s}
.screen.instant{transition:none!important}
.s-head{flex:none;padding-top:var(--sat);background:var(--bg);position:relative;z-index:3}
.s-head-row{height:54px;max-width:760px;margin:0 auto;display:grid;grid-template-columns:52px 1fr 52px;align-items:center;padding:0 9px}
.s-head-row > :last-child{justify-self:end}
.s-title{text-align:center;line-height:1.15;min-width:0}
.s-title small{display:block;font-size:12px;font-weight:500;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:0}
.s-title small .g{color:var(--green);font-weight:600} .s-title small .r{color:var(--red);font-weight:600}
.s-title b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.s-progress{height:3px;margin:0 16px;border-radius:2px;background:var(--fill3);overflow:hidden;max-width:728px}
@media (min-width:760px){.s-progress{margin:0 auto}}
.s-progress > i{display:block;height:100%;width:0;border-radius:2px;background:var(--blue);transition:width .4s var(--ease)}
.pager{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pager::-webkit-scrollbar{display:none}
.pager.dragging{scroll-snap-type:none;cursor:grabbing}
.pager.dragging *{-webkit-user-select:none;user-select:none}
.slide{position:relative;flex:0 0 100%;width:100%;height:100%;overflow-x:hidden;overflow-y:auto;scroll-snap-align:start;scroll-snap-stop:always;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch}
.slide-inner{max-width:700px;margin:0 auto;padding:18px 16px calc(var(--sab) + 104px)}
.q-meta{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px 0 9px;border-radius:13px;font-size:13px;font-weight:600;letter-spacing:-.01em;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill .dot{width:7px;height:7px;border-radius:4px;flex:none}
.q-no{margin-left:auto;font-size:13px;color:var(--label3);font-variant-numeric:tabular-nums;white-space:nowrap}
.q-title{font-size:20px;line-height:1.34;font-weight:600;letter-spacing:-.022em;margin-bottom:20px;text-wrap:pretty;overflow-wrap:break-word}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;padding:13px 14px 13px 12px;border-radius:16px;background:var(--card);text-align:left;font-size:16px;line-height:1.42;letter-spacing:-.01em;
  box-shadow:var(--shadow),inset 0 0 0 1px transparent;transition:transform .18s var(--ease-out),background-color .25s,box-shadow .25s,opacity .25s}
.opt:active{transform:scale(.98)}
.opt-mark{flex:none;width:28px;height:28px;margin-top:-2px;border-radius:14px;display:grid;place-items:center;font-size:14px;font-weight:600;color:var(--label2);
  box-shadow:inset 0 0 0 1.5px var(--label4);transition:background-color .25s,color .25s,box-shadow .25s}
.opt-mark .ic{width:15px;height:15px;stroke-width:3.2}
.opt-text{flex:1;min-width:0;overflow-wrap:break-word}
.opt.sel{background:var(--blue-t);box-shadow:inset 0 0 0 2px var(--blue)}
.opt.sel .opt-mark{background:var(--blue);color:#fff;box-shadow:none}
.opt.ok{background:var(--green-t);box-shadow:inset 0 0 0 2px var(--green)}
.opt.ok .opt-mark{background:var(--green);color:#fff;box-shadow:none}
.opt.bad{background:var(--red-t);box-shadow:inset 0 0 0 2px var(--red)}
.opt.bad .opt-mark{background:var(--red);color:#fff;box-shadow:none}
.opt.missed{box-shadow:inset 0 0 0 2px var(--green)}
.opt.missed .opt-mark{color:var(--green);box-shadow:inset 0 0 0 2px var(--green)}
.opt.dim{opacity:.42}
.opt.locked{cursor:default}
.opt.locked:active{transform:none}
.opt.pop{animation:pop .4s var(--ease-out)}
.opt.shake{animation:shake .45s ease}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.025)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.q-title code,.xi-q code{font-weight:600;font-size:.84em}
code{-webkit-box-decoration-break:clone;box-decoration-break:clone}

/* ---------- Toast ---------- */

<script>
window.QUESTIONS=[{"id":1859301428,"n":1,"t":"SQL и работа с данными","s":"Ограничение количества строк через TOP / LIMIT — контроль объёма тестовой выборки при отладке SQL-запроса к DWH","q":"При отладке SQL-запроса к DWH в Teradata нужно быстро проверить структуру таблицы fact_sales — какой синтаксис использовать?","a":["`DESCRIBE fact_sales;` — стандартная команда для просмотра структуры таблицы в Teradata.","`SELECT TOP 1 * FROM fact_sales` — вернёт одну строку, но Teradata не поддерживает TOP, нужно использовать SAMPLE вместо него.","Используйте SHOW TABLE fact_sales; — он возвращает DDL таблицы без сканирования данных.","`SELECT * FROM dbc.columns WHERE tablename='fact_sales';` возвращает DDL, аналогично SHOW TABLE, но работает во всех диалектах SQL."],"c":2,"f":4},{"id":74673939,"n":2,"t":"SQL и работа с данными","s":"Оконные функции SQL - применение ROW_NUMBER, RANK, SUM OVER и PARTITION BY для ранжирования и накопительных расчётов в аналитических выборках из DWH","q":"Почему PARTITION BY в оконных функциях не уменьшает количество строк в результате запроса, в отличие от GROUP BY?","a":["PARTITION BY сохраняет строки лишь потому, что требует явного указания ORDER BY — без сортировки поведение идентично GROUP BY и строки схлопываются.","PARTITION BY уменьшает строки так же, как GROUP BY, но только внутри каждого раздела, поэтому итоговое количество строк зависит от числа уникальных значений в секции.","PARTITION BY только определяет границы окна для расчёта, но сохраняет каждую исходную строку в результате, тогда как GROUP BY схлопывает строки в группы, возвращая одну строку на группу.","PARTITION BY не влияет на количество строк, потому что оконные функции выполняются после GROUP BY и работают уже с агрегированным результатом."],"c":2,"f":6},{"id":1907467847,"n":3,"t":"SQL и работа с данными","s":"Реляционная модель данных - понимание первичных и внешних ключей, кардинальности связей и принципов соединения сущностей для корректного построения многотабличных запросов","q":"В схеме есть таблицы Orders (order_id PK, client_id FK, date) и Clients (client_id PK, name). При LEFT JOIN Orders ON Clients.client_id = Orders.client_id какие клиенты попадут в результат?","a":["Только клиенты, у которых есть хотя бы один заказ — LEFT JOIN работает как INNER JOIN, если ключи совпадают.","Все клиенты из Clients, но клиенты без заказов будут полностью исключены из результата, так как NULL-значения не включаются при JOIN-операциях.","Все клиенты из Clients, включая тех, у кого нет заказов — для них поля из Orders будут NULL.","Все заказы, включая те, где client_id отсутствует в Clients."],"c":2,"f":5},{"id":401534761,"n":4,"t":"SQL и работа с данными","s":"Дублирование строк при JOIN - диагностика и устранение размножения записей при соединении таблиц с различной гранулярностью в аналитических выгрузках","q":"Почему JOIN таблицы фактов с таблицей, где одному ключу соответствует несколько строк, вызывает размножение записей?","a":["Каждая строка факта соединяется с каждой подходящей строкой второй таблицы, образуя декартово произведение для данного ключа — итоговых строк становится больше, чем в исходной таблице фактов.","JOIN дублирует строки только при использовании LEFT JOIN или FULL OUTER JOIN — эти типы соединений специально предназначены для сохранения всех записей левой таблицы, что автоматически создаёт дополнительные строки при несовпадении ключей в правой таблице, тогда как INNER JOIN такой проблемы не вызывает","Размножение записей происходит потому, что SQL-движок не может определить приоритет строк и случайно дублирует факты для заполнения пустых ячеек результирующего набора","Проблема возникает из-за нарушения ссылочной целостности: если в таблице измерений есть дубли ключей, база данных автоматически реплицирует строки фактов, чтобы сохранить баланс между таблицами"],"c":0,"f":6},{"id":1044402318,"n":5,"t":"SQL и работа с данными","s":"Агрегатные функции SQL - применение SUM, COUNT, AVG, MIN, MAX с GROUP BY для расчёта показателей продаж по менеджерам и периодам в выгрузках из DWH","q":"Почему агрегатные функции нельзя использовать в WHERE, но можно в HAVING?","a":["WHERE фильтрует строки до группировки, когда агрегат ещё не вычислен. HAVING работает после GROUP BY — агрегированные значения уже доступны.","WHERE работает только со строковыми и числовыми типами данных, а агрегатные функции возвращают специальный тип aggregate, который WHERE не умеет обрабатывать — для этого и существует HAVING.","WHERE фильтрует только индексированные столбцы, а агрегаты не индексируются, поэтому для них нужен отдельный оператор HAVING.","HAVING выполняется до GROUP BY и заранее подготавливает агрегаты, поэтому WHERE уже не нужен — он просто не успевает их получить."],"c":0,"f":3},{"id":1172575919,"n":6,"t":"SQL и работа с данными","s":"Некорректная агрегация при многотабличных JOIN - выявление и исправление логических ошибок задвоения сумм при соединении нескольких таблиц фактов","q":"Почему JOIN двух таблиц фактов через общее измерение приводит к задвоению сумм?","a":["Декартово произведение строк: каждая строка первой таблицы соединяется с каждой строкой второй по ключу измерения, умножая суммы на количество совпадений.","Задвоение происходит из-за отсутствия индексов на ключах измерений — без них оптимизатор сканирует таблицу дважды","Суммы задваиваются, потому что таблицы фактов содержат дублирующиеся ключи измерений, нарушающие целостность данных","JOIN автоматически суммирует значения из обеих таблиц фактов для одного ключа, что приводит к двойному учёту транзакций на уровне SQL-движка без участия разработчика"],"c":0,"f":5},{"id":937517953,"n":7,"t":"SQL и работа с данными","s":"Агрегатные функции SQL - применение SUM, COUNT, AVG, MIN, MAX с GROUP BY для расчёта показателей продаж по менеджерам и периодам в выгрузках из DWH","q":"В выгрузке из DWH есть таблица sales (manager_id, sale_date, amount). Напишите запрос, который возвращает топ-менеджера по сумме продаж за 2024 год?","a":["SELECT manager_id, SUM(amount) AS total_sales FROM sales WHERE YEAR(sale_date) = 2024 GROUP BY manager_id ORDER BY total_sales ASC LIMIT 1;","SELECT manager_id, SUM(amount) AS total_sales FROM sales WHERE sale_date BETWEEN '2024-01-01' AND '2024-12-31' GROUP BY manager_id ORDER BY total_sales DESC LIMIT 1;","SELECT manager_id, SUM(amount) AS total_sales FROM sales WHERE sale_date BETWEEN '2024-01-01' AND '2024-12-31' ORDER BY total_sales DESC GROUP BY manager_id LIMIT 1;","SELECT manager_id, COUNT(amount) AS total_sales FROM sales WHERE sale_date BETWEEN '2024-01-01' AND '2024-12-31' GROUP BY manager_id ORDER BY total_sales DESC LIMIT 1;"],"c":1,"f":4},{"id":275169717,"n":8,"t":"SQL и работа с данными","s":"Условная агрегация SQL - построение многомерных срезов через CASE WHEN внутри SUM и COUNT для формирования плоских наборов данных под модель Qlik Sense","q":"Почему CASE WHEN внутри SUM позволяет избежать множественных JOIN-ов при построении многомерных срезов?","a":["Потому что CASE WHEN устраняет необходимость в JOIN, поскольку агрегатные функции в SQL автоматически дедуплицируют строки, которые JOIN мог бы задублировать при объединении измерений.","Потому что JOIN объединяет строки физически, а CASE WHEN работает только с метаданными столбцов, не затрагивая сами данные, что принципиально снижает I/O-нагрузку.","Потому что условная агрегация обрабатывает все измерения за один проход по данным, тогда как каждый JOIN требует отдельного сканирования таблицы, многократно увеличивая стоимость запроса и количество строк в промежуточных наборах данных.","Потому что CASE WHEN переносит логику фильтрации с уровня JOIN на уровень SELECT, что позволяет оптимизатору заменить декартово произведение таблиц единственным индексным сканом, полностью исключая создание промежуточных результирующих наборов и снижая нагрузку на буферный пул базы данных."],"c":2,"f":4,"e":"Условная агрегация считает все срезы за один проход по таблице: каждый SUM(CASE WHEN …) — отдельная колонка результата. Каждый дополнительный JOIN — это ещё одно соединение и рост промежуточных наборов строк.","u":1},{"id":585353930,"n":9,"t":"SQL и работа с данными","s":"Логика JOIN в многотабличных запросах - выбор типа соединения (INNER, LEFT, FULL OUTER) при объединении таблиц фактов из разных доменных областей DWH","q":"В DWH есть таблица фактов продаж (sales_fact) и таблица фактов возвратов (returns_fact). Не все продажи имеют возвраты, и существуют возвраты без привязки к конкретной продаже. Какой тип JOIN следует использовать для построения сводного отчёта, учитывающего все записи из обеих таблиц?","a":["FULL OUTER JOIN — он сохраняет все строки из обеих таблиц фактов, подставляя NULL там, где совпадений нет. INNER JOIN потерял бы продажи без возвратов и «висящие» возвраты; LEFT JOIN потерял бы возвраты без продаж.","INNER JOIN, так как сводный отчёт должен отражать только завершённые бизнес-транзакции, где продажа и возврат связаны между собой — несвязанные записи нарушат целостность агрегированных показателей.","FULL OUTER JOIN не подходит — вместо него нужен UNION ALL двух LEFT JOIN: сначала sales_fact LEFT JOIN returns_fact, затем returns_fact LEFT JOIN sales_fact, что даёт контроль над дубликатами.","LEFT JOIN от sales_fact к returns_fact — оптимальный выбор: все продажи попадут в отчёт, а возвраты без привязки к продажам в сводном отчёте избыточны и могут исказить аналитику."],"c":0,"f":3},{"id":850769764,"n":10,"t":"SQL и работа с данными","s":"NULL-значения в SQL - обработка отсутствующих данных с помощью IS NULL, COALESCE, NULLIF при объединении таблиц DWH и расчёте агрегатных показателей","q":"Почему агрегатная функция SUM игнорирует NULL-значения, и как это влияет на результат расчёта показателей в DWH?","a":["SUM не игнорирует NULL, а трактует их как 0, поэтому итоговая сумма всегда остаётся корректной. Проблема возникает только в AVG, где NULL увеличивает знаменатель, завышая среднее значение. Именно поэтому в DWH рекомендуют использовать NULLIF(column, 0) перед агрегацией, чтобы избежать деления на ноль.","SQL-стандарт определяет NULL как 'неизвестное значение', поэтому агрегатные функции (SUM, AVG, COUNT) автоматически пропускают NULL, не включая их в вычисление. Это может привести к искажению показателей: например, SUM вернёт корректную сумму известных значений, но AVG посчитает среднее только по непустым строкам, занижая знаменатель. Чтобы явно учесть отсутствующие данные как ноль, применяют COALESCE(column, 0) перед агрегацией.","NULL в SQL — это просто пустая строка, поэтому SUM считает её нулём автоматически.","SQL-стандарт определяет NULL как отсутствие значения, и агрегатные функции действительно его пропускают, однако это поведение применимо только к COUNT — функция SUM по умолчанию заменяет NULL нулём автоматически на уровне движка базы данных. Поэтому использование COALESCE перед SUM является избыточным и не влияет на результат. В DWH проблема NULL критична лишь при JOIN-операциях, где отсутствующие ключи приводят к потере строк, а не при агрегации. Для корректной обработки достаточно настроить ETL-процесс так, чтобы NULL-значения замещались на этапе загрузки данных в хранилище."],"c":1,"f":6},{"id":195364156,"n":11,"t":"SQL и работа с данными","s":"Дублирование строк при JOIN - диагностика и устранение размножения записей при соединении таблиц с различной гранулярностью в аналитических выгрузках","q":"В аналитической выгрузке после LEFT JOIN таблицы заказов (1 строка на заказ) с таблицей платежей (несколько платежей на заказ) сумма заказов задвоилась — какой SQL-паттерн исправит ситуацию без потери данных по платежам?","a":["Перенести фильтрацию дублей в WHERE-условие, добавив ROW_NUMBER()=1 к основному запросу — это сохранит один платёж на заказ и устранит задвоение итоговых сумм.","Использовать INNER JOIN вместо LEFT JOIN — он автоматически отфильтрует лишние строки и предотвратит размножение записей при разной гранулярности таблиц.","Добавить DISTINCT в основной SELECT — это уберёт дублирующиеся строки заказов и исправит задвоение сумм без изменения логики JOIN.","Предварительно агрегировать таблицу платежей через подзапрос или CTE (GROUP BY order_id с SUM/COUNT), приведя её к гранулярности заказа, и только затем выполнять JOIN. Альтернатива — использовать оконные функции вместо JOIN."],"c":3,"f":5},{"id":823425637,"n":12,"t":"SQL и работа с данными","s":"Многотабличные JOIN-ы - логика и порядок соединения трёх и более таблиц (заказы, клиенты, продукты) для формирования плоских выборок под отчёты Qlik Sense","q":"В отчёте Qlik Sense нужна плоская таблица: номер заказа, имя клиента, название продукта и сумма. Таблицы: Orders (order_id, client_id, product_id, amount), Clients (client_id, name), Products (product_id, title). Какой SQL-запрос корректно соединит все три таблицы?","a":["SELECT o.order_id, c.name, p.title, o.amount FROM Orders o JOIN Clients c ON o.client_id = c.client_id JOIN Products p ON o.product_id = p.title — JOIN по product_id и title допустим, если title уникален и используется как суррогатный ключ продукта.","SELECT o.order_id, c.name, p.title, o.amount FROM Orders o JOIN Clients c ON o.client_id = c.client_id JOIN Products p ON o.product_id = p.product_id — Orders выступает основой, к ней последовательно присоединяются Clients и Products через соответствующие внешние ключи.","SELECT o.order_id, c.name, p.title, o.amount FROM Orders o, Clients c, Products p WHERE o.client_id = c.client_id — неполное условие WHERE, но Qlik Sense автоматически подтянет Products через ассоциативную модель по совпадающим именам полей.","SELECT o.order_id, c.name, p.title, o.amount FROM Clients c JOIN Orders o ON c.client_id = o.client_id JOIN Products p ON p.product_id = o.product_id — правильный запрос, но основой должна быть таблица Clients, иначе Qlik Sense построит некорректную ассоциативную модель."],"c":1,"f":5},{"id":428185423,"n":13,"t":"SQL и работа с данными","s":"Оконные функции SQL - применение ROW_NUMBER и RANK для ранжирования менеджеров по показателям продаж в аналитических выгрузках из DWH","q":"Почему ROW_NUMBER гарантирует уникальные ранги даже при одинаковых показателях продаж менеджеров, тогда как RANK — нет?","a":["ROW_NUMBER использует дополнительный внутренний счётчик транзакций базы данных для разрешения конфликтов при одинаковых значениях, тогда как RANK опирается исключительно на сортировку и не имеет механизма разрешения дублей, поэтому возвращает NULL для повторяющихся позиций.","ROW_NUMBER присваивает порядковый номер произвольно при равных значениях, не учитывая ties. RANK же фиксирует одинаковый ранг для равных значений и пропускает следующий номер, отражая реальные «ничьи» в данных.","ROW_NUMBER уникален, потому что учитывает все колонки секции PARTITION BY, тогда как RANK анализирует только колонку из ORDER BY и при совпадении значений дублирует ранги.","RANK пропускает номера только в случае явного указания NULLS LAST в ORDER BY, иначе поведение идентично ROW_NUMBER — оба присваивают уникальные порядковые номера."],"c":1,"f":5},{"id":696416270,"n":14,"t":"SQL и работа с данными","s":"Условная агрегация SQL - построение многомерных срезов через CASE WHEN внутри SUM и COUNT для формирования плоских наборов данных под модель Qlik Sense","q":"В Qlik Sense нужна плоская таблица с суммами продаж отдельно по каждому региону (North, South, East) в одной строке на продукт — какую SQL-конструкцию использовать?","a":["Для плоской таблицы с суммами по регионам нужно использовать PIVOT-оператор: SELECT product_id, [North] AS sales_north, [South] AS sales_south, [East] AS sales_east FROM sales PIVOT (SUM(amount) FOR region IN ([North],[South],[East])) — это стандартный SQL-подход, который работает во всех СУБД и специально создан для разворота строк в столбцы под аналитические инструменты.","Условная агрегация через CASE WHEN подходит только для счётчиков COUNT, но не для числовых сумм SUM — для денежных показателей нужно применять LEFT JOIN на каждый регион отдельно: SELECT p.product_id, n.amount AS sales_north, s.amount AS sales_south, e.amount AS sales_east FROM products p LEFT JOIN sales n ON p.product_id=n.product_id AND n.region='North' LEFT JOIN sales s ON p.product_id=s.product_id AND s.region='South' LEFT JOIN sales e ON p.product_id=e.product_id AND e.region='East', так как CASE WHEN внутри SUM не агрегирует корректно при NULL-значениях и даст искажённые итоги в Qlik.","Используй GROUP BY с HAVING: SELECT product_id, SUM(amount) FROM sales GROUP BY product_id, region HAVING region IN ('North','South','East') — Qlik сам развернёт данные.","Условную агрегацию: SELECT product_id, SUM(CASE WHEN region='North' THEN amount END) AS sales_north, SUM(CASE WHEN region='South' THEN amount END) AS sales_south, SUM(CASE WHEN region='East' THEN amount END) AS sales_east FROM sales GROUP BY product_id — это даёт денормализованный flat-набор, оптимальный для ассоциативной модели Qlik."],"c":3,"f":3},{"id":2073156786,"n":15,"t":"SQL и работа с данными","s":"Оператор SELECT — выбор конкретных полей из таблицы DWH для подготовки плоской выборки под загрузку в Qlik Sense","q":"Почему при подготовке выборки для Qlik Sense рекомендуется явно перечислять поля в SELECT вместо использования SELECT *?","a":["SELECT * тянет лишние поля, увеличивая объём данных и нагрузку на память Qlik Sense; явный список полей даёт контроль над составом выборки и повышает производительность загрузки.","Qlik Sense автоматически игнорирует лишние поля при загрузке, поэтому SELECT * удобнее для разработки, однако явный список полей требуется только для соответствия корпоративным стандартам документирования кода и упрощения code review в команде.","SELECT * быстрее пишется и не влияет на скорость загрузки.","SELECT * запрещён в большинстве DWH-систем на уровне прав доступа, поэтому явное перечисление полей — единственный способ выполнить запрос без ошибки авторизации."],"c":0,"f":4},{"id":553635551,"n":16,"t":"SQL и работа с данными","s":"Фильтрация данных через WHERE — применение условий по статусу, дате и числовым значениям при выгрузке клиентов и транзакций из DWH","q":"Почему условие WHERE выполняется до GROUP BY при выгрузке транзакций из DWH?","a":["WHERE заменяет HAVING при фильтрации агрегатов.","WHERE работает на уровне групп, поэтому база данных сначала применяет GROUP BY для формирования промежуточных наборов, а затем WHERE отсекает ненужные строки из уже агрегированных результатов — это стандартное поведение SQL-оптимизатора.","WHERE выполняется после GROUP BY, чтобы сначала сгруппировать все строки и только потом отфильтровать лишние агрегаты по нужному условию.","WHERE фильтрует строки до агрегации, уменьшая объём обрабатываемых данных и повышая производительность запроса."],"c":3,"f":5},{"id":390633401,"n":17,"t":"SQL и работа с данными","s":"INNER JOIN — объединение кадровой таблицы со справочником подразделений для формирования HR-выборки без потери строк","q":"Почему сотрудник без подразделения в справочнике исчезнет из результата INNER JOIN?","a":["INNER JOIN сохраняет все строки из левой таблицы, а справочник используется лишь для дополнения данными — если подразделение не найдено, поле просто останется пустым (NULL), но сотрудник никуда не денется.","INNER JOIN отбрасывает строку, так как справочник является главной таблицей, и все записи выбираются именно из него.","INNER JOIN возвращает только строки с совпадением в обеих таблицах — если подразделение отсутствует в справочнике, совпадения нет, строка отбрасывается.","Сотрудник исчезнет, потому что NULL-значения в поле подразделения автоматически фильтруются движком SQL на этапе WHERE, а не из-за логики самого JOIN."],"c":2,"f":3},{"id":991541649,"n":18,"t":"SQL и работа с данными","s":"LEFT JOIN — присоединение справочника категорий к таблице продуктов с сохранением записей без совпадений для подготовки измерения в отчёте","q":"Почему LEFT JOIN сохраняет строки из левой таблицы даже при отсутствии совпадений в правой?","a":["Он дублирует левую таблицу целиком.","Потому что SQL автоматически заполняет пропущенные значения нулями, чтобы не потерять данные при объединении таблиц разного размера.","LEFT JOIN сохраняет строки левой таблицы только если в правой таблице есть хотя бы одна запись с совпадением, иначе строка фильтруется — это поведение аналогично INNER JOIN с расширенными возможностями.","Это его ключевое правило: все строки левой таблицы включаются в результат, а для несовпавших строк правой таблицы подставляется NULL."],"c":3,"f":6},{"id":298040022,"n":19,"t":"SQL и работа с данными","s":"Сортировка результатов через ORDER BY — упорядочивание выгружаемых списков клиентов и транзакций по дате или сумме операции","q":"Вам нужно выгрузить список транзакций клиента за последний месяц, отсортированный от самой крупной суммы к наименьшей — какой ORDER BY вы используете?","a":["ORDER BY transaction_amount DESC","ORDER BY transaction_date DESC, transaction_amount","ORDER BY transaction_amount ASC","ORDER BY SUM(transaction_amount) DESC"],"c":0,"f":3},{"id":698528176,"n":20,"t":"SQL и работа с данными","s":"Ограничение количества строк через TOP / LIMIT — контроль объёма тестовой выборки при отладке SQL-запроса к DWH","q":"Почему при отладке SQL-запроса к DWH рекомендуется добавлять TOP/LIMIT вместо того, чтобы запускать запрос без ограничений?","a":["TOP/LIMIT нужен только для финальной оптимизации запроса, при отладке он не обязателен — главное правильно написать JOIN и WHERE.","Без TOP/LIMIT DWH блокирует таблицы на время выполнения, что мешает другим пользователям работать с данными параллельно.","Без ограничения запрос может вернуть миллионы строк, перегрузив сеть, память клиента и сам DWH, тогда как TOP/LIMIT позволяет быстро проверить логику запроса на небольшой выборке без лишней нагрузки.","TOP/LIMIT ускоряет выполнение запроса на стороне DWH, так как сервер обрабатывает меньше данных и быстрее строит план выполнения."],"c":2,"f":4},{"id":1604657076,"n":21,"t":"SQL и работа с данными","s":"Derived table в FROM - построение подзапросов в секции FROM для промежуточных агрегаций и расчёта долей категорий продуктов в общей выручке","q":"Вам нужно рассчитать долю выручки каждой категории продуктов в общей выручке за квартал. Какой подход с использованием derived table в секции FROM позволит корректно решить эту задачу?","a":["Создать подзапрос в FROM, агрегирующий выручку по категориям, и джойнить его с подзапросом квартальной выручки через INNER JOIN по полю quarter: SELECT cat, cat_rev, cat_rev / total_rev AS share FROM (SELECT category AS cat, quarter, SUM(revenue) AS cat_rev FROM sales GROUP BY category, quarter) AS cat_agg INNER JOIN (SELECT quarter, SUM(revenue) AS total_rev FROM sales GROUP BY quarter) AS total ON cat_agg.quarter != total.quarter — JOIN по неравенству даёт декартово произведение, деление на чужой квартал делает результат бессмысленным.","Создать подзапрос в FROM, агрегирующий выручку по категориям, и джойнить его с подзапросом общей выручки: SELECT cat, cat_rev, cat_rev / total_rev AS share FROM (SELECT category AS cat, SUM(revenue) AS cat_rev FROM sales GROUP BY category) AS cat_agg CROSS JOIN (SELECT SUM(revenue) AS total_rev FROM sales) AS total.","Достаточно использовать оконную функцию прямо в основном запросе без derived table: SELECT category, SUM(revenue) AS cat_rev, SUM(revenue) / SUM(SUM(revenue)) OVER() AS share FROM sales GROUP BY category — derived table в FROM для таких задач избыточен.","Использовать один подзапрос в FROM с группировкой по категориям, а общую выручку вычислять через вложенный SELECT в списке полей: SELECT cat, cat_rev, cat_rev / (SELECT SUM(revenue) FROM sales) AS share FROM (SELECT category AS cat, SUM(revenue) AS cat_rev FROM sales GROUP BY category) AS cat_agg. Такой подход избыточен — CROSS JOIN с derived table для total_rev создаёт лишнюю операцию соединения, а скалярный подзапрос в SELECT выполняется один раз и работает корректнее и эффективнее для расчёта долей."],"c":1,"f":3},{"id":554771508,"n":22,"t":"SQL и работа с данными","s":"Псевдонимы полей и таблиц через AS — именование столбцов и сокращение ссылок на таблицы для читаемости запроса при выгрузке в Qlik Sense","q":"Как переименовать столбец employee_full_name в 'Сотрудник' при выгрузке данных в Qlik Sense через SQL-запрос?","a":["SELECT \"Сотрудник\" = employee_full_name FROM employees","В Qlik Sense переименование столбцов делается только в скрипте загрузки через ALIAS, а не в SQL-запросе к источнику","SELECT employee_full_name RENAME \"Сотрудник\" FROM employees","Использовать псевдоним: SELECT employee_full_name AS \"Сотрудник\" FROM employees"],"c":3,"f":3},{"id":117920961,"n":23,"t":"SQL и работа с данными","s":"Оператор IN и список значений — фильтрация выборки по множеству статусов или категорий без перечисления условий через OR","q":"Почему использование IN предпочтительнее цепочки условий OR при фильтрации по множеству значений?","a":["IN автоматически убирает дубли из выборки, а OR — нет, поэтому результаты могут различаться","IN выполняется быстрее OR, потому что база данных использует бинарный поиск по списку значений, а не последовательную проверку каждого условия, что критично для больших таблиц","IN делает запрос короче и читаемее: перечисление значений в одном месте проще, чем повторение одного столбца в каждом OR-условии, при этом результат идентичен","OR позволяет комбинировать разные столбцы, а IN работает только с одним, поэтому IN предпочтительнее только в простых случаях"],"c":2,"f":2},{"id":1411266212,"n":24,"t":"SQL и работа с данными","s":"Оконные функции SQL - применение ROW_NUMBER, RANK, SUM OVER и PARTITION BY для ранжирования и накопительных расчётов в аналитических выборках из DWH","q":"В таблице продаж нужно пронумеровать транзакции каждого менеджера по убыванию суммы, при этом одинаковые суммы должны получать разные номера — какую оконную функцию следует использовать?","a":["ROW_NUMBER() OVER (PARTITION BY manager_id ORDER BY amount DESC) — она присваивает уникальные последовательные номера без пропусков, даже при одинаковых значениях суммы.","RANK() OVER (PARTITION BY manager_id ORDER BY amount DESC) — она присваивает уникальные номера без пропусков, корректно обрабатывая одинаковые суммы и гарантируя строгую последовательность в рамках каждого менеджера.","DENSE_RANK() OVER (PARTITION BY manager_id ORDER BY amount DESC) — присваивает уникальные последовательные номера без пропусков даже при одинаковых суммах.","ROW_NUMBER() OVER (ORDER BY amount DESC) — она нумерует транзакции по убыванию суммы, одинаковые значения получат разные номера."],"c":0,"f":2},{"id":1396458683,"n":25,"t":"SQL и работа с данными","s":"Фильтрация данных в SQL - использование WHERE и HAVING для отбора записей по статическим условиям и по результатам агрегации при выгрузке из корпоративного хранилища","q":"Почему фильтрация через HAVING выполняется позже, чем через WHERE при выполнении SQL-запроса?","a":["HAVING выполняется позже, потому что он работает на уровне индексов таблицы, а WHERE — на уровне физических блоков данных. Сначала база данных читает блоки через WHERE, затем строит индексные структуры и применяет HAVING к ним.","WHERE фильтрует строки до агрегации, а HAVING — уже после вычисления агрегатных функций (SUM, COUNT и т.д.), поэтому HAVING не может применяться к исходным строкам, только к результатам группировки.","WHERE и HAVING выполняются в одинаковый момент, но HAVING применяется только к столбцам, указанным в GROUP BY, тогда как WHERE работает со всеми остальными столбцами.","HAVING фильтрует позже, так как WHERE имеет более высокий приоритет синтаксического разбора — оптимизатор обрабатывает ключевые слова в порядке их приоритета, и WHERE всегда стоит выше HAVING в иерархии операторов SQL."],"c":1,"f":2},{"id":592899843,"n":26,"t":"SQL и работа с данными","s":"Реляционная модель данных - понимание первичных и внешних ключей, кардинальности связей и принципов соединения сущностей для корректного построения многотабличных запросов","q":"Почему внешний ключ должен ссылаться на столбец с гарантированной уникальностью (PRIMARY KEY или UNIQUE)?","a":["Внешний ключ ссылается на уникальный столбец, чтобы ускорить выполнение JOIN-запросов за счёт индексирования первичного ключа в родительской таблице.","Уникальность гарантирует однозначность ссылки — ровно одна запись в родительской таблице.","Ссылка на уникальный столбец нужна для каскадного удаления: без неё СУБД не сможет корректно распространить операцию DELETE на связанные записи.","Уникальность требуется для того, чтобы дочерняя таблица не содержала дублирующихся значений внешнего ключа, иначе СУБД отклонит вставку."],"c":1,"f":1},{"id":765417331,"n":27,"t":"SQL и работа с данными","s":"Подзапросы в WHERE - использование коррелированных и некоррелированных подзапросов для фильтрации записей по вычисляемым условиям (например, клиенты выше среднего по сумме заказов)","q":"Почему коррелированный подзапрос выполняется медленнее некоррелированного при большом объёме данных?","a":["Коррелированный подзапрос загружает все данные в память целиком, тогда как некоррелированный обращается к диску только один раз.","Коррелированный подзапрос создаёт временную таблицу для каждого результата, что требует дополнительных операций записи.","Коррелированный подзапрос выполняется заново для каждой строки внешнего запроса, тогда как некоррелированный вычисляется один раз и его результат переиспользуется.","Некоррелированный подзапрос использует индексы внешней таблицы, а коррелированный работает только с полным сканированием."],"c":2,"f":1},{"id":117835332,"n":28,"t":"SQL и работа с данными","s":"Логические операторы AND, OR, NOT в WHERE — составление составных условий фильтрации при выгрузке списков клиентов с несколькими критериями отбора","q":"Почему при совместном использовании AND и OR в WHERE без скобок результат фильтрации может оказаться неожиданным?","a":["Потому что SQL вычисляет условия строго слева направо, и порядок написания AND и OR напрямую определяет результат — скобки нужны только для читаемости, но не влияют на логику выполнения запроса","AND имеет более высокий приоритет, чем OR, поэтому условия вычисляются не слева направо, а сначала все AND-группы, затем OR — скобки явно задают нужный порядок вычислений","AND и OR имеют одинаковый приоритет, результат непредсказуем","OR имеет более высокий приоритет, чем AND, поэтому без скобок сначала объединяются все OR-условия, а потом применяется AND — это приводит к расширению выборки сверх ожидаемой"],"c":1,"f":3},{"id":154513130,"n":29,"t":"SQL и работа с данными","s":"Оконные функции с PARTITION BY и ORDER BY - формирование нарастающих итогов и скользящих расчётов в разрезе периодов и аналитических измерений без постобработки в Qlik Sense","q":"Как написать SQL-запрос для расчёта нарастающего итога продаж по каждому региону отдельно, сбрасывая накопление в начале каждого года?","a":["SUM(sales) OVER (PARTITION BY region ORDER BY YEAR(sale_date), sale_date ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) — PARTITION BY только по региону, накопление идёт сквозь все годы без сброса при смене года.","SUM(sales) OVER (PARTITION BY region, YEAR(sale_date) ORDER BY sale_date ROWS BETWEEN CURRENT ROW AND UNBOUNDED FOLLOWING) — фрейм FOLLOWING считает убывающий остаток от текущей строки до конца, а не нарастающий итог с начала.","Использовать SUM(sales) OVER (PARTITION BY region, YEAR(sale_date) ORDER BY sale_date ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) — PARTITION BY обеспечивает сброс накопления при смене раздела (регион + год), ORDER BY задаёт порядок накопления внутри раздела.","SUM(sales) OVER (PARTITION BY YEAR(sale_date) ORDER BY sale_date ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) — PARTITION BY только по году без региона смешивает все регионы вместе, накопление не разделяется по регионам."],"c":2,"f":3},{"id":1752198150,"n":30,"t":"SQL и работа с данными","s":"Подзапросы и CTE - декомпозиция сложной логики выгрузки на читаемые шаги через WITH для формирования аналитических наборов данных из DWH","q":"В чём основное архитектурное преимущество CTE перед дублированием подзапросов?","a":["CTE улучшает читаемость и декомпозицию логики, устраняя дублирование кода запроса.","CTE заменяет подзапросы за счёт оптимизатора, который всегда выбирает более эффективный план выполнения в отличие от вложенных SELECT-конструкций","CTE автоматически кэширует промежуточные результаты в памяти, что устраняет повторные обращения к таблицам DWH и ускоряет выполнение запроса","CTE создаёт отдельный физический срез данных во временной таблице, изолируя логику и гарантируя транзакционную целостность промежуточных наборов"],"c":0,"f":4},{"id":1759487564,"n":31,"t":"SQL и работа с данными","s":"Оконные функции SQL - использование LAG и LEAD для расчёта динамики и отклонений показателей между периодами в запросах к корпоративному хранилищу","q":"В корпоративном хранилище есть таблица monthly_sales(month_date, region, revenue). Нужно рассчитать процентное изменение выручки по каждому региону относительно предыдущего месяца — какое выражение использовать в SELECT?","a":["ROUND((revenue - LAG(revenue) OVER (PARTITION BY region ORDER BY month_date)) * 100.0 / COALESCE(LAG(revenue) OVER (PARTITION BY region ORDER BY month_date), 1), 2) AS pct_change — COALESCE заменяет NULL на 1, что защищает от деления на ноль и корректно обрабатывает первый месяц в каждом регионе, возвращая фактическую выручку как процент вместо NULL.","ROUND((revenue - LAG(revenue) OVER (PARTITION BY region ORDER BY month_date)) * 100.0 / NULLIF(LAG(revenue) OVER (PARTITION BY region ORDER BY month_date), 0), 2) AS pct_change. NULLIF защищает от деления на ноль, PARTITION BY region обеспечивает независимый расчёт по каждому региону.","ROUND((LAG(revenue) OVER (PARTITION BY region ORDER BY month_date) - revenue) * 100.0 / NULLIF(revenue, 0), 2) AS pct_change — деление разницы предыдущего и текущего значения на текущую выручку даёт корректное процентное изменение, где NULLIF(revenue, 0) защищает от деления на ноль в текущем периоде, а PARTITION BY region гарантирует расчёт в рамках каждого региона.","ROUND((revenue - LAG(revenue) OVER (ORDER BY month_date, region)) * 100.0 / NULLIF(LAG(revenue) OVER (ORDER BY month_date, region), 0), 2) AS pct_change — сортировка по month_date и region одновременно без PARTITION BY обеспечивает глобальный расчёт динамики, что является стандартным подходом для многомерных корпоративных хранилищ и позволяет корректно сравнивать показатели между регионами."],"c":1,"f":2},{"id":1640556900,"n":32,"t":"SQL и работа с данными","s":"Фильтрация данных через WHERE — применение условий по статусу, дате и числовым значениям при выгрузке клиентов и транзакций из DWH","q":"Вам нужно выгрузить из DWH всех активных клиентов, зарегистрированных после 2022 года, с суммой покупок выше 50 000. Какое условие WHERE корректно решает эту задачу?","a":["WHERE status = 'ACTIVE' OR registration_date > '2022-12-31' OR total_amount > 50000","WHERE status = 'ACTIVE' AND registration_date > '2022-12-31' AND total_amount > 50000","WHERE status = 'ACTIVE' AND registration_date >= '2022-01-01' AND total_amount > 50000","WHERE status = 'ACTIVE' AND YEAR(registration_date) > 2022 AND total_amount >= 50000"],"c":1,"f":2},{"id":686584124,"n":33,"t":"SQL и работа с данными","s":"Некорректная агрегация при многотабличных JOIN - выявление и исправление логических ошибок задвоения сумм при соединении нескольких таблиц фактов","q":"В отчёте Qlik Sense при JOIN таблицы продаж (1000 строк) с таблицей возвратов (50 строк) через общий ключ order_id сумма продаж задвоилась — какой SQL-паттерн исправит эту проблему до загрузки данных в модель?","a":["Использовать LEFT JOIN вместо INNER JOIN: это гарантирует сохранение всех строк продаж без дублирования, так как LEFT JOIN не создаёт дополнительных строк при несовпадении ключей.","Добавить DISTINCT к SELECT в запросе продаж: SELECT DISTINCT order_id, amount FROM sales — это устранит дублирующиеся строки до соединения таблиц и предотвратит задвоение сумм.","Использовать предварительную агрегацию каждой таблицы фактов до JOIN: SELECT order_id, SUM(amount) FROM sales GROUP BY order_id, затем JOIN с аналогично агрегированной таблицей возвратов. Это исключает декартово умножение строк при связи many-to-many.","Задвоение устраняется на стороне Qlik через агрегирующие функции Sum() с модификатором TOTAL в выражениях графиков — SQL-преобразования не нужны, проблема решается в слое визуализации."],"c":2,"f":1,"e":"Задвоение даёт связь «многие ко многим» по order_id. Если сначала свернуть каждую таблицу до гранулярности order_id, JOIN перестаёт размножать строки. DISTINCT убрал бы и законные одинаковые строки.","u":1},{"id":880225353,"n":34,"t":"SQL и работа с данными","s":"INNER JOIN — объединение кадровой таблицы со справочником подразделений для формирования HR-выборки без потери строк","q":"В таблице сотрудников (employees) есть записи с NULL в поле department_id — какие строки вернёт INNER JOIN с таблицей подразделений (departments) по этому полю?","a":["NULL считается особым значением, поэтому INNER JOIN совпадёт с NULL в departments и вернёт такие строки с пустым названием подразделения.","Строки с NULL будут исключены только если в таблице departments тоже нет NULL — иначе они попадут в результат по правилу совпадения пустых значений.","Строки с NULL в department_id будут исключены: INNER JOIN возвращает только совпадающие записи в обеих таблицах.","Строки с NULL в department_id будут возвращены как есть — INNER JOIN не фильтрует NULL, только LEFT JOIN их исключает."],"c":2,"f":3},{"id":2110704375,"n":35,"t":"SQL и работа с данными","s":"NULL-значения в SQL - обработка отсутствующих данных с помощью IS NULL, COALESCE, NULLIF при объединении таблиц DWH и расчёте агрегатных показателей","q":"При LEFT JOIN двух таблиц DWH часть значений revenue оказалась NULL — как корректно посчитать SUM, если NULL означает отсутствие дохода?","a":["SUM(ISNULL(revenue, 0)) — стандартный способ, COALESCE излишен, так как ISNULL работает быстрее и корректнее для агрегатов.","SUM(COALESCE(revenue, 0)) — SUM игнорирует NULL по стандарту SQL, но если NULL семантически означает 0, пропуск строк искажает бизнес-показатель.","SUM(revenue) достаточно — SQL автоматически интерпретирует NULL как 0 при суммировании, дополнительная обработка избыточна.","Нужен WHERE revenue IS NOT NULL перед SUM — это исключит NULL-строки и даст точный итог без искажений."],"c":1,"f":2},{"id":1859250105,"n":36,"t":"SQL и работа с данными","s":"Подзапросы и CTE - декомпозиция сложной логики выгрузки на читаемые шаги через WITH для формирования аналитических наборов данных из DWH","q":"В DWH есть таблицы продаж за 3 года (300 млн строк). Нужно построить отчёт: топ-10 менеджеров по росту продаж к прошлому году в каждом регионе. Как структурировать CTE-цепочку для этой задачи?","a":["Для 300 млн строк CTE неэффективны — они не материализуются и пересчитываются при каждом обращении. Правильнее создать временные таблицы с агрегатами по годам, добавить индексы, затем джойнить. ROW_NUMBER внутри CTE на таком объёме вызовет сортировку всей таблицы.","Достаточно двух CTE: в первом объединить продажи обоих лет через UNION ALL с признаком года, во втором сразу посчитать рост и ранжирование. Меньше CTE — меньше нагрузка на оптимизатор, запрос выполнится быстрее на 300 млн строк.","Декомпозиция на 4 CTE: 1) sales_current — агрегат продаж текущего года по менеджеру и региону; 2) sales_prev — аналог за прошлый год; 3) growth — JOIN двух CTE, вычисление % роста; 4) ranked — ROW_NUMBER() OVER (PARTITION BY region ORDER BY growth DESC). Финальный SELECT фильтрует rank <= 10. Такой подход изолирует логику каждого шага, упрощает отладку и переиспользование в Qlik-скрипте.","CTE-цепочку нужно строить иначе: сначала ranked с ROW_NUMBER по объёму продаж текущего года, затем отфильтровать топ-10, и только потом джойнить с прошлым годом для расчёта роста. Фильтрация до джойна снижает объём обрабатываемых данных."],"c":2,"f":1,"e":"Цепочка «агрегат текущего года → агрегат прошлого года → рост → ранжирование внутри региона» даёт верный результат и легко отлаживается. Ранжировать до расчёта роста нельзя: топ по объёму не равен топу по приросту.","u":1},{"id":1344030356,"n":37,"t":"SQL и работа с данными","s":"Сортировка результатов через ORDER BY — упорядочивание выгружаемых списков клиентов и транзакций по дате или сумме операции","q":"Почему без ORDER BY порядок строк в результате SQL-запроса непредсказуем?","a":["Без ORDER BY строки возвращаются в алфавитном порядке первичного ключа, но этот порядок может различаться в разных СУБД.","База данных намеренно перемешивает строки для оптимизации кэша, поэтому порядок всегда случаен и не зависит от хранения.","Порядок строк определяется индексами таблицы — если индекс есть, строки всегда вернутся в одном и том же порядке без ORDER BY.","База данных возвращает строки в порядке физического хранения или обработки, который может меняться при каждом выполнении запроса — гарантированную сортировку обеспечивает только явный ORDER BY."],"c":3,"f":2},{"id":1488395539,"n":38,"t":"SQL и работа с данными","s":"Оператор LIKE и шаблоны поиска — фильтрация текстовых полей справочника продуктов по частичному совпадению наименования или кода","q":"Какой SQL-запрос отберёт из справочника продуктов все записи, где код начинается с 'PRD' и содержит '42' в любой позиции после?","a":["WHERE product_code LIKE 'PRD_42%' — символ подчёркивания заменяет ровно один символ, поэтому '42' должно стоять строго на четвёртой и пятой позиции кода","WHERE product_code LIKE '%PRD%42%' — процент в начале шаблона позволяет коду начинаться с любых символов до 'PRD', что нарушает условие строгого начала с 'PRD'","WHERE product_code LIKE 'PRD%42%' — процент заменяет любое количество символов до и после '42'.","WHERE product_code LIKE 'PRD%' AND product_code LIKE '%42' — второй шаблон ищет только окончание на '42', а не вхождение в любой позиции после 'PRD'"],"c":2,"f":3},{"id":536925047,"n":39,"t":"SQL и работа с данными","s":"LEFT JOIN — присоединение справочника категорий к таблице продуктов с сохранением записей без совпадений для подготовки измерения в отчёте","q":"Таблица Products содержит 100 записей, справочник Categories — 10 категорий. После LEFT JOIN по полю category_id в результате оказалось 110 строк. Что это означает?","a":["В справочнике Categories есть лишние категории без продуктов.","Некоторые продукты имеют дублирующиеся значения category_id в справочнике Categories — LEFT JOIN умножил строки. Нужно проверить уникальность ключа в справочнике.","Результат означает, что в таблице Products есть 10 записей с незаполненным category_id: LEFT JOIN сохранил их как отдельные строки с NULL-значениями из справочника, поэтому итог превысил исходные 100 строк.","LEFT JOIN добавил 10 строк для продуктов, у которых не нашлось совпадений в справочнике Categories — именно они создали лишние записи с NULL в полях категорий."],"c":1,"f":2,"e":"LEFT JOIN сохраняет каждую строку Products и может только размножить её при нескольких совпадениях. Рост со 100 до 110 строк значит, что часть category_id встречается в справочнике больше одного раза — ключ справочника не уникален.","u":1},{"id":992770562,"n":40,"t":"SQL и работа с данными","s":"Группировка по временным периодам - формирование аналитических срезов по кварталам, месяцам и годам с помощью функций работы с датами в SQL-запросах к DWH","q":"Как сгруппировать продажи по кварталам в SQL-запросе к DWH, используя стандартную функцию работы с датами?","a":["Для группировки по кварталам в DWH нужно применять TRUNC(sale_date, 'Q') в секции GROUP BY, так как функции EXTRACT и DATEPART предназначены только для фильтрации в WHERE и не поддерживаются в GROUP BY стандартом SQL","Использовать EXTRACT(QUARTER FROM date_column) или DATEPART(QUARTER, date_column) в GROUP BY: GROUP BY EXTRACT(YEAR FROM sale_date), EXTRACT(QUARTER FROM sale_date)","Использовать QUARTER(sale_date) в GROUP BY достаточно: GROUP BY QUARTER(sale_date) — функция автоматически учитывает год при группировке, поэтому отдельно извлекать год не требуется","GROUP BY DATEPART(QUARTER, sale_date) без года"],"c":1,"f":1,"e":"Номер квартала повторяется каждый год, поэтому группируют по паре «год + квартал»: EXTRACT(YEAR …) и EXTRACT(QUARTER …) (DATEPART — в SQL Server).","u":1},{"id":970778831,"n":41,"t":"SQL и работа с данными","s":"Типы JOIN-ов - практические различия между INNER, LEFT, RIGHT и FULL JOIN при объединении сущностей DWH с учётом возможного отсутствия связанных записей","q":"Почему LEFT JOIN предпочтительнее INNER JOIN при загрузке фактов из DWH, когда не все измерения могут быть заполнены?","a":["LEFT JOIN сохраняет все записи фактов даже при отсутствии связанной записи в таблице измерения, возвращая NULL вместо потери строки — INNER JOIN такие строки исключает, что приводит к неполным данным в отчёте.","LEFT JOIN гарантирует, что все записи из таблицы измерений будут сохранены, даже если для них нет соответствующих фактов.","INNER JOIN сохраняет все факты и заполняет NULL для отсутствующих измерений, тогда как LEFT JOIN отбрасывает строки без совпадений — поэтому LEFT JOIN применяют только для таблиц измерений, но не для фактов.","LEFT JOIN предпочтительнее, потому что он выполняется быстрее INNER JOIN за счёт отсутствия операции пересечения множеств — это критично при загрузке больших таблиц фактов в DWH, где производительность важнее полноты данных."],"c":0,"f":2},{"id":646764907,"n":42,"t":"SQL и работа с данными","s":"Типы JOIN-ов - практические различия между INNER, LEFT, RIGHT и FULL JOIN при объединении сущностей DWH с учётом возможного отсутствия связанных записей","q":"В отчёте Qlik Sense нужно показать всех клиентов из DWH, включая тех, у кого нет ни одной транзакции — какой тип JOIN следует использовать при соединении таблиц DIM_CUSTOMER и FACT_TRANSACTIONS?","a":["INNER JOIN: возвращает только клиентов с транзакциями, исключая пустые записи — это обеспечит чистоту данных в отчёте без NULL-значений.","FULL JOIN: он гарантирует полноту данных — все клиенты и все транзакции будут отображены, включая клиентов без транзакций.","LEFT JOIN: он возвращает все записи из левой таблицы (DIM_CUSTOMER) и совпадающие из правой (FACT_TRANSACTIONS); клиенты без транзакций получат NULL в полях фактов.","RIGHT JOIN от DIM_CUSTOMER: все клиенты будут включены, так как правая таблица сохраняет все записи при RIGHT JOIN."],"c":2,"f":3},{"id":982775893,"n":43,"t":"SQL и работа с данными","s":"Derived table в FROM - построение подзапросов в секции FROM для промежуточных агрегаций и расчёта долей категорий продуктов в общей выручке","q":"Почему при расчёте доли категории в выручке подзапрос с общей суммой выносят в FROM, а не повторяют в каждой строке SELECT?","a":["Чтобы общая сумма вычислялась один раз и переиспользовалась при делении, избегая повторного сканирования таблицы для каждой строки","Подзапрос в FROM обязателен для GROUP BY, иначе агрегатная функция не сможет корректно разбить данные по категориям","Чтобы избежать ошибки деления на ноль, которая возникает при вычислении SUM в основном SELECT","Потому что подзапрос в FROM позволяет использовать оконные функции, которые недоступны при вычислении агрегатов напрямую в SELECT без промежуточного слоя"],"c":0,"f":2,"e":"Подзапрос с общей суммой в FROM вычисляется один раз и присоединяется ко всем строкам, а не повторяется для каждой строки результата.","u":1},{"id":1201947368,"n":44,"t":"SQL и работа с данными","s":"Группировка по временным периодам - формирование аналитических срезов по кварталам, месяцам и годам с помощью функций работы с датами в SQL-запросах к DWH","q":"Почему при группировке по месяцам в DWH рекомендуется использовать числовой ключ вида YYYYMM вместо названия месяца?","a":["Числовой ключ YYYYMM занимает меньше места в хранилище и ускоряет агрегацию, так как целочисленные операции выполняются быстрее строковых, а оптимизатор запросов лучше строит планы выполнения для числовых полей при GROUP BY","Названия месяцев предпочтительнее в аналитических запросах, но числовой ключ используется для связи с таблицей измерения календаря в схеме звезда, где первичный ключ всегда должен быть целочисленным по стандарту Kimball","Числовой ключ обеспечивает корректную сортировку и однозначную идентификацию периода без привязки к локали, тогда как строковые названия месяцев сортируются лексикографически и могут различаться в зависимости от языковых настроек базы данных","Числовой формат рекомендуется исключительно из соображений совместимости с SAP BW, поскольку этот инструмент не поддерживает группировку по строковым полям с названиями месяцев в InfoCube и требует числовых ключей для корректной загрузки данных"],"c":2,"f":2},{"id":543247021,"n":45,"t":"SQL и работа с данными","s":"Общие табличные выражения (CTE) - использование конструкции WITH для декомпозиции сложных SQL-запросов к DWH на читаемые логические блоки","q":"Почему CTE обычно не улучшает производительность по сравнению с подзапросом?","a":["Оптимизатор разворачивает CTE в тот же план, что и подзапрос.","CTE кешируется в памяти","Оптимизатор не может использовать индексы внутри CTE, поэтому производительность снижается","CTE всегда материализует результат во временную таблицу, что увеличивает накладные расходы"],"c":0,"f":2},{"id":448260358,"n":46,"t":"SQL и работа с данными","s":"Агрегация с GROUP BY - управление уровнем детализации результирующего набора при выгрузке из DWH для соответствия требуемой гранулярности модели Qlik Sense","q":"В модели Qlik Sense требуется таблица фактов на уровне «день-склад-товар», но в DWH данные хранятся на уровне отдельных транзакций — какой SQL-запрос обеспечит нужную гранулярность?","a":["SELECT date_key, warehouse_id, product_id, SUM(quantity) AS total_qty, SUM(amount) AS total_amount FROM fact_transactions GROUP BY date_key, warehouse_id, product_id — агрегация через GROUP BY по ключевым измерениям сворачивает транзакционный уровень до нужной гранулярности, исключая дублирование строк в ассоциативной модели Qlik.","Гранулярность в Qlik Sense регулируется через настройки таблицы в Data Manager — GROUP BY в SQL избыточен, так как движок Qlik сам агрегирует дублирующиеся строки при построении ассоциативной модели без явной свёртки на уровне запроса.","SELECT date_key, warehouse_id, product_id, COUNT(*) AS total_qty, SUM(amount) AS total_amount FROM fact_transactions GROUP BY date_key, warehouse_id, product_id — COUNT(*) считает строки транзакций, а не суммирует количество товара, что даёт некорректную метрику объёма.","SELECT date_key, warehouse_id, product_id, SUM(quantity), SUM(amount) FROM fact_transactions — без GROUP BY запрос вернёт одну строку с итогами по всей таблице, полностью уничтожая детализацию по измерениям вместо агрегации до нужного уровня."],"c":0,"f":2},{"id":2013428812,"n":47,"t":"SQL и работа с данными","s":"Фильтрация по диапазону дат — использование BETWEEN и операторов сравнения для выгрузки транзакций за указанный период из DWH","q":"Почему BETWEEN включает граничные значения дат при фильтрации периода?","a":["BETWEEN автоматически добавляет один день к конечной дате, расширяя диапазон, поэтому транзакции на крайней дате попадают в выборку за счёт этого смещения","BETWEEN включает граничные значения только для числовых типов данных, а для дат поведение зависит от СУБД и формата хранения временной метки в таблице фактов DWH","BETWEEN использует исключающие границы (> начало AND < конец), поэтому граничные даты не входят в выборку, но визуально кажется, что они включены из-за округления времени","BETWEEN использует включающие границы (>= начало AND <= конец), поэтому транзакции на крайних датах попадают в выборку"],"c":3,"f":1},{"id":578195077,"n":48,"t":"SQL и работа с данными","s":"Псевдонимы полей и таблиц через AS — именование столбцов и сокращение ссылок на таблицы для читаемости запроса при выгрузке в Qlik Sense","q":"Почему нельзя обращаться к таблице по оригинальному имени после назначения псевдонима в блоке FROM/JOIN?","a":["Парсер ожидает псевдоним и не распознаёт оригинальное имя.","Псевдоним скрывает имя","После назначения псевдонима оригинальное имя таблицы временно удаляется из памяти сервера до конца сессии","Оригинальное имя блокируется на уровне прав доступа к схеме БД"],"c":0,"f":1},{"id":132578346,"n":49,"t":"SQL и работа с данными","s":"Агрегация с GROUP BY - управление уровнем детализации результирующего набора при выгрузке из DWH для соответствия требуемой гранулярности модели Qlik Sense","q":"Почему включение неагрегированного столбца в SELECT без указания его в GROUP BY вызывает ошибку в большинстве СУБД?","a":["Потому что для каждой группы существует множество значений этого столбца, и СУБД не может детерминированно определить, какое из них вернуть в результирующую строку — это нарушает реляционную согласованность агрегации.","Потому что неагрегированный столбец без GROUP BY нарушает порядок сортировки результата — СУБД не может гарантировать стабильный вывод строк, и для предотвращения случайного перемешивания данных запрос отклоняется ещё до фазы выполнения.","Потому что SQL-стандарт запрещает любые столбцы в SELECT, не участвующие в агрегатных функциях, поскольку такие столбцы технически дублируют данные и увеличивают размер результирующего набора, что противоречит принципу нормализации выходных данных.","Потому что оптимизатор запросов не может построить корректный план выполнения при смешивании агрегированных и неагрегированных столбцов — это приводит к конфликту индексов, и СУБД отклоняет запрос на этапе компиляции, защищая производительность."],"c":0,"f":3,"e":"В группе много строк с разными значениями такого столбца, и СУБД не знает, какое вернуть. Поэтому столбец должен быть в GROUP BY или внутри агрегата.","u":1},{"id":1238121962,"n":50,"t":"SQL и работа с данными","s":"Фильтрация данных в аналитических запросах - корректное применение WHERE и HAVING при работе с агрегированными и детальными данными из таблиц фактов DWH","q":"Почему фильтрация по агрегированн
