аменить построчный INSERT внутри цикла на BULK COLLECT + FORALL: собрать данные в коллекцию через BULK COLLECT LIMIT (например, по 1000 строк), затем выполнить FORALL ... INSERT. Это сократит переключения между PL/SQL и SQL-движком с 500 000 до ~500 раз."],"c":3,"e":"🚂 Цикл FOR с INSERT = 500 000 отдельных поездок между PL/SQL и SQL. BULK COLLECT + FORALL = один состав из 500 вагонов делает один рейс туда и один обратно. Разница в количестве 'context switch' (переключений между движками) — именно они тратят время."},{"id":94,"n":95,"t":"Oracle PL/SQL","s":"Пользовательские типы данных PL/SQL — создание объектных типов, коллекций (VARRAY, Nested Table, Associative Array) для обработки наборов данных в ETL-логике","q":"В ETL-процессе на Informatica PC нужно передать из PL/SQL-процедуры набор строк (id + name) как единый параметр — какой пользовательский тип данных Oracle оптимально использовать?","a":["Associative Array (INDEX BY PLS_INTEGER) — лучший вариант для передачи пар id+name, поскольку поддерживает прямую индексацию и быстрый bulk-доступ. Informatica PC автоматически маппирует ассоциативные массивы схемного уровня на входные параметры процедур.","VARRAY(1000) OF VARCHAR2(200) — оптимальный выбор, так как фиксированный размер обеспечивает предсказуемое потребление памяти, а Informatica PC лучше работает с типизированными массивами фиксированной длины при передаче параметров через Database Connection.","Достаточно использовать SYS_REFCURSOR как OUT-параметр процедуры — курсор передаёт набор строк целиком, поддерживается всеми версиями Informatica PC и не требует создания пользовательских типов на уровне схемы Oracle.","Объектный тип (CREATE TYPE obj_t AS OBJECT) + Nested Table (CREATE TYPE tbl_t AS TABLE OF obj_t). Nested Table позволяет передавать неограниченный набор записей как параметр процедуры, поддерживает SQL-операции (TABLE()) и удобна для bulk-обработки в ETL-логике, в отличие от VARRAY (фиксированный размер) или Associative Array (не поддерживается на уровне схемы)."],"c":2,"e":"🚿 SYS_REFCURSOR — как шланг: открыл, потёк поток данных. Informatica умеет 'подключаться' к курсору и читать строки из него. Не нужно создавать сложные объектные типы — курсорная переменная передаёт набор строк целиком через стандартный механизм."},{"id":95,"n":96,"t":"Oracle PL/SQL","s":"Представления (View) — разработка сложных view для слоёв Business Vault и Information Mart поверх Raw Vault: логика вычислений, агрегаций и Point-in-Time структур","q":"В Business Vault вам нужно построить Point-in-Time (PIT) таблицу для Hub_Customer, объединяющую снимки из нескольких сателлитов с разной частотой загрузки — какой ключевой механизм в SQL-логике PIT view гарантирует корректный «срез» актуальных записей каждого сателлита на произвольную дату?","a":["Используется коррелированный подзапрос или аналитическая функция MAX(load_date) с фильтром load_date <= snapshot_date по каждому сателлиту отдельно (LEFT JOIN с подзапросом на последний load_date ≤ дате среза). Это позволяет для каждой строки PIT-календаря найти максимальный load_date каждого сателлита, не превышающий дату снимка, и джойнить сателлит по hub_key + этому load_date, получая актуальную версию даже если сателлиты обновлялись асинхронно.","Ключевой механизм — фильтр WHERE load_date = snapshot_date по каждому сателлиту, что позволяет получить точную версию записи именно на указанную дату. Если запись с таким load_date отсутствует, сателлит возвращает NULL через LEFT JOIN.","Используется оконная функция FIRST_VALUE(load_date) с сортировкой по load_date DESC и фильтром в HAVING, гарантирующей минимально возможную дату, строго превышающую snapshot_date — это позволяет брать «следующую» версию записи, ближайшую к дате среза, что в Data Vault считается стандартным подходом для обеспечения forward-looking consistency в PIT-структурах.","Для PIT view применяется INNER JOIN всех сателлитов по единому глобальному load_date из управляющей таблицы расписаний — это гарантирует синхронный срез, поскольку Data Vault предполагает согласованную загрузку всех сателлитов в рамках одного batch window. Сателлиты с пропущенными датами просто исключаются из среза, что обеспечивает целостность данных. Коррелированные подзапросы не используются — они избыточны при наличии единого load_date во всех связанных объектах хранилища."],"c":3,"e":"⚠️ Правильный ответ в этом вопросе — коррелированный подзапрос или MAX(load_date) per satellite. PIT-view должен для каждой строки PIT-календаря найти максимальный load_date ≤ snapshot_date в каждом сателлите. INNER JOIN по глобальному load_date работает только при синхронной загрузке.","d":1,"x":0},{"id":96,"n":97,"t":"Oracle PL/SQL","s":"Последовательности (Sequence) — создание и применение sequence для генерации суррогатных ключей и технических идентификаторов в объектах Data Vault","q":"В Data Vault для Hub-таблицы используется sequence с CACHE 1000. При сбое базы данных в mid-load обнаружены gaps в суррогатных ключах. Как правильно настроить sequence, чтобы минимизировать gaps, сохранив производительность?","a":["Правильное решение — заменить sequence на генерацию ключей через SYS_GUID() или ROWNUM-based подход внутри INSERT-блока. Sequence принципиально не подходит для Data Vault, так как не обеспечивает детерминированность при параллельных загрузках. Gaps — признак архитектурной ошибки.","Gaps при сбое возникают из-за слишком маленького значения CACHE. Оптимальное решение — увеличить CACHE до 10000 и выше: чем больше кеш, тем меньше обращений к диску, а значит, sequence будет менее уязвим к сбоям. Дополнительно следует включить параметр CYCLE, чтобы sequence автоматически заполнял пропущенные значения после рестарта базы данных, восстанавливая непрерывность ключей в Hub-таблице.","Чтобы устранить gaps, необходимо переключить sequence на NOCACHE ORDER — это гарантирует строгую последовательность без пропусков. Да, производительность снизится из-за serialization, но в Data Vault суррогатные ключи должны быть непрерывными, поскольку по ним строится аудит загрузки и контроль полноты данных. Gaps в Hub-ключах означают потерю записей и нарушение целостности хранилища, поэтому производительность здесь вторична.","Полностью избежать gaps при кешировании невозможно — это допустимо в Data Vault, так как суррогатные ключи не несут бизнес-смысла. Для баланса: уменьшить CACHE (например, до 100) снизит потери при сбое, но ухудшит производительность. Альтернатива — NOCACHE с NOORDER, но это serialization bottleneck. Правильное решение: оставить разумный CACHE (20–100), задокументировать допустимость gaps в стандартах DWH, и не использовать sequence-значения как индикатор непрерывности загрузки — для этого использовать отдельные поля LOAD_DATE и RECORD_SOURCE."],"c":3,"e":"💾 NOCACHE ORDER — гарантирует строгую последовательность без пропусков. Но это serialization bottleneck при параллельной загрузке. Правда в том, что пропуски в суррогатных ключах Data Vault — допустимы, потому что ключи не несут бизнес-смысла. Уменьши CACHE до 20-100 как компромисс."},{"id":97,"n":98,"t":"Oracle PL/SQL","s":"Динамический SQL в PL/SQL — использование EXECUTE IMMEDIATE и DBMS_SQL для построения гибкой метауправляемой ETL-логики загрузки таблиц Data Vault","q":"В метауправляемой ETL-логике загрузки хабов Data Vault нужно динамически строить INSERT на основе метаданных. Какой механизм — EXECUTE IMMEDIATE или DBMS_SQL — предпочтительнее, если количество бизнес-ключей меняется для каждого хаба?","a":["EXECUTE IMMEDIATE предпочтительнее: через USING можно передавать массив bind-переменных типа VARRAY, что позволяет динамически менять их количество без перекомпиляции запроса.","DBMS_SQL предпочтительнее, но только для DDL-операций. Для DML с переменным числом бизнес-ключей корректнее использовать EXECUTE IMMEDIATE с конкатенацией значений напрямую в строку запроса, избегая bind-переменных.","DBMS_SQL избыточен — оба механизма одинаково поддерживают переменное число параметров, но EXECUTE IMMEDIATE проще в синтаксисе и быстрее выполняется за счёт нативной компиляции PL/SQL.","DBMS_SQL — позволяет передавать bind-переменные в цикле через DBMS_SQL.BIND_VARIABLE. EXECUTE IMMEDIATE требует явного перечисления всех аргументов в USING — синтаксис не допускает передачи переменного числа значений через массив или цикл."],"c":3,"e":"🔧 DBMS_SQL позволяет динамически добавлять bind-переменные в цикле через DBMS_SQL.BIND_VARIABLE. EXECUTE IMMEDIATE требует явно перечислить все аргументы в USING — нельзя передать произвольное количество. Для метауправляемой загрузки с разным числом ключей DBMS_SQL гибче."},{"id":98,"n":99,"t":"Oracle PL/SQL","s":"Структура анонимных и именованных блоков PL/SQL - секции DECLARE, BEGIN, EXCEPTION, END и порядок их применения при разработке по готовому шаблону","q":"В готовом шаблоне анонимного блока PL/SQL секция EXCEPTION присутствует, но обработчик не нужен — что следует сделать?","a":["Секцию EXCEPTION нельзя удалять — она обязательна в шаблоне, поэтому нужно оставить пустой блок между EXCEPTION и END без какого-либо содержимого.","Удалить секцию EXCEPTION полностью или оставить с заглушкой WHEN OTHERS THEN NULL, если шаблон это требует. Секция необязательна.","Если обработчик не нужен, следует написать WHEN OTHERS THEN RAISE, чтобы исключение пробрасывалось выше — это стандартная практика при работе с шаблонами в корпоративной разработке.","Оставить как есть — пустая EXCEPTION не влияет на компиляцию."],"c":1,"e":"🧹 EXCEPTION не обязательна в PL/SQL-блоке. Если обработка ошибок не нужна — просто удали секцию EXCEPTION. Оставить пустой нельзя (ошибка компиляции). Если по шаблону нужно что-то оставить — WHEN OTHERS THEN NULL (заглушка, которая молча игнорирует ошибки)."},{"id":99,"n":100,"t":"Oracle PL/SQL","s":"Коллекции и пользовательские типы PL/SQL - объявление TYPE как таблицы или записи для пакетной обработки строк в процессах загрузки DWH","q":"Почему при пакетной загрузке данных в DWH используют TYPE как таблицу (nested table или varray), а не построчную обработку через курсор?","a":["TYPE-таблицы быстрее курсоров из-за кеширования.","Коллекции типа nested table используются потому, что они хранят данные непосредственно в SGA (System Global Area), что исключает дисковый ввод-вывод при загрузке и позволяет Oracle автоматически распараллеливать операции вставки без дополнительных настроек параллелизма.","Пакетная обработка через коллекции позволяет передавать данные массивом за одно обращение к SQL-движку (BULK COLLECT/FORALL), тогда как построчный курсор переключается между PL/SQL и SQL на каждой строке, что создаёт значительные накладные расходы (context switch) и замедляет загрузку.","Построчная обработка через курсор создаёт избыточную нагрузку исключительно из-за блокировок на уровне строк (row-level locks), которые Oracle удерживает до конца транзакции — при использовании же коллекций блокировки применяются только в момент финального COMMIT, что существенно снижает конкуренцию за ресурсы и ускоряет загрузку в DWH."],"c":2,"e":"🚌 Курсор обрабатывает строки одну за одной — 100 000 поездок. Коллекция TYPE + BULK COLLECT загружает 100 000 строк за раз, FORALL вставляет их все одним DML-оператором. Переключений контекста: 100 000 → 1. Скорость — в разы выше."},{"id":100,"n":101,"t":"Oracle PL/SQL","s":"Курсоры PL/SQL - явные курсоры и курсорные FOR-циклы для построчной обработки данных при реализации несложных трансформаций","q":"Почему курсорный FOR-цикл предпочтительнее явного курсора с OPEN/FETCH/CLOSE?","a":["Явный курсор надёжнее, так как программист сам контролирует открытие и закрытие, исключая ошибки","FOR-цикл позволяет изменять данные курсора напрямую, тогда как OPEN/FETCH/CLOSE только читает записи","FOR-цикл работает быстрее, так как использует массовую выборку данных вместо построчной обработки","FOR-цикл автоматически открывает, читает и закрывает курсор, устраняя риск утечки ресурсов и сокращая количество кода"],"c":3,"e":"♻️ FOR-цикл с курсором делает три вещи автоматически: OPEN (открывает), FETCH (читает строки), CLOSE (закрывает). С явным курсором (OPEN/FETCH/CLOSE) всё нужно делать вручную. Забыл CLOSE — утечка ресурсов. FOR-цикл устраняет этот риск и сокращает код втрое."},{"id":101,"n":102,"t":"Oracle PL/SQL","s":"Функции PL/SQL - создание пользовательских функций, возвращающих скалярные значения, для вычисления хэш-ключей и бизнес-атрибутов в маппингах","q":"Вам нужно создать функцию PL/SQL для вычисления хэш-ключа Hub-таблицы в Data Vault на основе бизнес-ключа. Какой встроенный Oracle-инструмент следует использовать внутри функции?","a":["Функция UTL_RAW.CAST_TO_RAW(business_key) — преобразует бизнес-ключ в RAW-формат, что является стандартным способом генерации хэш-ключей для Hub-таблиц в Data Vault на Oracle.","Функция ORA_HASH(business_key) — возвращает числовой хэш и является рекомендуемым инструментом для вычисления хэш-ключей в Data Vault.","Пакет DBMS_UTILITY, функция GET_HASH_VALUE — она специально предназначена для хэширования строк в PL/SQL.","Пакет DBMS_CRYPTO или функция STANDARD_HASH (Oracle 12c+), например: STANDARD_HASH(business_key, 'MD5') — возвращает RAW-значение хэша бизнес-ключа."],"c":3,"e":"🔐 STANDARD_HASH(business_key, 'MD5') — встроенная Oracle-функция (12c+) для генерации хэшей. Возвращает RAW-значение, которое можно хранить в RAW(16) для MD5. Альтернатива: DBMS_CRYPTO.HASH. ORA_HASH — числовой хэш для внутренних нужд, не подходит для Data Vault."},{"id":102,"n":103,"t":"Oracle PL/SQL","s":"WHERE и HAVING — корректная фильтрация строк и агрегатов в одном аналитическом запросе","q":"Почему нельзя использовать WHERE для фильтрации результатов агрегатных функций?","a":["WHERE выполняется после GROUP BY, но не умеет читать сгруппированные данные — для этого нужен HAVING.","WHERE не поддерживает синтаксис агрегатных функций по стандарту SQL-92, поэтому база данных выдаёт синтаксическую ошибку. Для обхода этого ограничения нужно использовать HAVING, которое специально расширяет возможности WHERE для работы с агрегатами.","WHERE фильтрует строки ДО группировки и агрегации, поэтому агрегатные значения (SUM, COUNT и др.) ещё не вычислены на этом этапе выполнения запроса. HAVING применяется ПОСЛЕ GROUP BY, когда агрегаты уже рассчитаны.","WHERE фильтрует только числовые столбцы, а агрегатные функции возвращают специальный тип данных, несовместимый с оператором WHERE, поэтому для них предусмотрен отдельный синтаксис HAVING."],"c":2,"e":"⏱️ WHERE выполняется ДО GROUP BY: на этом этапе агрегат ещё не вычислен, он просто не существует. Нельзя фильтровать по тому, чего ещё нет. HAVING выполняется ПОСЛЕ GROUP BY: агрегаты уже посчитаны, теперь можно по ним фильтровать."},{"id":103,"n":104,"t":"Oracle PL/SQL","s":"Стратегии партиционирования — влияние range и list партиционирования на partition pruning при типичных паттернах запросов к таблицам фактов","q":"Таблица фактов продаж партиционирована по RANGE на столбце sale_date (по месяцам), но большинство запросов фильтруют данные по region_id. Какая стратегия партиционирования устранит полное сканирование таблицы в этом сценарии?","a":["Использовать составное (composite) партиционирование: RANGE по sale_date как основное (для retention/архивирования) + LIST по region_id как субпартиционирование. Это обеспечит pruning сразу по обоим предикатам. Альтернатива — пересмотреть ключ: если region_id доминирует в запросах, сделать LIST по region_id основным партиционированием.","Секционировать по HASH на region_id — это быстрее.","Добавить составной индекс (composite index) на столбцы (sale_date, region_id) — оптимизатор автоматически выполнит index pruning вместо partition pruning, что даст аналогичный прирост производительности без изменения схемы партиционирования. Перестройка партиций избыточна, если статистика таблицы актуальна.","Переключиться на LIST-партиционирование исключительно по region_id, полностью отказавшись от RANGE по sale_date. Поскольку большинство запросов фильтруют по region_id, именно он должен быть единственным ключом партиционирования. Составное партиционирование создаёт избыточную сложность администрирования и не даёт значимого преимущества перед простым LIST, так как оптимизатор всё равно применяет pruning по ведущему ключу."],"c":0,"e":"🗂️ Если 90% запросов фильтруют по region_id, а таблица партиционирована только по дате — придётся читать все партиции (full scan). Составное партиционирование RANGE(date) + LIST(region_id) = pruning работает по обоим измерениям. Запрос читает только нужные date-диапазоны и регионы."},{"id":104,"n":105,"t":"Oracle PL/SQL","s":"JOIN-ы — механика INNER, LEFT, FULL OUTER JOIN и корректное их применение при загрузке данных в DWH-слои","q":"При загрузке данных в хаб Data Vault из двух источников (source_a и source_b) с частично пересекающимися ключами — какой тип JOIN следует использовать, чтобы не потерять бизнес-ключи ни из одного источника?","a":["FULL OUTER JOIN — он сохраняет записи из обоих источников, включая те, у которых нет пары. После этого применяется COALESCE для объединения ключей в единый business key.","LEFT JOIN от source_a как основного источника достаточно, если source_b считается второстепенным; бизнес-ключи из source_b, отсутствующие в source_a, всё равно появятся через отдельную инкрементальную загрузку в следующем ETL-цикле.","INNER JOIN — оптимальный выбор для загрузки в хаб, так как он гарантирует наличие бизнес-ключа в обоих источниках, исключая «мусорные» записи, а пропущенные ключи добавляются позднее через процедуру reconciliation.","FULL OUTER JOIN применяется, но без COALESCE — вместо этого нужно создать два отдельных потока INSERT для каждого источника и объединить их через UNION ALL, что даёт более прозрачную трассировку происхождения каждого бизнес-ключа в хабе."],"c":0,"e":"🌐 FULL OUTER JOIN берёт ВСЕ строки из ОБА источников: совпавшие — объединяет, несовпавшие — добавляет с NULL с другой стороны. COALESCE(a.key, b.key) объединяет ключи в единый business key. Это единственный способ не потерять ни одного бизнес-ключа при интеграции двух источников."},{"id":105,"n":106,"t":"Oracle PL/SQL","s":"Коррелированные подзапросы — механика выполнения, стоимость повторных вычислений и переписывание на JOIN или оконные функции с обоснованием выбора","q":"В хранилище Data Vault таблица satellites содержит 50 млн строк. Запрос с коррелированным подзапросом для получения последней версии записи по каждому hub_id выполняется 40 минут. Как его переписать для оптимизации?","a":["Переписать через DENSE_RANK() OVER (PARTITION BY hub_id ORDER BY load_date DESC), отфильтровав rank=1. В отличие от ROW_NUMBER(), DENSE_RANK корректно обрабатывает дубли load_date в Data Vault, где несколько записей могут иметь одинаковую дату загрузки.","Добавить индекс на hub_id и load_date — коррелированный подзапрос начнёт использовать index seek вместо full scan, что сократит повторные вычисления с O(N²) до O(N log N) без переписывания логики.","Заменить на JOIN с подзапросом MAX(load_date) GROUP BY hub_id — это эквивалентно ROW_NUMBER(), но быстрее, так как агрегация MAX требует меньше памяти и не строит промежуточных партиций, что критично для 50 млн строк.","Заменить коррелированный подзапрос на оконную функцию ROW_NUMBER() OVER (PARTITION BY hub_id ORDER BY load_date DESC), отфильтровав rn=1. Это устраняет повторное выполнение подзапроса для каждой строки (N раз), заменяя его одним проходом по данным с сортировкой внутри партиций."],"c":3,"e":"🏎️ ROW_NUMBER() OVER(PARTITION BY hub_id ORDER BY load_date DESC) = 1 — один проход по всем 50 млн строк, вычисляет номер строки внутри каждой партиции. Коррелированный подзапрос — для каждой из 50 млн строк запускает отдельный подзапрос. Разница: 1 проход vs 50 млн проходов."},{"id":106,"n":107,"t":"Oracle PL/SQL","s":"Стратегии партиционирования — влияние range и list партиционирования на partition pruning при типичных паттернах запросов к таблицам фактов","q":"Почему list-партиционирование по дискретному атрибуту (например, region_id) обеспечивает более точный partition pruning, чем range-партиционирование по тому же столбцу?","a":["При list-партиционировании оптимизатор точно сопоставляет предикат '= value' с единственной партицией, тогда как range вынужден проверять границы интервалов и может захватывать лишние партиции, если значения распределены неравномерно или запрос использует IN-список, охватывающий несколько диапазонов.","List-партиционирование обеспечивает более точный pruning, потому что хранит значения в отсортированном порядке внутри каждой партиции, что позволяет оптимизатору использовать бинарный поиск по метаданным и быстрее исключать нерелевантные партиции. Range-партиционирование такой сортировки не гарантирует, поэтому сканирует больше партиций при точечных запросах.","Range-партиционирование по дискретному атрибуту хуже только при запросах с BETWEEN, а при использовании предиката «= value» оба метода дают одинаково точный pruning, поскольку оптимизатор в обоих случаях обращается к одной партиции.","List-партиционирование точнее, так как физически исключает дубликаты значений между партициями на уровне хранилища, тогда как range допускает пересечение границ при неточном определении интервалов, что вынуждает оптимизатор читать соседние партиции для проверки целостности данных."],"c":0,"e":"📦 LIST-партиционирование: 'region_id=5 → партиция 5, и только она'. Точное сопоставление. RANGE-партиционирование: 'region_id между 1 и 10 → может быть несколько партиций'. Для дискретных атрибутов типа region_id LIST даёт более точный pruning и гарантированно читает одну партицию."},{"id":107,"n":108,"t":"Oracle PL/SQL","s":"CTE и вложенные подзапросы — архитектура многоуровневых WITH-выражений, материализация CTE и влияние на производительность сложных аналитических SELECT","q":"Почему многократное обращение к одному CTE может приводить к повторному выполнению его подзапроса?","a":["Повторное выполнение происходит потому, что SQL-движок не отслеживает зависимости между обращениями к CTE и не может гарантировать идемпотентность подзапроса без его повторного запуска.","Если CTE инлайнится оптимизатором, его логика разворачивается в каждой точке обращения без материализации.","CTE всегда материализуется при первом обращении, но кэш результата автоматически инвалидируется при каждом повторном вызове из-за потенциальных side-эффектов.","CTE всегда кэшируется и материализуется при первом вызове — повторные обращения к нему используют сохранённый результат без повторного выполнения подзапроса."],"c":1,"e":"🔄 В PostgreSQL 11 CTE материализуется: вычисляется один раз и результат хранится. Если оптимизатор решает 'инлайнить' CTE (не материализовать) — он разворачивает логику в каждой точке использования, что может привести к повторным вычислениям при нескольких обращениях."},{"id":108,"n":109,"t":"Oracle PL/SQL","s":"Фильтрация данных - разница между WHERE и HAVING при фильтрации строк и агрегированных значений","q":"Почему HAVING не может заменить WHERE при фильтрации строк до агрегации?","a":["HAVING фильтрует строки после сортировки ORDER BY, поэтому не имеет доступа к исходным данным таблицы — WHERE же работает напрямую с индексами, что делает его единственно возможным для фильтрации по столбцам таблицы.","HAVING не может заменить WHERE только потому, что синтаксически запрещено использовать HAVING без GROUP BY, тогда как WHERE работает в любом запросе, включая те, где группировка отсутствует.","HAVING применяется после группировки и агрегации, поэтому не видит исходные строки — WHERE фильтрует их до агрегации, что эффективнее и семантически верно.","HAVING может заменить WHERE, но работает медленнее, так как сначала загружает все строки в память, а затем фильтрует уже готовый результат — это вопрос производительности, а не семантики."],"c":2,"e":"⏰ HAVING живёт 'после GROUP BY'. Строки до группировки HAVING не видит. WHERE живёт 'до GROUP BY'. HAVING не может заменить WHERE просто потому что не имеет доступа к исходным строкам — они уже 'исчезли' в агрегаты. Каждый инструмент на своём месте."},{"id":109,"n":110,"t":"Oracle PL/SQL","s":"Фильтрация данных - применение HAVING для отбора групп с агрегированными показателями выше заданного порога","q":"Напишите SQL-запрос, который возвращает hub-таблицы схемы DWH с количеством строк более 10 000, используя системное представление information_schema.tables.","a":["SELECT table_name, row_count FROM information_schema.tables WHERE table_schema = 'dwh' AND table_name LIKE 'hub%' HAVING row_count > 10000;","SELECT table_name FROM information_schema.tables WHERE table_name LIKE 'hub%' AND row_count < 10000;","SELECT t.table_name, t.row_count FROM information_schema.tables t WHERE t.table_schema = 'dwh' AND t.table_name LIKE '%hub' GROUP BY t.table_name, t.row_count HAVING t.row_count > 10000;","SELECT table_name, row_count FROM information_schema.tables WHERE table_schema = 'dwh' AND table_name LIKE 'hub%' AND row_count > 10000;"],"c":3,"e":"📊 row_count — это столбец в information_schema.tables. Условие row_count > 10000 можно вставить прямо в WHERE — это обычный фильтр по столбцу, а не агрегатное условие. HAVING нужно только когда фильтруешь по результату COUNT(*), SUM() и т.п. из GROUP BY."},{"id":110,"n":111,"t":"Модели данных DWH","s":"Разграничение компонентов Data Vault — логика разделения ключей, связей и атрибутов между hub, link и satellite","q":"Почему бизнес-ключи хранятся в hub, а не в satellite?","a":["Бизнес-ключи стабильны и неизменны — их вынесение в hub обеспечивает единую точку идентификации сущности без дублирования при изменении атрибутов, которые версионируются в satellite.","Satellite предназначены исключительно для хранения исторических изменений описательных атрибутов, поэтому бизнес-ключи технически невозможно разместить в satellite — их структура не поддерживает уникальные идентификаторы без дополнительных суррогатных ключей.","Бизнес-ключи хранятся в hub, потому что они чаще всего изменяются, и централизованное хранение упрощает их версионирование без необходимости обновлять связанные satellite-таблицы.","Hub хранит ключи для ускорения JOIN-операций."],"c":0,"e":"🏦 Hub — центральный реестр бизнес-ключей (как СНИЛС или ИНН). Ключи стабильны и не меняются. Если держать их в Satellite — пришлось бы при каждом изменении атрибута 'находить' ключ через версионирование. В Hub ключ хранится один раз навсегда — единая точка правды."},{"id":111,"n":112,"t":"Модели данных DWH","s":"Дедупликация в Data Vault - стратегии обработки дублирующихся business key при интеграции данных из разнородных источников","q":"Почему в Data Vault дедупликация business keys выполняется на уровне staging, а не в Hub?","a":["Hub не имеет механизма сравнения входящих записей с уже загруженными, поэтому любой дубликат автоматически создаёт новую запись с новым hash key, что приводит к разрыву связей в Satellite и Link таблицах; staging предотвращает это, фильтруя записи ещё до генерации суррогатных ключей и тем самым сохраняя целостность всей модели.","Hub должен хранить только уникальные BK с первой датой загрузки — повторная вставка дубликата нарушит идемпотентность и исказит историю появления сущности в системе; staging изолирует грязные данные источника до их попадания в модель.","Hub — только для уникальных ключей, staging слишком медленная для этого.","Дедупликация выполняется в staging, потому что Hub не поддерживает составные ключи и технически не способен обрабатывать коллизии business keys из разных источников — это ограничение архитектуры Data Vault 1.0, устранённое только в версии 2.0."],"c":1,"e":"🚪 Hub — как вахтёр: проверяет, есть ли уже такой business key. Если ETL пускает дубль прямо в Hub — вахтёр либо пропустит (нарушение уникальности), либо создаст дубль. Staging-слой — предварительная проверка: дедупликация происходит ДО попытки вставки в Hub."},{"id":112,"n":113,"t":"Модели данных DWH","s":"Link-таблицы Data Vault - проектирование same-as link и иерархических link для моделирования нетривиальных доменных связей","q":"Почему Same-As Link в Data Vault хранит суррогатные ключи двух хабов одного типа, а не объединяет их в один хаб?","a":["Потому что хранение двух суррогатных ключей ускоряет ETL-процессы: при загрузке данных система сразу знает, в какой хаб направить запись, не выполняя дополнительных JOIN-операций для определения эквивалентности между источниками.","Чтобы сохранить исходные бизнес-ключи из разных систем без потери источника происхождения, фиксируя факт эквивалентности как отдельную бизнес-связь, а не физическое слияние записей.","Потому что объединение хабов одного типа нарушает принцип атомарности Data Vault: каждый хаб должен содержать только уникальные бизнес-ключи из одного источника, а слияние привело бы к дублированию записей и коллизиям суррогатных ключей.","Потому что Same-As Link технически не может ссылаться на один и тот же хаб дважды из-за ограничений реляционных СУБД на внешние ключи — поэтому создаются два отдельных хаба с идентичной структурой для обхода этого ограничения базы данных."],"c":1,"e":"🪞 SAL — 'зеркальный' Link между двумя записями одного Hub. 'COMP-001' (CRM) и 'C001' (ERP) — разные ключи, разные записи в Hub, но указывают на одну реальную компанию. SAL фиксирует факт эквивалентности, сохраняя оба ключа в исходном виде."},{"id":113,"n":114,"t":"Модели данных DWH","s":"Business Key в Data Vault - определение, выбор и корректное заполнение в hub-таблицах","q":"В HUB_CUSTOMER поступают '00123' и '123' из одного источника — это проблема качества данных или два разных ключа?","a":["Проблема качества данных в источнике: нужна нормализация до загрузки в Hub.","Это два разных Business Key — Hub хранит их оба как уникальные записи","Источник всегда прав","Data Vault допускает хранение обоих значений, нормализация выполняется в Satellite-таблицах при добавлении атрибутов"],"c":1,"e":"🏷️ '00123' и '123' — разные строки. Hub не нормализует бизнес-ключи — он хранит их как есть. Это может быть проблема качества данных в источнике, но с точки зрения Data Vault — это два разных ключа, два разных объекта. Нормализация — задача staging, не Hub."},{"id":114,"n":115,"t":"Модели данных DWH","s":"Link-таблицы Data Vault - структура, foreign surrogate keys и правила создания между hub-таблицами","q":"Почему link-таблица хранит surrogate keys из hub-таблиц, а не бизнес-ключи напрямую?","a":["Surrogate keys нужны только для совместимости с legacy-системами, которые не поддерживают строковые ключи в JOIN-операциях между таблицами.","Бизнес-ключи слишком длинные для хранения в link-таблицах, поэтому surrogate keys используются исключительно для экономии дискового пространства в хранилище.","Бизнес-ключи хранятся в link-таблицах напрямую, а surrogate keys добавляются лишь как дополнительный индекс для ускорения выборок в отчётах.","Surrogate keys обеспечивают стабильные связи между хабами независимо от изменений бизнес-ключей, снижают дублирование данных и ускоряют JOIN-операции за счёт числовых идентификаторов вместо составных строковых ключей."],"c":3,"e":"🔗 Surrogate key (хэш) — стабильный внутренний идентификатор. Если завтра источник изменит формат business key ('CUST-001' → '1'), хэш в Link останется прежним, связь не сломается. Хранить business key напрямую в Link — риск, что при изменении ключа все связи нужно переписывать."},{"id":115,"n":116,"t":"SQL","s":"Record Source в Data Vault - назначение поля, форматы значений и правила заполнения по стандарту команды","q":"Источник данных — SAP ERP, загрузка через Informatica PC. Как выглядит RECORD_SOURCE по стандарту команды?","a":["sap_erp.informatica.orders — система, инструмент и объект, но в нижнем регистре","SAP_ERP.INFORMATICA.ORDERS — система, инструмент загрузки и объект, верхний регистр, без пробелов.","INFORMATICA.SAP_ERP.ORDERS — инструмент загрузки ставится первым, затем система и объект","SAP_ERP.ORDERS — только система и объект без указания инструмента загрузки"],"c":1,"e":"📋 RECORD_SOURCE = 'SAP_ERP.ORDERS' по стандарту команды: [СИСТЕМА].[ОБЪЕКТ]. Без инструмента загрузки (Informatica) — он может меняться, а источник данных остаётся SAP ERP. Формат: система.объект, в верхнем регистре, через точку.","d":1,"x":3},{"id":116,"n":117,"t":"Модели данных DWH","s":"Разграничение компонентов Data Vault — логика разделения ключей, связей и атрибутов между hub, link и satellite","q":"В системе есть сущность «Клиент» с полями: customer_id, name, email, phone, created_date — в какой компонент Data Vault поместить поле email?","a":["Email — изменяемый атрибут, размещается в Satellite. Hub хранит только business key (customer_id), Link — связи между сущностями.","Email — стабильное контактное поле, поэтому его размещают в Hub: Satellite нужен только для часто меняющихся данных вроде статуса или баланса.","Email — уникальный идентификатор клиента, поэтому он помещается в Hub вместе с customer_id как дополнительный бизнес-ключ для поиска записей.","Email хранится в Link, так как связывает клиента с коммуникационным каналом и отражает отношение между сущностями."],"c":0,"e":"📧 Email — атрибут клиента, который может меняться (человек сменил почту). Hub хранит только стабильный бизнес-ключ (customer_id). Email — изменяемый атрибут → Satellite. Если email стал бизнес-ключом для поиска клиентов — только тогда он попадает в Hub."},{"id":117,"n":118,"t":"Oracle PL/SQL","s":"Обработка исключений PL/SQL — проектирование стратегий обработки ошибок в процессах загрузки DWH: пользовательские исключения, PRAGMA EXCEPTION_INIT, логирование ошибок","q":"Почему PRAGMA EXCEPTION_INIT необходимо объявлять до секции BEGIN, а не внутри обработчика исключений?","a":["PRAGMA EXCEPTION_INIT должна быть в секции объявлений, потому что PL/SQL-движок обрабатывает исключения последовательно сверху вниз, и если директива встретится после BEGIN, она будет проигнорирована интерпретатором без выдачи ошибки компиляции, что приведёт к молчаливому сбою в рантайме.","Ограничение связано с областью видимости переменных: исключение, объявленное в DECLARE, имеет область видимости всего блока включая EXCEPTION-секцию, тогда как директива PRAGMA EXCEPTION_INIT внутри BEGIN имела бы локальную область видимости только до ближайшего вложенного блока, что делало бы привязку ORA-кода ненадёжной при вложенных вызовах процедур.","PRAGMA EXCEPTION_INIT — директива компилятора: она связывает пользовательскую переменную-исключение с ORA-кодом на этапе компиляции, до выполнения кода. Внутри BEGIN директивы компилятора недопустимы — там только исполняемые операторы.","PRAGMA EXCEPTION_INIT технически можно разместить внутри блока BEGIN, однако Oracle рекомендует секцию DECLARE из соображений читаемости и стандартизации кода: при нахождении директивы внутри исполняемого блока она работает только для исключений, возникающих после строки с PRAGMA, но не для предшествующих операторов."],"c":2,"e":"🔨 PRAGMA — директива компилятора, как команда #include в C++. Она обрабатывается на этапе компиляции, до выполнения кода. В секции BEGIN компилятор ждёт исполняемые операторы, а не директивы. PRAGMA EXCEPTION_INIT должна быть в DECLARE, чтобы Oracle знал об исключении до начала блока."},{"id":118,"n":119,"t":"Oracle PL/SQL","s":"Последовательности (SEQUENCE) - создание и применение последовательностей для генерации суррогатных ключей в объектах хранилища данных","q":"Почему суррогатные ключи в DWH, генерируемые через SEQUENCE, не гарантируют отсутствие пропусков в значениях?","a":["SEQUENCE намеренно пропускает значения для обеспечения уникальности в RAC-среде, резервируя диапазоны для каждого узла.","Пропуски образуются потому, что при параллельных вставках Oracle автоматически пропускает уже занятые значения, проверяя уникальность по индексу первичного ключа.","Пропуски возникают из-за того, что SEQUENCE использует алгоритм round-robin при распределении значений между сессиями, и часть диапазонов резервируется как буфер для предотвращения конкурентных блокировок, но никогда не выдаётся конечным транзакциям.","SEQUENCE кэширует блоки значений (CACHE) в памяти каждого экземпляра; при откате транзакции или перезапуске БД закэшированные, но неиспользованные значения теряются безвозвратно, образуя пропуски."],"c":3,"e":"💸 Sequence с CACHE 1000 зарезервировал значения 1001-2000 в памяти. БД упала на значении 1050. При перезапуске — всё ещё не использованные 1051-2000 потеряны. Следующее значение начнётся с 2001. Gaps (1051-2000) безвозвратны. При NOCACHE — нет резерва в памяти, нет потерь."},{"id":119,"n":120,"t":"Oracle PL/SQL","s":"Курсоры и обработка наборов данных — явные курсоры, REF CURSOR, BULK COLLECT и FORALL для эффективной пакетной обработки данных при загрузке в DWH","q":"Почему FORALL выполняет DML значительно быстрее, чем цикл FOR с одиночными операциями?","a":["FORALL передаёт весь массив данных одним context switch между PL/SQL и SQL движками, устраняя многократные переключения контекста, которые и создают основные накладные расходы при построчной обработке.","FORALL быстрее цикла FOR потому, что он полностью обходит механизм транзакций Oracle и буферный кэш при записи данных, напрямую взаимодействуя с сегментами данных на диске, что устраняет накладные расходы на управление undo-сегментами и redo-логами для каждой отдельной строки.","FORALL работает быстрее, потому что автоматически распараллеливает выполнение DML-операций между несколькими потоками Oracle, позволяя базе данных обрабатывать части массива одновременно, что значительно сокращает общее время выполнения при больших объёмах данных.","FORALL оптимизирует производительность за счёт того, что PL/SQL движок предварительно компилирует все DML-операции в единый оптимизированный план выполнения, который Oracle кэширует и переиспользует для каждого элемента коллекции, избегая повторного разбора SQL-запросов при каждой итерации цикла."],"c":0,"e":"🚀 Цикл FOR с INSERT = 500 000 'телефонных звонков' между PL/SQL и SQL. FORALL = один звонок, но сразу отправляешь 500 000 задач. Context switch (переключение контекста) занимает время. Один большой вызов вместо тысяч маленьких — принципиальный выигрыш в скорости."},{"id":120,"n":121,"t":"Oracle PL/SQL","s":"Sequence в Oracle - создание и использование последовательностей (CREATE SEQUENCE, NEXTVAL, CURRVAL) для генерации суррогатных ключей в таблицах DWH","q":"Почему NEXTVAL возвращает новое значение при каждом обращении, даже если транзакция была откатана?","a":["Sequence живёт вне транзакций: INCREMENT происходит на уровне системы и не откатывается вместе с DML-операциями, чтобы гарантировать уникальность значений.","Это поведение настраивается параметром NOCYCLE — без него последовательность не откатывает значения, с ним — откатывает.","Sequence кэширует значения в памяти заранее, и при откате транзакции использованное значение просто теряется из кэша без возврата.","NEXTVAL автоматически фиксирует мини-транзакцию (autonomous transaction), поэтому откат основной транзакции не влияет на уже выданное значение."],"c":0,"e":"🔢 Sequence — это счётчик вне транзакций. Как счётчик посещений на сайте: даже если посетитель ушёл (транзакция откатилась), счётчик уже увеличился. Это сделано специально для уникальности: если позволить откат, два потока могли бы получить одинаковый номер."},{"id":121,"n":122,"t":"Oracle PL/SQL","s":"Переменные и типы данных PL/SQL - объявление и использование скалярных переменных, констант и якорных типов (%TYPE, %ROWTYPE) в блоках ETL-процессов","q":"В ETL-процессе нужно объявить переменную для хранения значения поля SALARY из таблицы EMPLOYEES, чтобы тип автоматически подстраивался под структуру таблицы — какой синтаксис использовать?","a":["v_salary NUMBER := EMPLOYEES.SALARY%TYPE; — тип столбца присваивается через инициализацию переменной","v_salary EMPLOYEES%ROWTYPE.SALARY; — якорный тип %ROWTYPE позволяет обращаться к отдельным полям строки таблицы через точечную нотацию","v_salary%TYPE := EMPLOYEES.SALARY; — якорный тип объявляется через %TYPE после имени переменной с указанием источника справа","v_salary EMPLOYEES.SALARY%TYPE; — якорный тип привязывает переменную к типу конкретного столбца таблицы."],"c":3,"e":"🧩 v_salary EMPLOYEES.SALARY%TYPE — переменная наследует тип поля SALARY из таблицы EMPLOYEES. Если DBA изменит SALARY с NUMBER(10,2) на NUMBER(15,4) — переменная автоматически получит новый тип при следующей компиляции процедуры. Без %TYPE — нужно вручную искать и менять везде."},{"id":122,"n":123,"t":"Oracle PL/SQL","s":"Переменные и типы PL/SQL - объявление скалярных переменных, записей (RECORD) и коллекций (TABLE, VARRAY) для промежуточной обработки данных хранилища","q":"Почему при объявлении коллекции типа TABLE OF в PL/SQL её необходимо инициализировать перед добавлением элементов, тогда как для VARRAY это правило одинаково обязательно?","a":["Инициализация нужна из-за ограничений памяти PGA: без конструктора PL/SQL не резервирует сегмент под коллекцию. Для VARRAY размер фиксирован при объявлении, поэтому память выделяется автоматически, но конструктор всё равно нужен для установки COUNT=0.","Оба типа (nested table и VARRAY) являются объектами и по умолчанию имеют значение NULL — не пустую коллекцию, а именно NULL. Без вызова конструктора (например, my_type()) обращение к элементам вызовет исключение ORA-06531 (Reference to uninitialized collection), поскольку объект не существует в памяти.","Коллекции TABLE OF требуют инициализации, потому что Oracle не знает тип элементов до первого вызова конструктора. VARRAY тип фиксирован при компиляции, поэтому Oracle создаёт пустой объект автоматически и инициализация необязательна.","Инициализация обязательна только для nested table, так как она хранится в отдельной таблице БД. VARRAY хранится inline и автоматически создаётся как пустой массив при объявлении, поэтому для него инициализация через конструктор не требуется."],"c":1,"e":"📭 Nested Table и VARRAY — объекты Oracle. По умолчанию они NULL (как несуществующий почтовый ящик). Перед использованием нужно 'создать ящик': my_collection := my_type(). Без инициализации обращение к коллекции вызовет ORA-06531. Это не опционально — это обязательно для обоих типов."},{"id":123,"n":124,"t":"Informatica PC","s":"Трансформация Router — маршрутизация потоков данных по условиям и формирование различных наборов атрибутов через Expression в каждой ветке","q":"В маппинге Informatica PC есть Router с тремя группами: VIP-клиенты, стандартные клиенты и группа Default. В ветке VIP через Expression добавляется атрибут DISCOUNT_RATE = 0.2, в ветке стандартных — DISCOUNT_RATE = 0.05. Запись клиента не попала ни в одну из именованных групп. Какое значение DISCOUNT_RATE получит эта запись?","a":["Запись попадёт в Default-группу и унаследует DISCOUNT_RATE = 0.05, так как Default автоматически применяет параметры последней именованной группы Router в качестве значения по умолчанию.","Запись вообще не будет обработана и потеряется: Default-группа Router существует только как технический маршрут для логирования отклонённых строк, и без подключённого target-объекта такие записи молча отбрасываются движком Integration Service.","Запись попадёт в Default-группу, но маппинг завершится ошибкой — Informatica PC требует явного указания Expression-трансформации для Default-группы, иначе сессия падает с ошибкой несоответствия схемы выходных портов.","Запись попадёт в Default-группу. DISCOUNT_RATE будет NULL, так как Default-группа Router передаёт порты без изменений, не поддерживая собственную Expression-логику."],"c":3,"e":"🚦 Default-группа Router — запасной выход. Если запись не подошла ни к одному условию именованных групп, она уходит в Default. DISCOUNT_RATE там NULL, потому что Default не имеет своей Expression-логики — он просто передаёт поля без изменений. Expression-трансформер подключается к именованным веткам."},{"id":124,"n":125,"t":"Informatica PC","s":"Оптимизация производительности mapping при обработке больших объёмов данных — предварительная сортировка потока перед Aggregator, настройка параметров сессии и выбор стратегии кэширования","q":"В mapping с Aggregator, обрабатывающем 500 млн записей, наблюдается высокое использование диска из-за spill файлов — какую настройку следует изменить в первую очередь?","a":["Сначала увеличить 'Session Log Level' до verbose для анализа spill файлов, затем перераспределить разделы в Source Qualifier","Увеличить 'Aggregator Data Cache Size' до максимального значения и отключить 'Sorted Input' — это позволит Aggregator самостоятельно управлять сортировкой без лишних накладных расходов на предварительную обработку данных","Включить 'Sorted Input' и уменьшить размер кэша — меньший кэш снизит нагрузку на память и устранит spill файлы","Сначала включить 'Sorted Input' (при предварительно отсортированных данных) — это снизит объём кэша. Затем увеличить 'Aggregator Data Cache Size' и 'Index Cache Size'."],"c":3,"e":"🧊 Spill-файлы появляются когда кэш Aggregator'а переполнен и данные 'выливаются' на диск. Решение: включи Sorted Input (данные приходят отсортированными по group by ключу → Aggregator обрабатывает группы одну за другой и освобождает память) + увеличь кэш если нужно."},{"id":125,"n":126,"t":"Informatica PC","s":"Трансформация Lookup в Informatica PowerCenter — обогащение входящего потока данных справочными значениями по ключевому полю","q":"В маппинге Informatica PowerCenter нужно обогатить поток заказов названием продукта из таблицы-справочника по PRODUCT_ID — какую трансформацию следует использовать?","a":["Трансформацию Filter с условием PRODUCT_ID IS NOT NULL — она автоматически подтягивает связанные значения из указанной таблицы-справочника и добавляет их в поток данных.","Трансформацию Router: направить поток по PRODUCT_ID в нужную ветку.","Трансформацию Joiner: подключить справочную таблицу как pipeline source, настроить Join Condition по PRODUCT_ID и выбрать тип Full Outer Join для получения названия продукта.","Трансформацию Lookup: подключить справочную таблицу, задать Lookup Condition по PRODUCT_ID, вернуть нужное поле названия продукта в поток."],"c":3,"e":"🔭 Lookup-трансформация в Informatica — это подстановка по ключу: 'у меня PRODUCT_ID=123, скажи мне PRODUCT_NAME из справочника'. Подключаешь таблицу-справочник, задаёшь условие (PRODUCT_ID = PRODUCT_ID), выбираешь поля для возврата — и готово. Это стандартное обогащение потока."},{"id":126,"n":127,"t":"Informatica PC","s":"Satellite-таблицы — структура и назначение полей для хранения атрибутов hub и link сущностей","q":"В satellite-таблице для hub 'Клиент' какой минимальный набор служебных полей обязателен по классическому Data Vault (Linstedt)?","a":["HASH_KEY (ссылка на hub), LOAD_DATE (дата загрузки), RECORD_SOURCE (источник), HASH_DIFF (хэш атрибутов) и SURROGATE_KEY (суррогатный ключ satellite) — обязательный первичный ключ таблицы по стандарту Линстедта","HASH_KEY (ссылка на hub), LOAD_DATE (дата загрузки), RECORD_SOURCE (источник), HASH_DIFF (хэш атрибутов для выявления изменений).","HASH_KEY (ссылка на hub), LOAD_DATE (дата загрузки), RECORD_SOURCE (источник), END_DATE (дата окончания действия записи) — для отслеживания актуальности атрибутов","HASH_KEY, LOAD_DATE, END_DATE"],"c":2,"e":"🏗️ Минимальный состав Satellite по Линстедту: HASH_KEY (внешний ключ на Hub), LOAD_DATE (когда загрузили), RECORD_SOURCE (откуда), HASH_DIFF (хэш атрибутов для обнаружения изменений). END_DATE / LOAD_END_DATE — полезный, но не обязательный по классическому стандарту атрибут.","d":1,"x":1},{"id":127,"n":128,"t":"Модели данных DWH","s":"Историчность данных в Data Vault - обеспечение целостности исторических записей satellite-таблиц при изменении структуры модели","q":"Почему при добавлении новой колонки в satellite-таблицу исторические записи не должны пересчитываться заново?","a":["Потому что каждая запись satellite фиксирует состояние атрибутов на момент загрузки через хэш-дифф — ретроактивное изменение нарушило бы аудитабельность и immutability исторических данных; новая колонка просто остаётся NULL для старых записей, сохраняя целостность временной линии","Потому что пересчёт хэш-диффов для исторических записей технически невозможен — алгоритм хэширования является односторонней функцией, и восстановить исходные значения атрибутов из существующих хэшей для последующего включения новой колонки в расчёт не представляется возможным без полной переработки ETL-процессов","Потому что исторические записи уже прошли процедуру дедупликации на этапе загрузки, и повторный пересчёт нарушит логику работы hub-таблиц, которые хранят ссылки на конкретные версии satellite-записей по первичному ключу — изменение структуры satellite автоматически инвалидирует все существующие связи в hub и link таблицах, что приведёт к каскадному разрушению референциальной целостности всей модели","Потому что согласно методологии Data Vault 2.0 новая колонка должна быть реализована как отдельный satellite-объект с собственным жизненным циклом, и пересчёт старых записей в исходном satellite противоречит принципу разделения rate-of-change — каждый атрибут должен версионироваться независимо, поэтому старый satellite остаётся неизменным, а новый satellite начинает историю с момента добавления колонки"],"c":0,"e":"📚 Data Vault 2.0: если атрибут меняется с другой скоростью — создай новый Satellite. Не ломай историю старого. Старый Satellite продолжает жить со своей историей, новый начинает с момента добавления. Исторические записи старого — неизменны, как архивные документы.","d":1,"x":3},{"id":128,"n":129,"t":"Informatica PC","s":"Record Source в Data Vault - назначение поля, форматы значений и правила заполнения по стандарту команды","q":"Почему поле Record Source в Data Vault заполняется на уровне загрузки, а не вычисляется динамически при каждом запросе?","a":["Поле заполняется при загрузке для того, чтобы система могла автоматически дедуплицировать записи из разных источников и корректно объединять их в единый хаб.","Чтобы упростить ETL-процессы и избежать необходимости хранить метаданные о маршрутах передачи данных между системами-источниками и хранилищем.","Чтобы зафиксировать реальный источник данных в момент загрузки и обеспечить воспроизводимый аудит происхождения записи.","Потому что динамическое вычисление источника при каждом запросе значительно снижает производительность хранилища и увеличивает нагрузку на серверы базы данных."],"c":2,"e":"🔍 RECORD_SOURCE фиксируется в момент загрузки: 'эта запись пришла из SAP.ORDERS в 14:32'. Если вычислять динамически — можно потерять реальный источник (таблица удалена, ETL изменился). Зафиксированный источник = аудитная цепочка: всегда можно проследить происхождение записи."},{"id":129,"n":130,"t":"Informatica PC","s":"Link-таблицы Data Vault - проектирование same-as link и иерархических link для моделирования нетривиальных доменных связей","q":"В системе CRM один клиент может иметь несколько дублирующих записей из разных источников — какой тип Link-таблицы Data Vault следует использовать для моделирования этой связи?","a":["Дубли устраняются на уровне Hub через добавление атрибута приоритета источника в Satellite, Link здесь не нужен.","Нужно создать отдельный Hub для каждого источника и соединить их стандартным Link, сохраняя бизнес-ключи раздельно.","Hierarchical Link — он связывает записи одного Hub в иерархию, что позволяет группировать дубли клиентов по уровням мастер-записи.","Same-As Link (SAL) — специальный тип Link, связывающий хабы одного типа между собой для обозначения эквивалентности/дублирования бизнес-ключей разных источников без изменения Hub-таблиц."],"c":3,"e":"👥 SAL (Same-As Link) для дублей CRM-клиентов: CRM говорит 'клиент 101', 'клиент 102' — разные записи для одного человека. SAL фиксирует: '101 ≡ 102'. Так исходные ключи сохраняются, а master-data management решает, кто 'главный' через SAL-связь."},{"id":130,"n":131,"t":"Informatica PC","s":"Hub-таблицы Data Vault — определение business key и проектирование surrogate key для новых бизнес-доменов","q":"В новом бизнес-домене 'Контрагенты' источник поставляет записи с составным натуральным ключом (ИНН + КПП). Как правильно определить business key для Hub-таблицы в Data Vault?","a":["Составной натуральный ключ (ИНН + КПП) нужно хранить в Hub как два отдельных поля без конкатенации — это сохраняет атомарность данных. Surrogate key должен быть целочисленным суррогатом, генерируемым базой данных через IDENTITY/SEQUENCE, так как хэширование создаёт риски коллизий и замедляет джойны.","Хранить ИНН+КПП как есть в Satellite.","Конкатенировать ИНН и КПП в единый business key (например, через разделитель), либо создать отдельный Hub для каждого атрибута, если они несут самостоятельный бизнес-смысл. Surrogate key генерируется как хэш (MD5/SHA) от полученного business key.","Использовать только ИНН как основной business key, поскольку КПП является производным атрибутом и относится к Satellite-таблице. Surrogate key генерируется как автоинкрементный sequence, что обеспечивает лучшую производительность по сравнению с хэш-функциями при больших объёмах данных."],"c":2,"e":"🔑 ИНН+КПП — составной бизнес-ключ: один без другого не уникален (ИНН у всех филиалов одинаковый, КПП различается). Конкатенируй через разделитель: '123456789~КПП001'. Хэш от этой строки = суррогатный ключ Hub. Разделитель критичен для избежания ложных коллизий."},{"id":131,"n":132,"t":"Informatica PC","s":"Hub-таблицы Data Vault - структура, обязательные поля и правила создания по шаблону","q":"Почему в Hub-таблице хранится только бизнес-ключ, но не атрибуты сущности?","a":["Чтобы обеспечить неизменяемость Hub и разделить ответственность: атрибуты хранятся в Satellite-таблицах, что позволяет независимо отслеживать их изменения во времени, не затрагивая ядро модели.","Чтобы сократить размер таблицы.","Атрибуты не хранятся в Hub, так как они относятся к Link-таблицам, которые специально созданы для описания свойств сущностей и их взаимосвязей — это позволяет централизованно управлять изменениями и упрощает построение витрин данных.","Потому что Hub-таблица оптимизирована для быстрой загрузки: хранение только ключей уменьшает объём данных и снижает нагрузку на ETL-процессы, а атрибуты намеренно дублируются во всех связанных таблицах для ускорения запросов."],"c":0,"e":"📦 Hub — только 'паспорт' (ключ + метаданные). Атрибуты (имя, адрес, статус) — в Satellite. Зачем? Атрибуты меняются, и каждое изменение создаёт новую версию в Satellite. Hub остаётся неизменным — единая точка идентификации сущности на весь срок жизни хранилища."},{"id":132,"n":133,"t":"Informatica PC","s":"Load Date в Data Vault - назначение поля, правила заполнения и типичные ошибки при реализации","q":"В хаб HUB_CUSTOMER поле LOAD_DATE заполнено датой повторной загрузки уже существующей записи — это правильно?","a":["Нет, но только если запись не изменилась — если же бизнес-ключ пришёл с новыми атрибутами, LOAD_DATE в хабе обновляется.","Да, при повторной загрузке LOAD_DATE нужно обновлять, иначе поле теряет смысл: Data Vault требует, чтобы дата всегда соответствовала последнему времени обработки записи в пайплайне.","Нет. LOAD_DATE фиксируется один раз при первой вставке записи и больше не обновляется — это неизменяемая техническая метка времени загрузки.","Да, это правильно — LOAD_DATE всегда обновляется при каждой загрузке, чтобы отражать актуальную дату последнего появления записи в источнике."],"c":2,"e":"⛔ LOAD_DATE в Hub = дата ПЕРВОГО появления business key в DWH. Hub — append-only: записи никогда не обновляются. Если бизнес-ключ пришёл снова, он уже есть в Hub и его туда не вставляют второй раз. LOAD_DATE = момент первичного появления, и он никогда не меняется."},{"id":133,"n":134,"t":"Informatica PC","s":"Соглашения об именовании объектов Data Vault - применение принятых naming conventions при создании и изменении таблиц","q":"Почему в Data Vault к именам хабов принято добавлять префикс HUB_?","a":["Префикс позволяет сразу определить тип объекта (Hub, Link, Satellite) по имени таблицы, без необходимости изучать её структуру — это ускоряет навигацию и снижает ошибки при разработке.","Префикс HUB_ добавляется исключительно по техническим причинам — реляционные СУБД не позволяют создавать таблицы с одинаковыми именами, и префикс предотвращает конфликты между хабами, линками и сателлитами, хранящими данные об одной сущности.","Префикс HUB_ необходим для корректной работы ETL-инструментов: большинство современных платформ автоматической загрузки данных, таких как WhereScape или Matillion, требуют строгого соответствия именования для распознавания типов объектов.","Префикс HUB_ указывает на то, что таблица содержит исторические данные бизнес-ключей и была загружена из основного источника системы, что позволяет аналитикам быстро определить приоритетность и достоверность хранимой в ней информации."],"c":0,"e":"🏷️ HUB_, LNK_, SAT_ — как цветные ярлыки на папках. Открываешь каталог таблиц: HUB_CUSTOMER, HUB_ORDER, LNK_CUSTOMER_ORDER, SAT_CUSTOMER_DETAILS — сразу ясна роль каждой таблицы без чтения её структуры. Это сокращает время ориентации в сложной схеме."},{"id":134,"n":135,"t":"Oracle PL/SQL","s":"Оптимизация PL/SQL-кода — выявление и устранение узких мест: минимизация context switch, использование BULK-операций, оптимизация циклов обработки данных","q":"Почему переключение контекста между PL/SQL и SQL движками снижает производительность при построчной обработке данных?","a":["PL/SQL и SQL движки используют разные области памяти (PGA и SGA), и при каждом переключении данные копируются между ними, что создаёт избыточный расход памяти, а не дополнительные вызовы.","Переключение контекста замедляет работу из-за блокировки таблиц: каждый SQL-запрос в цикле удерживает row-level lock дольше, чем пакетная операция, создавая конкуренцию за ресурсы.","Каждый переход между движками требует дополнительных системных вызовов и накладных расходов. При построчной обработке в цикле таких переключений тысячи, тогда как BULK-операции выполняют один переход для всей коллекции, многократно сокращая суммарные издержки.","Проблема не в самих переключениях, а в том, что построчный цикл мешает оптимизатору построить эффективный план выполнения — BULK работает быстрее именно благодаря единому explain plan для всей коллекции."],"c":2,"e":"🔌 PL/SQL и SQL — два разных движка. Каждый переход между ними = накладные расходы (как переключение передач). В цикле из 100 000 строк = 100 000 переключений. BULK операции = одно переключение для всего массива. Разница в скорости — значительная."},{"id":135,"n":136,"t":"Oracle PL/SQL","s":"Курсоры PL/SQL - использование явных курсоров, курсорных переменных и атрибутов курсора для построчной и пакетной обработки данных в ETL-процедурах","q":"Почему использование BULK COLLECT с LIMIT предпочтительнее полного BULK COLLECT без ограничений в ETL-процедурах при обработке больших объёмов данных?","a":["BULK COLLECT без LIMIT работает быстрее, так как использует один системный вызов, тогда как LIMIT создаёт дополнительные round-trips к базе данных, увеличивая нагрузку на сеть и снижая общую производительность ETL-процесса.","LIMIT нужен только для курсорных переменных REF CURSOR — обычный BULK COLLECT автоматически ограничивает выборку размером SGA, поэтому переполнение памяти невозможно.","BULK COLLECT с LIMIT предпочтительнее, потому что Oracle не может оптимизировать полную выборку — без LIMIT отключается механизм array fetching и данные читаются построчно.","BULK COLLECT без LIMIT загружает все строки в память сразу, что может вызвать переполнение PGA. LIMIT контролирует размер порции, обеспечивая баланс между количеством обращений к БД и потреблением памяти."],"c":3,"e":"🧃 BULK COLLECT без LIMIT = выпить всё ведро разом (переполнение памяти при больших объёмах). BULK COLLECT LIMIT 1000 = выпивать стакан за стаканом: контролируемо, память не взрывается. Баланс: меньше обращений к БД чем без BULK, меньше памяти чем без LIMIT."},{"id":136,"n":137,"t":"Oracle PL/SQL","s":"Пакеты PL/SQL - структура PACKAGE и PACKAGE BODY, группировка связанных процедур и функций одного ETL-потока по готовому образцу","q":"Почему в ETL-потоке процедуры загрузки хабов, линков и сателлитов объединяют в один PL/SQL-пакет?","a":["Чтобы скрыть логику от других схем — пакет шифрует код.","Потому что пакет создаёт отдельную транзакционную границу для каждого ETL-потока: все процедуры внутри него выполняются в одной транзакции, что гарантирует целостность данных между хабами, линками и сателлитами без явного управления COMMIT и ROLLBACK.","Чтобы сгруппировать связанную логику одного потока в единый модуль: упростить поддержку, управление зависимостями и повторное использование общих вспомогательных процедур внутри пакета.","Потому что Oracle автоматически оптимизирует выполнение процедур внутри пакета, запуская их параллельно, что ускоряет загрузку хабов, линков и сателлитов по сравнению со standalone-процедурами."],"c":2,"e":"📦 Пакет = библиотека с книгами по одной теме. Все процедуры загрузки одного ETL-потока в одном пакете: общие типы, вспомогательные функции, единая точка входа. Поддерживать и обновлять проще, чем 10 отдельных standalone-процедур разбросанных по схеме."},{"id":137,"n":138,"t":"Oracle PL/SQL","s":"Функции PL/SQL - создание детерминированных и недетерминированных функций для вычисления хэш-ключей хабов и линков Data Vault","q":"Какой атрибут функции PL/SQL необходимо указать при вычислении хэш-ключа хаба, чтобы оптимизатор Oracle мог устранять повторные вызовы для одинаковых входных значений в рамках одного SQL-запроса?","a":["DETERMINISTIC — подсказка оптимизатору, что функция возвращает одинаковый результат для одинаковых аргументов, позволяя устранять повторные вызовы внутри одного SQL-запроса.","NOCOPY — указывает оптимизатору передавать параметры по ссылке, избегая копирования и повторных вычислений хэш-значений при одинаковых входных данных.","PARALLEL_ENABLE — позволяет оптимизатору распараллелить вызовы функции и устранить дублирующиеся вычисления хэша в параллельных потоках.","RESULT_CACHE — кэширует результаты между сессиями, что автоматически устраняет повторные вызовы для одинаковых аргументов внутри запроса."],"c":0,"e":"🗓️ DETERMINISTIC говорит оптимизатору: 'для одинаковых входных данных результат всегда одинаков'. В рамках одного SQL-запроса Oracle может вызвать функцию один раз для повторяющегося значения и переиспользовать результат. RESULT_CACHE — кэш между сессиями (сильнее, но другое назначение)."},{"id":138,"n":139,"t":"Oracle PL/SQL","s":"Обработка исключений PL/SQL - использование стандартных и пользовательских исключений (EXCEPTION, RAISE, SQLCODE, SQLERRM) для логирования ошибок в ETL-блоках","q":"В ETL-блоке PL/SQL нужно поймать любую ошибку и записать в лог-таблицу код и текст ошибки — какие функции использовать внутри секции EXCEPTION?","a":["SQLCODE возвращает числовой код ошибки, SQLERRM — её текстовое описание. Их значения вставляются в лог-таблицу через INSERT в блоке WHEN OTHERS THEN.","SQLCODE и SQLERRM доступны только в блоке WHEN SPECIFIC_ERROR, для WHEN OTHERS нужно использовать DBMS_UTILITY.FORMAT_ERROR_STACK.","SQLCODE возвращает текст ошибки, SQLERRM — код. Вызывать их нужно до секции EXCEPTION, иначе значения будут недоступны.","SQLERRM возвращает числовой код ошибки, SQLCODE — текстовое описание. Их вставляют в лог через INSERT в блоке WHEN OTHERS THEN."],"c":0,"e":"🔎 SQLCODE = -1 (числовой код Oracle). SQLERRM = 'ORA-00001: unique constraint violated' (текстовое описание). Вместе дают полную картину: что за ошибка (код) и что именно произошло (текст). В лог-таблицу пишешь оба для полноценной диагностики."},{"id":139,"n":140,"t":"Oracle PL/SQL","s":"Хранимые процедуры PL/SQL - разработка процедур загрузки данных в слои Data Vault с обработкой входных параметров и возвратом статуса выполнения","q":"Почему в процедурах загрузки Data Vault рекомендуется использовать параметр OUT для возврата статуса вместо исключений?","a":["OUT-параметр позволяет вернуть статус выполнения вызывающему процессу без прерывания цепочки ETL, тогда как необработанное исключение полностью останавливает выполнение пакета и затрудняет частичный откат или логирование ошибок на уровне отдельного слоя.","OUT-параметр работает быстрее исключений, так как не требует обращения к системным таблицам Oracle для записи ошибки, что критично при массовой загрузке в хабы и сателлиты Data Vault.","OUT-параметр позволяет избежать блокировок таблиц аудита, поскольку исключение автоматически инициирует ROLLBACK, который снимает все блокировки и делает невозможным сохранение статуса загрузки в лог-таблицу.","Исключения предпочтительнее в Data Vault, но OUT-параметр используется для совместимости со старыми ETL-инструментами, которые не умеют перехватывать Oracle-исключения через JDBC-драйвер."],"c":0,"e":"🚂 Исключение останавливает весь поезд. OUT-параметр — это флажок машиниста: 'на этом участке была проблема, но едем дальше'. Informatica (вызывающий процесс) читает статус из OUT-параметра и решает: продолжить ли загрузку или выполнить компенсирующие действия. ETL-цепочка не прерывается."},{"id":140,"n":141,"t":"Informatica PC","s":"Трансформация Joiner — объединение разнородных источников и последующая фильтрация данных через Filter","q":"Почему в трансформации Joiner одним из источников рекомендуется назначать мастер-источник с меньшим объёмом данных?","a":["Меньший источник назначается мастером, чтобы Informatica автоматически применяла к нему индексирование на диске, что сокращает время записи временных файлов и уменьшает использование дискового пространства.","Меньший источник назначается мастером потому, что Joiner обрабатывает детальный источник первым и построчно сканирует его, а мастер используется лишь для финальной проверки условия соединения на последнем этапе.","Источник с меньшим объёмом данных становится мастером, поскольку именно к нему применяются условия фильтрации до выполнения джойна, что позволяет сократить итоговое количество строк в результирующем наборе данных.","Меньший источник как мастер загружается в память целиком, что ускоряет поиск совпадений и снижает нагрузку на кэш при объединении."],"c":3,"e":"📖 Joiner кэширует Master в памяти как словарь. Маленькая таблица (10 тыс.) = маленький словарь, быстро помещается в память. Большая таблица Detail (1 млн) читается потоком и ищет слова в словаре. Если перепутать — словарь в 1 млн записей = медленно и много памяти."},{"id":141,"n":142,"t":"Informatica PC","s":"Трансформация Lookup в Informatica PC — режимы кэширования (статический, динамический) и их применение для определения новых и изменённых записей при загрузке Satellite","q":"При загрузке Satellite в Data Vault нужно отделить новые записи от изменённых — какой режим кэширования Lookup следует использовать и почему?","a":["Dynamic Cache используется только для Hub-таблиц, где важна уникальность бизнес-ключа. Для Satellite достаточно Static Cache: изменения определяются сравнением хэша загружаемой записи с последней версией в таблице-приёмнике.","Static Cache: кэш загружается один раз, но не позволяет корректно разделить новые и изменённые записи внутри батча. Для Satellite нужен Dynamic Cache, обновляющий состояние на лету. Aggregator при Static Cache не решает проблему дублей, а лишь маскирует её.","Dynamic Cache не нужен: Lookup в режиме No Cache выполняет прямой SQL-запрос к Satellite при каждой строке, возвращая актуальные данные. Это точнее кэша, так как исключает рассинхронизацию при параллельных загрузках.","Dynamic Cache: Lookup сравнивает входящую запись с кэшем; если ключ отсутствует — запись новая (INSERT), если атрибуты изменились — изменённая (UPDATE). Кэш обновляется на лету, что позволяет корректно обрабатывать дубли в одном батче."],"c":3,"e":"🔍 Static Cache = фотография: снимок данных на момент старта маппинга. Dynamic Cache = живая база данных: обновляется в процессе. При загрузке Satellite: новая запись батча сначала не в статическом кэше → будет определена как 'новая', хотя только что была добавлена той же сессией. Dynamic решает это."},{"id":142,"n":143,"t":"SQL","s":"CTE — пошаговая трансформация данных из staging-слоя в целевую таблицу с проверкой уникальности ключей","q":"В staging-слое есть дубли по бизнес-ключу customer_id. Как с помощью CTE выбрать только одну запись на ключ перед загрузкой в Hub таблицу Data Vault?","a":["Использовать CTE с GROUP BY customer_id и MAX(load_date) — это стандартный способ дедупликации в staging перед загрузкой в Hub, ROW_NUMBER() избыточен.","Использовать CTE с ROW_NUMBER() PARTITION BY customer_id ORDER BY load_date ASC, затем WHERE rn = 1 — выбирается самая первая запись, что соответствует принципам Data Vault.","Использовать CTE с DISTINCT по customer_id — это автоматически уберёт дубли и гарантирует уникальность ключа перед INSERT в Hub без дополнительной фильтрации.","Использовать CTE с ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY load_date DESC), затем во внешнем SELECT отфильтровать WHERE rn = 1 — это гарантирует уникальность ключа перед INSERT в Hub."],"c":3,"e":"🥇 ROW_NUMBER() OVER(PARTITION BY customer_id ORDER BY load_date DESC) = 1 берёт последнюю по времени запись для каждого дублирующегося ключа. DISTINCT не даст контроля над тем, КАКУЮ из дублей выбрать. ROW_NUMBER + фильтр = детерминированный выбор нужной записи."},{"id":143,"n":144,"t":"SQL","s":"Анализ плана выполнения запроса — выявление узких мест через EXPLAIN/EXPLAIN ANALYZE и устранение избыточного полного сканирования таблиц","q":"Назовите основные причины расхождения estimated rows и actual rows в EXPLAIN ANALYZE.","a":["Ошибки в написании запроса и использование устаревших функций агрегации","Неверный порядок JOIN операций и отсутствие индексов на ключевых столбцах","Устаревший кэш буферного пула и неоптимальный cost_factor планировщика","Устаревшая статистика, корреляция столбцов, skew данных и выборочный характер ANALYZE."],"c":3,"e":"📊 estimated rows в EXPLAIN ANALYZE — прогноз оптимизатора на основе статистики. actual rows — реальность при выполнении. Расходятся из-за: устаревшей статистики (давно не делали ANALYZE), неравномерного распределения данных (skew), корреляции столбцов (оптимизатор не учитывает совместную избирательность)."},{"id":144,"n":145,"t":"SQL","s":"Многоуровневые JOIN — порядок соединений 5+ таблиц, типы JOIN (HASH/MERGE/NESTED LOOP) в плане выполнения и их оптимизация для запросов к Data Vault","q":"Почему в Data Vault запросах с 5+ таблицами оптимизатор предпочитает HASH JOIN вместо NESTED LOOP?","a":["HASH JOIN предпочитается потому, что Data Vault использует натуральные ключи вместо суррогатных, а NESTED LOOP не поддерживает соединение по хэшированным бизнес-ключам хабов. Оптимизатор автоматически переключается на HASH JOIN при обнаружении SHA-256 хэшей в условиях JOIN.","HASH JOIN выбирается, так как при 5+ таблицах NESTED LOOP требует больше памяти для хранения промежуточных результатов, а хэш-таблица занимает меньше оперативной памяти благодаря компрессии суррогатных ключей.","HASH JOIN эффективнее при больших объёмах данных: строит хэш-таблицу меньшего набора и сканирует большой один раз, тогда как NESTED LOOP даёт экспоненциальный рост операций при каждом добавлении таблицы без селективных индексов на суррогатных ключах хабов и линков.","NESTED LOOP быстрее при большом количестве таблиц, но оптимизатор выбирает HASH JOIN из-за особенностей хранения Data Vault — хабы и линки физически разнесены по разным файловым группам, что делает случайный доступ NESTED LOOP невозможным без полного сканирования."],"c":2,"e":"⚡ NESTED LOOP: для каждой строки из Hub ищем строки в SAT — O(N*M). При 5+ таблицах = экспоненциальный рост. HASH JOIN: строим хэш-таблицу меньшего набора, сканируем большой один раз — O(N+M). При больших объёмах Data Vault с хэш-ключами HASH JOIN всегда эффективнее."},{"id":145,"n":146,"t":"SQL","s":"Партиционирование — выбор партиционного ключа и его явное использование в условиях WHERE для снижения объёма сканирования","q":"Таблица ORDERS партиционирована по полю ORDER_DATE (по месяцам). Аналитик написал запрос: SELECT * FROM ORDERS WHERE YEAR(ORDER_DATE) = 2023. Почему этот запрос неэффективен и как его исправить?","a":["Запрос неэффективен, потому что функция YEAR() не поддерживается в большинстве SQL-диалектов при работе с партиционированными таблицами. Исправление: следует использовать EXTRACT(YEAR FROM ORDER_DATE) = 2023 — это стандартный SQL-синтаксис, который автоматически активирует partition pruning и заставит оптимизатор читать только партиции за 2023 год.","Проблема в том, что SELECT * возвращает все столбцы, создавая избыточную нагрузку на I/O независимо от партиционирования. Оптимизатор не может использовать partition pruning при полном сканировании столбцов. Исправление: нужно явно перечислить только нужные столбцы в SELECT и добавить индекс на ORDER_DATE для ускорения фильтрации внутри каждой партиции.","Запрос неэффективен из-за того, что условие YEAR(ORDER_DATE) = 2023 корректно активирует partition pruning, однако БД всё равно вынуждена сканировать все 12 месячных партиций за 2023 год последовательно, а не параллельно. Исправление: добавить хинт /*+ PARALLEL(ORDERS, 12) */ и явно указать конкретные месяцы через PARTITION(orders_2023_01, orders_2023_02, ...) для параллельного чтения нужных партиций.","Функция YEAR() оборачивает партиционный ключ, что отключает partition pruning — БД сканирует все партиции. Исправление: WHERE ORDER_DATE >= DATE '2023-01-01' AND ORDER_DATE < DATE '2024-01-01' — явный диапазон позволяет оптимизатору считывать только нужные партиции."],"c":3,"e":"📅 YEAR(ORDER_DATE) = 2023 оборачивает партиционный ключ функцией → оптимизатор не может сделать partition pruning (не знает, к каким партициям относится результат функции). Правильно: ORDER_DATE >= DATE '2023-01-01' AND ORDER_DATE < DATE '2024-01-01' — прямое сравнение активирует pruning."},{"id":146,"n":147,"t":"SQL","s":"Партиционирование — выбор партиционного ключа и его явное использование в условиях WHERE для снижения объёма сканирования","q":"Почему указание партиционного ключа в условии WHERE снижает объём сканирования данных?","a":["БД автоматически создаёт индекс по партиционному ключу, и оптимизатор использует его для быстрого поиска строк, минуя полное сканирование таблицы.","Указание партиционного ключа позволяет БД сжать передаваемые данные между узлами кластера, уменьшая сетевой трафик и ускоряя выполнение запроса.","БД читает только партиции, удовлетворяющие условию, пропуская остальные — это называется partition pruning.","БД кэширует результаты предыдущих запросов с тем же партиционным ключом и при повторном обращении возвращает данные напрямую из кэша, не обращаясь к диску."],"c":2,"e":"🗂️ Partition pruning = 'пропустить шкафы с ненужными документами'. WHERE sale_date BETWEEN '2023-01-01' AND '2023-12-31' → читаются только партиции за 2023 год. Остальные 10 лет данных физически не читаются. При таблицах в сотни ГБ разница = секунды vs минуты."},{"id":147,"n":148,"t":"SQL","s":"Оконные функции RANK и ROW_NUMBER — дедупликация записей и выбор актуальной версии данных при загрузке в сателлиты Data Vault","q":"При загрузке в сателлит Data Vault из источника приходят дубли одной записи с одинаковым хеш-ключом и разными таймстемпами — какую оконную функцию и с каким ORDER BY использовать, чтобы оставить только самую актуальную версию?","a":["ROW_NUMBER() OVER (PARTITION BY hash_key ORDER BY load_timestamp DESC) = 1 — оставляем строку с rn=1, это последняя по времени запись.","ROW_NUMBER() OVER (PARTITION BY hash_key ORDER BY load_timestamp DESC) > 1 — исключаем строку с rn=1, так как она является дублем-источником ошибки, и оставляем все остальные версии для корректной историзации в сателлите Data Vault.","ROW_NUMBER() OVER (PARTITION BY hash_key ORDER BY load_timestamp ASC) = 1 — сортируем по возрастанию, чтобы взять первую загруженную запись как оригинальную, ведь именно она отражает исходное состояние сателлита при инициальной загрузке.","RANK() OVER (PARTITION BY hash_key ORDER BY load_timestamp ASC) = 1 — оставляем строку с rank=1, это самая ранняя запись, которая считается «мастер-версией» при первичной загрузке в сателлит Data Vault."],"c":0,"e":"🥇 ROW_NUMBER() OVER(PARTITION BY hash_key ORDER BY load_timestamp DESC) = 1 — берём строку с самым поздним timestamp для каждого hash_key. DESC = от новых к старым, rn=1 = самая свежая. Это стандартный способ дедупликации: берём последнюю версию записи."},{"id":148,"n":149,"t":"SQL","s":"Агрегатные функции - использование COUNT и SUM для подсчёта транзакций и сумм в разрезе клиентов","q":"Почему COUNT(*) и COUNT(column_name) могут вернуть разные результаты для одной таблицы?","a":["COUNT(*) и COUNT(column_name) всегда возвращают одинаковый результат, но разница может возникнуть только если в таблице применены фильтры WHERE или условия JOIN","COUNT(column_name) более точен и считает все строки включая NULL, а COUNT(*) игнорирует строки где хотя бы один столбец содержит NULL-значение","COUNT(*) считает все строки включая NULL, а COUNT(column_name) игнорирует NULL-значения в указанном столбце","COUNT(*) считает только строки с уникальными значениями во всех столбцах, тогда как COUNT(column_name) учитывает и дублирующиеся строки таблицы"],"c":2,"e":"📊 SELECT COUNT(*) FROM employees → 1000 (все строки). SELECT COUNT(email) FROM employees → 980 (у 20 сотрудников email = NULL, они не считаются). COUNT(*) = все строки включая NULL. COUNT(column) = только строки где column NOT NULL. Разница = количество NULL в столбце."},{"id":149,"n":150,"t":"SQL","s":"JOIN-операции - применение INNER JOIN для соединения таблицы фактов с таблицей измерений при выгрузке данных","q":"Есть таблица фактов sales_fact (sale_id, customer_hk, amount) и таблица измерений customer_dim (customer_hk, customer_name, city). Напишите INNER JOIN для получения продаж с именами клиентов.","a":["SELECT sf.sale_id, cd.customer_name, sf.amount FROM sales_fact sf INNER JOIN customer_dim cd ON sf.customer_hk = cd.customer_hk;","SELECT * FROM sales_fact INNER JOIN customer_dim USING (sale_id);","SELECT sf.sale_id, cd.customer_name, sf.amount FROM sales_fact sf INNER JOIN customer_dim cd ON sf.sale_id = cd.customer_hk ORDER BY sf.sale_id;","SELECT sf.sale_id, cd.customer_name, sf.amount FROM customer_dim cd INNER JOIN sales_fact sf ON cd.customer_hk = sf.customer_hk WHERE sf.amount > 0;"],"c":0,"e":"🔗 INNER JOIN по customer_hk связывает факты с измерениями: SELECT sf.sale_id, cd.customer_name, sf.amount FROM sales_fact sf INNER JOIN customer_dim cd ON sf.customer_hk = cd.customer_hk. Алиасы sf и cd делают запрос читаемым, условие ON определяет ключ соединения."},{"id":150,"n":151,"t":"SQL","s":"Оконные функции - понимание конструкции OVER(PARTITION BY ... ORDER BY ...) при работе с данными хранилища","q":"В таблице хаба DWH нужно получить последнюю по дате загрузки запись для каждого бизнес-ключа — какую оконную функцию использовать?","a":["ROW_NUMBER() OVER(PARTITION BY load_date ORDER BY business_key DESC) — секционируем по дате загрузки, чтобы получить последнюю запись в каждой группе и отбираем rn = 1","RANK() OVER(PARTITION BY business_key ORDER BY load_date DESC) — отбираем строки где rank = 1, это эквивалентно ROW_NUMBER и даст тот же результат при дублях дат","MAX(load_date) GROUP BY business_key","ROW_NUMBER() OVER(PARTITION BY business_key ORDER BY load_date DESC) — отбираем строки где rn = 1"],"c":3,"e":"🕐 ROW_NUMBER() OVER(PARTITION BY business_key ORDER BY load_date DESC) нумерует записи от новой к старой для каждого бизнес-ключа. rn=1 = самая свежая запись = 'текущая'. Это стандартный паттерн для получения актуальной версии из исторической таблицы."},{"id":151,"n":152,"t":"SQL","s":"Оконные функции — механика выполнения PARTITION BY/ORDER BY, фреймы (ROWS/RANGE) и выбор между оконной функцией и GROUP BY для аналитических расчётов в DWH","q":"В DWH-запросе нужно вычислить скользящую сумму продаж за последние 7 календарных дней для каждой строки — какой фрейм использовать, если в данных возможны пропуски дат?","a":["ROWS BETWEEN 7 PRECEDING AND CURRENT ROW корректен при пропусках.","ROWS BETWEEN 6 PRECEDING AND CURRENT ROW — универсальный способ для скользящего окна в 7 дней, пропуски дат не влияют на результат, так как фре
