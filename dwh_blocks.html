ости загрузки, а не по происхождению данных, что оптимизирует производительность и снижает число таблиц в модели.","Создаю отдельные Hub-таблицы для каждого источника (HUB_CUSTOMER_CRM, HUB_CUSTOMER_WEB, HUB_CUSTOMER_CC) с привязанными сателлитами, что обеспечивает полную изоляцию источников и независимое управление загрузкой без коллизий при параллельной записи.","Создаю единый сателлит SAT_CUSTOMER_ALL с объединённым набором атрибутов всех источников и колонкой record_source для фильтрации, что упрощает модель и позволяет видеть все изменения клиента в одном месте, используя общий hash_diff по всем полям.","Создаю отдельный сателлит на каждый источник (SAT_CUSTOMER_CRM, SAT_CUSTOMER_WEB, SAT_CUSTOMER_CC), каждый со своим набором атрибутов, load_dts, record_source и hash_diff, что позволяет независимо управлять частотой загрузки, отслеживать происхождение данных и минимизировать коллизии при параллельной записи."],"c":3,"e":"Это канонический подход source-based splitting в Data Vault 2.0. Один Hub хранит бизнес-ключ клиента, а каждый источник получает собственный сателлит со своим набором атрибутов, независимым load_dts, record_source и hash_diff только по своим полям. Это обеспечивает: независимую частоту загрузки, точный провенанс, минимальные блокировки при параллельной записи и гибкость при изменении схемы одного источника.","r":["Группировка сателлитов по частоте обновления, а не по источнику — антипаттерн в Data Vault. Такой подход смешивает данные разных источников в одной таблице, нарушает принцип source-based splitting, усложняет отслеживание провенанса данных и создаёт проблемы с hash_diff при частичном обновлении атрибутов. Если источники меняют состав полей, единый 'быстрый' сателлит потребует перестройки.","Создание отдельных Hub-таблиц для каждого источника противоречит фундаментальному принципу Data Vault: Hub моделирует бизнес-сущность (клиент), а не источник. Разделение хабов разрывает интеграцию данных об одном клиенте, делает невозможным построение единого представления и усложняет связи через Link-таблицы. Изоляция источников достигается через сателлиты, а не через Hub.","Единый сателлит с колонкой record_source и общим hash_diff по всем полям — антипаттерн. Общий hash_diff будет срабатывать как изменение даже при обновлении только одного источника, порождая ложные версии записей. Поля, специфичные для одного источника, будут NULL у других, что создаёт разреженность и усложняет интерпретацию истории. Параллельная запись из разных источников вызывает конфликты.",null]},{"id":57,"n":57,"t":"Модели данных DWH","l":"Senior","s":"Reference-таблицы в Data Vault - проектирование и применение reference data для хранения классификаторов и справочников","q":"Почему reference-таблицы в Data Vault выделяются в отдельную структуру, а не встраиваются в сателлиты хабов?","a":["Потому что справочные данные разделяются множеством хабов и сателлитов, и вынесение их в отдельные таблицы устраняет избыточность, обеспечивает единую точку управления классификаторами и позволяет независимо версионировать их изменения.","Потому что стандарт Data Vault 2.0 запрещает хранить строковые описательные атрибуты в сателлитах хабов, поэтому классификаторы обязаны находиться в отдельных reference-таблицах.","Потому что reference-таблицы загружаются быстрее сателлитов за счёт упрощённой структуры, и их выделение — это исключительно оптимизация производительности ETL-процессов.","Потому что сателлиты хабов не поддерживают историчность данных, и reference-таблицы были введены как единственный способ хранения временных изменений классификаторов в Data Vault."],"c":0,"e":"Именно в этом заключается ключевая мотивация выделения reference-таблиц: справочные данные (статусы, коды, классификаторы) используются многими сущностями одновременно, и если хранить их в каждом сателлите отдельно — возникает дублирование. Отдельная reference-таблица даёт единую точку обновления, независимое версионирование и устранение избыточности.","r":[null,"Стандарт Data Vault 2.0 не запрещает хранить строковые описательные атрибуты в сателлитах хабов — сателлиты как раз и предназначены для хранения контекстных и описательных атрибутов. Никакого подобного запрета не существует. Reference-таблицы выделяются по логическим и архитектурным соображениям, а не по формальным ограничениям стандарта.","Производительность ETL не является основной и тем более единственной причиной выделения reference-таблиц. Упрощённая структура reference-таблиц действительно может давать некоторый прирост скорости загрузки, но главные мотивы — архитектурные: устранение дублирования, единая точка управления справочниками и независимое версионирование. Сводить решение исключительно к оптимизации ETL — неверно.","Утверждение ложно сразу в двух частях. Во-первых, сателлиты хабов отлично поддерживают историчность — это одна из их базовых функций (хранение снимков с датами load_date и end_date). Во-вторых, reference-таблицы не являются единственным способом хранения изменений классификаторов и не вводились именно с этой целью."]},{"id":58,"n":58,"t":"Модели данных DWH","l":"Senior","s":"Reference-таблицы в Data Vault - проектирование и применение reference data для хранения классификаторов и справочников","q":"Как смоделировать мультиязычность в Reference-таблице Data Vault для справочника валют с multi-active satellite?","a":["Multi-active SAT с составным ключом (currency_hash_key + language_code), где language_code — driving key дельты, плюс отдельные SAT per источник для conflict resolution.","Создать отдельный Hub для каждого языка (Hub_Currency_EN, Hub_Currency_FR) с собственными сателлитами, что обеспечивает полную изоляцию языковых версий и упрощает загрузку данных из разных источников.","Вынести все языковые варианты в Link между Hub_Currency и Hub_Language, без использования multi-active satellite и driving keys.","Добавить language_code как атрибут в стандартный (не multi-active) SAT, используя currency_hash_key как единственный ключ дельты и перезаписывая значения при смене языка."],"c":0,"e":"Это канонический подход Data Vault 2.0 для мультиязычности. Составной ключ (currency_hash_key + language_code) в multi-active SAT позволяет хранить одновременно активные записи для всех языков. Language_code как driving key корректно управляет дельтой: изменение перевода на одном языке не инвалидирует переводы на других. Отдельные SAT per source для conflict resolution — правильная практика разделения по источникам.","r":[null,"Создание отдельного Hub для каждого языка — грубое нарушение Data Vault. Hub моделирует бизнес-сущность (валюту), а не её языковую презентацию. Это приводит к дублированию бизнес-ключей, невозможности связать записи об одной валюте между хабами без дополнительных мостовых структур, и взрывному росту числа объектов при добавлении нового языка.","Вынесение переводов в Link между Hub_Currency и Hub_Language семантически некорректно: переводы — это описательный атрибут сущности 'валюта', а не связь между двумя бизнес-сущностями. Link моделирует транзакционные или ассоциативные отношения. Сами текстовые значения переводов всё равно придётся хранить в SAT на этом Link, и проблема мультиязычности лишь смещается на уровень ниже, усложняя модель без выигрыша.","Использование обычного SAT с одним hash_key как ключом дельты означает, что каждая новая запись (с любым языком) рассматривается как обновление единственной записи валюты. При загрузке перевода на французский язык система обнаружит 'изменение' и закроет запись с английским переводом, так как delta detection работает по полному набору атрибутов. Хранить одновременно несколько активных языковых версий в одной строке без multi-active невозможно корректно."]},{"id":59,"n":59,"t":"Модели данных DWH","l":"Senior","s":"Ключи вычисляемые в Data Vault - стратегии построения composite business key для hub-сущностей в доменах с составными натуральными идентификаторами","q":"Почему при формировании composite business key в hub-сущностях Data Vault критически важен фиксированный порядок конкатенации и единообразный разделитель компонентов ключа?","a":["Единообразный разделитель и порядок компонентов важны только на этапе первоначальной загрузки данных; после того как hub-запись создана и получила суррогатный ключ, последующие загрузки из других источников выполняют lookup по суррогату, поэтому расхождения в формате composite key уже не могут привести к дублированию.","Это требование связано с ограничениями СУБД на индексирование составных строковых полей, а не с корректностью идентификации бизнес-сущностей.","Фиксированный порядок конкатенации и единообразный разделитель нужны исключительно для улучшения читаемости SQL-запросов и упрощения отладки — на корректность хеширования и уникальность записей в hub это никак не влияет, поскольку хеш-функции коммутативны.","Потому что любое отклонение в порядке или разделителе даёт другой хеш, порождая дубликаты hub-записей для одной бизнес-сущности и нарушая целостность интеграции данных из разных источников."],"c":3,"e":"Хеш-функция детерминированно преобразует входную строку: любое изменение порядка компонентов ('A||B' vs 'B||A') или разделителя ('A||B' vs 'A##B') даёт принципиально другой хеш. Если разные источники формируют composite key по-разному, для одной и той же реальной бизнес-сущности возникнут несколько hub-записей с разными хешами, что разрушает интеграцию данных.","r":["Утверждение ошибочно: lookup при последующих загрузках в Data Vault выполняется не по суррогатному ключу, а именно по вычисленному хешу business key. Если два источника формируют composite key с разным порядком компонентов или разным разделителем, их хеши не совпадут, и система не найдёт существующую hub-запись, создав дубликат вместо корректного переиспользования уже существующей записи.","Требование фиксированного порядка и разделителя не связано с ограничениями СУБД на индексирование. Причина сугубо семантическая и алгоритмическая: разные варианты формирования строки перед хешированием дают разные хеш-значения, что ломает идентификацию бизнес-сущностей при интеграции данных из нескольких источников, порождая дубликаты в hub.","Утверждение ложно сразу по нескольким причинам. Хеш-функции (MD5, SHA-1, SHA-256) не являются коммутативными относительно конкатенации строк: хеш('AB||CD') ≠ хеш('CD||AB'). Разный порядок компонентов или разные разделители дадут разные хеш-значения, что напрямую влияет на уникальность записей в hub и приведёт к дублированию одних и тех же бизнес-сущностей.",null]},{"id":60,"n":60,"t":"Модели данных DWH","l":"Senior","s":"Ключи вычисляемые в Data Vault - стратегии построения composite business key для hub-сущностей в доменах с составными натуральными идентификаторами","q":"Какую стратегию формирования composite business key для hub вы примените при интеграции данных о банковских транзакциях из трёх источников, где натуральный идентификатор транзакции уникален только в пределах конкретного источника и даты операции?","a":["Использовать в качестве business key только хеш от идентификатора транзакции источника без включения кода системы-источника и даты операции, поскольку Data Vault предполагает разрешение коллизий на уровне сателлитов, где хранится контекст источника и временная привязка, а hub должен содержать максимально компактный и универсальный ключ, не зависящий от происхождения данных.","Создать три отдельных hub-сущности для каждого источника банковских транзакций (Hub_Transactions_SrcA, Hub_Transactions_SrcB, Hub_Transactions_SrcC), каждая со своим натуральным business key без кода источника, а интеграцию выполнить через same-as link, связывающий совпадающие транзакции между хабами, что соответствует принципу Data Vault о разделении бизнес-доменов и позволяет избежать проблемы составных ключей и коллизий при загрузке.","Сформировать business key хаба исключительно как конкатенацию кода источника и идентификатора транзакции без включения даты операции, поскольку дата является контекстным атрибутом и должна храниться в сателлите согласно принципам Data Vault, а добавление временных компонентов в business key хаба нарушает правило неизменяемости ключа и приводит к избыточному разрастанию хаба при высокой частоте транзакций.","Сформировать composite business key как конкатенацию кода источника, даты операции и идентификатора транзакции через фиксированный разделитель, применяя единообразное приведение типов и форматов (upper-case, trim, стандартный формат даты) перед хешированием, чтобы обеспечить коллизиоустойчивость и детерминированность ключа в hub."],"c":3,"e":"Вариант корректен: composite business key включает все компоненты, обеспечивающие уникальность (код источника + дата + идентификатор транзакции), что соответствует условию задачи. Нормализация форматов перед хешированием гарантирует детерминированность и воспроизводимость ключа. Фиксированный разделитель предотвращает склейку значений. Это классическая и рекомендуемая практика Data Vault 2.0 для доменов с составными натуральными идентификаторами.","r":["Использование хеша только от идентификатора транзакции без кода источника и даты — грубая ошибка. При интеграции трёх источников одинаковые идентификаторы из разных систем дадут одинаковый хеш, что породит массовые коллизии и смешение несвязанных транзакций в одном hub-ключе. Утверждение о том, что Data Vault разрешает коллизии на уровне сателлитов, является ложным: коллизии business key должны быть исключены на уровне формирования ключа хаба.","Создание трёх отдельных хабов для одной бизнес-сущности (транзакция) противоречит принципу Data Vault: хаб представляет единую бизнес-концепцию независимо от источника. Same-as link применяется для дедупликации идентичных бизнес-объектов, а не для замены правильного composite business key. Кроме того, если транзакция уникальна лишь в рамках источника, same-as link не решает проблему коллизий — он предназначен для сопоставления семантически одинаковых объектов, что здесь неприменимо.","Конкатенация кода источника и идентификатора транзакции без даты недостаточна: по условию задачи натуральный идентификатор уникален только в пределах источника И даты операции. Это означает, что два разных события из одного источника могут иметь одинаковый идентификатор в разные даты — коллизия неизбежна. Аргумент о том, что дата является 'контекстным атрибутом', неверен: если дата является частью составного натурального ключа источника, она обязана входить в business key хаба.",null]}]}];

function openSheet(o){

    '<div class="sh-head"><div class="sh-title">' + esc(o.title) + '</div><button class="icon-btn sh-close" type="button" aria-label="Закрыть">' + icon('xmark') + '</button></div>' +
    '<div class="sh-body"></div></div>');
  var body = $('.sh-body', root);
  body.innerHTML = o.body || '';
  var m = presentModal(root, { onDismiss: o.onDismiss });
  $('.ov-backdrop', root).addEventListener('click', function(){ m.dismiss(); });
  $('.sh-close', root).addEventListener('click', function(){ m.dismiss(); });
  var sh = $('.sh', root), drag = null;
  [$('.sh-grab', root), $('.sh-head', root)].forEach(function(h){
    h.addEventListener('pointerdown', function(e){
      if (e.target.closest('button')) return;
      drag = { y: e.clientY, t: Date.now(), dy: 0, id: e.pointerId, h: h };
      sh.classList.add('dragging');
      try { h.setPointerCapture(e.pointerId); } catch(err){}
    });
    h.addEventListener('pointermove', function(e){
      if (!drag || e.pointerId !== drag.id) return;
      drag.dy = Math.max(0, e.clientY - drag.y);
      sh.style.transform = 'translate3d(0,' + drag.dy + 'px,0)';
    });
    var end = function(e){
      if (!drag || e.pointerId !== drag.id) return;
      var d = drag; drag = null;
      var v = d.dy / Math.max(1, Date.now() - d.t);
      sh.classList.remove('dragging');
      sh.style.transform = '';
      if (d.dy > 110 || (v > 0.55 && d.dy > 24)) m.dismiss();
    };
    h.addEventListener('pointerup', end);
    h.addEventListener('pointercancel', end);
  });
  if (o.onReady) o.onReady(body, m);
  return m;
}

function mistakeIdsFiltered(){

function removeMistake(id, row){

  store.mistakes.splice(i, 1); save(); updateBadge();
  var finish = function(){ renderMistakes(); };
  if (row && !reduceMotion()) {
    var c = $('.sw-content', row);

/* swipe-to-delete for mistake rows */
function initSwipeRows(container){
  var st = null, openEl = null, ACT = 92;
  function setX(c, x){ c.style.transform = x ? 'translate3d(' + x + 'px,0,0)' : ''; c._x = x; }
  container.addEventListener('pointerdown', function(e){
    var c = e.target.closest('.sw-content');
    if (openEl && openEl !== c) { setX(openEl, 0); openEl = null; }
    if (!c || (e.pointerType === 'mouse' && e.button !== 0)) return;
    st = {c:c, x:e.clientX, y:e.clientY, base:c._x || 0, dx:c._x || 0, active:false, id:e.pointerId};
  });
  container.addEventListener('pointermove', function(e){
    if (!st || e.pointerId !== st.id) return;
    var dx = e.clientX - st.x, dy = e.clientY - st.y;
    if (!st.active) {
      if (Math.abs(dx) > 9 && Math.abs(dx) > Math.abs(dy) * 1.25) {
        st.active = true; st.c.classList.add('drag');
        try { st.c.setPointerCapture(e.pointerId); } catch(err){}
      } else if (Math.abs(dy) > 10) { st = null; return; }
      else return;
    }
    var x = st.base + dx;
    if (x > 0) x = x * 0.2;
    st.dx = x; setX(st.c, x);
  });
  function end(e){
    if (!st || e.pointerId !== st.id) return;
    var s = st; st = null;
    if (!s.active) return;
    s.c.classList.remove('drag');
    s.c._swiped = Date.now();
    var w = s.c.offsetWidth;
    if (s.dx < -w * 0.55) { var row = s.c.closest('.sw'); removeMistake(+row.getAttribute('data-id'), row); openEl = null; }
    else if (s.dx < -ACT / 2) { setX(s.c, -ACT); openEl = s.c; }
    else { setX(s.c, 0); if (openEl === s.c) openEl = null; }
  }
  container.addEventListener('pointerup', end);
  container.addEventListener('pointercancel', end);
  container.addEventListener('click', function(e){
    var c = e.target.closest('.sw-content');
    if (c && c._swiped && Date.now() - c._swiped < 400) { e.stopPropagation(); e.preventDefault(); return; }
    if (c && (c._x || 0) < 0) { setX(c, 0); openEl = null; e.stopPropagation(); e.preventDefault(); }
  }, true);
}
function onMistakesClick(e){
  var t;
  if ((t = e.target.closest('[data-mf]'))) { mistFilter = t.getAttribute('data-mf'); renderMistakes(); return; }
  if ((t = e.target.closest('[data-act]'))) {
    var act = t.getAttribute('data-act');
    if (act === 'm-test') startMistakesTest(mistakeIdsFiltered());
    else if (act === 'm-learn') startMistakesLearn(mistakeIdsFiltered());
    else if (act === 'go-home') showTab('home');
    else if (act === 'm-del') { var row = t.closest('.sw'); removeMistake(+row.getAttribute('data-id'), row); }
    else if (act === 'm-unmark') { var r2 = t.closest('.sw'); removeMistake(+r2.getAttribute('data-id'), r2); }
    return;
  }
  if ((t = e.target.closest('.xi-row'))) {
    var xi = t.closest('.xi'), id = +xi.getAttribute('data-id');
    toggleXi(xi, function(){ var st = store.stats[id]; return detailHTML(byId.get(id), {mode:'last', your: st && st.w !== undefined ? st.w : undefined, wrongs:true, sub:true, extra:'<div class="inline-actions"><button class="btn btn-gray" type="button" data-act="m-unmark">' + icon('trash') + 'Убрать из ошибок</button></div>'}); });
  }
}

var refState = {q:'', f:'all'}, refChipsBuilt = false;
function buildRefChips(){
  var chips = [['all', 'Все', QUESTIONS.length, null]].concat(TOPICS.map(function(t){ return [t, t, topicCount[t], tmeta(t).color]; }));
  if (LEVELS) LEVELS.forEach(function(lv){ chips.push(['lv:' + lv, lv, QUESTIONS.filter(function(q){ return q.l === lv; }).length, 'indigo']); });

    return '<button class="chip" type="button" data-k="' + esc(c[0]) + '" aria-pressed="' + (refState.f === c[0]) + '"' + (c[3] ? ' style="--chip:var(--' + c[3] + ');--chip-fg:#fff"' : '') + '>' +
      (c[3] ? '<span class="dot"></span>' : '') + esc(c[1]) + '<span class="n">' + c[2] + '</span></button>';
  }).join('');

}
function renderRef(){
  if (!refChipsBuilt) buildRefChips();

  else if (refState.f.indexOf('lv:') === 0) list = list.filter(function(q){ return 'lv:' + q.l === refState.f; });
  else if (refState.f !== 'all') list = list.filter(function(q){ return q.t === refState.f; });

/* ================= Screens ================= */
var S = {}, R = {};
function screenEl(name){ return name === 'session' ? S.el : R.el; }
function hideScreenInstant(elm){
  elm.classList.add('instant'); elm.classList.remove('open'); elm.setAttribute('aria-hidden', 'true');
  void elm.offsetWidth; elm.classList.remove('instant');
}
function openScreen(name){
  var prev = screen, elm = screenEl(name);
  if (prev === name) return;
  elm.style.zIndex = '42';
  if (prev) screenEl(prev).style.zIndex = '41';
  elm.setAttribute('aria-hidden', 'false');
  void elm.offsetWidth;
  elm.classList.add('open');
  screen = name;
  if (!prev) lock();
  else { var pel = screenEl(prev); setTimeout(function(){ if (screen !== prev) hideScreenInstant(pel); }, 520); }
  syncHistory();
}
function closeScreen(fromPop){
  if (!screen) return;
  var elm = screenEl(screen), was = screen;
  elm.classList.remove('open'); elm.setAttribute('aria-hidden', 'true');
  screen = null; unlock();
  if (was === 'session') stopSessionTimers();
  if (fromPop !== true) syncHistory();
  renderTab(currentTab); updateNav(); updateBadge();
}

/* ================= Session ================= */
var session = null, progTarget = -1, progTimer = 0, hintTimer = 0;
function startSession(o){
  if (!o.ids || !o.ids.length) { toast('Нет вопросов для этой подборки', {icon:'warn', color:'orange'}); return; }
  session = {
    kind: o.kind, ids: o.ids.slice(), label: o.label, src: o.src || 'main',
    instant: !!o.instant, hide: !!o.hide,
    answers: new Map(), order: new Map(), revealed: new Set(),
    idx: 0, started: Date.now(), fixed: 0, finished: false
  };
  if (session.kind === 'test') session.ids.forEach(function(id){ session.order.set(id, shuffle(byId.get(id).a.map(function(_, i){ return i; }))); });
  renderSession();
  if (screen === 'session') { S.pager.scrollLeft = 0; progTarget = -1; }
  openScreen('session');
  maybeShowHint();
}
function metaHTML(q){
  var c = tmeta(q.t).color;
  return '<div class="q-meta"><span class="pill" style="background:var(--' + c + '-t)"><span class="dot" style="background:var(--' + c + ')"></span>' + esc(q.t) + '</span>' +
    '<span class="q-no">' + (q.l ? esc(q.l) + ' · ' : '') + '№ ' + q.n + '</span></div>';
}
function slideHTML(id, i){
  var q = byId.get(id), body;
  if (session.kind === 'test') {
    var order = session.order.get(id);
    body = '<div class="opts" role="radiogroup" aria-label="Варианты ответа">' + order.map(function(oi, k){
      return '<button class="opt" type="button" role="radio" aria-checked="false" data-k="' + k + '"><span class="opt-mark">' + LETTERS[k] + '</span><span class="opt-text">' + fmtAnswer(q.a[oi]) + '</span></button>';
    }).join('') + '</div><div class="exp-slot"></div>';
  } else {
    body = '<div class="learn-slot">' + learnBody(q) + '</div>';
  }
  return '<section class="slide" data-i="' + i + '" aria-roledescription="карточка" aria-label="Вопрос ' + (i + 1) + ' из ' + session.ids.length + '"><div class="slide-inner">' +
    metaHTML(q) + '<h2 class="q-title">' + rich(q.q) + '</h2>' + body + '</div></section>';
}
function learnBody(q){
  if (session.hide && !session.revealed.has(q.id))
    return '<button class="reveal" type="button" data-act="reveal">' + icon('eye') + 'Показать ответ<small>Сначала попробуйте вспомнить</small></button>';
  return '<div class="ans"><div class="ans-h">' + icon('checkCircle') + 'Правильный ответ</div><div class="ans-text">' + fmtAnswer(q.a[q.c]) + '</div></div>' + expCardHTML(q);
}
function renderSession(){
  var s = session;
  S.pager.innerHTML = s.ids.map(slideHTML).join('');
  S.pager.scrollLeft = 0;
  s.idx = 0;
  if (s.kind === 'test') s.ids.forEach(function(_, i){ paintTestSlide(i); });
  updateChrome();
}
function slideAt(i){ return S.pager.children[i]; }
function paintTestSlide(i, animate){
  var s = session, id = s.ids[i], q = byId.get(id), slide = slideAt(i);
  if (!slide) return;
  var chosen = s.answers.has(id) ? s.answers.get(id) : undefined;
  var answered = chosen !== undefined, reveal = s.instant && answered, order = s.order.get(id);
  $$('.opt', slide).forEach(function(b){
    var k = +b.getAttribute('data-k'), oi = order[k], st = '';
    if (reveal) { if (oi === q.c) st = chosen === q.c ? 'ok' : 'missed'; else if (oi === chosen) st = 'bad'; else st = 'dim'; }
    else if (answered && oi === chosen) st = 'sel';
    b.className = 'opt' + (st ? ' ' + st : '') + (reveal ? ' locked' : '');
    b.setAttribute('aria-checked', oi === chosen ? 'true' : 'false');
    if (reveal) b.setAttribute('aria-disabled', 'true'); else b.removeAttribute('aria-disabled');
    $('.opt-mark', b).innerHTML = (st === 'ok' || st === 'missed') ? icon('check') : st === 'bad' ? icon('xmark') : LETTERS[k];
    if (animate && oi === chosen) {
      var cls = st === 'bad' ? 'shake' : (st === 'ok' || st === 'sel') ? 'pop' : '';
      if (cls && !reduceMotion()) { void b.offsetWidth; b.classList.add(cls); setTimeout(function(){ b.classList.remove(cls); }, 500); }
    }
  });
  var slot = $('.exp-slot', slide);
  if (reveal) { if (!slot.firstChild) slot.innerHTML = expCardHTML(q, chosen); }
  else if (slot.firstChild) slot.innerHTML = '';
}
function onOption(i, k){
  var s = session;
  if (!s || s.kind !== 'test' || s.finished) return;
  var id = s.ids[i], q = byId.get(id), oi = s.order.get(id)[k];
  if (oi === undefined) return;
  if (s.instant) {
    if (s.answers.has(id)) return;
    s.answers.set(id, oi);
    var ok = oi === q.c;
    if (recordAnswer(id, ok, oi)) { s.fixed++; toast('Ошибка исправлена', {icon:'checkCircle'}); }
    haptic(ok ? 'ok' : 'bad');
    paintTestSlide(i, true);
    scrollToExplanation(i);
  } else {
    if (s.answers.get(id) === oi) return;
    s.answers.set(id, oi);
    haptic('tick');
    paintTestSlide(i, true);
  }
  updateChrome();
}
function scrollToExplanation(i){
  var slide = slideAt(i);
  if (!slide) return;
  setTimeout(function(){
    if (!session || session.idx !== i) return;
    var exp = $('.exp', slide), opt = $('.opt.missed', slide) || $('.opt.ok', slide);
    if (!exp && !opt) return;
    var bar = $('.s-bottom', S.el), barH = bar ? bar.offsetHeight : 80;
    var need = Math.max(opt ? opt.offsetTop + opt.offsetHeight + 14 : 0, exp ? exp.offsetTop + 150 : 0);
    if (exp && opt && need - opt.offsetTop > slide.clientHeight - barH) need = exp.offsetTop + 150;
    var visibleBottom = slide.scrollTop + slide.clientHeight - barH;
    if (need > visibleBottom) {
      var target = Math.min(need - (slide.clientHeight - barH), slide.scrollHeight - slide.clientHeight);

}
function revealAnswer(i){

}
function counts(){

  return {ok:ok, bad:bad, answered:s.answers.size};
}
function updateChrome(){
  var s = session; if (!s) return;

  S.counter.textContent = (i + 1) + ' из ' + n;

function goTo(i, smooth){

var scrollRAF = 0;

function onMain(){

function firstUnanswered(){

function requestFinish(){

}
function sessionBack(fromPop){

    var c = counts();

      title: 'Завершить тест?',

      actions: [

function finishLearn(){
  var s = session, n = s ? s.ids.length : 0;

function finishTest(){
  var s = session; if (!s || s.finished) return;
  s.finished = true;
  var res = {ids:s.ids.slice(), answers:new Map(s.answers), correct:[], wrong:[], skipped:[], ms:Date.now() - s.started, instant:s.instant, label:s.label, src:s.src, fixed:s.fixed};
  s.ids.forEach(function(id){
    if (!s.answers.has(id)) { res.skipped.push(id); return; }
    var ok = s.answers.get(id) === byId.get(id).c;
    (ok ? res.correct : res.wrong).push(id);
    if (!s.instant && recordAnswer(id, ok, s.answers.get(id))) res.fixed++;
  });
  store.history.push({t:Date.now(), n:res.ids.length, ok:res.correct.length, bad:res.wrong.length, skip:res.skipped.length, ms:res.ms, ex:!s.instant, src:s.src});
  if (store.history.length > 60) store.history = store.history.slice(-60);

function stopSessionTimers(){ clearTimeout(hintTimer); hideHint(); }
function maybeShowHint(){

/* mouse drag paging (desktop) */
function initMouseDrag(){
  var d = null, justDragged = 0, snapTimer = 0;
  S.pager.addEventListener('pointerdown', function(e){
    if (e.pointerType !== 'mouse' || e.button !== 0 || !session) return;

  });

    if (!d || e.pointerId !== d.id) return;
    var dx = e.clientX - d.x;
    if (!d.active) {
      if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(e.clientY - d.y)) {
        d.active = true; clearTimeout(snapTimer); S.pager.classList.add('dragging');

    setIdx(target);
    snapTimer = setTimeout(function(){ S.pager.classList.remove('dragging'); }, 520);
  });
  S.pager.addEventListener('click', function(e){ if (Date.now() - justDragged < 300) { e.stopPropagation(); e.preventDefault(); } }, true);
}

/* ================= Results ================= */
var lastResult = null, rvFilter = 'all';
function renderResults(){
  var r = lastResult, n = r.ids.length, c = r.correct.length, w = r.wrong.length, sk = r.skipped.length;
  var pct = n ? Math.round(c / n * 100) : 0;
  var lvl = pct >= 90 ? 3 : pct >= 70 ? 2 : pct >= 50 ? 1 : 0;

  var msgs = ['Изучите правильные ответы и пройдите ошибки ещё раз — так материал закрепится быстрее.',
    'Больше половины верно. Отработайте ошибки, чтобы выйти на уверенный уровень.',

    (sk ? '<div class="tile"><b>' + sk + '</b><span>Без ответа</span></div>' : '') +
    '<div class="tile"><b>' + fmtTime(r.ms) + '</b><span>Время</span></div></div>' +

function renderReview(){

function onResultsClick(e){

/* ================= Keyboard ================= */
document.addEventListener('keydown', function(e){
  if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
  var tag = e.target && e.target.tagName;
  if (modals.length) {
    if (e.key === 'Escape') { e.preventDefault(); modals[modals.length - 1].cancel(); }
    return;
  }
  if (screen === 'session' && session) {
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    var onButton = tag === 'BUTTON';
    if (e.key === 'ArrowRight') { e.preventDefault(); goTo(session.idx + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(session.idx - 1); }
    else if (e.key === 'Escape') { e.preventDefault(); sessionBack(false); }
    else if (e.key === 'Enter' && !onButton) { e.preventDefault(); onMain(); }
    else if (e.key === ' ' && !onButton && session.kind === 'learn') { e.preventDefault(); onMain(); }
    else if (/^[1-8]$/.test(e.key) && session.kind === 'test') { var k = +e.key - 1; if (k < byId.get(session.ids[session.idx]).a.length) { e.preventDefault(); onOption(session.idx, k); } }
  } else if (screen === 'results') {
    if (e.key === 'Escape') { e.preventDefault(); closeScreen(); }
  }
});
