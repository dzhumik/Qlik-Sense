йм считает строки, а не интервалы времени.","RANGE BETWEEN 7 PRECEDING AND CURRENT ROW — правильный выбор, так как RANGE автоматически учитывает календарные пропуски, а граница должна быть 7, а не 6, чтобы включить текущий день в полный недельный диапазон; INTERVAL здесь избыточен.","RANGE BETWEEN INTERVAL '6' DAY PRECEDING AND CURRENT ROW — учитывает календарные дни, а не физические строки. ROWS BETWEEN 6 PRECEDING AND CURRENT ROW некорректен при пропусках дат."],"c":1,"e":"📅 ROWS BETWEEN 6 PRECEDING AND CURRENT ROW: считает 6 предыдущих строк + текущая = 7 строк физически. Не зависит от дат — считает строки. Если в данных есть пропуски дат (нет данных за понедельник), ROWS всё равно возьмёт ровно 7 строк независимо от того, какие даты они покрывают.","d":1,"x":3,"w":"Ключ спорный: ROWS считает строки, а не дни, поэтому при пропусках дат окно захватит больше 7 календарных дней. Ключ и объяснение оставлены как в исходном тесте."},{"id":152,"n":153,"t":"SQL","s":"Оконные функции LAG и LEAD — вычисление разницы между текущим и предыдущим значением показателя в разрезе клиентских счетов","q":"Какую оконную функцию и с каким синтаксисом использовать, чтобы вычислить разницу баланса текущего и предыдущего месяца по каждому клиентскому счёту?","a":["Использовать LAG: balance - LAG(balance) OVER (PARTITION BY account_id ORDER BY month) — даёт разницу с предыдущим значением в разрезе счёта.","Использовать LAG с группировкой: LAG(balance) OVER (GROUP BY account_id ORDER BY month) — синтаксис PARTITION BY заменяется на GROUP BY внутри оконной функции для корректного разбиения по счетам.","Использовать LAG без вычитания: LAG(balance, 1, 0) OVER (PARTITION BY account_id ORDER BY month) возвращает готовую разницу баланса с предыдущим месяцем, третий аргумент автоматически рассчитывает дельту.","Использовать LEAD: balance - LEAD(balance) OVER (PARTITION BY account_id ORDER BY month) — функция LEAD берёт следующее значение, что даёт разницу текущего и следующего месяца, а не предыдущего."],"c":0,"e":"📉 balance - LAG(balance) OVER(PARTITION BY account_id ORDER BY month) — разница между текущим и предыдущим балансом счёта. LAG берёт значение из предыдущей строки в той же партиции. PARTITION BY account_id = граница между счетами. ORDER BY month = порядок вычисления."},{"id":153,"n":154,"t":"SQL","s":"Функции PL/SQL - создание детерминированных и недетерминированных функций для вычисления хэш-ключей хабов и линков Data Vault","q":"Почему хэш-функции для хабов Data Vault должны быть детерминированными?","a":["Это требование связано с тем, что в Data Vault линки хранят хэши хабов, и если хэш недетерминирован, линк не сможет найти соответствующий хаб в момент JOIN-операции во время аналитических запросов к витринам данных, что приведёт к неполным результатам отчётов.","Детерминированность хэш-функций нужна исключительно для повышения производительности: Oracle кэширует результаты детерминированных функций в рамках одного запроса, что критично при обработке миллионов бизнес-ключей в хабах.","Хэш-функции должны быть детерминированными, чтобы гарантировать уникальность хэшей — недетерминированная функция может случайно сгенерировать одинаковый хэш для двух разных бизнес-ключей.","Один и тот же бизнес-ключ всегда должен давать одинаковый хэш независимо от времени и сессии — иначе один хаб-объект получит разные хэш-ключи при загрузке из разных источников, что сломает целостность связей в Data Vault."],"c":3,"e":"🔑 Если хэш недетерминирован, один и тот же ключ при разных загрузках даёт разные хэши → одна сущность получает несколько записей в Hub. Link'и тогда ссылаются на разные 'версии' Hub-записи. Детерминированность = один ключ → один хэш → одна Hub-запись → целостность всей модели."},{"id":154,"n":155,"t":"SQL","s":"Коллекции и пользовательские типы PL/SQL - объявление TYPE как таблицы или записи для пакетной обработки строк в процессах загрузки DWH","q":"Вы загружаете 100 000 строк в staging-таблицу DWH. Объявите тип вложенной таблицы записей для BULK COLLECT + FORALL.","a":["TYPE t_rows IS TABLE OF staging_table%ROWTYPE INDEX BY PLS_INTEGER — индексированная таблица лучше для FORALL","TYPE t_rows IS TABLE OF staging_table%ROWTYPE — вложенная таблица записей, оптимальна для BULK COLLECT + FORALL.","TYPE t_row IS RECORD — объявляют запись, затем TABLE OF t_row INDEX BY VARCHAR2(50) для пакетной загрузки через BULK COLLECT","TYPE t_rows IS VARRAY(100000) OF staging_table%ROWTYPE — оптимально для BULK COLLECT, так как фиксирует размер буфера"],"c":1,"e":"📦 TYPE t_rows IS TABLE OF staging_table%ROWTYPE создаёт тип 'коллекция строк как в staging_table'. BULK COLLECT INTO t_rows загружает все нужные строки в память разом. FORALL вставляет всю коллекцию за один DML-вызов. %ROWTYPE автоматически подстраивает структуру под таблицу."},{"id":155,"n":156,"t":"SQL","s":"Динамический SQL в PL/SQL — использование EXECUTE IMMEDIATE и DBMS_SQL для построения гибкой метауправляемой ETL-логики загрузки таблиц Data Vault","q":"Почему в метауправляемой ETL-логике Data Vault предпочтительнее использовать EXECUTE IMMEDIATE с bind variables вместо конкатенации значений прямо в SQL-строку?","a":["Конкатенация открывает риск SQL-инъекций и исключает повторное использование курсора из shared pool. Bind variables позволяют Oracle переиспользовать parse-план (soft parse), снижая нагрузку на CPU и shared pool при массовой загрузке множества однотипных хабов/сателлитов через единый шаблон SQL.","Конкатенация значений в SQL-строку работает быстрее при однократном выполнении, поэтому bind variables нужны только в циклах с тысячами итераций — для единичных загрузок хабов разницы нет.","Использование bind variables вместо конкатенации в первую очередь решает проблему превышения лимита длины SQL-строки в 32767 байт при динамическом построении INSERT-запросов для широких сателлитов Data Vault, а не вопросы безопасности или производительности shared pool — те решаются отдельно через политики VPD и параметр CURSOR_SHARING=FORCE.","Bind variables в EXECUTE IMMEDIATE необходимы исключительно для обеспечения совместимости с DBMS_SQL, поскольку конкатенация строк не поддерживается при параллельном выполнении ETL-потоков в Data Vault. Кроме того, bind variables автоматически экранируют специальные символы Oracle, что упрощает обработку суррогатных ключей хабов."],"c":0,"e":"🔧 DBMS_SQL.BIND_VARIABLE позволяет добавлять переменные в цикле: for each column: DBMS_SQL.BIND_VARIABLE(cursor, ':col'||i, value). EXECUTE IMMEDIATE с USING требует явного перечисления: USING val1, val2, val3 — нельзя сделать это в цикле при переменном числе аргументов.","d":1,"w":"Объяснение в исходном тесте взято от другого вопроса (про DBMS_SQL и переменное число параметров). Сам отмеченный ответ верен: bind variables защищают от SQL-инъекций и дают переиспользовать разобранный курсор."},{"id":156,"n":157,"t":"SQL","s":"Функции PL/SQL - создание пользовательских функций, возвращающих скалярные значения, для вычисления хэш-ключей и бизнес-атрибутов в маппингах","q":"Почему пользовательские функции PL/SQL для вычисления хэш-ключей в Data Vault должны быть детерминированными?","a":["Детерминированность необходима для повышения производительности: Oracle кэширует результаты детерминированных функций в рамках одного запроса, что ускоряет вычисление хэш-ключей при массовой загрузке миллионов записей в хранилище данных.","Детерминированные функции обязательны, поскольку Oracle не допускает использование недетерминированных функций в индексах на основе функций, а хэш-ключи в Data Vault всегда индексируются для обеспечения быстрого поиска по первичным ключам хабов и линков.","Детерминированность гарантирует уникальность хэш-значений: одинаковые входные данные не могут породить коллизии, что критично для Data Vault, так как хэш-ключ является единственным идентификатором сущности и не допускает дублирования записей в хабах и сателлитах.","Детерминированность гарантирует, что одинаковые входные бизнес-ключи всегда дают одинаковый хэш, обеспечивая корректное связывание записей между хабами, линками и сателлитами при повторных загрузках."],"c":2,"e":"🔐 Детерминированность ≠ уникальность. MD5 может выдать одинаковый хэш для разных входных данных (коллизия), но это крайне редко. Главное свойство: одинаковые входные данные → всегда одинаковый хэш → корректное связывание записей между Hub, Link и Satellite при повторных загрузках.","d":1,"x":3},{"id":157,"n":158,"t":"SQL","s":"Представления (VIEW) - разработка представлений на слоях Business Vault и Information Mart с инкапсуляцией логики преобразования данных Data Vault","q":"Почему в слое Business Vault логику вычисляемых атрибутов рекомендуется инкапсулировать во VIEW, а не хранить физически в таблицах?","a":["Чтобы сохранить принцип неизменности сырых данных Data Vault: VIEW позволяет добавлять бизнес-логику и дериваты без модификации исходных таблиц Hub/Link/Satellite, обеспечивая гибкость изменений без перезаписи исторических данных.","VIEW быстрее разрабатывать.","VIEW используется исключительно по соображениям производительности: Oracle материализует план выполнения представления один раз и переиспользует его, что критично для сложных агрегаций в Business Vault, а физические таблицы потребовали бы полного пересчёта при каждом обновлении данных в Satellite-слое.","Физическое хранение вычисляемых атрибутов в таблицах Business Vault требует дополнительных ETL-процессов для синхронизации с источником, тогда как VIEW автоматически кэширует результаты вычислений в памяти Oracle, снижая нагрузку на дисковую подсистему и ускоряя выборки."],"c":3,"e":"🏗️ VIEW = логика без физического хранения. Если бизнес-правило изменится — меняешь VIEW, не трогая данные. Физическая таблица = нужен ETL для синхронизации при каждом изменении Satellite. VIEW в Business Vault: чистота сырых данных в Raw Vault + гибкость бизнес-логики в одном флаконе.","d":1,"x":0},{"id":158,"n":159,"t":"Модели данных DWH","s":"Surrogate Key в Data Vault - принципы формирования и использование в hub, link и satellite","q":"Почему surrogate key в Data Vault генерируется на основе хеша бизнес-ключа, а не как автоинкремент?","a":["Хеш используется для экономии места: он занимает меньше байт, чем автоинкремент, что ускоряет JOIN-операции и снижает нагрузку на индексы в больших таблицах.","Автоинкремент не подходит, так как базы данных не поддерживают его в распределённых системах, а хеш генерируется встроенными функциями SQL без дополнительных настроек.","Хеш выбран ради безопасности: он скрывает реальные бизнес-ключи от аналитиков, обеспечивая маскирование чувствительных данных согласно требованиям GDPR.","Хеш обеспечивает детерминированность: один и тот же бизнес-ключ всегда даёт одинаковый surrogate key, что позволяет параллельно загружать данные из разных источников без конфликтов и без централизованного генератора ключей."],"c":3,"e":"🎯 Хэш детерминирован: любой источник, любое время, одинаковый бизнес-ключ → одинаковый суррогатный ключ. Это позволяет параллельно загружать данные из нескольких источников без центрального генератора ключей. Автоинкремент требует координации → узкое место при параллельности."},{"id":159,"n":160,"t":"Модели данных DWH","s":"Hub-таблицы Data Vault — определение business key и проектирование surrogate key для новых бизнес-доменов","q":"Почему surrogate key в Hub-таблице генерируется на основе хэша business key, а не через автоинкремент?","a":["Хэш от business key детерминирован: одинаковый ключ всегда даёт одинаковый surrogate key независимо от источника и среды загрузки, что позволяет безопасно параллельно загружать данные из нескольких источников без конфликтов и необходимости централизованной генерации ID.","Хэш используется для экономии места: он занимает меньше байт, чем автоинкремент, что ускоряет индексирование и JOIN-операции в хранилище при больших объёмах данных.","Хэш от business key гарантирует уникальность surrogate key: в отличие от автоинкремента, коллизии при хэшировании технически невозможны, поэтому такой подход считается более надёжным стандартом Data Vault.","Автоинкремент не подходит, так как не поддерживается большинством современных DWH-платформ. Хэш — единственный способ генерировать уникальные ключи без привязки к конкретной СУБД."],"c":2,"e":"⚠️ Внимание: коллизии хэш-функции теоретически возможны, хотя и крайне редки. Правильный ответ на этот вопрос — детерминированность (одинаковые ключи = одинаковый хэш), а не 'гарантированная уникальность'. Hash гарантирует детерминированность, а уникальность — статистически высокая, не абсолютная.","d":1,"x":0},{"id":160,"n":161,"t":"Informatica PC","s":"Цепочка трансформаций для загрузки Data Vault Hub — построение последовательности Lookup → Expression → Aggregator → Router с дедупликацией бизнес-ключей и вычислением хэш-значений","q":"В цепочке Lookup → Aggregator → Expression → Router для загрузки Hub какой компонент выполняет дедупликацию бизнес-ключей и какие требования к нему предъявляются?","a":["Aggregator с GROUP BY по бизнес-ключу, с включённым Sorted Input (данные предварительно отсортированы). Expression вычисляет MD5/SHA1 хэш после дедупликации. Router разделяет новые и существующие записи.","Дедупликацию бизнес-ключей выполняет Router с условием фильтрации по уникальности: он направляет дубликаты в отдельную группу Default, а уникальные записи — в целевую таблицу Hub. Aggregator при этом не используется, а Expression вычисляет MD5 хэш до Router на полном наборе данных включая дубликаты.","Дедупликацию выполняет Aggregator с GROUP BY по бизнес-ключу, однако Sorted Input должен быть отключён — сортировка данных снижает производительность и не требуется, так как Aggregator самостоятельно кэширует все записи в памяти. MD5 хэш вычисляется до Aggregator в компоненте Expression, чтобы хэшировать каждую запись до группировки.","Дедупликацию выполняет компонент Lookup, который сравнивает входящие бизнес-ключи с уже существующими в Hub и отфильтровывает дубликаты через условие No Match. Expression после Lookup вычисляет хэш, а Aggregator используется только для подсчёта статистики загрузки."],"c":1,"e":"⚠️ Внимание: правильный ответ для дедупликации в Hub — Aggregator с GROUP BY по бизнес-ключу. Router разделяет потоки на новые/существующие (через Lookup), но не дедуплицирует внутри батча. Expression вычисляет хэш, Aggregator группирует, Router направляет.","d":1,"x":0},{"id":161,"n":162,"t":"SQL","s":"JOIN-ы — механика INNER, LEFT, FULL OUTER JOIN и корректное их применение при загрузке данных в DWH-слои","q":"Почему при загрузке данных в hub-таблицу Data Vault рекомендуется использовать LEFT JOIN вместо INNER JOIN при сравнении с уже существующими записями?","a":["INNER JOIN вернул бы только совпадающие записи из обеих таблиц, что как раз и нужно для загрузки — однако LEFT JOIN предпочтительнее, так как позволяет сохранить дубликаты бизнес-ключей из источника и передать их в satellite-таблицы для отслеживания истории изменений атрибутов.","LEFT JOIN используется потому, что он работает быстрее INNER JOIN при большом объёме данных в hub-таблице — оптимизатор запросов может эффективнее использовать индексы по бизнес-ключам, что критично при инкрементальной загрузке в высоконагруженных DWH-системах.","INNER JOIN медленнее при NULL-значениях.","INNER JOIN исключил бы новые бизнес-ключи, которых ещё нет в hub — именно LEFT JOIN позволяет выявить записи, отсутствующие в целевой таблице (где правая часть NULL), и загрузить только новые уникальные бизнес-ключи."],"c":3,"e":"🔎 LEFT JOIN Hub к существующим данным: WHERE existing.key IS NULL означает 'эта запись есть в источнике, но НЕТ в Hub'. Именно эти строки нужно вставить. INNER JOIN вернул бы только уже существующие записи — то есть ничего нового не загрузим. LEFT JOIN = находим новинки."},{"id":162,"n":163,"t":"SQL","s":"Фильтрация данных - применение HAVING для отбора групп с агрегированными показателями выше заданного порога","q":"Почему HAVING применяется после GROUP BY, а не до него?","a":["Потому что HAVING фильтрует уже сформированные группы с вычисленными агрегатами, которые появляются только после GROUP BY.","Потому что HAVING работает только с индексированными столбцами, которые становятся доступны после того, как GROUP BY завершает сортировку и индексирование данных.","Потому что HAVING фильтрует строки до агрегации, поэтому ему нужен результат GROUP BY как входные данные.","HAVING применяется после GROUP BY, так как иначе WHERE не сможет корректно обработать условия фильтрации по исходным строкам."],"c":0,"e":"⏰ HAVING работает на результатах GROUP BY. Чтобы фильтровать по COUNT(*) или SUM() — нужно сначала их посчитать. COUNT(*) появляется только после GROUP BY. Поэтому HAVING физически не может стоять до GROUP BY — ему нечего фильтровать."},{"id":163,"n":164,"t":"SQL","s":"Хранимые процедуры PL/SQL — проектирование и реализация сложных процедур для загрузки данных в слои Data Vault (Hub, Link, Satellite)","q":"Почему при загрузке Hub в Data Vault используют MERGE вместо простого INSERT?","a":["MERGE быстрее INSERT при загрузке Hub, так как использует параллельные потоки записи и обходит табличные индексы.","MERGE используется для обновления существующих Hub-записей при изменении бизнес-ключа, что невозможно сделать через INSERT.","INSERT не поддерживает работу с суррогатными ключами (hash-ключами) в Data Vault, поэтому применяют MERGE.","MERGE атомарно обрабатывает дубликаты бизнес-ключей: вставляет только новые записи, избегая нарушений уникальности без отдельного SELECT-проверки."],"c":3,"e":"🔄 MERGE = 'если есть — ничего не делаем (WHEN MATCHED), если нет — вставляем (WHEN NOT MATCHED)'. Для Hub это идеально: дублей не будет (нет UPDATE для Hub), новые ключи добавляются атомарно. Простой INSERT упадёт с ошибкой при дубле или создаст дубль без уникального индекса."},{"id":164,"n":165,"t":"SQL","s":"Исключения PL/SQL - объявление пользовательских исключений и построение централизованной обработки ошибок в процедурах ETL-загрузки","q":"Почему в ETL-процедурах рекомендуется объявлять пользовательские исключения через PRAGMA EXCEPTION_INIT, а не использовать только встроенные исключения Oracle?","a":["PRAGMA EXCEPTION_INIT ускоряет обработку ошибок в ETL, так как исключения с именами обрабатываются быстрее, чем анонимные коды в WHEN OTHERS, что критично при массовых загрузках данных с высокой частотой ошибок.","PRAGMA EXCEPTION_INIT используется вместо встроенных исключений, потому что встроенные исключения Oracle не имеют кодов SQLCODE и недоступны через SQLERRM, а пользовательские исключения с PRAGMA дают полный доступ к диагностической информации об ошибке.","PRAGMA EXCEPTION_INIT позволяет связать произвольный код ошибки Oracle (-XXXXX) с именованным исключением, что даёт возможность перехватывать специфические ошибки БД (например, нарушение FK или уникальности) по имени в блоке EXCEPTION, делая централизованную обработку ошибок ETL читаемой и точной, а не ловить всё через WHEN OTHERS с ручным разбором SQLCODE.","PRAGMA EXCEPTION_INIT нужна для создания новых кодов ошибок, которых нет в Oracle, что позволяет ETL-процедурам генерировать собственные уникальные исключения через RAISE без привязки к системным кодам."],"c":2,"e":"🎯 PRAGMA EXCEPTION_INIT связывает имя исключения с кодом ORA. Вместо 'WHEN OTHERS THEN IF SQLCODE = -1 THEN...' пишешь чисто 'WHEN e_dup_val THEN'. Код становится читаемым. Каждый тип ошибки имеет имя и свой обработчик — централизованно, чисто, понятно."},{"id":165,"n":166,"t":"SQL","s":"Пакеты PL/SQL - структура PACKAGE и PACKAGE BODY, группировка связанных процедур и функций одного ETL-потока по готовому образцу","q":"В пакете ETL-потока загрузки хабов Data Vault нужно скрыть внутреннюю процедуру calc_hash от внешних вызовов — где её следует объявить?","a":["Только в PACKAGE BODY, добавив модификатор PROTECTED перед именем процедуры — иначе она останется публичной.","Только в PACKAGE (спецификации), без тела — объявление в спецификации автоматически делает процедуру приватной.","Только в PACKAGE BODY, без объявления в PACKAGE (спецификации) — тогда процедура будет приватной и недоступной извне пакета.","Объявить в обоих местах с ключевым словом PRIVATE — это стандартный способ скрыть процедуру от внешних вызовов."],"c":2,"e":"🔒 Процедура в PACKAGE BODY без объявления в PACKAGE SPEC = приватная процедура. Она видна только внутри пакета — другие пакеты и внешний код её вызвать не могут. PACKAGE SPEC = публичный интерфейс. PACKAGE BODY = реализация (публичная + приватная)."},{"id":166,"n":167,"t":"SQL","s":"Последовательности (Sequence) — создание и применение sequence для генерации суррогатных ключей и технических идентификаторов в объектах Data Vault","q":"Почему в Data Vault для генерации суррогатных ключей sequence предпочтительнее ROWNUM или функции генерации UUID на уровне SQL-запроса?","a":["Sequence предпочтительнее потому, что ROWNUM и UUID генерируются на клиентской стороне и не логируются в redo-логах Oracle, из-за чего невозможно восстановить значения ключей после сбоя, тогда как sequence полностью управляется словарём данных.","ROWNUM не подходит для суррогатных ключей исключительно по причине производительности: при больших объёмах данных Oracle вынужден материализовать весь результирующий набор для присвоения номеров строкам, тогда как sequence работает через легковесный кэш в SGA. UUID-функции же избыточны по размеру хранимых данных — 128 бит против компактного числового sequence, что критично для индексов Hub и Link таблиц.","UUID предпочтительнее sequence в Data Vault, поскольку гарантирует глобальную уникальность без обращения к базе данных, а ROWNUM не используется просто из соображений читаемости кода.","Sequence гарантирует уникальность и атомарность даже при параллельных сессиях: каждый вызов NEXTVAL возвращает уникальное значение независимо от конкурентных транзакций, тогда как ROWNUM зависит от контекста запроса и не гарантирует уникальность при параллельной загрузке, что критично для Hub и Link ключей в Data Vault."],"c":3,"e":"🔢 ROWNUM не уникален при параллельной загрузке (зависит от порядка строк в запросе). UUID генерируется без гарантии от БД. SEQUENCE.NEXTVAL = атомарный счётчик: каждый вызов гарантированно возвращает уникальное значение, даже при 100 параллельных сессиях одновременно."},{"id":167,"n":168,"t":"Модели данных DWH","s":"Link-таблицы Data Vault - моделирование многоуровневых связей между hub-сущностями в сложных доменах","q":"Почему в Data Vault Link-таблица не хранит дескриптивные атрибуты связи напрямую, а выносит их в отдельный Satellite?","a":["Чтобы сохранить неизменяемость Link-таблицы и отслеживать историю изменений атрибутов связи независимо от самого факта связи между Hub-сущностями.","Потому что Link-таблица технически не может содержать nullable-поля, а дескриптивные атрибуты связи часто необязательны и появляются позже основного факта связи.","Дескриптивные атрибуты выносятся в Satellite для оптимизации производительности JOIN-запросов: Link хранит только ключи, что уменьшает размер индексов и ускоряет поиск связей между Hub-сущностями в больших объёмах данных.","Чтобы упростить ETL-процессы загрузки данных."],"c":2,"e":"🏠 Link = факт что 'этот заказ связан с этим клиентом'. Атрибуты связи (скидка за сотрудничество, дата начала контракта) могут меняться. Изменяемые вещи нельзя держать в неизменяемом Link. Satellite к Link = история изменений атрибутов этой конкретной связи.","d":1,"x":0},{"id":168,"n":169,"t":"Informatica PC","s":"Трансформации Lookup и Aggregator — подстановка значений из справочников и расчёт агрегированных показателей в цепочке трансформаций","q":"В цепочке трансформаций Lookup → Aggregator нужно подставить название категории из справочника и посчитать сумму продаж по каждой категории — в каком порядке следует расположить трансформации?","a":["Порядок не имеет принципиального значения: Informatica автоматически оптимизирует цепочку трансформаций и переставляет их в нужном порядке при компиляции маппинга, поэтому Aggregator можно разместить до или после Lookup — результат будет одинаковым.","Сначала Lookup подставляет название категории, затем Aggregator группирует по ней и считает SUM продаж. Aggregator после Lookup — единственно верный порядок, иначе группировка будет по коду, а не названию.","Lookup следует поместить после Aggregator, но настроить его на справочную таблицу с агрегированными данными — такой подход позволяет избежать дублирования логики группировки и получить название категории вместе с предрассчитанной суммой продаж за один проход по данным.","Сначала Aggregator группирует по коду категории и считает SUM продаж, затем Lookup подставляет название — это эффективнее, так как уменьшает количество обращений к справочнику: вместо каждой строки lookup выполняется только для уникальных кодов после группировки."],"c":1,"e":"🍳 Сначала Lookup подставляет название (без него некуда группировать по названию), потом Aggregator считает SUM по этому названию. Порядок критичен: если поменять местами, Aggregator будет группировать по коду (до подстановки), а не по названию. Данные будут неверными."},{"id":169,"n":170,"t":"SQL","s":"Оконные функции — механика выполнения PARTITION BY/ORDER BY, фреймы (ROWS/RANGE) и выбор между оконной функцией и GROUP BY для аналитических расчётов в DWH","q":"Почему RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW может включать больше строк во фрейм, чем аналогичный ROWS-фрейм?","a":["RANGE работает с логическими границами по значению ORDER BY: все строки с одинаковым значением ключа сортировки считаются 'текущими' и включаются во фрейм вместе, тогда как ROWS оперирует физическими позициями строк и включает ровно одну текущую строку.","RANGE автоматически расширяет фрейм до границ секции (PARTITION), если в ORDER BY встречаются дублирующиеся значения, тогда как ROWS строго ограничен указанным количеством строк и никогда не выходит за пределы явно заданного диапазона позиций.","ROWS всегда пропускает NULL-строки, а RANGE включает их.","RANGE использует физические позиции строк точно так же, как ROWS, однако дополнительно включает во фрейм все строки из соседних секций с совпадающим значением ключа сортировки, что приводит к пересечению границ PARTITION BY и увеличивает количество обрабатываемых строк по сравнению с ROWS-фреймом."],"c":3,"e":"⚠️ Внимание: RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW работает с логическими границами ORDER BY. Строки с одинаковым значением ORDER BY ключа считаются 'текущими' одновременно — все они включаются во фрейм. ROWS оперирует физическими позициями строк. Это разница в поведении при дублях.","d":1,"x":0},{"id":170,"n":171,"t":"SQL","s":"Оконные функции - использование ROW_NUMBER() для нумерации строк внутри группы по шаблону","q":"Вам нужно пронумеровать строки внутри каждого hub_customer, упорядочив записи по load_date — какой SQL-запрос это реализует?","a":["SELECT *, ROW_NUMBER() OVER (PARTITION BY hub_customer_key ORDER BY load_date) AS rn FROM hub_customer;","SELECT *, RANK() OVER (PARTITION BY hub_customer_key ORDER BY load_date ASC) AS rn FROM hub_customer;","SELECT *, ROW_NUMBER() OVER (PARTITION BY load_date ORDER BY hub_customer_key) AS rn FROM hub_customer;","SELECT *, ROW_NUMBER() OVER (ORDER BY load_date) AS rn FROM hub_customer PARTITION BY hub_customer_key;"],"c":0,"e":"🏷️ SELECT *, ROW_NUMBER() OVER(PARTITION BY hub_customer_key ORDER BY load_date) AS rn FROM hub_customer нумерует строки внутри каждого клиента от старых к новым. rn=1 = самая ранняя запись, rn=MAX = самая свежая. Без ORDER BY нумерация непредсказуема."},{"id":171,"n":172,"t":"Oracle PL/SQL","s":"Обработка исключений PL/SQL - использование стандартных и пользовательских исключений (EXCEPTION, RAISE, SQLCODE, SQLERRM) для логирования ошибок в ETL-блоках","q":"Почему в ETL-блоке рекомендуется использовать SQLERRM вместе с SQLCODE при логировании ошибок?","a":["SQLCODE необходим для фильтрации системных ошибок от пользовательских исключений, а SQLERRM автоматически переводит сообщение на язык текущей сессии базы данных для читаемости логов","SQLERRM самостоятельно содержит полную информацию об ошибке включая код и описание, поэтому SQLCODE добавляют лишь для совместимости со старыми версиями Oracle и legacy-кодом","SQLCODE возвращает текстовое описание ошибки, а SQLERRM — её числовой идентификатор; совместное использование позволяет дублировать информацию для повышения надёжности записи в лог-таблицу","SQLCODE возвращает числовой код ошибки, а SQLERRM — её текстовое описание; вместе они дают полную диагностическую информацию для анализа сбоя"],"c":3,"e":"🔍 SQLCODE = числовой код ошибки (-1 для уникальности, -1017 для неверного пароля). SQLERRM = текстовое описание ('ORA-00001: unique constraint violated'). Только код = неясно что случилось. Только текст = сложно фильтровать и обрабатывать программно. Вместе = полная диагностика."},{"id":172,"n":173,"t":"SQL","s":"CTE — пошаговая трансформация данных из staging-слоя в целевую таблицу с проверкой уникальности ключей","q":"Почему при загрузке в Hub-таблицу Data Vault через CTE используют ROW_NUMBER() перед INSERT, а не просто DISTINCT?","a":["DISTINCT не используют потому, что он несовместим с конструкцией CTE в большинстве СУБД при наличии оконных функций в том же запросе, тогда как ROW_NUMBER() технически обязателен для корректной компиляции запроса INSERT...SELECT из CTE в соответствии со стандартом SQL:2003.","ROW_NUMBER() применяется не для устранения дублей, а для присвоения порядкового номера каждой записи перед вставкой в Hub, что позволяет системе аудита Data Vault отслеживать последовательность загрузки и восстанавливать хронологию появления бизнес-ключей в источнике без потери каких-либо строк.","DISTINCT не гарантирует выбор одной строки при дублях с разными атрибутами — ROW_NUMBER() позволяет детерминировано оставить ровно одну запись на бизнес-ключ, контролируя порядок выбора через ORDER BY.","DISTINCT прекрасно справляется с дублями по бизнес-ключу, однако ROW_NUMBER() используют по соображениям производительности: оконные функции выполняются быстрее операции DISTINCT на больших объёмах staging-данных, поскольку не требуют полной сортировки всего результирующего набора."],"c":1,"e":"✅ Правильный ответ: ROW_NUMBER() позволяет детерминированно выбрать ОДНУ запись из дублей, контролируя порядок через ORDER BY. DISTINCT убирает полностью одинаковые строки, но если дубли отличаются другими полями (датой загрузки) — DISTINCT не поможет. ROW_NUMBER + WHERE rn=1 = точный выбор.","d":1,"x":2},{"id":173,"n":174,"t":"SQL","s":"Агрегирование данных — GROUP BY, функции COUNT/SUM/MAX и их поведение при наличии NULL-значений в аналитических выборках","q":"В таблице сателлита SAT_PAYMENT есть столбец amount с NULL-значениями у части записей. Какой агрегат вернёт корректную сумму только по существующим платежам: SUM(amount) или SUM(COALESCE(amount, 0))?","a":["Оба варианта корректны и взаимозаменяемы: SUM(amount) игнорирует NULL, а SUM(COALESCE(amount, 0)) заменяет их нулями, поэтому результат идентичен. Однако в продуктивной среде Data Vault рекомендуется использовать именно COALESCE-версию как более явную и читаемую для аналитиков, работающих с сателлитами.","SUM(COALESCE(amount, 0)) — единственный корректный вариант, поскольку SUM(amount) при наличии NULL в столбце вернёт NULL для всей группы, и итоговая сумма окажется некорректной. COALESCE заменяет NULL нулями, гарантируя, что агрегат учтёт все строки и вернёт числовой результат вместо NULL.","SUM(amount) — игнорирует NULL автоматически и возвращает сумму только существующих значений. SUM(COALESCE(amount, 0)) даст тот же результат, но COALESCE избыточен и может вводить в заблуждение, создавая ложное ощущение, что нули учитываются как реальные платежи.","SUM(amount) вернёт NULL, если хотя бы одна запись содержит NULL."],"c":0,"e":"💡 SUM(amount) автоматически игнорирует NULL — результат суммы существующих значений. SUM(COALESCE(amount, 0)) явно заменяет NULL нулями перед суммированием — математически то же самое. Оба варианта корректны для суммирования платежей. COALESCE может ввести в заблуждение: нули ≠ отсутствие данных.","d":1,"x":2}]},{"id":"bauyrzhan","name":"Бауыржан","title":"Вопросы от Бауыржана","initial":"Б","color":"orange","topics":["SQL","Oracle PL/SQL","Модели данных DWH","Informatica PC"],"levels":["Junior","Middle","Senior"],"bank":"1d8c5747","questions":[{"id":1,"n":1,"t":"SQL","l":"Junior","s":"Индексы - понимание принципов работы индексов и их влияния на скорость выполнения SELECT-запросов","q":"Почему добавление индекса на столбец ускоряет выполнение SELECT-запроса с фильтрацией по этому столбцу?","a":["Индекс копирует все данные таблицы в отдельную область памяти, что позволяет обращаться к ним напрямую, минуя дисковые операции чтения.","Индекс сжимает данные столбца, уменьшая объём чтения с диска.","Индекс заставляет базу данных кэшировать весь столбец в оперативной памяти, поэтому повторные запросы выполняются быстрее за счёт отсутствия обращений к диску.","Индекс создаёт упорядоченную структуру (B-tree), позволяющую находить нужные строки без полного сканирования таблицы."],"c":3,"e":"B-tree индекс хранит упорядоченные значения столбца с указателями на физические строки таблицы. Это позволяет использовать бинарный поиск вместо полного сканирования (full table scan), что снижает сложность поиска с O(n) до O(log n).","r":["Индекс не копирует все данные таблицы. Он содержит только значения индексируемого столбца (или нескольких столбцов) и указатели (row ID / pointer) на соответствующие строки в основной таблице. Хранение полной копии таблицы описывает другой механизм — материализованное представление.","Индекс не сжимает данные столбца. Индекс — это отдельная структура данных (например, B-tree), которая хранит отсортированные значения и указатели на строки. Сжатие данных — это отдельный механизм, не связанный с индексированием.","Индекс не управляет кэшированием столбцов в оперативной памяти. Кэширование — это задача буферного пула СУБД (buffer pool/cache), который работает независимо от наличия индексов. Индекс ускоряет поиск структурно, а не через принудительное кэширование.",null]},{"id":2,"n":2,"t":"SQL","l":"Junior","s":"Индексы - понимание принципов работы индексов и их влияния на скорость выполнения SELECT-запросов","q":"Какой индекс вы создадите для ускорения запроса SELECT * FROM hub_customer WHERE customer_bk = '12345'?","a":["Создам составной индекс на первичный ключ и customer_bk, например: CREATE INDEX idx_hub_cust ON hub_customer(hub_customer_id, customer_bk), чтобы индекс покрывал суррогатный ключ.","Создам индекс на столбец customer_bk, например: CREATE INDEX idx_hub_cust_bk ON hub_customer(customer_bk).","Создам индекс на все столбцы таблицы hub_customer, чтобы покрыть SELECT *, например: CREATE INDEX idx_hub_cust_all ON hub_customer(*), так запрос будет читать только индекс.","Дополнительный индекс не нужен, так как SELECT * возвращает все столбцы и база данных в любом случае выполнит полное сканирование таблицы (Full Table Scan), индекс здесь не поможет."],"c":1,"e":"Это оптимальное решение: простой индекс на столбец customer_bk позволит оптимизатору использовать Index Scan или Index Seek для условия WHERE customer_bk = '12345', резко сократив число читаемых строк по сравнению с Full Table Scan.","r":["Составной индекс (hub_customer_id, customer_bk) неоптимален для данного запроса. Первым столбцом стоит суррогатный ключ, по которому фильтрации нет. Индекс будет использоваться неэффективно, так как условие WHERE только по customer_bk, а он второй в индексе — без префиксного столбца B-tree индекс по нему работать эффективно не будет.",null,"Синтаксис CREATE INDEX idx ON table(*) не существует ни в одной СУБД. Индекс на все столбцы бессмысленен и невозможен таким образом. Покрывающий индекс для SELECT * тоже не имеет смысла, так как придётся включать все столбцы явно, что фактически дублирует таблицу.","Утверждение ошибочно. SELECT * не означает, что индекс бесполезен. Оптимизатор может использовать индекс на customer_bk для быстрого нахождения нужных строк (Index Scan + lookup), а затем вернуть все столбцы. Индекс значительно сократит количество читаемых блоков при высокой селективности столбца."]},{"id":3,"n":3,"t":"SQL","l":"Junior","s":"Партиционирование - понимание концепции партиций таблиц и использование условий фильтрации для эффективного чтения данных","q":"Почему добавление условия фильтрации по ключу партиционирования в WHERE существенно ускоряет чтение данных из партиционированной таблицы?","a":["Условие WHERE кэширует все партиции в оперативной памяти, поэтому повторное чтение происходит быстрее.","Фильтр по ключу партиционирования заставляет базу данных использовать параллельное выполнение запроса на всех партициях.","Ключ партиционирования автоматически создаёт индекс на каждой партиции, и фильтрация ускоряется за счёт индексного доступа.","Оптимизатор читает только релевантные партиции, пропуская остальные (partition pruning), что сокращает объём сканируемых данных."],"c":3,"e":"Именно так работает partition pruning (отсечение партиций): оптимизатор на этапе планирования запроса определяет, какие партиции могут содержать нужные данные, и полностью пропускает остальные. Это сокращает объём физически читаемых данных кратно количеству ненужных партиций.","r":["WHERE не кэширует партиции в оперативной памяти. Кэширование — это отдельный механизм СУБД (buffer pool/page cache), не связанный с логикой условий фильтрации. Повторное чтение может ускоряться из-за кэша буферного пула, но не из-за условия WHERE.","Фильтр по ключу партиционирования делает обратное — он СУЖАЕТ набор партиций до нужных (partition pruning), а не заставляет обрабатывать все партиции параллельно. Параллельное выполнение — отдельный механизм, не связанный напрямую с фильтрацией по ключу партиционирования.","Партиционирование само по себе НЕ создаёт автоматически индексы на партициях. Партиция — это физическое разделение данных, а не индексная структура. Индексы создаются отдельно и независимо от партиционирования.",null]},{"id":4,"n":4,"t":"SQL","l":"Junior","s":"Партиционирование - понимание концепции партиций таблиц и использование условий фильтрации для эффективного чтения данных","q":"Какое условие фильтрации нужно добавить в WHERE-клаузу запроса к таблице транзакций, партиционированной по дате, чтобы Oracle читал только один партиционный сегмент за январь 2024?","a":["WHERE EXTRACT(MONTH FROM transaction_date) = 1 AND EXTRACT(YEAR FROM transaction_date) = 2024, что позволит Oracle автоматически определить нужную партицию и выполнить partition pruning для января 2024 года","WHERE transaction_date BETWEEN '01-JAN-2024' AND '31-JAN-2024 23:59:59', так как оператор BETWEEN включает обе границы и Oracle гарантированно выполнит partition pruning при использовании строковых литералов дат","WHERE TO_CHAR(transaction_date, 'YYYY-MM') = '2024-01', поскольку Oracle оптимизатор достаточно умён, чтобы распознать функцию на партиционном ключе и всё равно применить partition pruning для чтения одного сегмента","WHERE transaction_date >= DATE '2024-01-01' AND transaction_date < DATE '2024-02-01', что обеспечит partition pruning — чтение только нужной партиции."],"c":3,"e":"Прямое сравнение партиционного ключа с литералами дат без оборачивания в функции позволяет Oracle выполнить partition pruning. Открытый правый диапазон (< 2024-02-01) корректно охватывает весь январь включая последний момент 31-го числа, не захватывая февральскую партицию.","r":["EXTRACT() — это функция, применяемая к столбцу transaction_date, что аналогично варианту с TO_CHAR(). Oracle не выполнит partition pruning, так как ключевой столбец трансформирован функцией. Оптимизатор не способен статически определить диапазон партиции через функциональные выражения.","Сразу две проблемы: 1) строковые литералы '01-JAN-2024' требуют неявного приведения типов, что зависит от NLS-настроек сессии и может вызвать ошибку или некорректное поведение; 2) BETWEEN включает верхнюю границу '31-JAN-2024 23:59:59', но если тип DATE хранит секунды, записи в 23:59:59.5 могут быть пропущены — надёжнее использовать открытый диапазон с <.","Применение функции TO_CHAR() к партиционному ключу transaction_date блокирует partition pruning. Oracle не может применить обрезку партиций, когда ключевой столбец обёрнут в функцию — оптимизатор вынужден сканировать все партиции (full partition scan).",null]},{"id":5,"n":5,"t":"SQL","l":"Junior","s":"Оптимизация SELECT-запросов - написание читаемых и эффективных запросов с учётом структуры таблиц DWH","q":"Почему в SELECT-запросах к DWH рекомендуется перечислять конкретные столбцы вместо использования SELECT *?","a":["Это нужно только для повышения читаемости кода, на производительность это не влияет","SELECT * увеличивает нагрузку на сеть, но зато ускоряет чтение данных с диска","Это снижает объём читаемых данных, ускоряет выполнение запроса и повышает читаемость кода","SELECT * запрещён синтаксисом SQL в большинстве современных СУБД, поэтому его нельзя использовать"],"c":2,"e":"Перечисление конкретных столбцов сокращает объём читаемых данных (особенно критично для колоночных СУБД типа Redshift, BigQuery, Snowflake), снижает нагрузку на сеть, ускоряет выполнение запроса и делает код понятнее для других разработчиков.","r":["Утверждение неверно. Перечисление конкретных столбцов влияет на производительность напрямую: в колоночных DWH (BigQuery, Redshift, Snowflake) читаются только нужные колонки, что кардинально снижает I/O. Влияние на производительность — ключевая причина, а не только читаемость.","Утверждение противоречиво и неверно. SELECT * не ускоряет чтение с диска — наоборот, он увеличивает объём читаемых данных (особенно в колоночных хранилищах DWH), что замедляет и дисковые операции, и сетевой трафик одновременно.",null,"Утверждение ложно. SELECT * является абсолютно корректным синтаксисом SQL и поддерживается всеми современными СУБД без исключения. Он не запрещён — просто не рекомендуется к использованию по соображениям производительности и сопровождаемости."]},{"id":6,"n":6,"t":"SQL","l":"Junior","s":"Оптимизация SELECT-запросов - написание читаемых и эффективных запросов с учётом структуры таблиц DWH","q":"Как вы перепишете SELECT * FROM hub_customer JOIN sat_customer_details ON ... в более оптимальный запрос для DWH на Data Vault?","a":["Оставить SELECT *, но добавить индексы на все столбцы обеих таблиц для максимального ускорения чтения.","Заменить SELECT * на явный список только нужных столбцов, чтобы снизить объём читаемых данных и повысить читаемость запроса.","Заменить JOIN на подзапросы с SELECT *, так как подзапросы всегда быстрее соединений в Data Vault.","Добавить SELECT DISTINCT * для устранения дубликатов, что автоматически ускорит выполнение запроса в DWH."],"c":1,"e":"Явный список столбцов вместо SELECT * — ключевая оптимизация для колоночных DWH. Читаются только нужные колонки, снижается сетевой трафик и нагрузка на память, улучшается читаемость и поддерживаемость запроса. В Data Vault сателлиты содержат много технических полей (load_date, record_source и др.), которые часто не нужны.","r":["В колоночных DWH (Snowflake, BigQuery, Redshift) традиционные индексы отсутствуют или работают иначе (зональные карты, кластеризация). Добавление индексов на все столбцы в строковых СУБД наоборот замедляет запись и не решает проблему избыточного чтения данных при SELECT *.",null,"Подзапросы не всегда быстрее JOIN-ов. В большинстве колоночных DWH (Snowflake, BigQuery, Redshift) оптимизатор хорошо справляется с JOIN-ами, а подзапросы с SELECT * не решают проблему избыточного чтения данных и могут создавать дополнительные накладные расходы.","SELECT DISTINCT * добавляет операцию дедупликации, что увеличивает нагрузку на вычисления и замедляет запрос. В Data Vault дубликаты устраняются на этапе загрузки через хэш-ключи, а не на уровне SELECT. DISTINCT не является инструментом оптимизации производительности."]},{"id":7,"n":7,"t":"Oracle PL/SQL","l":"Junior","s":"View в Oracle - создание и замена представлений (CREATE OR REPLACE VIEW) для формирования витрин данных и слоёв абстракции над Raw Vault","q":"Какое ключевое преимущество CREATE OR REPLACE VIEW перед DROP/CREATE при изменении представления?","a":["Сохраняет зависимости, привилегии и гранты без пересоздания объекта.","Блокирует таблицу на время изменения, обеспечивая safety.","Автоматически создаёт резервную копию старого представления.","Работает быстрее за счёт кэширования данных представления."],"c":0,"e":"При DROP + CREATE все выданные привилегии (GRANT) теряются и объект пересоздаётся заново. CREATE OR REPLACE заменяет только определение представления, сохраняя все зависимости, привилегии и гранты на объект — это ключевое преимущество.","r":[null,"CREATE OR REPLACE VIEW не блокирует базовые таблицы. View — это лишь метаданные (хранимый запрос), и его замена работает с системными словарями, а не с данными таблиц.","CREATE OR REPLACE VIEW не создаёт никаких резервных копий. Старое определение представления просто перезаписывается новым без какого-либо архивирования или бэкапа.","View в Oracle не кэширует данные — это просто хранимый SQL-запрос. Никакого кэширования данных при CREATE OR REPLACE не происходит, производительность замены не связана с кэшем."]},{"id":8,"n":8,"t":"Oracle PL/SQL","l":"Junior","s":"View в Oracle - создание и замена представлений (CREATE OR REPLACE VIEW) для формирования витрин данных и слоёв абстракции над Raw Vault","q":"Как создать представление-витрину поверх Raw Vault хаба HUB_CUSTOMER, чтобы при изменении логики оно обновлялось без удаления?","a":["CREATE OR REPLACE VIEW v_dim_customer AS SELECT hub_customer_hk, customer_bk, load_date FROM hub_customer — однако REPLACE работает только если структура столбцов не изменилась, при добавлении новых колонок потребуется DROP и повторный CREATE.","CREATE OR REPLACE VIEW v_dim_customer AS SELECT hub_customer_hk, customer_bk, load_date FROM hub_customer — ключевое слово REPLACE позволяет обновлять определение без DROP.","ALTER VIEW v_dim_customer AS SELECT hub_customer_hk, customer_bk, load_date FROM hub_customer — команда ALTER VIEW обновляет определение без удаления.","DROP VIEW v_dim_customer; CREATE VIEW v_dim_customer AS SELECT hub_customer_hk, customer_bk, load_date FROM hub_customer — сначала нужно удалить старое представление командой DROP, а затем создать заново, иначе Oracle выдаст ошибку ORA-00955."],"c":1,"e":"CREATE OR REPLACE VIEW — правильный синтаксис Oracle для создания или замены существующего представления без предварительного DROP. Если представление уже существует, его определение заменяется новым, права на объект сохраняются. Это именно то, что нужно для обновления витрины поверх Raw Vault хаба HUB_CUSTOMER.","r":["Утверждение о том, что REPLACE работает только при неизменной структуре столбцов, является ложным. CREATE OR REPLACE VIEW в Oracle позволяет изменять и количество столбцов, и их типы, и порядок — без необходимости выполнять DROP. Ограничение существует лишь для столбцов, на которые ссылаются зависимые объекты с явными именами, но это не общее правило.",null,"В Oracle не существует команды ALTER VIEW для изменения определения (SELECT-части) представления. ALTER VIEW используется только для перекомпиляции (ALTER VIEW ... COMPILE) или добавления/изменения ограничений. Изменить логику запроса через ALTER VIEW нельзя — Oracle выдаст ошибку.","Использование DROP VIEW перед CREATE VIEW является избыточным и опасным подходом: при DROP теряются все выданные привилегии на представление, зависимые объекты становятся невалидными. Кроме того, ORA-00955 возникает при попытке CREATE без OR REPLACE, если объект существует — но правильное решение это именно OR REPLACE, а не DROP."]},{"id":9,"n":9,"t":"Oracle PL/SQL","l":"Junior","s":"Управление транзакциями в PL/SQL - использование COMMIT, ROLLBACK и SAVEPOINT для обеспечения целостности данных при загрузке в таблицы линков и сателлитов","q":"Почему при загрузке данных в сателлиты рекомендуется использовать SAVEPOINT перед каждым этапом, а не один COMMIT в конце всего процесса?","a":["SAVEPOINT нужен для того, чтобы каждый этап загрузки выполнялся в отдельной независимой транзакции, что позволяет параллельно обрабатывать несколько сателлитов без взаимных блокировок и конфликтов","SAVEPOINT позволяет откатить только неудавшийся этап, сохранив успешно загруженные данные предыдущих этапов, вместо потери всей работы при ошибке","SAVEPOINT ускоряет процесс загрузки, так как база данных не блокирует таблицы между этапами","SAVEPOINT автоматически фиксирует данные каждого этапа в базе, поэтому при ошибке уже не нужно делать COMMIT для сохранённых частей"],"c":1,"e":"Это корректное описание назначения SAVEPOINT. При многоэтапной загрузке сателлитов SAVEPOINT позволяет при ошибке на конкретном этапе откатиться только до последней точки сохранения (ROLLBACK TO SAVEPOINT), сохранив результаты предыдущих успешно выполненных этапов, вместо полного отката всей транзакции.","r":["SAVEPOINT не создаёт отдельные независимые транзакции — все точки сохранения существуют внутри одной транзакции. Параллельная обработка нескольких сателлитов без конфликтов достигается иными механизмами (отдельные сессии, автономные транзакции), но не через SAVEPOINT.",null,"SAVEPOINT не влияет на блокировки таблиц и не ускоряет загрузку. Блокировки удерживаются на протяжении всей транзакции независимо от наличия точек сохранения. SAVEPOINT — это механизм управления откатом, а не оптимизации производительности или блокировок.","SAVEPOINT не фиксирует данные автоматически — это принципиальная ошибка. Данные остаются частью текущей незавершённой транзакции и становятся постоянными только после явного COMMIT. До COMMIT изменения невидимы другим сессиям и могут быть откачены."]},{"id":10,"n":10,"t":"Oracle PL/SQL","l":"Junior","s":"Управление транзакциями в PL/SQL - использование COMMIT, ROLLBACK и SAVEPOINT для обеспечения целостности данных при загрузке в таблицы линков и сателлитов","q":"Как с помощью SAVEPOINT организовать загрузку данных в линк и его сателлит, чтобы при ошибке вставки в сателлит откатить только сателлит, сохранив линк?","a":["Перед INSERT в линк установить SAVEPOINT before_link, после INSERT в сателлит при ошибке выполнить ROLLBACK TO before_link, а затем COMMIT — это откатит только сателлит, сохранив линк в базе данных.","После INSERT в линк установить SAVEPOINT before_satellite, при ошибке выполнить ROLLBACK TO before_satellite, а затем COMMIT для сохранения линка.","После INSERT в линк выполнить COMMIT для его фиксации, затем установить SAVEPOINT before_satellite перед вставкой в сателлит, при ошибке выполнить ROLLBACK TO before_satellite — но SAVEPOINT не работает после COMMIT, поэтому нужно использовать автономную транзакцию.","Установить SAVEPOINT before_satellite перед INSERT в линк, затем вставить данные в линк и сателлит, при ошибке в сателлите выполнить ROLLBACK TO before_satellite и повторный COMMIT — это откатит только сателлит благодаря порядку операций."],"c":1,"e":"SAVEPOINT устанавливается ПОСЛЕ успешного INSERT в линк, но ДО INSERT в сателлит. При ошибке в сателлите ROLLBACK TO before_satellite откатывает только изменения после savepoint (то есть только сателлит), а INSERT в линк остаётся в транзакции. Последующий COMMIT фиксирует линк.","r":["SAVEPOINT before_link установлен ДО INSERT в линк. ROLLBACK TO before_link откатит и линк, и сателлит — то есть оба изменения будут отменены. Цель — сохранить линк — не будет достигнута. Последующий COMMIT зафиксирует пустую транзакцию.",null,"Неверно сразу по двум причинам: 1) SAVEPOINT действительно сбрасывается после COMMIT, так что before_satellite будет недействителен — это верное наблюдение. Но 2) вывод о необходимости автономной транзакции ошибочен: автономная транзакция решает другую задачу (независимая фиксация). Правильное решение — просто не делать промежуточный COMMIT, а ставить SAVEPOINT после линка.","SAVEPOINT before_satellite установлен ДО INSERT в линк, значит откат к нему отменит и линк, и сателлит одновременно. Порядок операций после savepoint не влияет на то, что попадает под откат — откатывается всё, что было сделано после точки сохранения."]},{"id":11,"n":11,"t":"Oracle PL/SQL","l":"Junior","s":"Динамический SQL в PL/SQL - использование EXECUTE IMMEDIATE для выполнения параметризованных DDL и DML операций по шаблону в рамках ETL-блоков","q":"Почему для выполнения DDL-операций внутри PL/SQL-блока необходимо использовать EXECUTE IMMEDIATE, а не просто написать DDL-команду напрямую?","a":["DDL-команды требуют отдельного подключения к базе, а EXECUTE IMMEDIATE открывает вложенную сессию для их выполнения.","EXECUTE IMMEDIATE нужен только для логирования DDL-операций, без него Oracle не записывает изменения в журнал транзакций.","DDL-команды напрямую работают, но EXECUTE IMMEDIATE просто ускоряет их выполнение за счёт обхода оптимизатора.","PL/SQL-компилятор не поддерживает DDL-команды как статические выражения, поэтому их можно выполнить только динамически через EXECUTE IMMEDIATE."],"c":3,"e":"PL/SQL действительно не позволяет использовать DDL-команды (CREATE, DROP, ALTER, TRUNCATE и т.д.) как статические выражения внутри блока. Компилятор PL/SQL разбирает только DML и некоторые другие конструкции на этапе компиляции, а DDL требует выполнения через динамический SQL — EXECUTE IMMEDIATE или DBMS_SQL.","r":["Утверждение ложное. EXECUTE IMMEDIATE не открывает никакой вложенной сессии и не требует отдельного подключения. DDL выполняется в той же сессии и том же соединении. EXECUTE IMMEDIATE — это механизм динамического SQL внутри текущего контекста выполнения PL/SQL-блока.","Утверждение ложное. EXECUTE IMMEDIATE не имеет никакого отношения к логированию DDL в журнал транзакций. DDL-операции автоматически фиксируются Oracle в redo log вне зависимости от способа их выполнения. Кроме того, DDL в Oracle неявно выполняет COMMIT до и после себя.","Утверждение ложное по двум причинам: во-первых, DDL-команды нельзя написать напрямую в статическом PL/SQL-блоке — это вызовет ошибку компиляции. Во-вторых, EXECUTE IMMEDIATE не обходит оптимизатор и не ускоряет DDL — он является единственным способом их выполнения внутри PL/SQL, а не альтернативным путём для оптимизации.",null]},{"id":12,"n":12,"t":"Oracle PL/SQL","l":"Junior","s":"Динамический SQL в PL/SQL - использование EXECUTE IMMEDIATE для выполнения параметризованных DDL и DML операций по шаблону в рамках ETL-блоков","q":"Как с помощью EXECUTE IMMEDIATE создать staging-таблицу с динамическим именем, включающим дату загрузки, в ETL-процессе?","a":["EXECUTE IMMEDIATE 'CREATE TABLE STG_SALES_' || TO_CHAR(SYSDATE,'YYYYMMDD') || ' AS SELECT * FROM SRC_SALES WHERE 1=0' — формирует DDL-строку с конкатенацией даты.","EXECUTE IMMEDIATE 'CREATE TABLE STG_SALES_' || TO_CHAR(SYSDATE,'YYYYMMDD') || ' (LIKE SRC_SALES INCLUDING ALL)' — использует конструкцию LIKE INCLUDING ALL для копирования структуры исходной таблицы в Oracle PL/SQL.","EXECUTE IMMEDIATE 'CREATE TABLE STG_SALES_:dt AS SELECT * FROM SRC_SALES WHERE 1=0' USING TO_CHAR(SYSDATE,'YYYYMMDD') — передаёт имя таблицы через bind-переменную в USING, что корректно параметризует DDL-операцию.","EXECUTE IMMEDIATE 'ALTER SESSION SET TABLE_PREFIX = ''STG_SALES_' || TO_CHAR(SYSDATE,'YYYYMMDD') || ''''; EXECUTE IMMEDIATE 'CREATE TABLE FROM TEMPLATE SRC_SALES' — задаёт динамическое имя через параметр сессии и создаёт таблицу по шаблону."],"c":0,"e":"Корректный подход: DDL-строка формируется через конкатенацию строк с TO_CHAR(SYSDATE,'YYYYMMDD'), что даёт динамическое имя таблицы. Конструкция 'AS SELECT * FROM SRC_SALES WHERE 1=0' создаёт таблицу с нужной структурой без данных. EXECUTE IMMEDIATE выполняет готовую строку — стандартная практика для DDL в ETL.","r":[null,"Синтаксис 'CREATE TABLE ... (LIKE ... INCLUDING ALL)' — это конструкция PostgreSQL, а не Oracle. В Oracle для копирования структуры таблицы используется 'CREATE TABLE ... AS SELECT * FROM ... WHERE 1=0'. В Oracle такой синтаксис вызовет ошибку ORA-00904 или ORA-00907.","В Oracle bind-переменные через USING нельзя использовать для подстановки идентификаторов (имён таблиц, столбцов, схем) — только для значений данных в DML/SELECT. В DDL-операции ':dt' как имя таблицы не будет заменено значением из USING, что вызовет ошибку ORA-00903 (invalid table name).","В Oracle не существует параметра сессии TABLE_PREFIX и команды 'CREATE TABLE FROM TEMPLATE'. Такой синтаксис полностью выдуман и не является частью Oracle SQL. Оба EXECUTE IMMEDIATE вызовут ошибку ORA-00922 (invalid option) и ORA-00903 соответственно."]},{"id":13,"n":13,"t":"Informatica PC","l":"Junior","s":"Трансформации Filter и Router в Informatica PowerCenter — фильтрация и маршрутизация записей по условию статуса","q":"Почему для маршрутизации записей по нескольким условиям предпочтительнее использовать Router вместо нескольких Filter-трансформаций?","a":["Filter не поддерживает работу со строковыми полями, поэтому Router универсальнее для любых типов данных","Router автоматически удаляет дубликаты при маршрутизации, что невозможно сделать с помощью Filter","Router читает данные один раз, а несколько Filter требуют отдельных конвейеров, увеличивая нагрузку на источник","Router позволяет использовать агрегатные функции в условиях, а Filter поддерживает только простые выражения"],"c":2,"e":"Router читает входной поток данных единожды и распределяет записи по группам-выходам на основе условий. При использовании нескольких Filter-трансформаций каждый Filter обрабатывает весь поток независимо, что фактически создаёт несколько параллельных конвейеров и увеличивает нагрузку на источник и производительность маппинга.","r":["Filter прекрасно работает со строковыми полями — поддерживаются все типы данных, включая строки, числа, даты. Ограничений по типу данных у Filter нет. Это утверждение полностью ложное и не отражает реальное поведение трансформации.","Router не выполняет дедупликацию записей — это не его функция. Удаление дубликатов реализуется другими средствами, например через Sorter или SQL-логику. Router лишь распределяет записи по группам согласно заданным условиям.",null,"Router не поддерживает агрегатные функции в условиях маршрутизации — это ограничение применимо к обеим трансформациям. Агрегатные функции используются в Aggregator-трансформации. Условия в Router — это обычные логические выражения, аналогичные Filter."]},{"id":14,"n":14,"t":"Informatica PC","l":"Junior","s":"Трансформации Filter и Router в Informatica PowerCenter — фильтрация и маршрутизация записей по условию статуса","q":"Какую трансформацию следует использовать вместо нескольких Filter для маршрутизации записей по трём различным значениям статуса заказа?","a":["Router, так как он позволяет задать несколько групп условий в одной трансформации вместо нескольких отдельных Filter.","Filter, так как можно объединить все три условия в одном выражении через оператор OR и направить записи в один выходной поток","Expression, так как она позволяет вычислить значение статуса и на основе результата автоматически распределить записи по нескольким целевым таблицам","Joiner, так как он объединяет потоки данных по условию совпадения значений статуса"],"c":0,"e":"Router — это именно та трансформация, которая позволяет задать несколько групп условий (groups) внутри одной трансформации и направить каждую запись в соответствующий выходной поток. Это прямая замена нескольким последовательным Filter трансформациям.","r":[null,"Filter с OR не разделяет записи по разным потокам — он лишь пропускает или блокирует записи целиком. Чтобы направить записи по трём разным значениям статуса в три разных потока, Filter принципиально не подходит.","Expression трансформация предназначена для вычисления выражений и добавления новых полей, но не умеет автоматически распределять записи по нескольким выходным потокам или целевым таблицам. Такой функциональности у неё нет.","Joiner предназначен для объединения двух входных потоков данных по условию совпадения ключей (аналог JOIN в SQL). Он никак не связан с маршрутизацией или фильтрацией записей по значению статуса."]},{"id":15,"n":15,"t":"Модели данных DWH","l":"Junior","s":"Отличие Data Vault от Star Schema - ключевые концептуальные различия в структуре хранения и назначении объектов","q":"Почему Data Vault лучше Star Schema адаптируется к изменениям источников данных?","a":["Data Vault использует денормализованные таблицы фактов, которые автоматически расширяются при появлении новых источников без участия разработчика","Data Vault хранит все данные в одной универсальной таблице, поэтому любые изменения источников не требуют модификации схемы базы данных","Data Vault лучше адаптируется благодаря отсутствию связей между таблицами","Разделение на хабы, линки и сателлиты позволяет добавлять новые атрибуты и связи без изменения существующих структур"],"c":3,"e":"Архитектура Data Vault разработана именно для гибкости: хабы хранят бизнес-ключи и не меняются при добавлении атрибутов, новые атрибуты добавляются через новые сателлиты без изменения существующих таблиц, новые связи добавляются через новые линки. Это позволяет расширять модель без разрушения существующей структуры.","r":["Data Vault использует нормализованные структуры, а не денормализованные таблицы фактов — это характеристика Star Schema. Кроме того, автоматического расширения без участия разработчика не существует: любые изменения требуют проектирования новых сателлитов или линков.","Data Vault не хранит данные в одной универсальной таблице — это принципиально неверно. Архитектура Data Vault разделяет данные на три типа структур: хабы, линки и сателлиты. Описанное поведение больше напоминает антипаттерн 'God Table'.","Утверждение ложно: Data Vault как раз строится на явных связях между таблицами — линки (Links) специально предназначены для хранения связей между хабами. Отсутствие связей не является ни характеристикой, ни преимуществом Data Vault.",null]},{"id":16,"n":16,"t":"Модели данных DWH","l":"Junior","s":"Отличие Data Vault от Star Schema - ключевые концептуальные различия в структуре хранения и назначении объектов","q":"Какую модель — Data Vault или Star Schema — вы выберете для слоя хранилища, если бизнес-источники часто добавляются и изменяются?","a":["Лучше выбрать Star Schema, ведь Data Vault требует полной перестройки модели при добавлении каждого нового источника.","Data Vault, так как её структура хабов, линков и сателлитов позволяет добавлять новые источники без перестройки существующей модели.","Data Vault, но только потому, что она быстрее работает при аналитических запросах к часто меняющимся данным.","Star Schema, так как её простая структура фактов и измерений легко адаптируется к любым изменениям источников."],"c":1,"e":"Архитектура Data Vault построена так, чтобы новые источники, атрибуты и связи добавлялись через новые сателлиты и линки без изменения существующих объектов. Хабы содержат бизнес-ключи и остаются стабильными. Это делает Data Vault идеальным выбором для часто меняющейся источниковой среды.","r":["Утверждение ошибочно: как раз Data Vault НЕ требует перестройки при добавлении новых источников — это его главное преимущество. Новые источники просто добавляются через новые сателлиты или линки, не затрагивая существующую структуру. Star Schema, напротив, при добавлении новых источников часто требует изменения измерений и таблиц фактов.",null,"Утверждение содержит ложный аргумент: Data Vault как раз медленнее при аналитических запросах из-за большого количества джоинов между хабами, линками и сателлитами. Преимущество Data Vault — гибкость к изменениям, а не скорость аналитики. Для быстрых аналитических запросов поверх Data Vault строят витрины в виде Star Schema.","Star Schema плохо адаптируется к частым изменениям источников: добавление нового источника или изменение атрибутов требует изменения существующих таблиц фактов и измерений, что может сломать существующую логику и витрины. Star Schema оптимальна для стабильных, устоявшихся требований к отчётности, а не для volatile-среды."]},{"id":17,"n":17,"t":"Модели данных DWH","l":"Junior","s":"Типы объектов Data Vault - назначение и взаимосвязь hub, link и satellite в модели хранилища","q":"Почему в Data Vault описательные атрибуты бизнес-объектов выносятся в satellite, а не хранятся непосредственно в hub?","a":["Чтобы hub оставался неизменяемым ключевым ядром, а satellite отслеживал историю изменений атрибутов независимо.","Потому что hub не поддерживает текстовые типы данных, только числовые суррогатные ключи.","Чтобы уменьшить размер таблиц hub за счёт нормализации и ускорить JOIN-операции.","Атрибуты выносятся в satellite временно, а после валидации переносятся обратно в hub."],"c":0,"e":"Это верный ответ. Hub хранит только бизнес-ключ и системные поля (load date, record source), оставаясь неизменяемым. Satellite же содержит описательные атрибуты с временными метками, что позволяет отслеживать полную историю их изменений независимо и без модификации hub.","r":[null,"Это технически неверно. Hub может содержать текстовые поля — например, бизнес-ключ нередко является строкой. Ограничений на типы данных в hub не существует. Причина выноса атрибутов в satellite совершенно иная — архитектурная, а не техническая.","Нормализация и ускорение JOIN — не основная причина. Напротив, наличие satellite создаёт дополнительные JOIN-операции, а не сокращает их. Цель разделения — отслеживание истории изменений и гибкость архитектуры, а не оптимизация размера таблиц.","Это полностью вымышленный процесс. В Data Vault атрибуты никогда не переносятся из satellite обратно в hub — это противоречит самой архитектуре. Satellite является постоянным местом хранения описательных данных, а не временным буфером."]},{"id":18,"n":18,"t":"Модели данных DWH","l":"Junior","s":"Типы объектов Data Vault - назначение и взаимосвязь hub, link и satellite в модели хранилища","q":"Какой объект Data Vault вы создадите для хранения истории изменений описательных атрибутов клиента, таких как адрес и телефон?","a":["Hub клиента, потому что все данные о клиенте, включая историю изменений, хранятся в одном hub","Satellite, привязанный к Hub клиента, так как satellite хранит историзируемые описательные атрибуты бизнес-объекта.","Hub клиента, так как hub является основным объектом для хранения всех атрибутов бизнес-объекта, включая описательные и исторические данные, такие как адрес и телефон","Link, связывающий клиента с его атрибутами, так как link отвечает за хранение связей между данными"],"c":1,"e":"Satellite — это именно тот объект Data Vault, который предназначен для хранения описательных атрибутов (адрес, телефон и т.д.) с полной историей изменений. Satellite привязывается к Hub через его хэш-ключ и содержит даты загрузки, что обеспечивает версионирование данных.","r":["Hub не предназначен для хранения истории изменений или описательных атрибутов. Его единственная функция — идентификация уникального бизнес-объекта по бизнес-ключу. История изменений — это функция Satellite.",null,"Hub хранит только уникальные бизнес-ключи сущности и технические метаданные (дата загрузки, источник). Описательные атрибуты и история их изменений в Hub не хранятся — это зона ответственности Satellite.","Link предназначен для хранения связей (ассоциаций) между бизнес-объектами, например между клиентом и заказом. Он не хранит описательные атрибуты и не обеспечивает историзацию изменений свойств объекта."]},{"id":19,"n":19,"t":"Модели данных DWH","l":"Junior","s":"Техническое задание на создание объектов Data Vault - чтение, интерпретация и реализация без архитектурных решений","q":"Почему в техническом задании на Data Vault хабы содержат только бизнес-ключ, а не описательные атрибуты?","a":["Хабы содержат только бизнес-ключ из-за ограничений производительности базы данных, так как добавление описательных атрибутов замедляет операции соединения таблиц.","Это сделано для экономии дискового пространства в хранилище данных.","Описательные атрибуты не включаются в хабы, потому что они хранятся в линках, которые связывают бизнес-объекты между собой и одновременно содержат их характеристики.","Описательные атрибуты выносятся в сателлиты для отслеживания истории их изменений отдельно от уникальной идентификации бизнес-объекта."],"c":3,"e":"Это фундаментальный принцип Data Vault: хаб отвечает исключительно за уникальную идентификацию бизнес-объекта через бизнес-ключ, а описательные атрибуты выносятся в сателлиты, что позволяет независимо отслеживать историю изменений каждого атрибута, не затрагивая структуру хаба.","r":["Производительность операций JOIN не является причиной разделения атрибутов и бизнес-ключей в Data Vault. Архитектурное решение продиктовано методологическими принципами разделения ответственности и управления историей изменений, а не техническими ограничениями базы данных.","Экономия дискового пространства не является причиной данного архитектурного решения. Напротив, Data Vault нередко требует больше места по сравнению с другими подходами из-за хранения полной истории изменений в сателлитах и служебных метаданных во всех таблицах.","Линки в Data Vault предназначены исключительно для хранения связей между хабами (бизнес-объектами) и не содержат описательных атрибутов самих объектов. Описательные атрибуты хранятся в сателлитах, которые присоединяются как к хабам, так и к линкам.",null]},{"id":20,"n":20,"t":"Модели данных DWH","l":"Junior","s":"Техническое задание на создание объектов Data Vault - чтение, интерпретация и реализация без архитектурных решений","q":"Какой тип объекта Data Vault вы создадите для хранения бизнес-ключа клиента, указанного в техническом задании как основная сущность?","a":["Link (линк), связывающий клиента с другими сущностями и содержащий бизнес-ключ, хеш-ключ и дату загрузки","Hub (хаб), содержащий бизнес-ключ клиента, хеш-ключ, дату загрузки и источник записи.","Hub (хаб), содержащий бизнес-ключ клиента, все описательные атрибуты сущности, дату загрузки и источник записи","Satellite (сателлит), хранящий бизнес-ключ клиента вместе с описательными атрибутами, датой загрузки и источником записи"],"c":1,"e":"Hub — это именно тот объект Data Vault, который предназначен для хранения бизнес-ключа основной сущности. Структура хаба строго определена: бизнес-ключ, суррогатный хеш-ключ (HashKey), дата загрузки (LoadDate) и источник записи (RecordSource). Никаких описательных атрибутов в хабе нет.","r":["Link предназначен для хранения связей между двумя и более сущностями (хабами), а не для хранения бизнес-ключа одной основной сущности. Кроме того, Link не содержит бизнес-ключей — он содержит хеш-ключи родительских хабов.",null,"Hub не должен содержать описательные атрибуты сущности. Это фундаментальное нарушение принципов Data Vault: хаб хранит только бизнес-ключ, хеш-ключ, дату загрузки и источник. Описательные атрибуты выносятся в Satellite.","Satellite не хранит бизнес-ключ — он хранит описательные (контекстные) атрибуты и ссылается на родительский Hub через его хеш-ключ. Бизнес-ключ является прерогативой исключительно Hub-объекта."]},{"id":21,"n":21,"t":"SQL","l":"Middle","s":"Оконные функции PARTITION BY и ORDER BY — вычисление нарастающего итога и скользящих агрегатов по счетам клиентов","q":"Почему при вычислении нарастающего итога необходимо указывать ORDER BY внутри OVER()?","a":["ORDER BY задаёт порядок строк и активирует фрейм RANGE UNBOUNDED PRECEDING AND CURRENT ROW, без которого агрегат считается по всей партиции.","ORDER BY внутри OVER() необходим исключительно для сортировки итогового результата запроса, а без него результат возвращается в произвольном порядке, что не влияет на саму агрегацию.","Без ORDER BY оконная функция не может определить, к какой партиции относится строка, поэтому PARTITION BY перестаёт работать и агрегат вычисляется по всей таблице без разбиения на группы.","ORDER BY активирует фрейм ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING, который ограничивает вычисление только текущей строкой, без него агрегат считался бы по всей партиции целиком."],"c":0,"e":"Именно так и работает механизм: ORDER BY внутри OVER() задаёт логический порядок строк в партиции и по умолчанию активирует фрейм RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW, что и обеспечивает нарастающий итог. Без ORDER BY фрейм по умолчанию становится RANGE BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING, то есть агрегат считается по всей партиции целиком.","r":[null,"ORDER BY внутри OVER() не имеет никакого отношения к сортировке итогового результата запроса — для этого используется ORDER BY на уровне всего SELECT. ORDER BY внутри OVER() определяет логический порядок строк в партиции и активирует фрейм нарастающего итога, то есть напрямую влияет на результат агрегации.","PARTITION BY и ORDER BY внутри OVER() — независимые механизмы. ORDER BY никак не влияет на работу PARTITION BY: разбиение на партиции выполняется независимо от наличия ORDER BY. Без ORDER BY партиции по-прежнему формируются корректно, просто агрегат вычисляется по всей партиции, а не нарастающим итогом.","Два грубых ошибки: во-первых, ORDER BY активирует фрейм RANGE UNBOUNDED PRECEDING AND CURRENT ROW, а не ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING. Во-вторых, фрейм UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING — это как раз режим 'вся партиция целиком', а не ограничение только текущей строкой. Описание полностью перевёрнуто."]},{"id":22,"n":22,"t":"SQL","l":"Middle","s":"Оконные функции PARTITION BY и ORDER BY — вычисление нарастающего итога и скользящих агрегатов по счетам клиентов","q":"Как с помощью оконной функции вычислить скользящее среднее суммы транзакций за последние 3 операции по каждому счёту клиента?","a":["AVG(txn_amount) OVER (PARTITION BY account_id ORDER BY txn_date ROWS BETWEEN 3 PRECEDING AND CURRENT ROW)","AVG(txn_amount) OVER (PARTITION BY account_id ORDER BY txn_date RANGE BETWEEN 2 PRECEDING AND CURRENT ROW)","AVG(txn_amount) OVER (PARTITION BY account_id ORDER BY txn_date ROWS BETWEEN 1 PRECEDING AND 1 FOLLOWING)","AVG(txn_amount) OVER (PARTITION BY account_id ORDER BY txn_date ROWS BETWEEN 2 PRECEDING AND CURRENT ROW)"],"c":3,"e":"ROWS BETWEEN 2 PRECEDING AND CURRENT ROW корректно захватывает ровно 3 строки: 2 предыдущие и текущую. PARTITION BY account_id разбивает по счёту, ORDER BY txn_date задаёт порядок. Итого AVG считается по последним 3 транзакциям каждого счёта.","r":["ROWS BETWEEN 3 PRECEDING AND CURRENT ROW захватывает 4 строки (3 предыдущих + текущая), а не последние 3 операции. Среднее вычисляется по 4 транзакциям, что не соответствует условию 'последние 3 операции'.","Использует RANGE вместо ROWS. RANGE BETWEEN 2 PRECEDING AND CURRENT ROW работает с диапазоном значений дат (логический диапазон), а не с фиксированным числом строк. Это не гарантирует ровно 3 операции — попадут все строки, чьё значение txn_date попадает в диапазон, что может дать неверный результат.","ROWS BETWEEN 1 PRECEDING AND 1 FOLLOWING захватывает окно из 3 строк (1 предыдущая, текущая, 1 следующая) — это скользящее среднее с заглядыванием вперёд, а не среднее за последние 3 операции. Включение будущей строки некорректно для расчёта по прошлым транзакциям.",null]},{"id":23,"n":23,"t":"SQL","l":"Middle","s":"Планы выполнения запросов — чтение EXPLAIN/EXPLAIN ANALYZE для диагностики неэффективных операций в SELECT-запросах разработчика","q":"Какая наиболее частая причина расхождения оценок строк в EXPLAIN и EXPLAIN ANALYZE?","a":["Разница возникает из-за округления чисел в выводе EXPLAIN","Устаревшая статистика таблиц приводит к неточным оценкам кардинальности оптимизатора.","Расхождение вызвано различием между cold cache и warm cache при повторных запусках запроса","Параллельное выполнение запроса искажает подсчёт строк"],"c":1,"e":"Оптимизатор PostgreSQL строит оценки кардинальности на основе статистики (pg_statistic), собираемой командой ANALYZE. Если статистика устарела (после массовых INSERT/UPDATE/DELETE), оценки rows в EXPLAIN расходятся с реальными actual rows в EXPLAIN ANALYZE — это наиболее частая и задокументированная причина.","r":["EXPLAIN отображает числа с достаточной точностью (включая дробные значения rows), округление не является причиной расхождения с реальными строками в EXPLAIN ANALYZE. Это поверхностное и неверное объяснение.",null,"Cold/warm cache влияет на время выполнения (actual time), но не на количество реально обработанных строк (actual rows). Расхождение оценок строк с этим не связано.","При параллельном выполнении EXPLAIN ANALYZE показывает строки по каждому worker отдельно, однако это особенность отображения, а не причина расхождения оценок. Сам подсчёт строк на уровне плана остаётся корректным при правильной интерпретации вывода."]},{"id":24,"n":24,"t":"SQL","l":"Middle","s":"Планы выполнения запросов — чтение EXPLAIN/EXPLAIN ANALYZE для диагностики неэффективных операций в SELECT-запросах разработчика","q":"Какой шаг вы предпримете, если EXPLAIN ANALYZE показывает Seq Scan на большой таблице хаба с фильтрацией по business key в WHERE-условии?","a":["Удалю WHERE-условие по business key и перенесу фильтрацию на уровень приложения, так как Seq Scan возникает именно из-за наличия предиката в запросе.","Увеличу значение work_mem и shared_buffers, чтобы PostgreSQL мог выполнить Seq Scan быстрее за счёт кэширования данных в оперативной памяти.","Перепишу запрос с использованием подзапроса или CTE, поскольку оптимизатор автоматически выберет Index Scan при изменении структуры запроса.","Создам индекс на колонку business key, чтобы заменить Seq Scan на Index Scan и ускорить фильтрацию."],"c":3,"e":"Создание индекса на колонку business key — корректное решение. Оно позволяет оптимизатору переключиться с Seq Scan на Index Scan при фильтрации по этой колонке, что критически важно для больших таблиц хабов в Data Vault, где business key является ключевым атрибутом поиска.","r":["Seq Scan возникает не из-за наличия WHERE-условия, а из-за отсутствия подходящего индекса или низкой селективности предиката. Перенос фильтрации в приложение приведёт к передаче огромного объёма данных по сети и ухудшит производительность, а не улучшит её.","Увеличение work_mem и shared_buffers может ускорить Seq Scan за счёт кэширования, но не устраняет саму проблему — полное сканирование большой таблицы. Это паллиативная мера, не решающая первопричину: отсутствие индекса на business key для точечной фильтрации.","Переписывание запроса через CTE или подзапрос не гарантирует смену плана на Index Scan. Оптимизатор принимает решение на основе статистики, наличия индексов и стоимостных оценок. Если индекса на business key нет — никакая переструктуризация запроса не заставит PostgreSQL использовать Index Scan.",null]},{"id":25,"n":25,"t":"SQL","l":"Middle","s":"Фильтрация в JOIN vs WHERE — разница между условиями ON и WHERE при работе с OUTER JOIN в запросах загрузки данных","q":"Почему перенос фильтрующего условия из ON в WHERE при LEFT JOIN может привести к потере строк из левой таблицы?","a":["ON ограничивает только правую таблицу, а WHERE всегда дублирует строки левой таблицы","WHERE применяет фильтр до выполнения соединения, поэтому строки левой таблицы, не прошедшие фильтр, исключаются ещё на этапе подготовки данных","WHERE отбрасывает строки с NULL после соединения, фактически превращая LEFT JOIN во INNER JOIN.","WHERE автоматически меняет порядок соединения таблиц, делая правую таблицу ведущей"],"c":2,"e":"При LEFT JOIN строки левой таблицы, не имеющие совпадений в правой, получают NULL в столбцах правой таблицы. Если условие фильтрации перенесено в WHERE и оно проверяет столбец правой таблицы (например, right.col = 'X'), то строки с NULL не пройдут это условие и будут отброшены. Итог — поведение как у INNER JOIN.","r":["Утверждение содержит две ошибки. Во-первых, условие ON при LEFT JOIN не ограничивает только правую таблицу — оно определяет условие соединения для обеих таблиц, просто не отбрасывает строки левой при несовпадении. Во-вторых, WHERE не дублирует строки левой таблицы — это бессмысленное утверждение, не имеющее отношения к реальному поведению SQL.","WHERE применяется ПОСЛЕ выполнения соединения (JOIN), а не
