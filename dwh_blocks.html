<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --nav-h:44px; --tab-h:50px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.32,.72,0,1); --ease-out:cubic-bezier(.22,1,.36,1);

  --bg:#F2F2F7; --card:#FFFFFF; --card2:#F2F2F7; --raised:#FFFFFF;
  --label:#000000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3); --label4:rgba(60,60,67,.18);
  --sep:rgba(60,60,67,.29); --hl:#D1D1D6;
  --fill:rgba(120,120,128,.2); --fill2:rgba(120,120,128,.16); --fill3:rgba(118,118,128,.12); --fill4:rgba(116,116,128,.08);
  --bar:rgba(249,249,249,.9); --material:rgba(250,250,252,.96); --material-solid:#FFFFFF;
  --thumb:#FFFFFF;
  --blue:#007AFF; --green:#34C759; --red:#FF3B30; --orange:#FF9500; --yellow:#FFCC00; --purple:#AF52DE; --pink:#FF2D55; --teal:#30B0C7; --indigo:#5856D6; --gray:#8E8E93;
  --blue-t:rgba(0,122,255,.12); --green-t:rgba(52,199,89,.15); --red-t:rgba(255,59,48,.12); --orange-t:rgba(255,149,0,.15); --purple-t:rgba(175,82,222,.13); --pink-t:rgba(255,45,85,.12); --teal-t:rgba(48,176,199,.15); --indigo-t:rgba(88,86,214,.13); --gray-t:rgba(142,142,147,.16); --yellow-t:rgba(255,204,0,.18);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 0 1px rgba(0,0,0,.04);
  --shadow-lg:0 18px 50px rgba(0,0,0,.22);
  --backdrop:rgba(0,0,0,.34);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --raised:#2C2C2E;
  --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3); --label4:rgba(235,235,245,.18);
  --sep:rgba(84,84,88,.65); --hl:#3A3A3C;
  --fill:rgba(120,120,128,.36); --fill2:rgba(120,120,128,.32); --fill3:rgba(118,118,128,.24); --fill4:rgba(118,118,128,.18);
  --bar:rgba(22,22,24,.9); --material:rgba(44,44,46,.96); --material-solid:#2C2C2E;
  --thumb:#636366;
  --blue:#0A84FF; --green:#30D158; --red:#FF453A; --orange:#FF9F0A; --yellow:#FFD60A; --purple:#BF5AF2; --pink:#FF375F; --teal:#40C8E0; --indigo:#5E5CE6; --gray:#8E8E93;
  --blue-t:rgba(10,132,255,.22); --green-t:rgba(48,209,88,.2); --red-t:rgba(255,69,58,.2); --orange-t:rgba(255,159,10,.2); --purple-t:rgba(191,90,242,.22); --pink-t:rgba(255,55,95,.2); --teal-t:rgba(64,200,224,.2); --indigo-t:rgba(94,92,230,.26); --gray-t:rgba(142,142,147,.24); --yellow-t:rgba(255,214,10,.2);
  --shadow:none;
  --shadow-lg:0 18px 50px rgba(0,0,0,.6);
  --backdrop:rgba(0,0,0,.55);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg);touch-action:manipulation}
html.locked,html.locked body{overflow:hidden}
body{font-family:var(--font);font-size:17px;line-height:1.35;letter-spacing:-.012em;color:var(--label);background:var(--bg);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-tap-highlight-color:transparent;
  min-height:100vh;min-height:100dvh;transition:background-color .3s}
button,input{font:inherit;color:inherit;letter-spacing:inherit;-webkit-appearance:none;appearance:none;border:0;background:none;border-radius:0}
button{cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation;text-align:inherit}
button:disabled{cursor:default}
button:focus{outline:none}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
input[type=search]::-webkit-search-cancel-button,input[type=search]::-webkit-search-decoration{-webkit-appearance:none;display:none}
code{font-family:var(--mono);font-size:.86em;background:var(--fill4);padding:.08em .38em;border-radius:5px;letter-spacing:0;overflow-wrap:anywhere;font-weight:500}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.c-red{color:var(--red)} .c-green{color:var(--green)} .c-blue{color:var(--blue)} .c-orange{color:var(--orange)}
[hidden]{display:none!important}

/* ---------- Navigation bar ---------- */
.navbar{position:fixed;top:0;left:0;right:0;z-index:20;padding-top:var(--sat);transition:background-color .25s,box-shadow .25s}
.navbar.compact{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--sep)}
body[data-tab="ref"] .navbar.compact{box-shadow:none}
.nb-inner{height:var(--nav-h);max-width:760px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 8px}
.nb-title{font-size:17px;font-weight:600;opacity:0;transform:translateY(5px);transition:opacity .2s,transform .25s var(--ease);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
.navbar.compact .nb-title{opacity:1;transform:none}
.nb-right{justify-self:end;display:flex;align-items:center}
.nb-btn{height:44px;min-width:44px;padding:0 10px;color:var(--blue);font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:4px;border-radius:22px;transition:opacity .15s}
.nb-btn:active{opacity:.35}
.nb-btn.danger{color:var(--red)}
.nb-btn.bold{font-weight:600}
.nb-btn .ic{width:24px;height:24px}
.nb-left{justify-self:start;display:flex;align-items:center;min-width:0}
.nb-back{padding:0 10px 0 0;gap:1px;font-size:17px}
.nb-back .ic{width:28px;height:28px;stroke-width:2.5;margin-right:-2px}

/* ---------- Pages ---------- */
.page{display:none;max-width:760px;margin:0 auto;padding:calc(var(--sat) + var(--nav-h)) 0 calc(var(--sab) + var(--tab-h) + 36px)}
.page.active{display:block;animation:pageIn .35s var(--ease)}
#tab-home.page{padding-bottom:calc(var(--sab) + var(--tab-h) + 104px)}
@keyframes pageIn{from{opacity:0}to{opacity:1}}
.lt{padding:4px 20px 4px}
.lt h1{font-size:34px;line-height:41px;font-weight:700;letter-spacing:-.024em}
.lt p{font-size:15px;line-height:20px;color:var(--label2);margin-top:1px}

/* ---------- Grouped lists ---------- */
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:0 32px 7px;margin-top:26px;font-size:13px;line-height:18px;color:var(--label2);text-transform:uppercase;letter-spacing:.02em}
.sec-h .link{text-transform:none;font-size:15px;color:var(--blue);letter-spacing:-.01em;padding:4px 0;margin:-4px 0}
.sec-h .link:active{opacity:.4}
.sec-f{padding:7px 32px 0;font-size:13px;line-height:18px;color:var(--label2)}
.group{margin:0 16px;background:var(--card);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.card{margin:0 16px;background:var(--card);border-radius:18px;box-shadow:var(--shadow)}
.cell{position:relative;display:flex;align-items:center;gap:14px;width:100%;min-height:48px;padding:10px 16px;text-align:left}
.group > .cell + .cell::before{content:"";position:absolute;top:0;right:0;left:var(--sep-l,16px);height:.5px;background:var(--sep)}
.group.icons{--sep-l:60px}
.cell.tap{transition:background-color .2s}
.cell.tap:active{background:var(--hl);transition:none}
.cell-icon{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.cell-icon .ic{width:18px;height:18px;stroke-width:2.2}
.cell-body{flex:1;min-width:0;display:flex;flex-direction:column}
.cell-title{font-size:17px;line-height:22px}
.cell-sub{font-size:13px;line-height:18px;color:var(--label2);margin-top:1px}
.cell-value{color:var(--label2);font-variant-numeric:tabular-nums}
.cell-check{color:var(--blue);width:22px;height:22px;stroke-width:2.6;opacity:0;transform:scale(.6);transition:opacity .15s,transform .25s var(--ease)}
.cell[aria-checked="true"] .cell-check{opacity:1;transform:none}
.cell.col{flex-direction:column;align-items:stretch;gap:10px;padding-top:12px;padding-bottom:14px}
.cell.danger{color:var(--red);justify-content:center}
.chev{color:var(--label3);width:16px;height:16px;stroke-width:2.6}

/* ---------- Switch ---------- */
.switch{position:relative;flex:none;width:51px;height:31px;border-radius:16px;background:var(--fill);transition:background-color .25s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;
  box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:transform .3s var(--ease)}
[aria-checked="true"] > .switch{background:var(--green)}
[aria-checked="true"] > .switch::after{transform:translateX(20px)}

/* ---------- Segmented control ---------- */
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:32px;padding:2px;border-radius:9px;background:var(--fill3)}
.seg-thumb{position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px) / var(--n));border-radius:7px;background:var(--thumb);
  box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);transform:translateX(calc(100% * var(--i)));transition:transform .32s var(--ease)}
.seg button{position:relative;z-index:1;font-size:13px;font-weight:500;text-align:center;border-radius:7px;white-space:nowrap;padding:0 4px;overflow:hidden;text-overflow:ellipsis}
.seg button[aria-selected="true"]{font-weight:600}
.seg.lg{height:36px} .seg.lg button{font-size:14px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 18px;border-radius:14px;font-size:17px;font-weight:600;letter-spacing:-.02em;text-align:center;
  transition:transform .18s var(--ease-out),opacity .18s,background-color .2s,color .2s;white-space:nowrap}
.btn:active{transform:scale(.97);opacity:.82}
.btn .ic{width:20px;height:20px;stroke-width:2.3}
.btn-filled{background:var(--blue);color:#fff}
.btn-tinted{background:var(--blue-t);color:var(--blue)}
.btn-gray{background:var(--fill3);color:var(--label)}
.btn-red{background:var(--red);color:#fff}
.btn-block{width:100%}
.btn:disabled{opacity:.4;transform:none}
.icon-btn{width:34px;height:34px;border-radius:17px;display:grid;place-items:center;background:var(--fill3);color:var(--label2);transition:opacity .15s,transform .15s}
.icon-btn .ic{width:17px;height:17px;stroke-width:2.6}
.icon-btn:active{opacity:.5;transform:scale(.92)}

/* ---------- Tab bar & dock ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-bottom:var(--sab);background:var(--bar);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 -.5px 0 var(--sep)}
.tabbar-inner{display:flex;max-width:560px;margin:0 auto;height:var(--tab-h)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--gray);font-size:10px;font-weight:500;letter-spacing:.01em;position:relative;transition:color .2s}
.tab .ic{width:26px;height:26px;stroke-width:1.8}
.tab[aria-selected="true"]{color:var(--blue)}
.tab[aria-selected="true"] .ic .fill{fill:currentColor;fill-opacity:.18}
.tab:active .ic{transform:scale(.9)}
.badge{position:absolute;top:2px;left:calc(50% + 5px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:12px;font-weight:600;line-height:18px;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:0}
.dock{position:fixed;left:0;right:0;bottom:calc(var(--tab-h) + var(--sab));z-index:19;padding:16px 16px 10px;display:none;pointer-events:none;
  background:linear-gradient(to bottom,rgba(0,0,0,0),var(--bg) 55%)}
:root[data-theme="light"] .dock{background:linear-gradient(to bottom,rgba(242,242,247,0),var(--bg) 55%)}
body[data-tab="home"] .dock{display:block}
.dock-inner{max-width:560px;margin:0 auto;pointer-events:auto}
.dock .btn{width:100%;box-shadow:0 8px 22px rgba(0,122,255,.28)}
.dock .btn:disabled{box-shadow:none;background:var(--fill);color:var(--label2);opacity:1}

/* ---------- Home ---------- */
.prog{display:flex;align-items:center;gap:18px;padding:18px 18px 18px 16px;margin-top:14px}
.prog-ring{position:relative;flex:none;width:96px;height:96px}
.prog-ring .ring{width:96px;height:96px}
.prog-ring-ic{position:absolute;top:0;left:0;right:0;bottom:0;display:grid;place-items:center;color:var(--green)}
.prog-ring-ic .ic{width:28px;height:28px;stroke-width:2.2}
.prog-body{flex:1;min-width:0}
.prog-pct{font-size:34px;line-height:38px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.prog-pct small{font-size:20px;font-weight:600;margin-left:1px;color:var(--label2)}
.prog-cap{font-size:13px;color:var(--label2);margin-top:1px}
.prog-stats{display:flex;gap:14px;margin-top:10px;padding-top:10px;border-top:.5px solid var(--sep)}
.prog-stats > div{display:flex;flex-direction:column;min-width:0}
.prog-stats b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.prog-stats span{font-size:12px;color:var(--label2)}
.ring{transform:rotate(-90deg);overflow:visible;display:block}
.ring-track{fill:none;stroke:var(--fill3)}
.ring-val{fill:none;stroke-linecap:round;transition:stroke-dashoffset 1.1s var(--ease-out),opacity .2s}
.banner{display:flex;align-items:center;gap:14px;width:calc(100% - 32px);padding:14px 14px 14px 16px;margin-top:12px;text-align:left;transition:transform .18s var(--ease-out),background-color .2s}
.banner:active{transform:scale(.98);background:var(--hl)}
.banner-body{flex:1;min-width:0;display:flex;flex-direction:column}
.banner-body b{font-size:17px;font-weight:600;letter-spacing:-.02em}
.banner-body span{font-size:13px;color:var(--label2);margin-top:1px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 16px}
.mode{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:14px 14px 16px;border-radius:18px;background:var(--card);text-align:left;
  box-shadow:var(--shadow),inset 0 0 0 2px transparent;transition:box-shadow .25s,transform .18s var(--ease-out)}
.mode:active{transform:scale(.97)}
.mode[aria-pressed="true"]{box-shadow:var(--shadow),inset 0 0 0 2px var(--blue)}
.mode-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;margin-bottom:9px}
.mode-ic .ic{width:24px;height:24px}
.mode-t{font-size:clamp(15px,4.3vw,17px);font-weight:600;letter-spacing:-.025em}
.mode-s{font-size:13px;line-height:17px;color:var(--label2)}
.mode-radio{position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:12px;box-shadow:inset 0 0 0 1.5px var(--label4);display:grid;place-items:center;color:#fff;transition:background-color .2s}
.mode-radio .ic{width:14px;height:14px;stroke-width:3.2;opacity:0;transform:scale(.5);transition:opacity .15s,transform .25s var(--ease)}
.mode[aria-pressed="true"] .mode-radio{background:var(--blue);box-shadow:none}
.mode[aria-pressed="true"] .mode-radio .ic{opacity:1;transform:none}

/* ---------- Chips & search ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:16px;background:var(--card);color:var(--label);font-size:15px;font-weight:500;
  box-shadow:var(--shadow);transition:background-color .2s,color .2s,transform .15s}
.chip:active{transform:scale(.95)}
.chip .n{font-size:13px;color:var(--label2);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--chip,var(--label));color:var(--chip-fg,var(--bg))}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.75}
.chip .dot{width:8px;height:8px;border-radius:4px;background:var(--chip,var(--gray))}
.chip[aria-pressed="true"] .dot{background:currentColor}
.search{display:flex;align-items:center;gap:6px;height:36px;margin:0 16px;padding:0 8px;border-radius:10px;background:var(--fill3);color:var(--label2)}
.search .ic{width:18px;height:18px;stroke-width:2.3}
.search input{flex:1;min-width:0;height:100%;font-size:17px;color:var(--label);outline:none;background:transparent}
.search input::placeholder{color:var(--label2);opacity:1}
.search .clear{width:18px;height:18px;border-radius:9px;background:var(--label3);color:var(--card);display:none;place-items:center}
.search .clear .ic{width:10px;height:10px;stroke-width:3.4}
.search.has .clear{display:grid}
.sticky-tools{position:sticky;top:calc(var(--sat) + var(--nav-h));z-index:10;padding:6px 0 4px;background:var(--bg);transition:background-color .25s,box-shadow .25s}
.sticky-tools.stuck{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--sep)}

/* ---------- Expandable rows (reference / mistakes / review) ---------- */
.xi{position:relative}
.group > .xi + .xi::before,.group > .sw + .sw::before{content:"";position:absolute;top:0;right:0;left:46px;height:.5px;background:var(--sep);z-index:2}
.xi-row{display:flex;align-items:flex-start;gap:12px;width:100%;padding:12px 14px 12px 16px;text-align:left;transition:background-color .2s}
.xi-row:active{background:var(--hl);transition:none}
.xi-dot{flex:none;width:18px;height:18px;margin-top:2px;border-radius:9px;display:grid;place-items:center;color:#fff;box-shadow:inset 0 0 0 1.5px var(--label4)}
.xi-dot .ic{width:11px;height:11px;stroke-width:3.4}
.xi-dot.ok{background:var(--green);box-shadow:none}
.xi-dot.bad{background:var(--red);box-shadow:none}
.xi-dot.skip{background:var(--gray);box-shadow:none}
.xi-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.xi-q{font-size:15px;line-height:20px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.xi.open .xi-q{display:block;-webkit-line-clamp:unset;font-weight:600}
.xi-meta{font-size:12px;line-height:16px;color:var(--label2);font-variant-numeric:tabular-nums}
.xi-chev{flex:none;margin-top:2px;color:var(--label3);width:16px;height:16px;stroke-width:2.6;transition:transform .3s var(--ease)}
.xi.open .xi-chev{transform:rotate(180deg)}
.xi-detail{display:none;padding:0 16px 16px 46px}
.xi.open .xi-detail{display:block;animation:rise .3s var(--ease)}
mark{background:var(--yellow-t);color:inherit;border-radius:3px;padding:0 1px;box-shadow:0 0 0 1px var(--yellow-t)}
.kv{border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.45;margin-top:8px;background:var(--fill4)}
.kv:first-child{margin-top:0}
.kv > small{display:flex;align-items:center;gap:5px;font-size:12px;line-height:16px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px;color:var(--label2)}
.kv > small .ic{width:13px;height:13px;stroke-width:3}
.kv.good{background:var(--green-t)} .kv.good > small{color:var(--green)}
.kv.bad{background:var(--red-t)} .kv.bad > small{color:var(--red)}
.kv-sub{font-size:12px;line-height:16px;color:var(--label3);margin-top:10px}
.kv .code-blk{font-size:13px}
.inline-actions{display:flex;gap:8px;margin-top:12px}
.inline-actions .btn{height:36px;font-size:15px;border-radius:10px;padding:0 14px}

/* swipe rows */
.sw{position:relative;overflow:hidden;background:var(--red)}
.sw-del{position:absolute;top:0;right:0;bottom:0;width:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#fff;font-size:13px;font-weight:600;background:var(--red)}
.sw-del .ic{width:22px;height:22px}
.sw-content{position:relative;background:var(--card);touch-action:pan-y;transition:transform .35s var(--ease);will-change:transform}
.sw-content.drag{transition:none}
.sw.gone{transition:height .3s var(--ease),opacity .3s;opacity:0}

/* ---------- Empty states ---------- */
.empty{text-align:center;padding:56px 32px 24px;display:flex;flex-direction:column;align-items:center}
.empty-ic{width:76px;height:76px;border-radius:38px;display:grid;place-items:center;color:#fff;margin-bottom:18px}
.empty-ic .ic{width:38px;height:38px;stroke-width:2.6}
.empty h2{font-size:22px;font-weight:700;letter-spacing:-.025em}
.empty p{font-size:15px;line-height:21px;color:var(--label2);margin:6px 0 20px;max-width:330px}
.empty.small{padding:40px 32px}
.empty.small p{margin:0}

/* ---------- Mistakes ---------- */
.mh{padding:18px 16px 16px;margin-top:14px}
.mh-top{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;padding:0 2px}
.mh-num{font-size:44px;line-height:46px;font-weight:700;letter-spacing:-.04em;color:var(--red);font-variant-numeric:tabular-nums}
.mh-cap{font-size:15px;line-height:20px;color:var(--label2)}
.mh-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mh-btns .btn{padding:0 10px}

/* ---------- Blocks (start screen) ---------- */
body[data-view="blocks"] .tabbar,body[data-view="blocks"] .dock{display:none!important}
#tab-blocks.page{padding-bottom:calc(var(--sab) + 40px)}
.page.push{animation:pushIn .42s var(--ease)}
.page.pop{animation:popIn .42s var(--ease)}
@keyframes pushIn{from{opacity:0;transform:translate3d(36px,0,0)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:translate3d(-36px,0,0)}to{opacity:1;transform:none}}
.blk-list{display:grid;gap:14px;margin:0 16px}
.blk{display:block;width:100%;padding:16px 16px 15px;border-radius:22px;background:var(--card);box-shadow:var(--shadow);text-align:left;
  transition:transform .18s var(--ease-out),background-color .2s}
.blk:active{transform:scale(.98);background:var(--hl)}
.blk-head{display:flex;align-items:center;gap:14px}
.blk-av{flex:none;width:56px;height:56px;border-radius:28px;display:grid;place-items:center;color:#fff;font-size:25px;font-weight:600;letter-spacing:-.02em;
  box-shadow:inset 0 -1px 0 rgba(0,0,0,.08)}
.blk-body{flex:1;min-width:0;display:flex;flex-direction:column}
.blk-title{font-size:22px;line-height:27px;font-weight:700;letter-spacing:-.026em}
.blk-sub{font-size:15px;line-height:20px;color:var(--label2);margin-top:1px}
.blk-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.blk-tag{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px 0 8px;border-radius:12px;background:var(--fill4);font-size:12px;font-weight:600;color:var(--label2);white-space:nowrap}
.blk-tag i{width:7px;height:7px;border-radius:4px;flex:none}
.blk-tag.lv{background:var(--indigo-t);color:var(--indigo);padding:0 9px}
.blk-prog{display:block;height:6px;border-radius:3px;background:var(--fill3);margin-top:14px;overflow:hidden}
.blk-prog > i{display:block;height:100%;min-width:0;border-radius:3px;background:linear-gradient(90deg,var(--green),var(--teal));transition:width .8s var(--ease-out)}
.blk-meta{display:flex;justify-content:space-between;gap:10px;font-size:13px;line-height:18px;color:var(--label2);margin-top:7px;font-variant-numeric:tabular-nums}
.blk-meta b{font-weight:600}
.lvl-wrap{padding:12px 16px}

/* ---------- Why / disputed ---------- */
.why{margin:-16px -16px 14px;padding:14px 16px 14px;background:var(--red-t);border-radius:18px 18px 0 0}
.why:last-child{margin-bottom:-16px;border-radius:18px}
.why-h{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--red);margin-bottom:6px}
.why-h .ic{width:15px;height:15px;stroke-width:3}
.why-t{font-size:15px;line-height:1.5}
.warn-alt{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--card);font-size:14px;line-height:1.45}
.warn-alt small{display:block;font-size:11px;line-height:15px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--orange);margin-bottom:3px}
.warn-alt .code-blk{font-size:12.5px}
.warn > span{min-width:0;flex:1}
.kv-why{margin-top:8px;padding-top:8px;border-top:.5px solid var(--sep);font-size:14px;line-height:1.45;color:var(--label)}
.kv-why b{display:block;font-size:11px;line-height:15px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--red);margin-bottom:2px}
.dt{margin-top:8px;border-radius:12px;background:var(--fill4);overflow:hidden}
.dt > summary{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;font-size:12px;line-height:16px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--label2);cursor:pointer;list-style:none;-webkit-user-select:none;user-select:none}
.dt > summary::-webkit-details-marker{display:none}
.dt > summary .ic{width:14px;height:14px;stroke-width:2.8;transition:transform .25s var(--ease)}
.dt[open] > summary .ic{transform:rotate(180deg)}
.dt-item{padding:10px 12px;border-top:.5px solid var(--sep);font-size:14px;line-height:1.45}
.dt-item > div:first-child{font-weight:500;margin-bottom:4px}
.dt-item > div:first-child .code-blk{font-weight:500}
.dt-item > div + div{color:var(--label2)}

/* ---------- Overlay screens ---------- */
.screen{position:fixed;top:0;right:0;bottom:0;left:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;
  transform:translate3d(0,100%,0);visibility:hidden;transition:transform .5s var(--ease),visibility 0s linear .5s}
.screen.open{transform:none;visibility:visible;transition:transform .5s var(--ease),visibility 0s}
.screen.instant{transition:none!important}
.s-head{flex:none;padding-top:var(--sat);background:var(--bg);position:relative;z-index:3}
.s-head-row{height:54px;max-width:760px;margin:0 auto;display:grid;grid-template-columns:52px 1fr 52px;align-items:center;padding:0 9px}
.s-head-row > :last-child{justify-self:end}
.s-title{text-align:center;line-height:1.15;min-width:0}
.s-title small{display:block;font-size:12px;font-weight:500;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:0}
.s-title small .g{color:var(--green);font-weight:600} .s-title small .r{color:var(--red);font-weight:600}
.s-title b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.s-progress{height:3px;margin:0 16px;border-radius:2px;background:var(--fill3);overflow:hidden;max-width:728px}
@media (min-width:760px){.s-progress{margin:0 auto}}
.s-progress > i{display:block;height:100%;width:0;border-radius:2px;background:var(--blue);transition:width .4s var(--ease)}
.pager{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pager::-webkit-scrollbar{display:none}
.pager.dragging{scroll-snap-type:none;cursor:grabbing}
.pager.dragging *{-webkit-user-select:none;user-select:none}
.slide{position:relative;flex:0 0 100%;width:100%;height:100%;overflow-x:hidden;overflow-y:auto;scroll-snap-align:start;scroll-snap-stop:always;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch}
.slide-inner{max-width:700px;margin:0 auto;padding:18px 16px calc(var(--sab) + 104px)}
.q-meta{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px 0 9px;border-radius:13px;font-size:13px;font-weight:600;letter-spacing:-.01em;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill .dot{width:7px;height:7px;border-radius:4px;flex:none}
.q-no{margin-left:auto;font-size:13px;color:var(--label3);font-variant-numeric:tabular-nums;white-space:nowrap}
.q-title{font-size:20px;line-height:1.34;font-weight:600;letter-spacing:-.022em;margin-bottom:20px;text-wrap:pretty;overflow-wrap:break-word}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;padding:13px 14px 13px 12px;border-radius:16px;background:var(--card);text-align:left;font-size:16px;line-height:1.42;letter-spacing:-.01em;
  box-shadow:var(--shadow),inset 0 0 0 1px transparent;transition:transform .18s var(--ease-out),background-color .25s,box-shadow .25s,opacity .25s}
.opt:active{transform:scale(.98)}
.opt-mark{flex:none;width:28px;height:28px;margin-top:-2px;border-radius:14px;display:grid;place-items:center;font-size:14px;font-weight:600;color:var(--label2);
  box-shadow:inset 0 0 0 1.5px var(--label4);transition:background-color .25s,color .25s,box-shadow .25s}
.opt-mark .ic{width:15px;height:15px;stroke-width:3.2}
.opt-text{flex:1;min-width:0;overflow-wrap:break-word}
.opt.sel{background:var(--blue-t);box-shadow:inset 0 0 0 2px var(--blue)}
.opt.sel .opt-mark{background:var(--blue);color:#fff;box-shadow:none}
.opt.ok{background:var(--green-t);box-shadow:inset 0 0 0 2px var(--green)}
.opt.ok .opt-mark{background:var(--green);color:#fff;box-shadow:none}
.opt.bad{background:var(--red-t);box-shadow:inset 0 0 0 2px var(--red)}
.opt.bad .opt-mark{background:var(--red);color:#fff;box-shadow:none}
.opt.missed{box-shadow:inset 0 0 0 2px var(--green)}
.opt.missed .opt-mark{color:var(--green);box-shadow:inset 0 0 0 2px var(--green)}
.opt.dim{opacity:.42}
.opt.locked{cursor:default}
.opt.locked:active{transform:none}
.opt.pop{animation:pop .4s var(--ease-out)}
.opt.shake{animation:shake .45s ease}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.025)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.q-title code,.xi-q code{font-weight:600;font-size:.84em}
code{-webkit-box-decoration-break:clone;box-decoration-break:clone}
.code-blk{display:block;font-family:var(--mono);font-size:13.5px;line-height:1.5;letter-spacing:0;font-weight:500;background:var(--fill4);border-radius:9px;padding:8px 10px;margin:1px 0 6px;white-space:pre-wrap;overflow-wrap:anywhere}
.code-blk:last-child{margin-bottom:0}
.code-tail{display:block}
.exp{margin-top:16px;padding:16px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);animation:rise .4s var(--ease) both}
.exp-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.exp-emoji{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:19px;line-height:1;background:var(--fill4);flex:none}
.exp-title{font-size:15px;font-weight:600;color:var(--label2)}
.exp-text{font-size:16px;line-height:1.55}

<script>
window.BLOCKS=[{"id":"adlet","name":"Адлет","title":"Вопросы от Адлета","initial":"А","color":"blue","topics":["Data Vault","SQL","Oracle PL/SQL","Informatica PC","Модели данных DWH"],"bank":"6f1656bb","questions":[{"id":0,"n":1,"t":"Data Vault","s":"Историчность данных в satellite — использование load date и load end date для отслеживания изменений атрибутов во времени","q":"В satellite таблице атрибут изменился 3 раза. Как корректно закрыть предыдущую версию записи при использовании load_end_date?","a":["load_end_date предыдущей записи проставляется как дата последней загрузки самой первой версии записи, чтобы сохранить хронологию с момента первичного появления hub-ключа в системе.","При загрузке новой версии в load_end_date предыдущей записи проставляется дата/время новой загрузки минус 1 секунда (или сама дата новой загрузки), а у актуальной записи load_end_date остаётся NULL или максимальной датой (9999-12-31).","При загрузке новой версии load_end_date предыдущей записи не обновляется — вместо этого старая запись физически удаляется из satellite, а новая версия атрибута вставляется как единственная актуальная запись, что обеспечивает чистоту таблицы и отсутствие дубликатов.","При загрузке новой версии у актуальной записи load_end_date обновляется текущей датой, а у новой записи load_end_date сразу устанавливается NULL — так система всегда знает, какая запись активна."],"c":1,"e":"📅 Представь дневник с датами. Когда запись устарела — ты не вычёркиваешь её, а закрываешь дату окончания: 'актуально до 15 марта'. В Data Vault load_end_date предыдущей записи = дата загрузки новой версии. Текущая запись всегда остаётся с NULL — потому что мы ещё не знаем, когда она устареет."},{"id":1,"n":2,"t":"Data Vault","s":"Load Date в Data Vault - назначение поля, правила заполнения и типичные ошибки при реализации","q":"Почему поле Load Date в Data Vault заполняется временем загрузки в хранилище, а не временем создания записи в источнике?","a":["Load Date заполняется временем загрузки, чтобы избежать дублирования: бизнес-время уже есть в источнике, поэтому в хранилище его повторно не сохраняют и используют только техническое время для сортировки записей.","Load Date хранит время из источника, преобразованное в часовой пояс хранилища — это позволяет унифицировать временные метки и сравнивать записи из разных систем в единой шкале времени.","Load Date фиксирует момент, когда запись появилась в DWH, обеспечивая аудит и воспроизводимость истории загрузок. Время из источника хранится отдельно — в полях бизнес-ключа или атрибутах сателлита, чтобы не смешивать техническое время хранилища с бизнес-временем.","Load Date заполняется временем загрузки, потому что источники часто не предоставляют точного времени создания записи, а значит хранилище вынуждено использовать собственное время как единственно доступное. Если источник передаёт timestamp, то Load Date должен содержать именно его для точности аудита."],"c":2,"e":"🏭 Представь конвейер на заводе: важно знать не когда деталь изготовили на предприятии-поставщике, а когда она поступила к вам на склад. Load Date — это штамп 'принято на склад DWH'. Бизнес-время из источника хранится отдельно в атрибутах, чтобы не смешивать техническое и бизнесовое время."},{"id":2,"n":3,"t":"Data Vault","s":"Surrogate key в Data Vault — принципы генерации и применения хэш-ключей в hub и link таблицах","q":"Почему в Data Vault хэш-ключи предпочтительнее числовых sequence-генерируемых суррогатных ключей для hub и link таблиц?","a":["Числовые суррогатные ключи могут конфликтовать при слиянии данных из разных источников, так как одно и то же число может быть присвоено разным записям в разных системах, тогда как хэши гарантируют уникальность за счёт большего пространства значений.","Хэш-ключи занимают меньше места в хранилище, чем числовые последовательности, и ускоряют операции JOIN за счёт фиксированной длины поля, что критично при работе с большими объёмами данных в hub таблицах.","Sequence-генерируемые ключи зависят от централизованного генератора, который создаёт узкое место при параллельной загрузке, поэтому хэши предпочтительнее — они генерируются быстрее на уровне базы данных и требуют меньше вычислительных ресурсов, чем криптографические функции над бизнес-ключами, что снижает нагрузку на CPU при высокочастотной потоковой загрузке из множества источников одновременно.","Хэш-ключи детерминированы: одни и те же бизнес-ключи всегда дают одинаковый хэш независимо от источника или среды загрузки, что позволяет параллельно загружать данные из разных систем без централизованной координации и устраняет зависимость от порядка загрузки."],"c":3,"e":"🔑 Представь номер паспорта. Если два человека одновременно из разных городов приходят регистрироваться, каждый может независимо посчитать свой номер по алгоритму (хэш), и он всегда будет одинаков. С числовой последовательностью нужен один 'выдающий номера' центр — это узкое место при параллельной загрузке."},{"id":3,"n":4,"t":"Data Vault","s":"Link-таблицы для трёх и более сущностей — проектирование многосторонних связей в соответствии с методологией Data Vault","q":"Почему в Data Vault Link-таблица для трёх сущностей содержит три отдельных хэш-ключа вместо одного составного?","a":["Каждый хэш-ключ хранит MD5-хэш всех трёх бизнес-ключей сразу, но в разных форматах кодирования, чтобы гарантировать уникальность записи в Link-таблице при любых комбинациях входных значений.","Один составной ключ усложнил бы дедупликацию записей, поэтому ключи разделяют для упрощения ETL-процессов.","Три хэш-ключа используются для ускорения JOIN-операций: каждый ключ индексируется отдельно, что снижает нагрузку на базу данных при выборке данных из нескольких Hub-таблиц одновременно.","Каждый хэш-ключ ссылается на отдельный Hub, сохраняя независимость связей и обеспечивая гибкость при изменении модели без перестройки всей таблицы."],"c":3,"e":"🔗 Представь список участников конференции: у каждого — свой бейдж с ID. В Link-таблице для трёх участников события хранятся три разных ID (от трёх разных Hub), а не один общий. Так каждый Hub остаётся независимым, и если одна сущность изменится — не нужно перестраивать всю таблицу."},{"id":4,"n":5,"t":"Data Vault","s":"Историчность данных в satellite — использование load date и load end date для отслеживания изменений атрибутов во времени","q":"Почему в satellite поле load_end_date для текущей записи хранит значение NULL, а не реальную дату?","a":["NULL означает, что запись актуальна прямо сейчас — дата окончания неизвестна, так как изменение ещё не произошло.","NULL означает ошибку загрузки: дата окончания не была присвоена ETL-процессом из-за отсутствия информации в источнике.","Load_end_date становится NULL после архивации записи, сигнализируя, что данные перенесены в архивную таблицу и недоступны для обычных запросов.","NULL используется для экономии места в хранилище — реальные даты занимают больше памяти, чем пустые значения."],"c":0,"e":"📖 NULL в load_end_date — это как открытый договор без даты окончания: 'действует до отдельного уведомления'. Пока нет новой версии записи — мы не знаем дату её 'смерти'. Когда придёт обновление, мы запишем дату закрытия в эту запись и создадим новую с NULL."},{"id":5,"n":6,"t":"Data Vault","s":"Link-таблицы Data Vault — правила проектирования связей между hub-сущностями без атрибутивной нагрузки","q":"В Link-таблице между Hub_Customer и Hub_Order обнаружили атрибут order_amount — как правильно поступить с ним согласно правилам Data Vault?","a":["Оставить order_amount в Link-таблице допустимо, если это денормализованный атрибут связи — Data Vault разрешает хранить контекстные метрики прямо в Link для ускорения аналитических запросов и снижения количества JOIN-операций.","Перенести order_amount в Hub_Order, так как сумма заказа является ключевым бизнес-атрибутом, идентифицирующим заказ в системе.","Вынести order_amount в Satellite к Link-таблице (SAT_LINK), так как Link хранит только хэш-ключи связанных хабов и метаданные загрузки без атрибутов.","Удалить order_amount как избыточный — суммы хранятся в источнике."],"c":2,"e":"🏠 Представь дом (Link) и паспорт жильца (Hub). В Link хранится только факт: 'этот жилец живёт в этой квартире'. Его зарплату (order_amount) туда не вписывают — она хранится в отдельном документе (Satellite к Link). Так чисто разделяется 'кто с кем связан' и 'что мы знаем об этой связи'."},{"id":6,"n":7,"t":"Data Vault","s":"Hub-таблицы Data Vault - проектирование business key для источников с пересекающимися и конфликтующими идентификаторами","q":"Как в Data Vault 2.0 рекомендуется разрешать коллизии пересекающихся business key из разных источников в Hub?","a":["Добавлением префикса/namespace к business key или созданием отдельных Hub-таблиц на каждый источник.","Использованием суррогатных хэш-ключей SHA-256 для унификации всех источников в единый Hub","Объединением конфликтующих ключей через Link-таблицу с указанием приоритета источника","Хранением source_system как отдельного атрибута в Satellite без изменения структуры Hub"],"c":0,"e":"🏷️ Представь, что два разных завода выпускают детали с одинаковыми серийными номерами '1001'. Чтобы не перепутать, добавляют префикс завода: 'ЗАВОД-А:1001' и 'ЗАВОД-Б:1001'. В Data Vault также: либо добавляем namespace к ключу, либо делаем отдельный Hub для каждого источника."},{"id":7,"n":8,"t":"Data Vault","s":"Data Vault vs Star Schema - принципиальные архитектурные различия и обоснование выбора Data Vault для загрузки сырых данных","q":"В хранилище на Star Schema исторически менялись атрибуты измерения 'Клиент' (адрес, категория), а бизнес требует полного аудита изменений без потери первоначальных данных — какой компонент Data Vault закроет эту задачу и почему?","a":["Satellite (SAT) — хранит всю историю изменений атрибутов с временными метками (load_date, load_end_date). В отличие от SCD Type 2 в Star Schema, SAT не требует изменения структуры Hub/Link и обеспечивает полный аудируемый журнал без перестройки модели.","Reference Table (REF) — специализированный компонент Data Vault для хранения справочных и исторических данных атрибутов. В отличие от Satellite, REF-таблицы оптимизированы именно для аудита изменяемых атрибутов измерений вроде адреса и категории клиента, содержат встроенный механизм версионирования и не требуют дополнительных Hub-структур для обеспечения полной истории изменений.","Link (LNK) — компонент, отвечающий за связи между сущностями, идеально подходит для хранения истории изменений атрибутов клиента, поскольку каждое изменение адреса или категории означает новую бизнес-связь. Link фиксирует все версии отношений с временными метками, заменяя SCD Type 2 без перестройки модели и сохраняя полный аудируемый след изменений.","Hub (HUB) — центральный компонент Data Vault, хранящий уникальные бизнес-ключи клиентов с временными метками первой загрузки. Именно Hub фиксирует момент появления клиента в системе и все последующие изменения его идентификаторов, обеспечивая полный аудит без изменения структуры модели и потери первоначальных данных."],"c":0,"e":"📸 Star Schema — как фотоальбом: старое фото затирается новым. Data Vault Satellite — как хронологический дневник: каждое изменение адреса или категории клиента добавляется новой строкой с датой. Можно вернуться к любому моменту прошлого без потери данных."},{"id":8,"n":9,"t":"Data Vault","s":"Hub-таблицы Data Vault - проектирование business key для источников с пересекающимися и конфликтующими идентификаторами","q":"Два источника (CRM и ERP) имеют пересекающиеся числовые customer_id (1001 — разные клиенты). Какие подходы применяются при проектировании Hub_Customer для корректного разграничения записей?","a":["Подход 1: разделить Hub_Customer на Hub_CRM_Customer и Hub_ERP_Customer без связей между ними, поскольку Data Vault запрещает объединение идентификаторов разных источников в одном хабе; Подход 2: использовать Reference-таблицу для хранения соответствий между системами.","Подход 1: создать единый Hub_Customer с составным ключом, объединив customer_id из обоих источников через COALESCE, что устраняет дубли; Подход 2: использовать Bridge-таблицу для маппинга пересекающихся идентификаторов между CRM и ERP.","Подход 1: использовать только числовой customer_id как business key, добавив атрибут source_system в сателлит — это сохраняет чистоту хаба и позволяет различать источники через исторические записи сателлита.","Подход 1: составной business key с кодом источника ('CRM_1001', 'ERP_1001'). Подход 2: раздельные хабы на источник, связанные через Same-As Link (SAL)."],"c":3,"e":"🏷️ CRM говорит 'клиент 1001', ERP говорит 'клиент 1001' — но это разные люди! Решение: делаем составной ключ 'CRM_1001' и 'ERP_1001', или создаём отдельные Hub'ы на каждый источник, а потом связываем их через Same-As Link, если выяснится, что это одно и то же лицо."},{"id":9,"n":10,"t":"Data Vault","s":"Surrogate key в Data Vault - алгоритмы генерации хеш-ключей и обеспечение детерминированности при загрузке из множества источников","q":"В Data Vault хаб CUSTOMER загружается из трёх источников: CRM (customer_id='C-001'), ERP (cust_no='C-001'), MDM (id='C001'). При использовании MD5 для генерации хеш-ключа каждый источник даёт разный хеш — как правильно обеспечить детерминированность Hub Hash Key?","a":["Необходимо нормализовать бизнес-ключ до загрузки: привести к единому формату (например, убрать префиксы, trim, upper/lower case) согласно стандарту хеширования, затем применять MD5/SHA-1 к нормализованному значению. Дополнительно фиксируют разделитель (например, '||') и порядок компонентов составного ключа в соглашении о хешировании (Hash Key Standard), чтобы все источники давали идентичный хеш для одного и того же бизнес-объекта.","Нужно создать отдельный хаб для каждого источника (HUB_CUSTOMER_CRM, HUB_CUSTOMER_ERP, HUB_CUSTOMER_MDM) с собственным хеш-ключом, а связь между ними установить через Same-As Link. Нормализация бизнес-ключей до хеширования противоречит принципу Data Vault — хранить данные в исходном виде.","Детерминированность достигается автоматически: MD5 всегда даёт одинаковый хеш для одинаковых входных данных, поэтому достаточно убедиться, что все три источника передают поле с одним и тем же именем (например, customer_id), а сама функция хеширования обеспечит уникальность. Нормализация значений избыточна и усложняет архитектуру.","Правильное решение — использовать суррогатный ключ из sequence или identity вместо хеш-ключа на уровне хаба: каждый источник при первой загрузке получает новый суррогатный номер, а сопоставление разных форматов бизнес-ключа (C-001 из CRM и C001 из MDM) выполняется отдельно в таблице соответствий (mapping table), которая связывает суррогатные ключи разных источников между собой. Хеш-ключи в такой схеме применяются только для сателлитов, но не для хабов, поскольку хаб агрегирует уникальные бизнес-объекты, а не записи источников, и суррогат лучше отражает эту семантику."],"c":2,"e":"🧂 Разные источники пишут по-разному: 'C-001', 'C001', 'c001'. Для детерминированности хэша нужно нормализовать до хэширования: убрать пробелы, привести к верхнему регистру, убрать спецсимволы. Только тогда один и тот же бизнес-объект получит одинаковый хэш из всех источников.","d":1,"x":0},{"id":10,"n":11,"t":"Data Vault","s":"Surrogate key в Data Vault - алгоритмы генерации хеш-ключей и обеспечение детерминированности при загрузке из множества источников","q":"Почему при генерации хеш-ключей в Data Vault критически важна нормализация входных значений перед хешированием?","a":["Разные источники могут передавать один и тот же бизнес-ключ в разных регистрах, с пробелами или NULL-представлениями — без нормализации один объект получит разные хеш-ключи, что нарушит детерминированность и создаст дубликаты хабов.","Нормализация входных значений перед хешированием необходима для обеспечения безопасности: без приведения к единому формату хеш-функции MD5 и SHA-1 становятся уязвимы к коллизионным атакам, когда злоумышленник может подобрать разные бизнес-ключи, дающие одинаковый хеш, что приведёт к несанкционированному слиянию записей в хабах и саттелитах Data Vault.","Нормализация нужна исключительно для повышения производительности хеш-функций: стандартизированные строки одинаковой длины обрабатываются быстрее, что критично при загрузке больших объёмов данных из множества источников одновременно.","Без нормализации хеш-функция вернёт ошибку при NULL-значениях."],"c":0,"e":"✂️ Представь: источник А пишет ' Иванов ', источник Б пишет 'ИВАНОВ', источник В — 'иванов'. Без нормализации хэш-функция выдаст три разных ключа для одного человека. Нормализация (TRIM + UPPER) делает из них одинаковую строку → один хэш → одна запись в Hub. Без этого — дубли и хаос."},{"id":11,"n":12,"t":"Data Vault","s":"Satellite-таблицы Data Vault - разделение атрибутов по скорости изменения (rate of change) при реструктуризации существующей модели","q":"Почему разделение атрибутов по скорости изменения на отдельные сателлиты снижает нагрузку на DWH при загрузке?","a":["Стабильные атрибуты не создают новых версий записей при изменении только волатильных, что уменьшает объём INSERT-операций и рост таблиц с историей.","Разделение уменьшает количество JOIN-операций при запросах, так как каждый сателлит содержит меньше столбцов и быстрее сканируется","Волатильные атрибуты выносятся в отдельные таблицы, что позволяет сжимать стабильные данные и экономить дисковое пространство","Стабильные атрибуты реже индексируются, поэтому разделение снижает нагрузку на обновление индексов при каждой загрузке"],"c":0,"e":"🗂️ Представь папку с документами. Адрес меняется раз в 5 лет, а баланс — каждый день. Если держать всё вместе, из-за изменения баланса создаётся новая версия записи даже для неизменившегося адреса. Разделив на два Satellite, каждый обновляется только тогда, когда меняется его часть."},{"id":12,"n":13,"t":"Data Vault","s":"Hub-таблицы Data Vault - структура, обязательные поля и правила создания по шаблону","q":"Вам нужно создать Hub-таблицу для сущности 'Клиент' в Data Vault. Какие обязательные поля должны присутствовать в этой таблице?","a":["HUB_CUSTOMER_ID (суррогатный ключ), CUSTOMER_BK (бизнес-ключ), LOAD_DATE (дата загрузки), RECORD_SOURCE (источник записи).","HUB_CUSTOMER_HK (хэш-ключ), CUSTOMER_BK (бизнес-ключ), LOAD_DATE (дата загрузки), END_DATE (дата окончания).","HUB_CUSTOMER_HK (хэш-ключ), CUSTOMER_BK (бизнес-ключ), LOAD_DATE (дата загрузки), RECORD_SOURCE (источник записи).","HUB_CUSTOMER_HK (хэш-ключ), CUSTOMER_NAME (имя клиента), LOAD_DATE (дата загрузки), RECORD_SOURCE (источник записи)."],"c":1,"e":"🪪 Hub — это минимальный паспорт сущности: ID (суррогатный ключ), сам бизнес-ключ, когда пришёл (LOAD_DATE) и откуда (RECORD_SOURCE). Никаких атрибутов — только идентификация. Атрибуты идут в Satellite отдельно.","d":1,"x":2},{"id":13,"n":14,"t":"Data Vault","s":"Соглашения об именовании объектов Data Vault - применение принятых naming conventions при создании и изменении таблиц","q":"Вы создаёте хаб для сущности 'Клиент' в модели Data Vault — какое имя таблицы соответствует принятым naming conventions?","a":["HUB_CUSTOMER: префикс HUB_ указывает тип объекта, имя сущности в верхнем регистре на английском.","CUSTOMER_HUB: суффикс _HUB в конце имени таблицы является стандартом Data Vault, так как название сущности должно стоять первым для удобства сортировки объектов по алфавиту в каталоге базы данных","DV_HUB_CUST: допустимо сокращение имени","Hub_Customer: в Data Vault принято использовать смешанный регистр (CamelCase) для имён таблиц — префикс Hub_ указывает тип объекта, а имя сущности пишется с заглавной буквы, что соответствует общепринятым стандартам именования в корпоративных хранилищах данных"],"c":0,"e":"📚 В библиотеке книги сортируют по первому слову названия: 'Война и мир', а не 'и мир, Война'. Имя сущности должно стоять первым для удобства поиска. Поэтому CUSTOMER_HUB, а не HUB_CUSTOMER. Хотя в разных командах бывают разные стандарты — главное выбрать один и придерживаться его.","d":1,"x":1},{"id":14,"n":15,"t":"Data Vault","s":"Surrogate key в Data Vault — принципы генерации и применения хэш-ключей в hub и link таблицах","q":"В hub-таблице для составного бизнес-ключа (first_name + last_name + birth_date) какой подход генерации хэш-ключа корректен?","a":["Порядок полей в конкатенации не важен — главное применять TRIM и UPPER для нормализации. HASH(UPPER(TRIM(last_name)) || UPPER(TRIM(first_name)) || birth_date) даст тот же ключ, что и любой другой порядок.","Хэшировать каждое поле отдельно и объединять результаты: HASH(first_name) || HASH(last_name) || HASH(birth_date). Это безопаснее, так как позволяет избежать коллизий при конкатенации строк разной длины и не требует фиксированного порядка полей.","Разделитель между полями не нужен: HASH(UPPER(TRIM(first_name)) || UPPER(TRIM(last_name)) || birth_date) работает корректно, так как хэш-функция сама обеспечивает уникальность результата.","Конкатенировать поля в фиксированном порядке с разделителем: HASH(UPPER(TRIM(first_name)) || '||' || UPPER(TRIM(last_name)) || '||' || birth_date). Порядок и нормализация должны быть одинаковы везде."],"c":3,"e":"🥪 Чтобы хэш составного ключа был надёжным, нужно: 1) всегда один порядок полей, 2) разделитель между полями (иначе 'Ива' + 'нов' = 'Ива' + 'нов', что совпадёт с 'Иван' + 'ов'), 3) нормализация (TRIM, UPPER). Как рецепт бутерброда — всегда в одном порядке."},{"id":15,"n":16,"t":"Data Vault","s":"Business Key в Data Vault - определение, выбор и корректное заполнение в hub-таблицах","q":"Почему Business Key в hub-таблице должен храниться в исходном, неизменённом виде?","a":["Чтобы сохранить уникальный идентификатор бизнеса независимо от источника и обеспечить воспроизводимость загрузки без потери смысла ключа.","Потому что Data Vault требует хранить Business Key в исходном виде для оптимизации хранилища — нормализованные ключи занимают больше места и замедляют работу индексов в hub-таблицах при больших объёмах данных.","Чтобы ускорить JOIN-операции между hub и link таблицами.","Чтобы упростить дедупликацию: хранение ключа в исходном виде позволяет базе данных автоматически устранять дубликаты без написания дополнительного кода преобразования."],"c":0,"e":"📦 Представь штрих-код на товаре. Если магазин получил товар с кодом '12345', он хранит именно '12345', а не переводит в свою систему. Это позволяет восстановить цепочку поставок и повторить загрузку с тем же результатом. Изменение бизнес-ключа при загрузке ломает аудит."},{"id":16,"n":17,"t":"Data Vault","s":"Добавление атрибутов в существующую satellite-таблицу - порядок действий, типы данных и соблюдение стандартов","q":"Почему при добавлении атрибута в satellite-таблицу нельзя просто изменить существующие записи, а нужно загружать новую версию строки?","a":["Satellite использует append-only подход из соображений производительности: вставка новых строк быстрее UPDATE, особенно при параллельной загрузке из нескольких источников.","Изменять существующие записи запрещено только в продакшн-среде из-за блокировок таблиц; в тестовом контуре допускается прямое обновление атрибутов через UPDATE.","Satellite хранит историю изменений через версионирование: каждое изменение атрибута создаёт новую запись с актуальным load_date, сохраняя предыдущие версии нетронутыми для исторического анализа.","Изменение существующих записей нарушает первичный ключ satellite-таблицы, так как он включает load_date и не допускает повторных значений для одного hub-ключа."],"c":2,"e":"📜 Satellite — это юридический архив: нельзя изменить уже подписанный документ. Если что-то изменилось, создаётся новый документ с датой. Старые версии остаются нетронутыми. Это обеспечивает полный аудит: всегда видно, каким был атрибут в любой момент времени."},{"id":17,"n":18,"t":"Data Vault","s":"Satellite-таблицы Data Vault - структура, назначение атрибутов и связь с родительским hub","q":"Почему Satellite-таблица хранит исторические изменения атрибутов через добавление новых строк, а не обновление существующих?","a":["Потому что Hub-таблица не поддерживает каскадные обновления, и Satellite вынужден добавлять строки вместо изменения старых","Чтобы ускорить запросы: новые строки индексируются быстрее, чем обновление существующих записей в больших таблицах","Чтобы избежать блокировок: UPDATE блокирует таблицу, а INSERT позволяет параллельно писать данные без конфликтов","Чтобы сохранить полную историю изменений: каждая новая строка фиксирует состояние атрибутов на конкретный момент времени через load_date, не затирая предыдущие версии"],"c":3,"e":"📕 Satellite работает как бортовой журнал корабля: каждое событие записывается новой строкой с датой и временем. Никто не стирает старые записи — они остаются для истории. UPDATE уничтожил бы историю, а INSERT сохраняет её полностью."},{"id":18,"n":19,"t":"Informatica PC","s":"Трансформация Expression в Informatica PowerCenter — форматирование и преобразование полей при загрузке плоских файлов в таблицу-приёмник","q":"Почему трансформация Expression в Informatica PowerCenter не может изменить количество строк на выходе?","a":["Expression выполняет построчную обработку, но может объединять дублирующиеся строки в одну, если их значения совпадают после применения трансформаций — это встроенная оптимизация.","Expression поддерживает только чтение данных без их модификации, поэтому все строки проходят через трансформацию без каких-либо изменений, что автоматически сохраняет их исходное количество на выходе.","Expression обрабатывает каждую строку индивидуально и передаёт её дальше без фильтрации или агрегации — одна входная строка всегда даёт одну выходную.","Expression не фильтрует строки, так как это функция агрегации."],"c":2,"e":"⚗️ Expression в Informatica — это формульная пробирка: вы можете изменить состав жидкости (значения полей), но не количество молекул (строк). Каждая входящая строка выходит ровно одной строкой с (возможно) изменёнными значениями. Для изменения количества строк используют Filter или Aggregator."},{"id":19,"n":20,"t":"Informatica PC","s":"Трансформация Router — маршрутизация потоков данных по условиям и формирование различных наборов атрибутов через Expression в каждой ветке","q":"Почему каждая ветка Router может иметь собственный Expression-трансформер с независимым набором атрибутов?","a":["Потому что Router создаёт копии всех входящих строк для каждой ветки одновременно, а Expression-трансформер в каждой ветке получает полный набор данных и самостоятельно фильтрует нужные строки через внутренние условия — это позволяет формировать разные атрибуты без пересечения результатов между ветками.","Потому что Router разделяет поток на отдельные группы строк по условиям, и каждая группа обрабатывается своим независимым конвейером трансформаций — Expression в каждой ветке работает только со своим подмножеством строк, формируя уникальный набор выходных полей без влияния на другие ветки.","Потому что каждая ветка Router физически изолирована на уровне сессии Informatica и запускается в отдельном потоке выполнения с собственным контекстом памяти, поэтому Expression-трансформер в каждой ветке автоматически получает независимое пространство переменных и атрибутов, недоступное другим веткам.","Потому что Expression-трансформер содержит встроенный механизм маршрутизации, который определяет принадлежность строки к конкретной ветке Router и на основании этого активирует соответствующий набор вычислений — именно Expression управляет тем, какие атрибуты будут сформированы для каждого условия Router."],"c":1,"e":"🚦 Router — как развязка на дороге: он разделяет поток машин по разным съездам в зависимости от условия. Каждый съезд (ветка) — независимая дорога со своими правилами. Expression в каждой ветке видит только 'своих' машин и может обрабатывать их по-своему."},{"id":20,"n":21,"t":"Informatica PC","s":"Трансформация Joiner — объединение разнородных источников и последующая фильтрация данных через Filter","q":"В маппинге Informatica PC два источника объединяются через Joiner. Мастер-таблица содержит 1 млн строк, детальная — 10 тыс. Какую таблицу назначить Master-источником для оптимизации памяти?","a":["Большую таблицу (1 млн) назначить Master: Joiner кэширует Detail, поэтому меньший поток должен быть ведущим.","Размер таблицы не влияет на выбор Master — определяющий фактор порядок соединения и тип JOIN, а не количество строк.","Меньшую таблицу (10 тыс.) назначить Detail: Informatica оптимизирует кэш для Detail-источника, Master читается потоком.","Меньшую таблицу (10 тыс. строк) назначить Master: Informatica кэширует Master-источник в памяти, большую (1 млн) — Detail (драйвирующий поток)."],"c":3,"e":"📚 Joiner кэширует Master-таблицу в оперативной памяти как словарь для быстрого поиска. Поэтому мастером назначают меньшую таблицу (10 тыс. строк), чтобы она поместилась в памяти целиком. Большая таблица (1 млн) читается потоком и ищет совпадения в этом словаре."},{"id":21,"n":22,"t":"Informatica PC","s":"Трансформация Lookup в Informatica PC — режимы кэширования (статический, динамический) и их применение для определения новых и изменённых записей при загрузке Satellite","q":"Почему динамический кэш Lookup предпочтительнее статического при загрузке Satellite в Data Vault?","a":["Динамический кэш предпочтительнее, потому что он загружается в оперативную память полностью до начала обработки строк, обеспечивая более быстрый доступ к данным по сравнению со статическим кэшем, который обращается к базе данных при каждом поиске. Это критично при загрузке Satellite, где объёмы данных особенно велики.","Динамический кэш автоматически применяет хеш-партиционирование при поиске совпадений, что позволяет параллельно обрабатывать несколько потоков данных одновременно. Статический кэш работает только в однопоточном режиме, из-за чего при загрузке Satellite возникают узкие места производительности и некорректная сортировка дельта-записей внутри батча.","Динамический кэш предпочтительнее, поскольку он хранит хеш-суммы всех атрибутов Satellite и автоматически сравнивает их с входящими записями, генерируя флаги NEW и CHANGED без дополнительных трансформаций. Статический кэш такой функциональности не поддерживает и требует ручного написания сложных выражений в трансформации Expression для определения изменений.","Динамический кэш обновляется в процессе выполнения маппинга: новые записи добавляются в кэш на лету, что позволяет корректно различать новые и изменённые записи внутри одного батча — статический кэш содержит только снимок данных на момент старта и не отражает изменения, внесённые в текущем прогоне."],"c":3,"e":"🔄 Статический кэш Lookup — снимок на начало дня. Динамический — живая база данных: если в ходе загрузки появилась новая запись, она сразу добавляется в кэш. Это критично для Satellite: новые записи внутри одного батча должны правильно определяться как 'новые', а не 'уже существующие'."},{"id":22,"n":23,"t":"Informatica PC","s":"Цепочка трансформаций для загрузки Data Vault Hub — построение последовательности Lookup → Expression → Aggregator → Router с дедупликацией бизнес-ключей и вычислением хэш-значений","q":"Почему Aggregator в цепочке загрузки Hub располагается после Expression?","a":["Expression должен очистить NULL-значения бизнес-ключей перед группировкой в Aggregator","Aggregator не работает со строковыми полями до их нормализации в Expression","Aggregator первым читает источник","Хэш-поле вычисляется в Expression и недоступно Aggregator до него."],"c":3,"e":"🍳 Сначала Expression нарезает и подготавливает ингредиенты (чистит NULL, нормализует, вычисляет хэш), а потом Aggregator готовит блюдо (группирует). Если дать Aggregator'у грязные данные с NULL — группировка сломается, потому что NULL ≠ NULL в SQL."},{"id":23,"n":24,"t":"Informatica PC","s":"Трансформация Lookup в Informatica PowerCenter — обогащение входящего потока данных справочными значениями по ключевому полю","q":"Почему трансформация Lookup в Informatica PowerCenter по умолчанию возвращает только первое найденное совпадение, даже если в таблице-справочнике есть несколько подходящих строк?","a":["Lookup возвращает первое совпадение, потому что это ограничение лицензии базового уровня — в расширенной версии можно настроить возврат всех строк.","По умолчанию Lookup работает в режиме single-match для экономии памяти: кэш хранит только уникальные ключи, удаляя повторяющиеся записи при загрузке справочника.","Lookup использует SQL-запрос с DISTINCT, который автоматически удаляет дубликаты ещё на этапе выборки из базы данных, поэтому в результате всегда одна строка.","Lookup кэширует данные и при поиске возвращает первую совпавшую запись из кэша, так как предназначен для обогащения строки единственным справочным значением, а не для генерации нескольких выходных строк на одну входную."],"c":3,"e":"📖 Lookup — это словарь: когда ищёшь слово, получаешь первое определение. Он создан для обогащения одной строки одним значением из справочника. Если в справочнике несколько строк с одним ключом — вернётся первая из кэша. Для нескольких совпадений нужен Joiner."},{"id":24,"n":25,"t":"Oracle PL/SQL","s":"Пакеты (PACKAGE) PL/SQL - организация процедур и функций загрузки хабов, линков и сателлитов в пакеты с разделением спецификации и тела","q":"В пакете DWH_LOAD при загрузке хаба в спецификации объявлена процедура load_hub_customer, но тело пакета её не содержит — что произойдёт при компиляции тела пакета?","a":["Компиляция тела завершится с предупреждением PLW-06009, спецификация пакета будет автоматически инвалидирована, а вызов load_hub_customer вернёт NULL вместо выполнения логики загрузки хаба.","Компиляция тела завершится ошибкой: PLS-00323, так как процедура объявлена в спецификации, но не реализована в теле пакета.","Компиляция тела пакета завершится успешно, но при вызове load_hub_customer Oracle автоматически сгенерирует исключение NO_DATA_FOUND, так как тело процедуры не определено.","Компиляция тела пакета пройдёт без ошибок — Oracle допускает отсутствие реализации процедуры в теле, если она объявлена в спецификации как forward declaration без параметров."],"c":1,"e":"🏗️ Пакет PL/SQL — как здание: спецификация (spec) — это фасад с вывеской 'здесь есть процедура X'. Если фасад обещает процедуру, а внутри (тело пакета) её нет — компилятор выдаст ошибку PLS-00323: 'вы пообещали, но не сделали'. Фасад и внутренности должны соответствовать друг другу."},{"id":25,"n":26,"t":"Oracle PL/SQL","s":"Курсоры PL/SQL - использование явных курсоров, курсорных переменных и атрибутов курсора для построчной и пакетной обработки данных в ETL-процедурах","q":"В ETL-процедуре необходимо обработать 10 млн строк из staging-таблицы с минимальной нагрузкой на память — какой механизм курсора оптимален?","a":["Неявный курсор в цикле FOR с прямым INSERT/UPDATE — Oracle автоматически оптимизирует построчную обработку через внутренний механизм array processing, поэтому явное управление размером пакета через LIMIT избыточно и усложняет код без реального выигрыша по памяти.","Явный курсор с BULK COLLECT ... LIMIT (например, LIMIT 1000) в цикле LOOP — загружает данные пакетами фиксированного размера, снижая количество context switch между SQL и PL/SQL и контролируя потребление памяти.","Явный курсор с BULK COLLECT без LIMIT — загружает все 10 млн строк в коллекцию за один раз, что полностью устраняет context switch между SQL и PL/SQL и обеспечивает максимальную скорость обработки при минимальных накладных расходах на циклы.","Курсорная переменная REF CURSOR с FETCH построчно — проще в коде."],"c":1,"e":"🚌 BULK COLLECT с LIMIT — как автобус с вместимостью: загружает пассажиров порциями по 1000, везёт, высаживает, возвращается за следующей партией. Без LIMIT — как попытка вместить всех 10 млн в один автобус: он рухнет (переполнение памяти). Порции = баланс между скоростью и расходом памяти."},{"id":26,"n":27,"t":"Oracle PL/SQL","s":"Последовательности (SEQUENCE) - создание и применение последовательностей для генерации суррогатных ключей в объектах хранилища данных","q":"В Data Vault хабе необходимо генерировать суррогатный ключ при вставке новых записей — какой DDL-синтаксис Oracle позволит привязать sequence к колонке хаба без использования триггера?","a":["Использовать конструкцию GENERATED ALWAYS AS IDENTITY — hub_key NUMBER GENERATED ALWAYS AS IDENTITY PRIMARY KEY, которая автоматически создаёт и привязывает sequence к колонке. Работает с Oracle 12c+ и не требует триггеров, однако sequence при этом создаётся неявно и не может использоваться в других таблицах хранилища.","Использовать DEFAULT-значение с псевдостолбцом ROWNUM: hub_key NUMBER DEFAULT ROWNUM NOT NULL — это встроенный механизм Oracle, гарантирующий уникальность ключей в хабе без отдельного объекта sequence, поскольку ROWNUM автоматически инкрементируется для каждой новой строки в сессии.","Использовать DEFAULT-значение колонки: hub_key NUMBER DEFAULT hub_seq.NEXTVAL NOT NULL. Доступно с Oracle 12c+, sequence генерируется автоматически при INSERT без явного указания значения.","Использовать синтаксис CREATE SEQUENCE hub_seq и затем указать BEFORE INSERT триггер с :NEW.hub_key := hub_seq.NEXTVAL — это стандартный Oracle-подход до версии 12c, который полностью заменяет DEFAULT NEXTVAL и считается более портируемым для хранилищ, работающих на нескольких версиях Oracle одновременно."],"c":2,"e":"🔢 DEFAULT hub_seq.NEXTVAL — как автозаполнение даты в форме: вы не пишете дату вручную, она подставляется автоматически. С Oracle 12c+ sequence можно напрямую прописать как DEFAULT-значение колонки, без триггеров. INSERT не указывает это поле — Oracle сам берёт следующий номер."},{"id":27,"n":28,"t":"Oracle PL/SQL","s":"Пользовательские типы данных PL/SQL — создание объектных типов, коллекций (VARRAY, Nested Table, Associative Array) для обработки наборов данных в ETL-логике","q":"Почему Associative Array в PL/SQL нельзя сохранить в столбец таблицы Oracle, в отличие от Nested Table?","a":["Associative Array нельзя хранить в таблице, потому что он использует индексацию по произвольным ключам (включая VARCHAR2), что несовместимо с реляционной моделью Oracle — Nested Table же всегда индексируется по целым числам, что делает её структурно совместимой с SQL-движком и позволяет Oracle корректно сериализовать данные в табличный столбец.","Это ограничение связано с тем, что Associative Array является устаревшим типом коллекции (ранее назывался PL/SQL Table), и Oracle намеренно запретил его использование в SQL-контексте в целях обратной совместимости, оставив эту возможность только для Nested Table и VARRAY.","Associative Array не поддерживает хранение в столбцах таблиц из-за ограничения на максимальный размер коллекции — он не может превышать 32KB, тогда как Nested Table не имеет такого ограничения и поэтому допускается SQL-движком для персистентного хранения.","Associative Array существует только в памяти PL/SQL-движка и не имеет соответствующего SQL-типа на уровне базы данных, тогда как Nested Table является schema-level типом, известным SQL-движку Oracle и пригодным для хранения в столбцах таблиц."],"c":3,"e":"🏠 Associative Array живёт только в оперативной памяти PL/SQL, как блокнот на рабочем столе. Nested Table — как официальный документ в сейфе (схеме БД): у неё есть SQL-тип, Oracle её знает и может хранить в столбце таблицы. Блокнот нельзя положить в сейф — он не формализован."},{"id":28,"n":29,"t":"Oracle PL/SQL","s":"Обработка исключений PL/SQL — проектирование стратегий обработки ошибок в процессах загрузки DWH: пользовательские исключения, PRAGMA EXCEPTION_INIT, логирование ошибок","q":"В процессе загрузки DWH через Informatica PC возникает ORA-00001 (нарушение уникальности). Как правильно перехватить эту ошибку в PL/SQL-процедуре и залогировать её без остановки всего пакета загрузки?","a":["Перехватывать ORA-00001 не нужно — достаточно добавить хинт IGNORE_ROW_ON_DUPKEY_INDEX в INSERT-запрос, тогда Oracle молча пропустит дубли без исключений и логирования.","Использовать встроенное исключение DUP_VAL_ON_INDEX без PRAGMA EXCEPTION_INIT — оно автоматически перехватит ORA-00001. В блоке EXCEPTION записать ошибку в лог-таблицу прямым INSERT в рамках основной транзакции, после чего вызвать ROLLBACK SAVEPOINT для отката только нарушающей строки, а затем продолжить цикл загрузки — автономная транзакция здесь избыточна и замедляет процесс.","Объявить исключение и привязать его через PRAGMA EXCEPTION_INIT(e_dup_val, -1), в блоке EXCEPTION перехватить его, записать в лог-таблицу (SQLERRM, SQLCODE, имя процедуры, время) через автономную транзакцию (PRAGMA AUTONOMOUS_TRANSACTION), затем выполнить CONTINUE или обработать строку-нарушитель отдельно — основная транзакция при этом не откатывается.","Объявить исключение и привязать через PRAGMA EXCEPTION_INIT(e_dup_val, -1), перехватить в блоке EXCEPTION, залогировать через автономную транзакцию, затем обязательно вызвать RAISE для повторного возбуждения исключения наверх — иначе Informatica PC не получит сигнал об ошибке и не сможет корректно пометить сессию как failed, что приведёт к потере трассировки ошибок в мониторинге ETL и повторной загрузке дублей."],"c":2,"e":"🎯 PRAGMA EXCEPTION_INIT + AUTONOMOUS_TRANSACTION — золотой стандарт логирования ошибок. PRAGMA даёт дублю имя (e_dup_val), EXCEPTION перехватывает его, AUTONOMOUS_TRANSACTION позволяет записать в лог-таблицу даже если основная транзакция откатится. Так загрузка продолжается, а ошибка фиксируется."},{"id":29,"n":30,"t":"Oracle PL/SQL","s":"Представления (View) — разработка сложных view для слоёв Business Vault и Information Mart поверх Raw Vault: логика вычислений, агрегаций и Point-in-Time структур","q":"Почему Point-in-Time (PIT) таблицы в Data Vault реализуются как материализованные view или отдельные таблицы, а не как обычные view поверх сателлитов?","a":["Обычный view при каждом обращении выполняет дорогостоящие JOIN всех сателлитов с поиском актуальной записи на заданную дату. PIT-структура материализует снимки: для каждого бизнес-ключа и даты хранятся HASH_KEY и LOAD_DTS каждого сателлита, а при отсутствии записи — нулевой хэш (ghost record). Это превращает временно́й поиск в простой lookup, обеспечивая предсказуемую производительность на больших объёмах.","Обычные view технически способны реализовать PIT-логику, однако их не используют из-за ограничений оптимизатора Oracle: CBO не умеет корректно строить планы выполнения для view, содержащих аналитические функции ROW_NUMBER() OVER (PARTITION BY ... ORDER BY LOAD_DTS DESC) поверх множества сателлитов одновременно, что приводит к игнорированию существующих индексов и принудительному full table scan каждого сателлита при любом обращении к такому view.","PIT-таблицы реализуются как материализованные объекты главным образом из соображений согласованности данных: обычный view при параллельных транзакциях загрузки может возвращать разные снимки для одного бизнес-ключа разным сессиям, тогда как материализованная структура фиксирует единое состояние данных на момент последнего refresh, гарантируя транзакционную консистентность всех аналитических запросов к слою Information Mart независимо от текущей активности ETL-процессов.","PIT-структуры материализуются прежде всего потому, что обычные view не поддерживают хранение ghost records (нулевых хэшей) для отсутствующих записей в сателлитах — это ограничение синтаксиса Oracle, и единственный способ обойти его — физически зафиксировать строки с NULL-значениями или нулевыми хэшами в отдельной таблице или материализованном view, которые Oracle умеет корректно индексировать и использовать в bitmap-планах."],"c":0,"e":"📸 Обычный VIEW — фото по запросу: каждый раз делает новый снимок (JOIN всех сателлитов). PIT-таблица — готовый фотоальбом: снимки уже сделаны заранее, с закладками на каждую дату. Аналитики берут готовый снимок, а не ждут фотографа. Это в разы быстрее для больших данных."},{"id":30,"n":31,"t":"Oracle PL/SQL","s":"Переменные и типы данных PL/SQL - объявление и использование скалярных переменных, констант и якорных типов (%TYPE, %ROWTYPE) в блоках ETL-процессов","q":"Почему использование %TYPE для объявления переменной предпочтительнее явного указания типа данных в ETL-процессах?","a":["При изменении типа столбца в таблице переменная автоматически наследует новый тип, что исключает ошибки несоответствия типов и устраняет необходимость ручного обновления кода ETL.","%TYPE обязателен при работе с NULL-значениями — без него переменная не может хранить NULL, что критично в ETL-процессах с пропущенными данными.","%TYPE позволяет обойти ограничения прав доступа к таблицам, объявляя переменные без необходимости иметь привилегию SELECT на исходную таблицу.","%TYPE ускоряет выполнение ETL-запросов, так как Oracle заранее знает точный тип и не тратит время на преобразование данных при загрузке."],"c":0,"e":"🎭 %TYPE — умный дублёр актёра: как бы ни изменился типаж главной роли (тип столбца в таблице), дублёр автоматически подстраивается. Если вы написали NUMBER, а потом столбец стал VARCHAR2 — придётся вручную менять везде. С %TYPE — всё подстраивается само при перекомпиляции."},{"id":31,"n":32,"t":"Oracle PL/SQL","s":"Sequence в Oracle - создание и использование последовательностей (CREATE SEQUENCE, NEXTVAL, CURRVAL) для генерации суррогатных ключей в таблицах DWH","q":"Вам нужно создать суррогатный ключ для хаба в Data Vault — напишите DDL для sequence, стартующей с 1 с шагом 1, без кэширования?","a":["CREATE SEQUENCE hub_seq START WITH 0 INCREMENT BY 1 NOCACHE NOCYCLE;","CREATE SEQUENCE hub_seq BEGIN WITH 1 STEP 1 NOCACHE;","CREATE SEQUENCE hub_seq START WITH 1 INCREMENT BY 1 NOCACHE NOCYCLE;","CREATE SEQUENCE hub_seq START WITH 1 INCREMENT BY 1 CACHE 20 NOCYCLE ORDER;"],"c":2,"e":"⚠️ Правильный синтаксис Oracle: CREATE SEQUENCE hub_seq START WITH 1 INCREMENT BY 1 NOCACHE NOCYCLE. 'BEGIN WITH' и 'STEP' — не Oracle-синтаксис. Это частая ошибка — перепутать с другими СУБД. Запомни: START WITH, INCREMENT BY, NOCACHE."},{"id":32,"n":33,"t":"Oracle PL/SQL","s":"Объектные типы Oracle - создание пользовательских типов (CREATE TYPE) для передачи структурированных данных между процедурами загрузки сателлитов","q":"Как передать коллекцию записей о бизнес-ключах в процедуру загрузки хаба, используя объектные типы Oracle?","a":["Создать объектный тип строки: CREATE TYPE t_hub_key AS OBJECT (bk VARCHAR2(100), load_dts DATE); затем табличный тип: CREATE TYPE t_hub_key_tab AS TABLE OF t_hub_key; передать t_hub_key_tab как параметр процедуры.","Создать тип CREATE TYPE t_hub_key AS TABLE OF VARCHAR2(100), передать его напрямую без объектного типа строки — Oracle автоматически упакует поля бизнес-ключа.","Использовать ассоциативный массив: TYPE t_hub_key_tab IS TABLE OF t_hub_key INDEX BY PLS_INTEGER внутри пакета — объектные типы на уровне схемы для этого не нужны.","Создать объектный тип строки, затем передать его как VARRAY, а не TABLE OF: CREATE TYPE t_hub_key_tab AS VARRAY(1000) OF t_hub_key — это стандартный подход для хабов."],"c":0,"e":"📦 Для передачи набора строк между процедурами используют: CREATE TYPE t_hub_key AS OBJECT (...) + CREATE TYPE t_hub_key_tab AS TABLE OF t_hub_key. Это официальный SQL-тип, Oracle его знает. Передаём как параметр — и внутри процедуры работаем с коллекцией через FORALL/BULK."},{"id":33,"n":34,"t":"Oracle PL/SQL","s":"Курсоры и обработка наборов данных — явные курсоры, REF CURSOR, BULK COLLECT и FORALL для эффективной пакетной обработки данных при загрузке в DWH","q":"При загрузке 500 000 строк из staging в хаб Data Vault через FORALL+BULK COLLECT вы получаете ORA-24381 из-за дубликатов по hash-ключу — какой механизм позволит пропустить ошибочные строки и продолжить загрузку пакета?","a":["Использовать директиву SAVE EXCEPTIONS в FORALL и обработать коллекцию SQL%BULK_EXCEPTIONS в блоке EXCEPTION, чтобы залогировать ошибочные строки и не откатывать весь пакет.","Добавить WHEN DUP_VAL_ON_INDEX THEN NULL в блок EXCEPTION внутри FORALL — это автоматически пропустит дубликаты без отката пакета.","Указать директиву EXCEPTIONS INTO в операторе INSERT — Oracle сам соберёт ошибочные строки в указанную таблицу исключений без дополнительного кода.","Использовать BULK COLLECT с LIMIT и обернуть каждую итерацию в SAVEPOINT, откатывая только проблемный чанк через ROLLBACK TO SAVEPOINT."],"c":0,"e":"🚑 SAVE EXCEPTIONS в FORALL — как скорая помощь, которая едет дальше после ДТП, не останавливая всю колонну. Ошибочные строки собираются в SQL%BULK_EXCEPTIONS, основной пакет не откатывается. После FORALL — разбираем ошибки и логируем отдельно."},{"id":34,"n":35,"t":"Oracle PL/SQL","s":"Структура анонимных и именованных блоков PL/SQL - секции DECLARE, BEGIN, EXCEPTION, END и порядок их применения при разработке по готовому шаблону","q":"Почему секция DECLARE в анонимном блоке PL/SQL должна располагаться до BEGIN?","a":["Секция DECLARE резервирует память до выполнения, иначе Oracle не сможет оптимизировать запросы","Переменные и типы должны быть объявлены до их использования в исполняемом коде блока BEGIN","BEGIN не может запуститься без инициализации стека вызовов, которую выполняет DECLARE","DECLARE обрабатывается компилятором в последнюю очередь, поэтому синтаксически идёт первой"],"c":1,"e":"🏗️ DECLARE — это чертёж здания, BEGIN — стройка. Нельзя начать строить, если чертежей ещё нет. Oracle компилирует блок сверху вниз: сначала объявляет все типы и переменные, потом их использует. Если переменная встречается раньше объявления — ошибка компиляции."},{"id":35,"n":36,"t":"Oracle PL/SQL","s":"Функции PL/SQL — разработка детерминированных и табличных функций (PIPELINED) для трансформации и хеширования данных в процессах Data Vault","q":"В процессе загрузки хабов Data Vault вы используете функцию хеширования для генерации HUB_HASH_KEY. Какой атрибут объявления функции гарантирует кеширование результатов между сессиями и исключает повторные вычисления хеша для одинаковых бизнес-ключей?","a":["NOCOPY — исключает копирование входных параметров и кеширует хеш-значения в PGA.","PARALLEL_ENABLE — позволяет Oracle распределять вычисления хеша между параллельными процессами и автоматически кеширует промежуточные результаты в
