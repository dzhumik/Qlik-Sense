 буферном пуле для повторного использования в рамках транзакции.","DETERMINISTIC — Oracle кеширует результаты функции между сессиями в SGA, гарантируя, что одинаковые бизнес-ключи не вычисляются повторно при загрузке хабов Data Vault.","RESULT_CACHE — Oracle кеширует результаты вызовов в SGA между сессиями, исключая повторные вычисления для одинаковых входных значений."],"c":3,"e":"💾 RESULT_CACHE — это термос для кофе: сварил один раз, храни горячим для всех. Oracle кэширует результат в SGA и возвращает его любой сессии без повторных вычислений. DETERMINISTIC тоже кэширует, но только в рамках одного запроса. RESULT_CACHE — между сессиями."},{"id":36,"n":37,"t":"Oracle PL/SQL","s":"Хранимые процедуры PL/SQL — проектирование и реализация сложных процедур для загрузки данных в слои Data Vault (Hub, Link, Satellite)","q":"При загрузке данных в Hub таблицу Data Vault через PL/SQL процедуру необходимо избежать дублирования бизнес-ключей при параллельном запуске нескольких потоков — какой механизм Oracle следует применить?","a":["Применить SEQUENCE для генерации HASH_KEY — уникальные значения последовательности исключают коллизии между потоками","Использовать SELECT FOR UPDATE на Hub таблице перед INSERT — блокирует строки и предотвращает дубли при параллельной загрузке","Использовать MERGE с уникальным индексом на HASH_KEY (хэш от бизнес-ключа) — обеспечивает атомарность без явных блокировок. Альтернатива: DBMS_LOCK для сериализации потоков.","Добавить уникальный индекс на BUSINESS_KEY вместо HASH_KEY — прямая индексация ключа надёжнее хэша при параллельном MERGE"],"c":2,"e":"🔒 MERGE — как 'зарегистрировать или обновить' на сайте: если логин существует — ничего не делаем (WHEN MATCHED), если нет — создаём (WHEN NOT MATCHED). Для Hub это идеально: дублей не будет, уникальный индекс — страховка, атомарность — гарантия при параллельной загрузке."},{"id":37,"n":38,"t":"Oracle PL/SQL","s":"Хранимые процедуры PL/SQL - разработка процедур загрузки данных в слои Data Vault с обработкой входных параметров и возвратом статуса выполнения","q":"Процедура загрузки хаба в Data Vault завершается с ошибкой ORA-00001 на уникальном индексе business key — какое решение правильно применить?","a":["Удалить уникальный индекс на business key в таблице хаба и заменить его на неуникальный, поскольку проверку дубликатов в Data Vault должна выполнять отдельная процедура контроля качества данных, а не индексы базы данных.","Использовать INSERT с хинтом IGNORE_ROW_ON_DUPKEY_INDEX, указав имя уникального индекса — это стандартный Oracle-подход для хабов Data Vault, позволяющий движку автоматически пропускать дубли без изменения логики процедуры.","Использовать INSERT с конструкцией MERGE или INSERT ... WHERE NOT EXISTS, чтобы пропускать уже существующие бизнес-ключи и избегать дублирования.","Добавить блок EXCEPTION WHEN DUP_VAL_ON_INDEX THEN NULL в процедуру загрузки хаба, чтобы при нарушении уникального индекса ошибка подавлялась и загрузка продолжалась для всех записей без остановки."],"c":2,"e":"🚧 INSERT...WHERE NOT EXISTS — как проверка очереди: 'если тебя нет в списке, добавляю'. MERGE делает то же самое атомарно. Это безопаснее простого INSERT при параллельной загрузке, когда несколько потоков могут одновременно попытаться вставить одну запись."},{"id":38,"n":39,"t":"Oracle PL/SQL","s":"Представления (VIEW) - разработка представлений на слоях Business Vault и Information Mart с инкапсуляцией логики преобразования данных Data Vault","q":"В слое Business Vault вам нужно создать VIEW, которое вычисляет «активную» запись из satellite-таблицы (историчные данные с LOAD_DATE и LOAD_END_DATE). Какое условие WHERE следует использовать для получения только текущей записи?","a":["WHERE LOAD_DATE = (SELECT MAX(LOAD_DATE) FROM satellite) — текущей считается запись с самой поздней датой загрузки","WHERE LOAD_END_DATE = TO_DATE('9999-12-31', 'YYYY-MM-DD') — неверно, так как в Data Vault 2.0 активные записи всегда имеют NULL вместо sentinel-даты, а значение 9999-12-31 означает архивную запись","WHERE LOAD_END_DATE IS NOT NULL — записи с указанной датой окончания являются актуальными, а NULL-значения относятся к архивным или удалённым версиям","WHERE LOAD_END_DATE IS NULL — это стандартный паттерн в Data Vault: открытая запись (без даты окончания) считается текущей активной версией."],"c":3,"e":"🟢 WHERE LOAD_END_DATE IS NULL — универсальный признак актуальной записи в Data Vault. NULL означает 'открытая запись, неизвестно когда закончится'. Как договор без даты истечения — действует прямо сейчас. Когда придёт обновление, NULL заменится реальной датой."},{"id":39,"n":40,"t":"Oracle PL/SQL","s":"Процедуры PL/SQL - создание хранимых процедур с входными и выходными параметрами для загрузки данных в хабы и сателлиты Data Vault","q":"Почему при загрузке в хаб Data Vault хранимая процедура должна проверять существование записи перед вставкой?","a":["Хаб хранит только уникальные бизнес-ключи, повторная вставка нарушит уникальность и целостность данных","Хаб допускает дубли, но проверка нужна для корректного обновления метаданных загрузки","Без проверки сателлиты не смогут найти родительский хаб по хэш-ключу","Проверка нужна для обновления существующих бизнес-ключей новыми значениями атрибутов из источника"],"c":0,"e":"🏦 Hub — как реестр уникальных клиентов банка. Если клиент уже есть в реестре, повторно добавлять нельзя — нарушится уникальность. Поэтому перед INSERT проверяют: EXISTS в Hub? Если да — пропускаем, если нет — добавляем. MERGE делает это атомарно и элегантно."},{"id":40,"n":41,"t":"Oracle PL/SQL","s":"Процедуры PL/SQL - создание хранимых процедур с входными и выходными параметрами для загрузки данных в хабы и сателлиты Data Vault","q":"Вы создаёте хранимую процедуру для загрузки данных в хаб Data Vault. Какой OUT-параметр необходимо добавить, чтобы вызывающий процесс мог получить количество успешно загруженных записей?","a":["Параметр типа NUMBER с модификатором IN OUT, так как количество строк нужно передавать в процедуру и получать обратно после загрузки.","Параметр типа VARCHAR2 с модификатором OUT: p_status OUT VARCHAR2, которому присваивают значение 'SUCCESS' или 'ERROR' после INSERT.","Параметр типа NUMBER с модификатором OUT: p_rows_loaded OUT NUMBER, которому присваивают значение ROWNUM после завершения INSERT, поскольку именно ROWNUM отражает общее число обработанных строк в текущей транзакции.","Параметр типа NUMBER с модификатором OUT: p_rows_loaded OUT NUMBER, которому присваивают SQL%ROWCOUNT после INSERT."],"c":2,"e":"📊 SQL%ROWCOUNT — встроенный счётчик Oracle: после INSERT он автоматически содержит количество вставленных строк. Присвой его в OUT-параметр: p_rows_loaded := SQL%ROWCOUNT. Вызывающий процесс (Informatica) получит цифру и узнает, сколько строк реально загружено.","d":1,"x":3},{"id":41,"n":42,"t":"Oracle PL/SQL","s":"Курсоры PL/SQL - явные курсоры и курсорные FOR-циклы для построчной обработки данных при реализации несложных трансформаций","q":"Вы пишете трансформацию: нужно перебрать строки таблицы ORDERS и для каждой строки обновить статус — какую конструкцию PL/SQL использовать?","a":["Нужно использовать явный курсор с ручным управлением: OPEN cur; FETCH cur INTO rec; CLOSE cur; — только так PL/SQL гарантирует корректное построчное обновление без риска пропустить строки.","Курсорный FOR-цикл: FOR rec IN (SELECT * FROM orders) LOOP UPDATE ... WHERE id = rec.id; END LOOP; — он автоматически открывает, читает и закрывает курсор.","Курсорный FOR-цикл подходит только для SELECT-запросов и чтения данных, но для UPDATE внутри цикла необходимо явно объявить курсор через CURSOR cur IS ..., открыть его командой OPEN и после каждого FETCH вручную вызывать COMMIT, иначе изменения не сохранятся.","FOR-цикл здесь избыточен — правильнее написать один UPDATE orders SET status = ... WHERE условие, это быстрее и не требует курсора вовсе."],"c":3,"e":"🎯 Один UPDATE orders SET status='X' WHERE condition заменяет 10 000 строк за один SQL-вызов. Цикл с курсором делает 10 000 отдельных вызовов. Принцип: всегда предпочитай один мощный SQL-оператор тысячам маленьких. Курсор нужен только когда логика слишком сложна для одного SQL."},{"id":42,"n":43,"t":"SQL","s":"WHERE и HAVING — корректная фильтрация строк и агрегатов в одном аналитическом запросе","q":"В DWH-запросе нужно отобрать только активные источники (status = 'active') и оставить лишь те, у которых суммарная загрузка превышает 1 000 000 записей — в каком месте запроса разместить каждое из условий?","a":["WHERE — для агрегата, HAVING — для статуса.","status = 'active' нужно поместить в HAVING, чтобы фильтрация происходила после группировки и не исключала источники, которые могли менять статус; SUM(records) > 1000000 — тоже в HAVING для корректного подсчёта итогов по всем строкам.","Оба условия можно разместить в HAVING — он фильтрует и строки, и агрегаты, а WHERE в таком запросе избыточен.","status = 'active' — в WHERE (фильтрует строки до агрегации), SUM(records) > 1000000 — в HAVING (фильтрует уже вычисленные агрегаты)."],"c":3,"e":"🍽️ WHERE — кухня (фильтруешь до готовки), HAVING — поднос (отбираешь готовые блюда). status='active' фильтрует строки до группировки — значит в WHERE. SUM(records) > 1000000 считается из агрегата — значит его ещё нет до GROUP BY, поэтому только в HAVING."},{"id":43,"n":44,"t":"SQL","s":"Коррелированные подзапросы — механика выполнения, стоимость повторных вычислений и переписывание на JOIN или оконные функции с обоснованием выбора","q":"Почему коррелированный подзапрос выполняется многократно, а не один раз?","a":["Потому что SQL-движок не кэширует результаты подзапросов по соображениям безопасности транзакций: каждый повторный вызов гарантирует актуальность данных на момент чтения строки внешнего запроса, даже если значения в таблице не изменились.","Потому что он ссылается на столбец внешнего запроса: для каждой строки внешнего запроса подзапрос вычисляется заново с новым значением этого столбца, не имея возможности быть материализованным заранее.","Потому что подзапрос не имеет собственного индекса.","Потому что оптимизатор намеренно избегает материализации подзапросов, содержащих агрегатные функции или JOIN, так как их результат зависит от статистики таблиц, которая может устареть между итерациями внешнего цикла, что делает однократное вычисление ненадёжным."],"c":1,"e":"🔄 Коррелированный подзапрос — как спросить у каждого прохожего: 'А ваш сосед дома?' Для каждой строки внешнего запроса он бегает в подзапрос с новым значением. 1 млн строк = 1 млн запусков подзапроса. Замена на JOIN или ROW_NUMBER() делает это одним проходом."},{"id":44,"n":45,"t":"SQL","s":"CTE рекурсивные — обход иерархических структур данных при трансформации в рамках DWH-слоёв","q":"В слое Staging DWH есть таблица с иерархией сотрудников (employee_id, manager_id). Какой SQL-конструкцией вы обойдёте всю иерархию от корневого менеджера до листовых узлов, сохранив уровень вложенности?","a":["Рекурсивным CTE: в anchor-части выбираем корень (manager_id IS NULL), в рекурсивной части джойним CTE на исходную таблицу по условию cte.manager_id = employees.employee_id, то есть идём от потомков к родителям, инкрементируя счётчик уровня (level + 1).","Рекурсивным CTE: в anchor-части выбираем листовые узлы (employee_id NOT IN SELECT manager_id), в рекурсивной части джойним по manager_id = employee_id, двигаясь снизу вверх, уровень уменьшаем на 1 (level - 1) на каждой итерации.","Рекурсивным CTE: в anchor-части выбираем корень (manager_id IS NULL), в рекурсивной части джойним таблицу на саму CTE по employee_id = manager_id, добавляя счётчик уровня (level + 1).","Обычным self-join через серию последовательных JOIN таблицы на саму себя: каждый дополнительный JOIN добавляет один уровень иерархии, а уровень вложенности считается номером джойна — это стандартный подход для иерархий фиксированной глубины в Staging-слое DWH."],"c":2,"e":"🌳 Рекурсивный CTE — обход дерева компании: начинаешь с CEO (manager_id IS NULL), потом находишь его прямых подчинённых (JOIN по employee_id = manager_id), потом их подчинённых и т.д. Счётчик уровня (+1 на каждом шаге) показывает, насколько глубоко в иерархии находится сотрудник."},{"id":45,"n":46,"t":"SQL","s":"Индексы в запросах разработчика — понимание того, как условия в WHERE, JOIN ON и ORDER BY используют или не используют индексы, и переписывание запроса для их задействования","q":"Почему применение функции к индексированному столбцу в WHERE делает индекс бесполезным?","a":["Функция меняет тип данных столбца, что приводит к несовместимости с индексом: оптимизатор отказывается от его использования из соображений безопасности типов, предпочитая полный скан для гарантии корректного результата. Поэтому нужно явное приведение типов.","Функция вычисляется для каждой строки, и оптимизатор не может сопоставить результат с заранее построенными индексными значениями — индекс хранит исходные значения столбца, а не результаты преобразований, поэтому движок вынужден выполнять полный скан таблицы.","Индекс теряет избирательность при функциях.","Индекс становится бесполезным потому, что база данных блокирует доступ к индексным страницам во время выполнения функции — это техническое ограничение менеджера блокировок, которое защищает от грязного чтения промежуточных результатов вычислений. После завершения функции индекс снова становится доступным."],"c":1,"e":"📚 Индекс — это алфавитный указатель в конце книги. Но если ты ищешь слово через YEAR(date), ты не ищешь по страницам указателя — ты перелистываешь всю книгу. Индекс хранит исходные значения дат, а не результаты функций. Решение: range-условие (date >= ... AND date < ...) или функциональный индекс."},{"id":46,"n":47,"t":"SQL","s":"CTE и вложенные подзапросы — архитектура многоуровневых WITH-выражений, материализация CTE и влияние на производительность сложных аналитических SELECT","q":"В Data Vault ETL-процессе на PostgreSQL 11 CTE используется трижды в одном SELECT: для хаба, сателлита и линка. Как принудительная материализация каждого CTE повлияет на производительность по сравнению с инлайн-подзапросами?","a":["Материализованные CTE и инлайн-подзапросы в PostgreSQL 11 идентичны по производительности — оптимизатор автоматически выбирает наилучший план в обоих случаях, поэтому выбор между ними определяется только читаемостью кода.","Инлайн-подзапросы блокируют predicate pushdown сильнее, чем материализованные CTE, поскольку каждый подзапрос создаёт отдельный контекст выполнения без доступа к внешним предикатам.","Каждый CTE вычисляется ровно один раз, результат сохраняется во временное хранилище, predicate pushdown блокируется. Инлайн-подзапросы позволяют оптимизатору строить единый план с проталкиванием предикатов, что эффективнее при больших объёмах.","Принудительная материализация CTE в PostgreSQL 11 ускоряет выполнение, так как каждый результат кешируется и переиспользуется без повторных вычислений, а оптимизатор получает статистику по промежуточным наборам данных для построения более точного плана соединений хаба, сателлита и линка."],"c":2,"e":"📦 В PostgreSQL 11 CTE — барьер оптимизации: результат материализуется во временном хранилище, предикаты не проталкиваются внутрь. Инлайн-подзапросы позволяют оптимизатору построить единый план. Для трёх CTE в Data Vault ETL это может означать три отдельных лишних прохода по данным."},{"id":47,"n":48,"t":"SQL","s":"Работа с историческими данными в Data Vault — написание SELECT для извлечения актуальных записей из сателлитов через оконные функции ROW_NUMBER/RANK без коррелированных подзапросов","q":"Напишите SELECT-запрос для извлечения актуальных записей из сателлита SAT_CUSTOMER (поля: HK_CUSTOMER, LOAD_DATE, NAME, EMAIL) на текущую дату, используя ROW_NUMBER без коррелированных подзапросов?","a":["SELECT HK_CUSTOMER, NAME, EMAIL FROM (SELECT HK_CUSTOMER, LOAD_DATE, NAME, EMAIL, ROW_NUMBER() OVER (PARTITION BY HK_CUSTOMER ORDER BY LOAD_DATE ASC) AS rn FROM SAT_CUSTOMER WHERE LOAD_DATE <= CURRENT_DATE) t WHERE rn = 1 — партиционируем по хаш-ключу, но сортируем по возрастанию даты загрузки, получая первую загруженную запись вместо актуальной, что является типичной ошибкой при работе с историческими данными в Data Vault","SELECT HK_CUSTOMER, NAME, EMAIL FROM (SELECT HK_CUSTOMER, LOAD_DATE, NAME, EMAIL, ROW_NUMBER() OVER (PARTITION BY HK_CUSTOMER ORDER BY LOAD_DATE DESC) AS rn FROM SAT_CUSTOMER) t WHERE rn = 1 AND LOAD_DATE = CURRENT_DATE — переносим фильтр по дате во внешний SELECT и меняем условие на точное совпадение с текущей датой, что исключает все записи кроме загруженных именно сегодня и ломает логику получения актуальной версии на любую произвольную дату","SELECT HK_CUSTOMER, NAME, EMAIL FROM (SELECT HK_CUSTOMER, LOAD_DATE, NAME, EMAIL, ROW_NUMBER() OVER (PARTITION BY HK_CUSTOMER ORDER BY LOAD_DATE DESC) AS rn FROM SAT_CUSTOMER WHERE LOAD_DATE <= CURRENT_DATE) t WHERE rn = 1 — партиционируем по хаш-ключу, берём строку с максимальной датой загрузки (rn=1), фильтр выносим во внешний SELECT.","SELECT HK_CUSTOMER, NAME, EMAIL FROM (SELECT HK_CUSTOMER, LOAD_DATE, NAME, EMAIL, ROW_NUMBER() OVER (PARTITION BY NAME ORDER BY LOAD_DATE DESC) AS rn FROM SAT_CUSTOMER WHERE LOAD_DATE <= CURRENT_DATE) t WHERE rn = 1 — партиционируем по полю NAME вместо хаш-ключа HK_CUSTOMER, что приводит к некорректной группировке записей: клиенты с одинаковыми именами будут объединены в одну партицию, и актуальные данные будут определяться неверно, нарушая целостность исторических данных"],"c":2,"e":"🥇 ROW_NUMBER() OVER(PARTITION BY HK_CUSTOMER ORDER BY LOAD_DATE DESC) = 1 берёт строку с самой поздней датой загрузки для каждого клиента. Это как взять последнее письмо из папки для каждого отправителя. Фильтр WHERE LOAD_DATE <= CURRENT_DATE ограничивает только прошлыми загрузками."},{"id":48,"n":49,"t":"SQL","s":"Оконные функции RANK и ROW_NUMBER — дедупликация записей и выбор актуальной версии данных при загрузке в сателлиты Data Vault","q":"Почему при дедупликации в сателлитах Data Vault используют ROW_NUMBER, а не RANK?","a":["RANK присваивает одинаковый номер дублям, оставляя несколько строк с рангом 1, тогда как ROW_NUMBER гарантирует уникальный номер каждой строке, позволяя выбрать ровно одну запись.","ROW_NUMBER работает быстрее RANK при обработке больших объёмов данных в Data Vault, так как не выполняет сравнение значений между строками, что критично при загрузке миллионов записей в сателлиты.","RANK корректно обрабатывает NULL-значения в ключевых полях сателлита, тогда как ROW_NUMBER игнорирует NULL и может случайно выбрать неактуальную версию записи, что нарушает историчность данных.","RANK не поддерживает секционирование по хаб-ключам в конструкции PARTITION BY, поэтому при загрузке сателлитов Data Vault его применение ограничено, а ROW_NUMBER работает корректно с любыми разделами."],"c":0,"e":"🏆 RANK — как соревнование: двое с одинаковым результатом получают оба 1-е место, следующий — 3-е. ROW_NUMBER — как нумерация в очереди: каждый получает уникальный номер, никаких ничьих. Для дедупликации нужен ровно один победитель → только ROW_NUMBER гарантирует это."},{"id":49,"n":50,"t":"SQL","s":"Оконные функции LAG и LEAD — вычисление разницы между текущим и предыдущим значением показателя в разрезе клиентских счетов","q":"Почему LAG без явного указания PARTITION BY может давать некорректные результаты при анализе показателей по клиентским счетам?","a":["Без PARTITION BY функция LAG берёт предыдущую строку по всему результирующему набору, игнорируя границы между счетами разных клиентов, что приводит к сравнению значений разных счетов вместо значений внутри одного счёта.","Без PARTITION BY функция LAG не работает с датами, поэтому временные ряды по счетам вычисляются неверно — нужно явно указывать столбец с датой в секции PARTITION BY.","Без PARTITION BY LAG использует глобальную сортировку, из-за чего для первой строки каждого нового счёта возвращается случайное значение вместо NULL.","Без PARTITION BY LAG возвращает NULL для всех строк, кроме первой, так как не может определить порядок строк внутри каждого счёта без явного разбиения."],"c":0,"e":"📊 LAG без PARTITION BY — как смотреть на предыдущую строку в общем списке, игнорируя, чьи это данные. Если список отсортирован по дате, последняя строка клиента А может быть рядом с первой строкой клиента Б — и LAG сравнит их как будто они одного счёта. Нужен PARTITION BY account_id!"},{"id":50,"n":51,"t":"SQL","s":"CTE рекурсивные — обход иерархических структур данных при трансформации в рамках DWH-слоёв","q":"Почему рекурсивный CTE требует наличия двух обязательных частей — якоря и рекурсивного шага?","a":["Якорь задаёт начальную точку обхода, рекурсивный шаг многократно присоединяет дочерние узлы, пока не останется новых строк — без якоря рекурсия не имеет точки старта и уходит в бесконечный цикл.","Якорь задаёт условие остановки рекурсии, без него запрос зациклится.","Две части обязательны, так как SQL-стандарт требует явного разделения базового набора данных и преобразующей логики — якорь фильтрует строки верхнего уровня, а рекурсивный шаг применяет агрегатные функции для вычисления итоговых метрик по каждому узлу иерархии.","Якорь нужен только для оптимизации запроса — без него рекурсия всё равно выполнится, но значительно медленнее, поскольку планировщик не сможет построить эффективный план выполнения и будет сканировать всю таблицу на каждом шаге."],"c":0,"e":"🌿 Рекурсивный CTE без якоря — как лестница без первой ступеньки: не знаешь откуда начинать подниматься. Якорь (anchor) = корень дерева (manager_id IS NULL). Рекурсивный шаг = повторное присоединение дочерних узлов. Без якоря — бесконечный цикл или ошибка."},{"id":51,"n":52,"t":"SQL","s":"JOIN-операции - применение INNER JOIN для соединения таблицы фактов с таблицей измерений при выгрузке данных","q":"Почему INNER JOIN между таблицей фактов и измерений возвращает только совпадающие записи, исключая факты без соответствующего измерения?","a":["INNER JOIN исключает несовпадающие записи, потому что автоматически применяет фильтрацию NULL-значений: если ключ в таблице фактов равен NULL или отсутствует в индексе измерения, оптимизатор базы данных отбрасывает такие строки ещё до выполнения соединения, оставляя только валидные записи.","INNER JOIN возвращает только совпадающие строки, так как таблица измерений является главной (driving table) и задаёт границы выборки — факты без измерения исключаются, потому что движок SQL сначала сканирует измерение и только затем ищет соответствующие факты, игнорируя всё лишнее.","INNER JOIN возвращает только строки, где ключ соединения существует в обеих таблицах одновременно — факты без соответствующего значения в измерении отсутствуют в результате, так как условие соединения не выполняется.","INNER JOIN фильтрует данные через условие WHERE."],"c":2,"e":"🤝 INNER JOIN — рукопожатие: работает только если ОБА человека протянули руку. Факт без измерения (нет пары в customer_dim) — рукопожатия нет, строка исчезает. Если нужны все факты даже без измерений — используй LEFT JOIN."},{"id":52,"n":53,"t":"SQL","s":"Агрегатные функции - использование COUNT и SUM для подсчёта транзакций и сумм в разрезе клиентов","q":"Напишите SQL-запрос, который подсчитывает количество транзакций и общую сумму по каждому клиенту из таблицы transactions (поля: client_id, amount)?","a":["SELECT client_id, COUNT(*) AS cnt_transactions, SUM(amount) AS total_amount FROM transactions GROUP BY client_id;","SELECT client_id, COUNT(*) AS cnt_transactions, SUM(amount) AS total_amount FROM transactions GROUP BY amount;","SELECT client_id, COUNT(amount) AS cnt_transactions, SUM(amount) AS total_amount FROM transactions;","SELECT client_id, SUM(*) AS cnt_transactions, COUNT(amount) AS total_amount FROM transactions GROUP BY client_id;"],"c":0,"e":"🧮 Классический запрос агрегации: SELECT client_id, COUNT(*) AS cnt, SUM(amount) AS total FROM transactions GROUP BY client_id. GROUP BY группирует строки по клиенту, COUNT считает количество, SUM суммирует. Это основа любой аналитики."},{"id":53,"n":54,"t":"SQL","s":"Агрегатные функции - применение AVG, MIN, MAX для расчёта базовых метрик по группам данных","q":"Почему AVG игнорирует NULL-значения при расчёте среднего?","a":["NULL-значения игнорируются функцией AVG по техническим причинам — движок базы данных не умеет складывать неопределённые значения, поэтому строки с NULL полностью исключаются из выборки, включая знаменатель и числитель","AVG исключает NULL из расчёта только ради производительности: обработка пустых значений требует дополнительных ресурсов, а результат при их включении был бы идентичным, так как NULL равен 0","AVG игнорирует NULL, потому что это стандартное поведение всех числовых функций SQL — любая арифметика с NULL даёт NULL, поэтому движок автоматически заменяет их нулями перед подсчётом","NULL означает отсутствие данных, включение исказило бы среднее — SQL исключает их из подсчёта суммы и количества строк автоматически"],"c":3,"e":"⚖️ NULL — это 'неизвестно', а не ноль. Если у 3 студентов известна оценка (8, 9, 10) и у 2 неизвестна (NULL), среднее = (8+9+10)/3 = 9, а не (8+9+10+0+0)/5 = 7.2. SQL правильно исключает неизвестные значения, чтобы не исказить реальное среднее."},{"id":54,"n":55,"t":"SQL","s":"Фильтрация данных - разница между WHERE и HAVING при фильтрации строк и агрегированных значений","q":"В таблице orders нужно найти клиентов, сделавших более 5 заказов, но только среди тех, у кого статус 'active' — где правильно разместить каждое условие?","a":["Оба условия нужно поместить в HAVING, так как оба относятся к фильтрации по клиентам, а HAVING работает со всеми условиями после GROUP BY.","Оба в WHERE: WHERE status='active' AND count>5.","Статус 'active' следует проверять через HAVING (он применяется ко всем строкам группы), а количество заказов >5 — через WHERE, поскольку WHERE обрабатывает числовые сравнения быстрее до агрегации.","Статус 'active' фильтруется через WHERE (до агрегации), условие на количество заказов >5 — через HAVING (после агрегации GROUP BY)."],"c":3,"e":"🏷️ Двухэтапная фильтрация: WHERE отсеивает неактивных клиентов ДО подсчёта заказов (экономит вычисления). HAVING отбрасывает тех, у кого мало заказов ПОСЛЕ подсчёта (может работать только с агрегатом). Смешать их нельзя — WHERE не знает COUNT(*), HAVING не нужен для status."},{"id":55,"n":56,"t":"SQL","s":"Оконные функции - понимание конструкции OVER(PARTITION BY ... ORDER BY ...) при работе с данными хранилища","q":"Почему PARTITION BY в оконной функции не уменьшает количество строк в результате запроса, в отличие от GROUP BY?","a":["PARTITION BY только разбивает строки на группы для вычисления, но сохраняет каждую строку в результате — агрегация происходит без схлопывания строк.","PARTITION BY автоматически добавляет скрытую группировку, которая объединяет дублирующиеся строки внутри раздела, поэтому итоговое число строк зависит от уникальности значений в указанном столбце.","PARTITION BY работает после GROUP BY, поэтому строки уже сгруппированы до применения оконной функции и их количество не меняется.","PARTITION BY не уменьшает строки, потому что оконные функции запрещено применять без ORDER BY, и именно ORDER BY сохраняет исходный порядок и количество записей."],"c":0,"e":"🎥 GROUP BY — режиссёрская склейка: из 10 кадров делает 1 финальный. PARTITION BY — как монтажная таблица: кадры остаются все, но для каждого рассчитывается результат в контексте его группы. Количество строк в результате не меняется."},{"id":56,"n":57,"t":"SQL","s":"Агрегатные функции - применение AVG, MIN, MAX для расчёта базовых метрик по группам данных","q":"Напишите SQL-запрос, который вычисляет среднюю, минимальную и максимальную сумму заказа по каждому региону из таблицы orders (поля: region, order_amount)?","a":["SELECT region, AVG(order_amount), MIN(order_amount), MAX(order_amount) FROM orders WHERE region IS NOT NULL ORDER BY region;","SELECT region, AVG(order_amount), MIN(order_amount), MAX(order_amount) FROM orders GROUP BY region;","SELECT AVG(order_amount), MIN(order_amount), MAX(order_amount) FROM orders;","SELECT region, AVERAGE(order_amount), MINIMUM(order_amount), MAXIMUM(order_amount) FROM orders GROUP BY region HAVING COUNT(*) > 0;"],"c":1,"e":"📊 SELECT region, AVG(order_amount), MIN(order_amount), MAX(order_amount) FROM orders GROUP BY region — три агрегата в одном запросе с группировкой по региону. Запомни: каждое не-агрегированное поле в SELECT обязано быть в GROUP BY."},{"id":57,"n":58,"t":"SQL","s":"Агрегирование и HAVING — разница между фильтрацией в WHERE и HAVING, поведение агрегатов при работе с большими объёмами данных хранилища","q":"В хранилище есть таблица фактов на 500 млн строк. Запрос с GROUP BY + HAVING COUNT(*) > 1000 выполняется 40 минут. Какое изменение в логике фильтрации даст наибольший прирост производительности?","a":["Заменить HAVING COUNT(*) > 1000 на подзапрос с WHERE в CTE — оптимизатор выполнит фильтрацию до агрегации, так как CTE материализуется отдельно и обрабатывает меньший объём данных, чем прямой HAVING.","Добавить индекс на столбцы из GROUP BY — это позволит движку использовать index scan вместо full table scan при агрегации, и HAVING будет применяться уже к предварительно отсортированным данным индекса, минуя сортировку всей таблицы.","Наибольший прирост даст замена COUNT(*) на COUNT(1) — COUNT(*) сканирует все столбцы строки, тогда как COUNT(1) работает только с константой, что на таблицах в 500 млн строк сокращает I/O и время агрегации в несколько раз.","Добавить предварительную фильтрацию через WHERE до агрегации — WHERE отсекает строки до GROUP BY, уменьшая объём данных для агрегирования. HAVING фильтрует уже после агрегации всего набора, поэтому движок всё равно обрабатывает все 500 млн строк. Если бизнес-логика позволяет заранее ограничить диапазон (например, по дате или статусу), WHERE-условие сократит объём агрегируемых данных на порядки и кардинально снизит время выполнения."],"c":3,"e":"⚡ HAVING COUNT(*) > 1000 работает ПОСЛЕ того как сгруппировались все 500 млн строк. WHERE до GROUP BY — фильтрует строки ДО группировки. Если можно отсечь данные по дате или статусу через WHERE — движок обрабатывает гораздо меньший объём. Это самый мощный способ ускорить такие запросы."},{"id":58,"n":59,"t":"SQL","s":"Индексы — принципы работы B-tree индексов и влияние на план выполнения SELECT-запросов при разработке трансформаций","q":"Почему B-tree индекс не используется оптимизатором при выборке более 10–20% строк таблицы?","a":["B-tree индекс не используется при выборке более 10–20% строк из-за ограничений блокировочного механизма: при массовом чтении через индекс возникает конкуренция за блокировки на листовых страницах индекса, и оптимизатор предпочитает Full Scan, чтобы снизить нагрузку на менеджер блокировок.","При выборке более 10–20% строк B-tree индекс перестаёт помещаться в буферный кэш базы данных, и оптимизатор автоматически переключается на Full Scan, чтобы избежать вытеснения горячих страниц из памяти и сохранить производительность других запросов.","При большом проценте выбираемых строк оптимизатор отказывается от B-tree индекса, потому что глубина дерева становится слишком большой для эффективного обхода: каждый дополнительный уровень узлов увеличивает количество сравнений, что делает обход медленнее последовательного чтения.","Полное сканирование таблицы (Full Scan) становится дешевле: чтение индексных блоков плюс случайный доступ к блокам данных даёт больше I/O-операций, чем последовательное чтение всей таблицы подряд."],"c":3,"e":"📚 Индекс помогает найти 100 строк из миллиона (как указатель в книге). Но если нужно прочитать 200 тыс. строк из миллиона (20%+) — быстрее просто пролистать всю книгу подряд. Чтение подряд (Sequential Scan) эффективнее хаотичных прыжков по индексу при большом % выборки."},{"id":59,"n":60,"t":"SQL","s":"Работа с историческими данными в Data Vault — написание SELECT для извлечения актуальных записей из сателлитов через оконные функции ROW_NUMBER/RANK без коррелированных подзапросов","q":"Почему использование ROW_NUMBER() предпочтительнее коррелированного подзапроса при извлечении актуальных записей из сателлита Data Vault?","a":["ROW_NUMBER() вычисляется за один проход по данным (single scan), тогда как коррелированный подзапрос выполняется повторно для каждой строки внешнего запроса — это даёт кратный выигрыш в производительности на больших объёмах исторических данных сателлита.","Коррелированный подзапрос создаёт временную таблицу для каждой группы хабов, а ROW_NUMBER() работает в памяти без дисковых операций, поэтому потребляет меньше I/O.","ROW_NUMBER() предпочтительнее, потому что поддерживается всеми СУБД без исключений, а коррелированные подзапросы имеют ограничения в синтаксисе некоторых диалектов SQL, используемых в хранилищах данных.","ROW_NUMBER() автоматически использует индексы по ключевым полям сателлита, тогда как коррелированный подзапрос обходит индексы и читает данные последовательно, что критично при больших объёмах."],"c":0,"e":"🚂 ROW_NUMBER() — как товарный поезд: все вагоны просматриваются за один рейс. Коррелированный подзапрос — как курьер, который за каждым письмом едет на склад отдельно. При 50 млн строк курьер делает 50 млн поездок. Разница в производительности — в десятки раз."},{"id":60,"n":61,"t":"SQL","s":"Surrogate Key в Data Vault - принципы формирования и использование в hub, link и satellite","q":"В Data Vault Hub для сущности 'Клиент' поступают записи из двух источников. На основе чего генерируется Surrogate Key?","a":["Surrogate Key генерируется хэшем (MD5/SHA-1) только от Business Key, обеспечивая уникальность бизнес-сущности независимо от источника.","Surrogate Key вычисляется хэшем от Business Key совместно с датой загрузки записи, поскольку одна бизнес-сущность может иметь разные ключи в разные периоды времени.","Surrogate Key генерируется хэшем от комбинации Business Key и названия источника данных, что гарантирует уникальность записи в разрезе каждой системы-источника отдельно.","Surrogate Key формируется как автоинкрементный числовой идентификатор на основе последовательности базы данных, что обеспечивает уникальность и высокую производительность при загрузке данных."],"c":0,"e":"🎭 Surrogate Key = хэш от BK + название источника. Зачем включать источник? Потому что CRM и ERP могут иметь одинаковые business key для разных объектов. Хэш только от BK без источника вызвал бы коллизии. Включение источника гарантирует уникальность в разрезе каждой системы.","d":1,"x":2},{"id":61,"n":62,"t":"SQL","s":"Satellite-таблицы Data Vault - структура, назначение атрибутов и связь с родительским hub","q":"Вы создаёте Satellite для Hub_Customer. Какой внешний ключ должен присутствовать в таблице Satellite для связи с родительским Hub?","a":["Поле Hub_Customer_HashKey (хэш-ключ родительского Hub) — внешний ключ в Satellite, ссылающийся на первичный ключ Hub_Customer.","Satellite не содержит внешних ключей на Hub — связь обеспечивается через Load_Date и Record_Source, которые однозначно идентифицируют запись и её происхождение.","Поле Satellite_HashKey — собственный первичный ключ таблицы Satellite, который одновременно служит внешним ключом для Hub_Customer и формируется как хэш от атрибутов самого Satellite.","Поле Customer_ID (натуральный бизнес-ключ клиента) — внешний ключ в Satellite, напрямую ссылающийся на исходный идентификатор из источника данных."],"c":0,"e":"🔗 Satellite не существует сам по себе — он 'прикреплён' к Hub через внешний ключ Hub_Customer_HashKey. Это как папка с документами, на которой написано 'Клиент #12345'. Без этой ссылки непонятно, чьи это данные. HashKey Hub'а = FK в Satellite."},{"id":62,"n":63,"t":"SQL","s":"Составной business key — обоснование и формирование ключа из нескольких атрибутов источника при сложной логике уникальности","q":"В источнике заказы идентифицируются комбинацией region_code + order_type + order_number, причём order_number уникален только внутри region_code и order_type — как правильно сформировать business key для Hub в Data Vault?","a":["Конкатенировать все три атрибута в единый BK: например, region_code || '~' || order_type || '~' || order_number, используя разделитель, исключающий коллизии. Хэш вычисляется от этой строки целиком.","Хэш считается от каждого атрибута отдельно, потом хэши XOR-ятся в один HK.","Для составного ключа следует создать три отдельных Hub — по одному на каждый атрибут (HubRegion, HubOrderType, HubOrder), а затем связать их через Link, поскольку Data Vault предписывает хранить каждый бизнес-объект в собственном Hub без смешивания атрибутов в одном ключе.","Достаточно использовать только order_number как BK, а region_code и order_type вынести в сателлит — они описывают контекст заказа, но не участвуют в уникальности на уровне Hub."],"c":0,"e":"📍 order_number='42' уникален только внутри region='KZ' И order_type='RETAIL'. Значит, ключ клиента — комбинация всех трёх: 'KZ~RETAIL~42'. Конкатенируешь с разделителем (чтобы 'K'+'Z42' не совпало с 'KZ'+'42'), хэшируешь — получаешь уникальный Hub Hash Key."},{"id":63,"n":64,"t":"SQL","s":"Link-таблицы Data Vault — правила проектирования связей между hub-сущностями без атрибутивной нагрузки","q":"Почему Link-таблица в Data Vault не должна содержать описательных атрибутов бизнес-сущностей?","a":["Link хранит только факт связи между Hub-ами через их суррогатные ключи; описательные атрибуты относятся к Satellite-таблицам, что обеспечивает неизменность структуры Link при изменении бизнес-правил и позволяет версионировать атрибуты независимо от самой связи.","Описательные атрибуты исключаются из Link, потому что они относятся исключительно к Hub-таблицам: каждый Hub хранит как бизнес-ключ, так и все описательные характеристики своей сущности, а Link лишь ссылается на уже обогащённые Hub-записи через суррогатные ключи, что и обеспечивает целостность модели.","Link-таблица не должна содержать атрибутов, потому что это увеличивает объём хранимых данных и замедляет JOIN-операции. Все дополнительные поля выносятся в Hub-таблицы, где они хранятся рядом с бизнес-ключами для быстрого доступа.","Link не содержит описательных атрибутов, так как Data Vault запрещает любые поля кроме суррогатных ключей и дат загрузки — это жёсткое техническое ограничение движков ETL, которые не умеют обрабатывать атрибуты в таблицах связей при параллельной загрузке."],"c":0,"e":"🏠 Link — это запись в книге актов: 'Клиент 123 купил Товар 456'. В книге актов нет места для суммы покупки — это отдельный документ (Satellite к Link). Link хранит только ФАКТ связи (кто с кем), а атрибуты этой связи — в Satellite."},{"id":64,"n":65,"t":"Модели данных DWH","s":"Добавление атрибутов в существующую satellite-таблицу - порядок действий, типы данных и соблюдение стандартов","q":"Вы добавляете атрибут arrival_date в существующую satellite-таблицу SAT_CLIENT. Какой тип данных следует использовать для хранения даты прибытия без временной метки?","a":["TIMESTAMP — универсальный тип, который автоматически обрезает время при сохранении, поэтому подходит для хранения только дат.","VARCHAR(10) — гибкий формат 'YYYY-MM-DD' позволяет хранить дату без времени и упрощает интеграцию с источниками.","DATETIME — стандартный тип для дат в Data Vault, DATE устарел и не рекомендуется в современных DWH.","DATE — хранит только дату (год, месяц, день) без времени, что соответствует требованию и стандартам именования атрибутов в Data Vault."],"c":3,"e":"⚠️ Важно: DATE в Oracle — правильный выбор. VARCHAR(10) — плохо, потому что строки не сортируются как даты, нет валидации формата, нельзя делать арифметику. TIMESTAMP содержит лишнее время. DATE хранит год-месяц-день без времени и поддерживает все операции с датами."},{"id":65,"n":66,"t":"Модели данных DWH","s":"Satellite-таблицы — структура и назначение полей для хранения атрибутов hub и link сущностей","q":"Почему satellite-таблица содержит технический атрибут load_end_date, и что означает NULL в этом поле?","a":["load_end_date заполняется при первичной загрузке и содержит NULL только для исторических записей, которые были удалены из источника.","NULL в поле load_end_date указывает на ошибку загрузки: запись не получила временную метку окончания из-за сбоя в ETL-процессе.","NULL в load_end_date означает, что запись ещё не прошла валидацию и будет заполнена после успешной проверки данных системой контроля качества.","NULL означает актуальную запись; поле заполняется системой при появлении новой версии."],"c":3,"e":"📖 NULL в load_end_date = 'действует прямо сейчас'. Это НЕ ошибка загрузки — это проектное решение. Когда придёт новая версия записи, ETL-процесс обновит load_end_date текущей записи (закроет её) и вставит новую с NULL. Паттерн SCD Type 2 в исполнении Data Vault."},{"id":66,"n":67,"t":"SQL","s":"Link-таблицы для трёх и более сущностей — проектирование многосторонних связей в соответствии с методологией Data Vault","q":"В хранилище нужно связать три сущности: Order, Product и Warehouse — как правильно спроектировать Link-таблицу по методологии Data Vault?","a":["Создать один трёхсторонний Link (Order_Product_Warehouse_LNK) с тремя FK на хэш-ключи соответствующих Hub-таблиц, добавив стандартные атрибуты: LOAD_DTS, RECORD_SOURCE и собственный хэш-ключ Link.","Трёхсторонний Link (Order_Product_Warehouse_LNK) нужно создать с тремя FK, однако хэш-ключ самого Link следует вычислять только на основе двух наиболее важных сущностей (Order и Product), а Warehouse добавлять как дескриптивный атрибут в Satellite-таблицу к этому Link.","Правильный подход — создать Hub-таблицу верхнего уровня OrderProductWarehouse_HUB, которая агрегирует все три сущности в единый бизнес-ключ, а затем построить Link-таблицы от этого нового Hub к каждому из трёх исходных Hub: Order_HUB, Product_HUB и Warehouse_HUB.","Нужно создать три отдельных двусторонних Link-таблицы: Order_Product_LNK, Product_Warehouse_LNK и Order_Warehouse_LNK — это соответствует принципу атомарности Data Vault, где каждая связь должна быть представлена отдельным линком с двумя FK на Hub-ключи."],"c":0,"e":"🔺 Три сущности — один Link с тремя FK. Это атомарная транзакция: один заказ содержит конкретный товар на конкретном складе — это неделимый факт. Три отдельных двусторонних Link'а разорвали бы эту атомарность и усложнили запросы."},{"id":67,"n":68,"t":"Модели данных DWH","s":"Дедупликация в Data Vault - стратегии обработки дублирующихся business key при интеграции данных из разнородных источников","q":"В Data Vault при интеграции данных из CRM и ERP одна и та же компания имеет business key 'COMP-001' в CRM и 'C001' в ERP — какую стратегию следует применить для корректной дедупликации в Hub?","a":["В Hub загружается только один ключ — приоритетного источника (ERP как системы записи), второй отбрасывается. RECORD_SOURCE фиксирует оба источника в Satellite.","Использовать Same-As Link (SAL): оба ключа загружаются как отдельные записи в Hub с разными RECORD_SOURCE, а SAL фиксирует связь между ними как эквивалентные сущности. Это сохраняет историю источников без потери данных и позволяет управлять мэппингом через мастер-данные.","Необходимо выбрать единый стандарт business key на этапе ETL: привести все ключи к формату одного источника (например, CRM), трансформировав 'C001' в 'COMP-001' до загрузки в Hub. Это обеспечивает единообразие хранилища и исключает дублирование записей. SAL применяется только для физически разных объектов, а не для вариаций одного ключа.","Создать отдельный Hub для каждого источника (HubCRM и HubERP), загружая ключи независимо, а затем объединять их через обычный Link. Это классическая практика Data Vault для разнородных источников — каждый Hub хранит натуральные ключи своей системы, а Link устанавливает связь между сущностями двух доменов без необходимости в специализированных конструкциях SAL."],"c":1,"e":"🗝️ 'COMP-001' и 'C001' — разные строки, разные хэши, разные записи в Hub. Same-As Link (SAL) говорит: 'эти две разные записи — один и тот же реальный объект'. Так сохраняется история источников и решается проблема несовпадения форматов без потери данных."},{"id":68,"n":69,"t":"SQL","s":"Историчность данных в Data Vault - обеспечение целостности исторических записей satellite-таблиц при изменении структуры модели","q":"В satellite-таблице добавляется новый обязательный атрибут — какую стратегию миграции исторических записей следует применить, чтобы сохранить целостность временных срезов?","a":["Пересчитать HASH_DIFF для всех исторических записей с учётом нового атрибута (NULL), чтобы обеспечить консистентность алгоритма хеширования во всей таблице и корректную дедупликацию при будущих загрузках.","Создать новую версию satellite-таблицы (SAT_V2), перенеся туда все исторические записи с заполненным атрибутом, а старую таблицу архивировать — это стандартная практика версионирования схем в Data Vault 2.0.","Добавить атрибут как nullable (или с дефолтным значением), заполнив исторические записи NULL/константой, не пересчитывая LOAD_DATE и HASH_DIFF — это сохраняет неизменность уже зафиксированной истории. Новый HASH_DIFF рассчитывается только для будущих загрузок с учётом нового атрибута.","Добавить атрибут как NOT NULL с дефолтным значением и обновить LOAD_DATE всех исторических записей на текущую дату миграции — это явно обозначит момент изменения структуры и сохранит прозрачность истории изменений."],"c":2,"e":"🏛️ Исторические записи — как архивные документы: их нельзя задним числом переписывать. Добавляешь новый атрибут — делаешь его nullable, старые записи получают NULL (они просто 'не знали' об этом атрибуте). HASH_DIFF не пересчитывается — он отражал состояние на момент загрузки."},{"id":69,"n":70,"t":"SQL","s":"Link-таблицы Data Vault - моделирование многоуровневых связей между hub-сущностями в сложных доменах","q":"В домене e-commerce нужно смоделировать связь Order-Product-Warehouse-Supplier. Сравните подходы: единый четырёхсторонний Link vs. несколько связанных Link-таблиц разной гранулярности.","a":["Единый четырёхсторонний Link всегда предпочтительнее разбивки на несколько таблиц, поскольку минимизирует количество JOIN-операций при запросах и снижает нагрузку на хранилище. Декомпозиция на LINK_ORDER_PRODUCT и LINK_PRODUCT_WAREHOUSE_SUPPLIER создаёт избыточность и нарушает принцип атомарности Data Vault, что критично для аудита транзакций в e-commerce домене.","Выбор между подходами определяется исключительно производительностью: четырёхсторонний Link быстрее при OLAP-нагрузке, а разбивка на два Link ускоряет OLTP-операции.","Единый LINK_ORDER_PRODUCT_WAREHOUSE_SUPPLIER фиксирует атомарную транзакцию одной строкой. Альтернатива — LINK_ORDER_PRODUCT + LINK_PRODUCT_WAREHOUSE_SUPPLIER — предпочтительна, если бизнес-связи независимы и требуется раздельная гранулярность запросов.","Разбиение на несколько Link-таблиц всегда предпочтительнее единого многостороннего Link, так как Data Vault запрещает связывать более трёх Hub-сущностей в одной таблице из соображений нормализации."],"c":0,"e":"🔄 Единый 4-сторонний Link — только если все четыре сущности всегда присутствуют вместе как атомарное событие. Если Supplier может появиться позже — лучше разбить. Правило: гранулярность Link = гранулярность бизнес-события. Неправильная гранулярность = сложные NULL в Link.","d":1,"x":2},{"id":70,"n":71,"t":"SQL","s":"Data Vault vs Star Schema - принципиальные архитектурные различия и обоснование выбора Data Vault для загрузки сырых данных","q":"Почему Data Vault намеренно сохраняет дублирующиеся и противоречивые данные из источников без трансформации?","a":["Потому что Data Vault оптимизирован под скорость загрузки: трансформации и очистка данных замедляют ETL-процессы, поэтому их намеренно откладывают до момента выгрузки в аналитические витрины, где производительность уже не критична.","Data Vault сохраняет противоречивые данные из разных источников, поскольку это позволяет системе автоматически выявлять и разрешать конфликты через механизм мастер-данных (MDM) непосредственно в слое Hub-ов и Link-ов, избегая необходимости создавать отдельный MDM-слой в архитектуре хранилища.","Чтобы обеспечить полный аудит и воспроизводимость истории: бизнес-правила применяются позже, в слое подачи данных (Information Mart), а Raw Vault остаётся неизменным источником правды о том, что реально пришло из систем-источников.","Это компромисс из-за ограничений инструментов загрузки — Data Vault не умеет эффективно дедуплицировать данные на лету."],"c":2,"e":"📹 Raw Vault — это видеорегистратор: записывает всё как есть, без купюр. Бизнес-правила ('этот клиент — VIP') применяются позже в Information Mart. Если правила изменятся — можно пересчитать витрины без переструктурирования хранилища. Аудит = 'мы точно знаем, что нам пришло из источника'."},{"id":71,"n":72,"t":"SQL","s":"Multi-active satellite - проектирование составного первичного ключа для сущностей с несколькими одновременно активными записями атрибутов","q":"Почему в Multi-Active Satellite первичный ключ должен включать дополнительный атрибут помимо хэш-ключа хаба и даты загрузки?","a":["Потому что хэш-ключ хаба не гарантирует уникальность в рамках одной транзакции загрузки — при параллельной загрузке из нескольких источников один и тот же хэш может быть сгенерирован дважды, и дополнительный атрибут служит защитой от коллизий хэш-функции.","Потому что дата загрузки в Multi-Active Satellite намеренно фиксируется одинаковой для всей пачки записей одного батча, и дополнительный атрибут нужен исключительно для корректной сортировки записей внутри батча при построении отчётов и витрин данных.","Потому что несколько записей атрибутов одновременно активны для одной сущности — без дополнительного дискриминатора (например, типа или порядкового номера) невозможно уникально идентифицировать каждую из них.","Потому что стандарт Data Vault 2.0 требует включения суррогатного последовательного ключа во все типы сателлитов для обеспечения совместимости с реляционными СУБД, которые не могут использовать составные ключи на основе хэшей в качестве первичных."],"c":2,"e":"📱 У клиента три активных телефонных номера одновременно. Hub_key + Load_Date не уникальны: они одинаковы для всех трёх строк одного батча. Нужен дискриминатор — например, тип номера (mobile/work/home) или порядковый номер. Это и есть 'дополнительный атрибут первичного ключа'."},{"id":72,"n":73,"t":"Модели данных DWH","s":"Link-таблицы Data Vault - структура, foreign surrogate keys и правила создания между hub-таблицами","q":"В Link-таблице между Hub_Customer и Hub_Order какие обязательные поля должны присутствовать помимо LINK_HASH_KEY и дат загрузки?","a":["Натуральные бизнес-ключи: CUSTOMER_ID и ORDER_ID из исходных систем — именно они связывают Hub-таблицы, плюс EFFECTIVE_DATE для отслеживания версий связи","LINK_SEQ_ID и STATUS_FLAG","Foreign surrogate keys: CUSTOMER_HASH_KEY и ORDER_HASH_KEY — хэш-ключи родительских Hub-таблиц, а также поля LOAD_DATE, RECORD_SOURCE.","Только суррогатные ключи хабов: CUSTOMER_HASH_KEY и ORDER_HASH_KEY, а LOAD_DATE и RECORD_SOURCE хранятся исключительно в Satellite-таблицах, прикреплённых к данному Link"],"c":2,"e":"⚠️ Внимание: правильный ответ в этом вопросе помечен неверно в тесте! Link хранит LOAD_DATE и RECORD_SOURCE в себе (это стандартные поля Link), а не только в Satellite. Обязательные поля Link: LINK_HASH_KEY, CUSTOMER_HASH_KEY, ORDER_HASH_KEY, LOAD_DATE, RECORD_SOURCE."},{"id":73,"n":74,"t":"SQL","s":"Проектирование satellite-таблиц для link-сущностей — хранение атрибутов связей и их историчность","q":"Почему для хранения атрибутов link-сущности создаётся отдельный satellite, а не добавляются колонки прямо в link-таблицу?","a":["Атрибуты связи выносятся в отдельный satellite исключительно из соображений производительности: link-таблица участвует в JOIN-операциях при каждом запросе, и добавление широких текстовых колонок увеличивает её физический размер, замедляя сканирование индексов. Satellite позволяет хранить тяжёлые атрибуты отдельно, при этом историчность здесь второстепенна — главная причина разделения именно в оптимизации чтения link при построении графа связей.","Link-таблица остаётся неизменяемой не потому, что это архитектурный принцип Data Vault, а потому что большинство СУБД физически не позволяют эффективно обновлять строки в таблицах с составными хеш-ключами без полного перестроения индексов. Поэтому атрибуты выносятся в satellite как технический обходной путь — он просто добавляет новые строки вместо UPDATE, что дешевле для движка базы данных, и историчность является лишь приятным побочным эффектом этого технического ограничения.","Отдельный satellite для link создаётся потому, что Data Vault запрещает хранить любые атрибуты в link-таблице по соображениям нормализации: все описательные данные должны находиться исключительно в satellites хабов, к которым относится связь. Link-satellite — это лишь вспомогательный паттерн для редких случаев, когда атрибут невозможно однозначно отнести ни к одному из связанных хабов, и историчность тут не является ключевым фактором принятия решения об архитектуре.","Link-таблица содержит только хеш-ключи связанных хабов и load_date — она неизменяема и описывает только факт связи. Атрибуты связи могут меняться со временем, поэтому их историчность обеспечивается через отдельный link-satellite с собственным механизмом версионирования (load_date + end_date или hash_diff), не нарушая иммутабельности самого link."],"c":3,"e":"🗃️ Link = неизменяемый факт связи (кто-кого). Если у связи есть атрибуты (сумма, дата начала контракта) — они могут меняться. Изменяемые вещи нельзя хранить в неизменяемом Link. Поэтому Satellite к Link — отдельная история изменений атрибутов этой связи."},{"id":74,"n":75,"t":"SQL","s":"Агрегирование данных — GROUP BY, функции COUNT/SUM/MAX и их поведение при наличии NULL-значений в аналитических выборках","q":"Почему COUNT(*) и COUNT(column) могут возвращать разные значения для одной группы?","a":["COUNT(*) считает все строки группы, COUNT(column) — только строки, где значение столбца не NULL.","COUNT(*) игнорирует дубликаты, COUNT(column) считает все строки включая NULL","COUNT(column) считает уникальные значения, COUNT(*) — все строки с повторами","COUNT(*) не работает с NULL-столбцами, поэтому возвращает меньшее значение"],"c":0,"e":"📊 Таблица: Иван: сумма=100, Мария: NULL, Пётр: сумма=200. COUNT(*) = 3 (считает все строки). COUNT(amount) = 2 (игнорирует NULL у Марии). Разница появляется только когда в указанном столбце есть NULL-значения."},{"id":75,"n":76,"t":"SQL","s":"Индексы — принципы работы B-tree индексов и влияние на план выполнения SELECT-запросов при разработке трансформаций","q":"В трансформации ETL выполняется запрос SELECT * FROM fact_sales WHERE sale_date BETWEEN '2023-01-01' AND '2023-12-31' AND region_id = 5, но план выполнения показывает Full Table Scan — какой индекс следует создать для оптимизации?","a":["Достаточно создать отдельные индексы на sale_date и region_id — оптимизатор объединит их через Index Merge для ускорения запроса.","Создать составной B-tree индекс на (region_id, sale_date): сначала высокоселективный равностный фильтр, затем диапазонный — это позволит Index Range Scan вместо Full Table Scan.","Создать индекс только на sale_date, так как BETWEEN-фильтр охватывает год данных и является основным условием для оптимизации.","Создать составной индекс на (sale_date, region_id): диапазонный фильтр должен стоять первым, это даёт лучшую селективность для Range Scan."],"c":1,"e":"📚 Индекс (region_id, sale_date): сначала ищем по равенству region_id=5 (быстро исключаем 80% данных), потом по диапазону дат. Равностный фильтр должен стоять первым в составном индексе — он максимально сужает выборку. Диапазон после равенства = эффективный Range Scan."},{"id":76,"n":77,"t":"SQL","s":"Агрегирование и HAVING — разница между фильтрацией в WHERE и HAVING, поведение агрегатов при работе с большими объёмами данных хранилища","q":"Почему фильтрация через HAVING выполняется медленнее, чем аналогичная фильтрация через WHERE?","a":["HAVING медленнее, так как выполняется после сортировки данных в GROUP BY: движок вынужден удерживать все отсортированные группы в памяти до завершения сортировки, и только затем применяет условие фильтрации, что требует дополнительного прохода по уже упорядоченному набору и увеличивает потребление оперативной памяти и дисковых операций по сравнению с WHERE.","HAVING работает медленнее, потому что применяет более сложные алгоритмы хэш-фильтрации к агрегированным значениям, тогда как WHERE использует простое побитовое сравнение на уровне строк — разница обусловлена типом операции, а не порядком выполнения.","HAVING фильтрует уже после агрегирования — движок сначала обрабатывает и группирует все строки, затем отбрасывает ненужные группы. WHERE отсекает строки до агрегирования, существенно сокращая объём данных, над которым строится агрегат.","HAVING не использует индексы, а WHERE использует — поэтому WHERE быстрее."],"c":2,"e":"🍳 WHERE = предварительная нарезка овощей (до готовки): чем меньше нарежешь — тем быстрее готовится. HAVING = выбираешь готовые блюда по вкусу: все уже приготовлено, только потом отбираешь нужные. Очевидно, что нарезать лишнее заранее — пустая работа."},{"id":77,"n":78,"t":"SQL","s":"Многоуровневые JOIN — порядок соединений 5+ таблиц, типы JOIN (HASH/MERGE/NESTED LOOP) в плане выполнения и их оптимизация для запросов к Data Vault","q":"В плане выполнения запроса к Data Vault (HUB→SAT→LINK→SAT→HUB) оптимизатор выбрал NESTED LOOP для соединения LINK с большим SAT (10M строк) — какое изменение запроса или статистики устранит проблему?","a":["Следует секционировать SAT по LOAD_DATE и использовать MERGE JOIN — он оптимален для Data Vault, так как Hub и Satellite всегда содержат предсортированные данные по HASH_KEY.","Нужно добавить индекс на все колонки SAT (включая LOAD_DATE и RECORD_SOURCE), тогда NESTED LOOP станет эффективнее за счёт index scan, и оптимизатор автоматически переключится на оптимальный план без обновления статистики.","Обновить статистику (ANALYZE/COMPUTE STATS) на SAT и LINK. Оптимизатор переключится на HASH JOIN, эффективный для больших таблиц. Дополнительно — убедиться в наличии индексов на HASH_KEY колонках и при необходимости использовать хинт /*+ USE_HASH(sat) */.","Проблема в самом NESTED LOOP — его нужно принудительно отключить хинтом /*+ NO_NL */ для всех соединений в запросе, а статистика здесь роли не играет, поскольку оптимизатор выбирает тип JOIN исключительно на основе физической структуры таблиц и наличия индексов."],"c":2,"e":"🔧 NESTED LOOP для больших таблиц — как перебирать 10 млн ключей одним за другим. HASH JOIN — как сделать хэш-таблицу меньшего набора и быстро проверять совпадения. ANALYZE обновляет статистику → оптимизатор 'видит' реальный размер таблиц → выбирает HASH JOIN сам."},{"id":78,"n":79,"t":"SQL","s":"Анализ плана выполнения запроса — выявление узких мест через EXPLAIN/EXPLAIN ANALYZE и устранение избыточного полного сканирования таблиц","q":"В плане EXPLAIN ANALYZE виден Seq Scan на таблице фактов из 50 млн строк с фильтром по load_date, хотя индекс существует — какова наиболее вероятная причина игнорирования индекса планировщиком?","a":["Планировщик считает Seq Scan дешевле: статистика устарела (нужен ANALYZE), фильтр возвращает >10-15% строк (низкая селективность), либо корреляция столбца низкая — случайный heap fetch дороже seq scan. Решение: ANALYZE, проверить pg_stats.correlation, скорректировать random_page_cost.","Индекс заблокирован конкурентной транзакцией — нужно выполнить REINDEX CONCURRENTLY.","Планировщик отказывается от индекса, потому что таблица фактов не секционирована по load_date — при отсутствии partition pruning оптимизатор всегда предпочитает Seq Scan для таблиц крупнее 10 млн строк, так как стоимость обхода индексных страниц превышает пороговое значение effective_cache_size. Необходимо реализовать партиционирование по диапазону дат и пересоздать индексы на каждой партиции отдельно, после чего планировщик автоматически начнёт использовать Index Scan.","Индекс игнорируется из-за неподходящего типа данных в условии фильтра: если load_date хранится как timestamp, а фильтр передаёт date, PostgreSQL не может использовать B-tree индекс без явного приведения типов. Решение — пересоздать индекс с выражением CAST или использовать функциональный индекс on (load_date::date)."],"c":0,"e":"🔍 load_date хранится как TIMESTAMP, а фильтр передаёт DATE. Oracle не может автоматически использовать индекс на TIMESTAMP для условия DATE без явного приведения типов. Решение: переписать фильтр с явным CAST или создать функциональный индекс на (load_date::date).","d":1,"x":3},{"id":79,"n":80,"t":"Oracle PL/SQL","s":"Индексы в запросах разработчика — понимание того, как условия в WHERE, JOIN ON и ORDER BY используют или не используют индексы, и переписывание запроса для их задействования","q":"В DWH-запросе есть условие WHERE YEAR(load_date) = 2023, и индекс по колонке load_date не используется — как переписать условие, чтобы индекс заработал?","a":["Проблема в отсутствии составного индекса: если добавить к индексу по load_date ещё одну колонку из WHERE или SELECT, оптимизатор переключится на index scan вместо full table scan. Функция YEAR() сама по себе не мешает использованию индекса — важна его селективность и покрытие запроса. Поэтому правильное решение — создать covering index, включающий все колонки из запроса.","Нужно создать функциональный индекс на выражение YEAR(load_date) — тогда оптимизатор сможет использовать его при условии WHERE YEAR(load_date) = 2023. Это стандартный подход для sargable-запросов с функциями над колонками.","Переписать как CAST(load_date AS DATE) BETWEEN '2023-01-01' AND '2023-12-31'","Заменить на range-условие: WHERE load_date >= '2023-01-01' AND load_date < '2024-01-01'. Функция YEAR() оборачивает колонку, делая индекс non-sargable — оптимизатор не может использовать B-tree индекс. Прямое сравнение значений восстанавливает sargability."],"c":3,"e":"📅 YEAR(load_date) = 2023 оборачивает колонку функцией → индекс по load_date бесполезен. Правильно: load_date >= '2023-01-01' AND load_date < '2024-01-01'. Прямое сравнение значений (sargable) позволяет оптимизатору использовать B-tree индекс для Range Scan."},{"id":80,"n":81,"t":"SQL","s":"JOIN-операции - понимание разницы между INNER, LEFT и RIGHT JOIN при работе с неполными данными в DWH","q":"В таблице хабов HUB_CLIENT есть 1000 записей, а в сателлите SAT_CLIENT — только 750. Какой JOIN нужно использовать, чтобы получить всех клиентов, даже если у них нет атрибутов в сателлите?","a":["LEFT JOIN от HUB_CLIENT к SAT_CLIENT — вернёт все 1000 хабов, для 250 клиентов без сателлита атрибуты будут NULL.","RIGHT JOIN от HUB_CLIENT к SAT_CLIENT — вернёт все 750 сателлитов, клиенты без атрибутов будут отброшены.","LEFT JOIN от SAT_CLIENT к HUB_CLIENT — вернёт все 1000 записей, NULL появится у хабов.","INNER JOIN вернёт только 750 клиентов с атрибутами, NULL-значения не нужны в DWH."],"c":0,"e":"🌐 LEFT JOIN: берём всех из левой таблицы (HUB_CLIENT, 1000 записей) и добавляем данные из правой (SAT_CLIENT), если есть. Для 250 клиентов без Satellite атрибуты будут NULL, но строки останутся. INNER JOIN вернул бы только 750 — потеряли бы 250 клиентов без атрибутов."},{"id":81,"n":82,"t":"SQL","s":"Оконные функции - использование ROW_NUMBER() для нумерации строк внутри группы по шаблону","q":"Почему ROW_NUMBER() присваивает уникальные номера даже при одинаковых значениях в PARTITION BY?","a":["Потому что ROW_NUMBER() нумерует строки последовательно без учёта дублей — в отличие от RANK() и DENSE_RANK(), она никогда не повторяет номер внутри раздела.","Потому что уникальность обеспечивается значениями в ORDER BY — при одинаковых данных в PARTITION BY именно сортировка гарантирует разные номера.","Потому что ROW_NUMBER() работает так же, как RANK(), но дополнительно учитывает физический порядок хранения строк в таблице, что и позволяет ей избегать повторяющихся номеров даже для дублирующихся значений в разделе.","Потому что ROW_NUMBER() автоматически добавляет случайный тай-брейкер при одинаковых значениях, чтобы избежать конфликтов нумерации в рамках раздела."],"c":0,"e":"🎫 ROW_NUMBER как театральные билеты: каждый получает уникальный номер 1, 2, 3... даже если двое с одинаковыми именами. RANK как соревнование: оба Иванова получают одинаковое место, следующий — сразу 3-е. Для выбора ровно одной строки нужен ROW_NUMBER."},{"id":82,"n":83,"t":"SQL","s":"Группировка данных - использование GROUP BY для агрегирования показателей по атрибутам измерений","q":"Почему все столбцы в SELECT без агрегатных функций должны присутствовать в GROUP BY?","a":["Потому что столбцы без агрегатных функций используются как ключи сортировки результата, а GROUP BY определяет порядок вывода строк — без явного указания сортировка была бы неопределённой","Это требование производительности: движок базы данных создаёт индекс по всем столбцам из SELECT, и если столбец не указан в GROUP BY, индекс не будет построен и запрос завершится с ошибкой","Иначе для каждой группы было бы неизвестно, какое из множества значений этого столбца вернуть — SQL не допускает такой неоднозначности","Потому что SQL сначала выполняет GROUP BY, а затем SELECT, и все столбцы должны быть зарегистрированы заранее, иначе движок не сможет выделить для них память при агрегации"],"c":2,"e":"📦 GROUP BY customer_id: для каждого customer_id будет одна строка. Если в SELECT есть city — какой city вернуть, если у клиента два города? SQL не знает. Поэтому city тоже должен быть в GROUP BY (группируй по обоим) или обёрнут в агрегат (MAX(city))."},{"id":83,"n":84,"t":"SQL","s":"Группировка данных - использование GROUP BY для агрегирования показателей по атрибутам измерений","q":"Вам нужно посчитать суммарную выручку по каждому региону из таблицы sales (region, amount). Какой SQL-запрос это реализует?","a":["SELECT SUM(amount) FROM sales GROUP BY region;","SELECT region, SUM(amount) FROM sales GROUP BY region HAVING COUNT(*) > 0;","SELECT region, SUM(amount) FROM sales GROUP BY region;","SELECT region, SUM(amount) FROM sales ORDER BY region;"],"c":2,"e":"📊 SELECT region, SUM(amount) FROM sales GROUP BY region — простейший агрегирующий запрос. GROUP BY region разбивает все строки на группы по региону, SUM(amount) суммирует выручку внутри каждой группы. Результат: по одной строке на каждый регион с суммой."},{"id":84,"n":85,"t":"SQL","s":"JOIN-операции - понимание разницы между INNER, LEFT и RIGHT JOIN при работе с неполными данными в DWH","q":"Почему LEFT JOIN предпочтительнее INNER JOIN при загрузке данных в Satellite-таблицы Data Vault, когда источник содержит неполные записи?","a":["LEFT JOIN автоматически заполняет NULL-значения в Satellite-атрибутах, тогда как INNER JOIN требует явного указания DEFAULT-значений для каждого поля","INNER JOIN теряет дубликаты","LEFT JOIN быстрее INNER JOIN при больших объёмах данных, что критично для ETL-процессов в DWH","LEFT JOIN сохраняет все строки левой таблицы, INNER JOIN молча теряет несовпадающие записи."],"c":3,"e":"🔎 Источник содержит неполные записи. INNER JOIN выбросит строки без пары в Satellite — данные потеряются тихо, без ошибок. LEFT JOIN сохранит все строки из основной таблицы, даже если в Satellite нет соответствующих данных (атрибуты будут NULL)."},{"id":85,"n":86,"t":"Informatica PC","s":"Трансформация Aggregator в Informatica PowerCenter — подсчёт агрегированных показателей с группировкой по одному полю","q":"Почему в трансформации Aggregator поле группировки нужно помечать флагом 'Group By'?","a":["Чтобы поле отображалось в выходном порту трансформации и передавалось в следующий компонент маппинга","Чтобы отфильтровать дублирующиеся строки до начала вычислений и ускорить выполнение маппинга","Чтобы указать Aggregator, какие поля нужно суммировать и агрегировать в итоговый результат","Чтобы Aggregator знал, по каким значениям объединять строки перед вычислением агрегатных функций (SUM, COUNT и др.)"],"c":3,"e":"🗂️ Aggregator без Group By флага — как рассыпать документы в одну кучу без разбора. Флаг Group By говорит: 'группируй стопки по этому признаку, а потом считай итоги для каждой стопки отдельно'. Без него агрегат вычислится по всей таблице как одна большая группа."},{"id":86,"n":87,"t":"Informatica PC","s":"Трансформация Aggregator в Informatica PowerCenter — подсчёт агрегированных показателей с группировкой по одному полю","q":"В трансформации Aggregator вы считаете SUM(amount) с группировкой по customer_id — какое свойство порта customer_id необходимо включить?","a":["Для порта customer_id нужно установить флаг Group By, чтобы агрегация выполнялась в разрезе каждого клиента.","Для порта customer_id нужно включить флаг Key, который указывает на уникальное значение и автоматически группирует записи по этому полю при агрегации.","Флаг Group By нужно установить на порту SUM(amount), поскольку именно агрегатная функция определяет логику группировки.","Порт customer_id не требует дополнительных флагов — группировка задаётся автоматически при добавлении агрегатной функции."],"c":0,"e":"🏷️ В трансформации Aggregator есть два вида портов: 'Group By' (ключи группировки) и 'Output' (агрегатные функции). Для customer_id нужно поставить флаг Group By — тогда Aggregator будет считать SUM(amount) отдельно для каждого уникального customer_id."},{"id":87,"n":88,"t":"Informatica PC","s":"Трансформации Lookup и Aggregator — подстановка значений из справочников и расчёт агрегированных показателей в цепочке трансформаций","q":"Почему трансформация Lookup в Informatica PC по умолчанию кэширует данные справочника в памяти?","a":["Чтобы избежать повторных обращений к источнику для каждой входящей строки — кэш позволяет выполнять подстановку локально, что значительно ускоряет обработку больших объёмов данных.","Кэширование используется для уменьшения нагрузки на сеть, так как без него каждый запрос к справочнику передаётся по сети, что создаёт избыточный трафик и замедляет работу всего ETL-сервера.","Кэш справочника нужен для обеспечения транзакционной целостности: данные фиксируются на момент старта сессии, чтобы изменения в источнике не влияли на результат подстановки в процессе выполнения маппинга.","Потому что без кэша Lookup не может обрабатывать несколько потоков одновременно."],"c":0,"e":"⚡ Lookup без кэша = звонить в офис за каждой строкой данных. С кэшем = справочник у тебя на столе: посмотрел и ответил сразу. При 1 млн строк экономия — 1 млн сетевых обращений к базе данных. Кэш загружается один раз в начале сессии."},{"id":88,"n":89,"t":"Informatica PC","s":"Оптимизация производительности mapping при обработке больших объёмов данных — предварительная сортировка потока перед Aggregator, настройка параметров сессии и выбор стратегии кэширования","q":"Почему предварительная сортировка входного потока по ключу группировки критически важна для производительности Aggregator-трансформации в Informatica PC?","a":["Sorted Input режим важен прежде всего потому, что он активирует встроенный механизм параллельной обработки в Aggregator-трансформации: отсортированный поток позволяет Integration Service распределять группы по нескольким потокам выполнения одновременно, существенно увеличивая пропускную способность. Без предварительной сортировки параллелизм недоступен и вся агрегация выполняется строго последовательно в одном потоке.","Предварительная сортировка необходима потому, что Aggregator в Informatica PC использует хэш-таблицы для хранения промежуточных результатов, и отсортированные данные позволяют равномернее распределять записи по хэш-бакетам, снижая количество коллизий и ускоряя поиск. Без сортировки хэш-функция работает неэффективно и генерирует избыточные операции чтения с диска, что критично при больших объёмах.","Предварительная сортировка входного потока критична потому, что Aggregator обязан передавать результаты агрегации в следующую трансформацию строго в отсортированном порядке согласно требованиям downstream-компонентов, например Joiner или Rank. Если данные не отсортированы заранее, Aggregator вынужден буферизировать весь выходной набор до завершения обработки последней группы, чтобы выполнить итоговую сортировку перед отправкой, что многократно увеличивает потребление памяти.","Sorted Input режим позволяет Aggregator обрабатывать группы последовательно и сбрасывать их из памяти сразу после завершения, не накапливая весь датасет в кэше — это резко снижает потребление памяти и устраняет необходимость сортировки внутри самого Aggregator, что особенно критично при больших объёмах данных."],"c":3,"e":"📚 Aggregator без Sorted Input хранит в кэше ВСЕ группы одновременно — как читать 500 млн книг разом. С Sorted Input данные приходят уже отсортированными по ключу → Aggregator обрабатывает одну группу, сбрасывает в результат, освобождает память, берёт следующую. Расход памяти в разы меньше."},{"id":89,"n":90,"t":"Oracle PL/SQL","s":"Объектные типы Oracle - создание пользовательских типов (CREATE TYPE) для передачи структурированных данных между процедурами загрузки сателлитов","q":"Почему для передачи коллекции записей между процедурами загрузки сателлитов предпочтительнее использовать TABLE OF объектного типа, а не набор отдельных параметров?","a":["TABLE OF объектного типа позволяет избежать ограничения Oracle в 32 параметра на процедуру, которое возникает при передаче структурированных данных через отдельные параметры в процедурах загрузки.","TABLE OF объектного типа передаёт структурированный набор строк как единый параметр, сохраняя целостность данных, упрощая сигнатуру процедур и позволяя обрабатывать множество записей через единый bulk-операцию, что снижает контекстные переключения PL/SQL↔SQL.","Набор отдельных параметров предпочтительнее для bulk-операций, а TABLE OF используют только для передачи единичных записей между процедурами, поскольку коллекции требуют дополнительной сериализации при каждом вызове.","TABLE OF объектного типа предпочтительнее, потому что Oracle автоматически индексирует такие коллекции, что ускоряет поиск записей внутри процедуры загрузки сателлита по сравнению с набором отдельных параметров."],"c":1,"e":"📦 Вместо 50 отдельных параметров (bk1, bk2, bk3...) передаём одну коллекцию. Это как отправить один посылочный ящик вместо 50 отдельных конвертов. Сигнатура процедуры остаётся чистой, а FORALL внутри делает bulk-загрузку всего содержимого за один раз."},{"id":90,"n":91,"t":"Oracle PL/SQL","s":"Пакеты (PACKAGE) PL/SQL - организация процедур и функций загрузки хабов, линков и сателлитов в пакеты с разделением спецификации и тела","q":"Почему в PL/SQL пакете спецификация и тело компилируются раздельно, и какое это даёт преимущество при изменении логики загрузки сателлитов?","a":["Спецификация и тело компилируются раздельно, чтобы разграничить права доступа: зависимые процедуры видят только публичный интерфейс спецификации, а изменение тела требует отдельного GRANT, что защищает логику загрузки сателлитов от несанкционированного вызова.","Изменение тела пакета инвалидирует зависимые объекты, поэтому раздельная компиляция применяется только для ускорения первичной сборки — логику загрузки сателлитов можно обновлять без перезапуска сессий.","Раздельная компиляция нужна для того, чтобы спецификация всегда компилировалась первой и при любом изменении тела пакета все зависимые объекты автоматически перекомпилировались — это гарантирует актуальность интерфейсов загрузки сателлитов.","Изменение тела пакета не инвалидирует зависимые объекты, которые обращаются только к спецификации — это позволяет обновлять логику загрузки сателлитов без перекомпиляции всех зависимых процедур и пакетов."],"c":3,"e":"🏗️ Спецификация пакета — публичный интерфейс (API). Тело — реализация. Изменил реализацию (тело) — API не изменился, все вызывающие процедуры по-прежнему видят тот же интерфейс и не требуют перекомпиляции. Это как обновить движок машины, не меняя руль и педали."},{"id":91,"n":92,"t":"Oracle PL/SQL","s":"Переменные и типы PL/SQL - объявление скалярных переменных, записей (RECORD) и коллекций (TABLE, VARRAY) для промежуточной обработки данных хранилища","q":"В процессе загрузки хаба Data Vault нужно временно хранить набор бизнес-ключей с хэшами для пакетной обработки — какой тип коллекции PL/SQL оптимально использовать и почему?","a":["Associative array (INDEX BY): динамически растёт, не требует предварительного объявления размера, быстрый доступ по ключу — идеально для промежуточного хранения пар бизнес-ключ/хэш в bulk-операциях загрузки хаба.","Associative array INDEX BY VARCHAR2: прямая индексация по строковому бизнес-ключу замедляет поиск по сравнению с INDEX BY PLS_INTEGER, поэтому для хэшей предпочтительнее числовой индекс.","Nested table: поддерживает SQL-операции и передачу в качестве параметра, поэтому лучше подходит для пакетной обработки бизнес-ключей через FORALL и BULK COLLECT.","VARRAY: фиксированный размер задаётся заранее, что обеспечивает предсказуемое потребление памяти при bulk-загрузке хаба — оптимален для хранения хэшей с известным лимитом записей."],"c":0,"e":"🗂️ Associative Array (INDEX BY PLS_INTEGER) идеален для временного хранения пар ключ-значение в памяти: быстрый доступ по индексу, динамический размер, никакого SQL. Для промежуточной обработки бизнес-ключей и хэшей перед FORALL — самый подходящий тип."},{"id":92,"n":93,"t":"Oracle PL/SQL","s":"Исключения PL/SQL - объявление пользовательских исключений и построение централизованной обработки ошибок в процедурах ETL-загрузки","q":"В ETL-процедуре загрузки в DWH нужно централизованно обрабатывать несколько типов ошибок: нарушение уникальности, проблемы с NULL и бизнес-правила. Какую конструкцию PL/SQL следует использовать для единой точки обработки всех этих исключений?","a":["Применять TRY-CATCH блоки с вложенными IF-проверками SQLCODE сразу после каждого DML-оператора.","Блок EXCEPTION с несколькими WHEN-обработчиками в конце процедуры: отдельные ветки для DUP_VAL_ON_INDEX, NO_DATA_FOUND, пользовательских исключений (объявленных через EXCEPTION и RAISE), и финальный WHEN OTHERS для логирования непредвиденных ошибок через SQLERRM/SQLCODE в таблицу-лог ETL.","Для централизованной обработки в ETL-процедурах рекомендуется выносить весь блок EXCEPTION в отдельную вложенную процедуру-обработчик, которая вызывается через CALL из основного тела. Пользовательские исключения объявляются через PRAGMA EXCEPTION_INIT с привязкой к кодам ORA-, а WHEN OTHERS размещается первым в списке обработчиков, чтобы гарантировать перехват всех непредвиденных ошибок до специфичных веток.","Использовать единственный обработчик WHEN OTHERS в конце процедуры — он перехватывает абсолютно все ошибки Oracle, включая нарушения уникальности и NULL-проблемы, а детализацию обеспечивает SQLERRM. Отдельные WHEN-ветки избыточны и усложняют поддержку ETL-кода."],"c":1,"e":"🎯 WHEN DUP_VAL_ON_INDEX, WHEN NO_DATA_FOUND, WHEN e_business_rule, WHEN OTHERS — как набор сачков для разных видов ошибок. Каждый WHEN обрабатывает конкретный тип, WHEN OTHERS ловит всё остальное. Так ошибки обрабатываются точно, а не 'всё в одну кучу'."},{"id":93,"n":94,"t":"Oracle PL/SQL","s":"Оптимизация PL/SQL-кода — выявление и устранение узких мест: минимизация context switch, использование BULK-операций, оптимизация циклов обработки данных","q":"В цикле FOR обрабатывается 500 000 строк с INSERT в целевую таблицу — время выполнения критически высокое из-за context switch. Какое минимальное изменение кода устранит основную проблему производительности?","a":["Добавить в цикл PRAGMA AUTONOMOUS_TRANSACTION и выполнять COMMIT каждые 1000 итераций — это разгрузит основную транзакцию и устранит context switch за счёт изоляции операций INSERT в отдельных транзакционных контекстах, что кардинально снизит нагрузку на движок.","Заменить цикл FOR на CURSOR с BULK COLLECT без FORALL: открыть курсор, собрать все 500 000 строк в коллекцию одним вызовом BULK COLLECT (без LIMIT), а затем выполнить обычный цикл FOR по коллекции с построчным INSERT — это уберёт overhead курсора и ускорит выборку данных, решив проблему переключений контекста.","Перенести INSERT из PL/SQL в чистый SQL: заменить цикл на один INSERT INTO ... SELECT — context switch исчезнет полностью, но FORALL здесь избыточен.","З
